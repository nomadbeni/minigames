<style>

[hidden]{display:none!important}
*{box-sizing:border-box}

.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font:700 16px/1 var(--disp);white-space:nowrap;font-variant-numeric:tabular-nums}
.sp{flex:1;min-width:0}

#tip{min-height:40px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font:600 18px/1.25 var(--font);transition:opacity .2s}

/* ---------------------------------------------------------------- level builder */
function B(name,theme,w){
  const g=[];for(let y=0;y<ROWS;y++)g.push(new Array(w).fill('.'));
  const L={name,theme,w,g,ents:[],signs:[],start:2};
  const ok=(x,y)=>x>=0&&x<w&&y>=0&&y<ROWS;
  L.fill=(x0,x1,top,ch='#')=>{for(let x=x0;x<=x1;x++)for(let y=top;y<ROWS;y++)if(ok(x,y))g[y][x]=ch;return L};
  L.box=(x0,x1,y0,y1,ch='#')=>{for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)if(ok(x,y))g[y][x]=ch;return L};
  L.row=(x0,x1,y,ch)=>L.box(x0,x1,y,y,ch);
  L.clr=(x0,x1)=>L.box(x0,x1,2,ROWS-1,'.');
  L.pool=(x0,x1)=>{L.clr(x0,x1);return L.box(x0,x1,11,12,'~')};
  L.e=(t,x,y,o)=>{L.ents.push(Object.assign({t,x,y},o||{}));return L};
  L.sign=(x,txt)=>{L.signs.push({x,txt});return L};
  return L;
}

/*END*/

/* ---------------------------------------------------------------- sprites (pixel strings) */
function spr(rows,pal){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const k=r[i];if(pal[k]){x.fillStyle=pal[k];x.fillRect(i,j,1,1)}}});
  return c;
}
function flip(c){const f=document.createElement('canvas');f.width=c.width;f.height=c.height;const x=f.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return f}

"STTtTTTTTtTS",".TTTTTTTTTT.","..TTtTTtTT.."];

  jump:["..SS...SS...",".SS.....SS..","SS.......SS.","ss........ss","............"]};
const MAN={};for(const k in MANLEGS)MAN[k]=pair(spr(MANBODY.concat(MANLEGS[k]),MANP));
const DINOP={G:'#4caf50',g:'#2e7d32',K:'#111',W:'#fff',L:'#c5e1a5',d:'#2e7d32'};

const DINO=[pair(spr(DINOTOP.concat(["....GG..GG......","....GG..GG......","...ggg.ggg......"]),DINOP)),
            pair(spr(DINOTOP.concat(["...GG....GG.....","..GG......GG....","..ggg.....ggg..."]),DINOP))];

             pair(spr(["...x.x.x.x....",".XXXXXXXXX....","XXXXXXXXXXX...","XXXXXXXXXXbbb.","XXXXXXXXXbbKbb","XXXXXXXXbbbbbN",".XXXXXXXbbbbb.","..bbbbbbbbbb..","..b.b...b.b...",".bb.bb.bb.bb.."],SPIKYP))];
const BIRDP={P:'#9c5ab8',p:'#6d3a86',K:'#111',Y:'#ffb020',W:'#fff'};
const BIRD=[pair(spr(["PP............PP",".PPP........PPP.","..pPPP....PPPp..","...PPPPPPPPPP...","......PPPWYYY...","......PPKP......",".......PP.......","................"],BIRDP)),
            pair(spr(["................","................","......PPPWYYY...","...PPPPPPKP.....","..pPPPPPPPPPp...",".PPP..PP...PPP..","PP...........PP.","................"],BIRDP))];
const FROGP={W:'#fff',K:'#111',F:'#8bc34a',f:'#558b2f',L:'#dcedc8',R:'#7a2a1a'};
const FROG=[pair(spr(["..WW....WW..",".WWKW..WWKW.",".FFFFFFFFFF.","FFFFFFFFFFFF","FFRRRRRRRRFF","FFFFFFFFFFFF",".FFLLLLLLFF.","FF.LLLLLL.FF","Ff........fF","ff........ff"],FROGP)),
            pair(spr(["..WW....WW..",".WWKW..WWKW.",".FFFFFFFFFF.","FFFFFFFFFFFF","FFRRRRRRRRFF","FFFFFFFFFFFF",".FFLLLLLLFF.",".F.LLLLLL.F.",".F........F.","ff........ff"],FROGP))];
const FOOD=[
  spr(["....g...","...g....",".RRRRRR.","RRRRRRwR","RRRRRRRR","RRRRRRRR",".RRRRRR.","..RRRR.."],{g:'#3f8f2a',R:'#e53935',w:'#fff'}),
  spr(["...gg...","..g..g..",".VV..VV.","VVVVVVVV","VwVVVwVV",".VV.VVV.","..VVVV..","...VV..."],{g:'#3f8f2a',V:'#7b3fbf',w:'#e7d6ff'}),
  spr([".....ww.","....wwww","...MMww.","..MMMM..",".MMMMMM.","MMMMMMM.","MMMMMM..",".MMMM..."],{M:'#b5651d',w:'#fff8e1'})];
const FOODPTS=[50,100,250];
const HEART=spr([".RR..RR.","RRRRRRRR","RRwRRRRR","RRRRRRRR",".RRRRRR.","..RRRR..","...RR...","........"],{R:'#ff4d5a',w:'#ffd0d0'});

/* tiles for a theme, drawn once */
function tileSet(th){
  const mk=(f)=>{const c=document.createElement('canvas');c.width=TS;c.height=TS;f(c.getContext('2d'));return c};
  const dots=(x,col,n,seed)=>{let s=seed;for(let i=0;i<n;i++){s=(s*9301+49297)%233280;const px=s%14+1;s=(s*9301+49297)%233280;const py=s%14+1;x.fillStyle=col;x.fillRect(px,py,2,1)}};
  return {
    fill:mk(x=>{x.fillStyle=th.dirt;x.fillRect(0,0,TS,TS);dots(x,th.dark,6,7)}),
    top:mk(x=>{x.fillStyle=th.dirt;x.fillRect(0,0,TS,TS);dots(x,th.dark,4,3);x.fillStyle=th.top;x.fillRect(0,0,TS,5);x.fillStyle=th.top2;for(let i=0;i<TS;i+=3)x.fillRect(i,5,2,1+(i%2));x.fillRect(0,4,TS,1)}),
    rock:mk(x=>{x.fillStyle=th.rock;x.fillRect(0,0,TS,TS);x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,14,TS,2);x.fillRect(14,0,2,TS);x.fillStyle='rgba(255,255,255,.3)';x.fillRect(0,0,TS,2);x.fillRect(0,0,2,TS);x.fillStyle='rgba(0,0,0,.45)';x.fillRect(5,4,1,5);x.fillRect(6,8,4,1);x.fillRect(10,8,1,4)}),
    ice:mk(x=>{x.fillStyle='#9fdcff';x.fillRect(0,0,TS,TS);x.fillStyle='#e6f8ff';x.fillRect(0,0,TS,3);x.fillRect(3,6,5,1);x.fillRect(9,10,4,1);x.fillStyle='#5fa8d8';x.fillRect(0,15,TS,1)}),
    plank:mk(x=>{x.fillStyle=th.plank;x.fillRect(0,0,TS,6);x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,5,TS,1);x.fillRect(7,0,1,6);x.fillStyle='rgba(255,255,255,.25)';x.fillRect(0,0,TS,1)}),
    spike:mk(x=>{x.fillStyle='#d8d8e0';for(let i=0;i<4;i++){x.beginPath();x.moveTo(i*4,16);x.lineTo(i*4+2,7);x.lineTo(i*4+4,16);x.fill()}x.fillStyle='#8a8a96';for(let i=0;i<4;i++)x.fillRect(i*4+2,10,1,6)})
  };
}

/* ---------------------------------------------------------------- save (local only, checked field by field) */
const NLV=LEVELS.length;
const isInt=(v,lo,hi)=>typeof v==='number'&&Number.isInteger(v)&&v>=lo&&v<=hi;
function freshSave(){return {v:1,unlocked:1,best:new Array(NLV).fill(0),cur:null}}
function loadSave(){
  const s=freshSave();
  let raw=null;
  try{const t=localStorage.getItem(SAVE_KEY);if(t)raw=JSON.parse(t)}catch(e){raw=null}
  if(!raw||typeof raw!=='object'||Array.isArray(raw))return s;
  if(isInt(raw.unlocked,1,NLV))s.unlocked=raw.unlocked;
  if(Array.isArray(raw.best))for(let i=0;i<NLV;i++)if(isInt(raw.best[i],0,1e7))s.best[i]=raw.best[i];
  const c=raw.cur;
  if(c&&typeof c==='object'&&!Array.isArray(c)&&isInt(c.lvl,0,NLV-1)&&isInt(c.cp,-1,20)&&isInt(c.score,0,1e7)&&isInt(c.lives,1,9)&&c.lvl<s.unlocked)
    s.cur={lvl:c.lvl,cp:c.cp,score:c.score,lives:c.lives};
  return s;
}
let SAVE=loadSave();
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE))}catch(e){}}

/* ---------------------------------------------------------------- sound (Web Audio, made on first touch) */
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,d,type='square',slide=0,vol=.08,delay=0){
  const a=AC;if(!a)return;
  try{const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
const SFX={
  jump:()=>tone(320,.14,'square',300,.05),
  swing:()=>tone(180,.08,'triangle',-90,.07),
  bonk:()=>{tone(140,.12,'square',-60,.09);tone(90,.1,'triangle',0,.07,.03)},
  food:()=>{tone(660,.06,'square',0,.05);tone(990,.08,'square',0,.05,.06)},
  heart:()=>{tone(520,.08);tone(780,.08,'square',0,.08,.08);tone(1040,.12,'square',0,.08,.16)},
  hurt:()=>tone(240,.25,'sawtooth',-180,.08),
  die:()=>{tone(400,.18,'square',-200,.08);tone(260,.3,'square',-180,.08,.18)},
  rock:()=>tone(120,.15,'sawtooth',-70,.08),
  cp:()=>{tone(440,.08);tone(660,.12,'square',0,.08,.09)},
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',0,.07,i*.12))},
  boss:()=>tone(70,.4,'sawtooth',-20,.1),
  life:()=>{[784,988,1175,1568].forEach((f,i)=>tone(f,.1,'square',0,.06,i*.08))}
};

/* ---------------------------------------------------------------- state */
const S={mode:'title',lvl:0,lv:null,tiles:null,th:null,p:null,ents:[],items:[],plats:[],parts:[],pops:[],cps:[],cp:-1,
  score:0,cpScore:0,lives:3,hp:3,nextLife:5000,cam:0,t:0,dieT:0,bossDead:true,shake:0};
const KEY={left:false,right:false,jump:false,atk:false};
let jumpHit=false,atkHit=false;

function tileAt(tx,ty){if(tx<0||tx>=S.lv.w)return '#';if(ty<0||ty>=ROWS)return '.';return S.lv.g[ty][tx]}
const isSolid=(tx,ty)=>SOLID[tileAt(tx,ty)]===1;

function moveBody(b,oneway){
  b.x+=b.vx;let hit=0;
  const y0=Math.floor(b.y/TS),y1=Math.floor((b.y+b.h-.01)/TS);
  if(b.vx>0){const tx=Math.floor((b.x+b.w-.01)/TS);for(let ty=y0;ty<=y1;ty++)if(isSolid(tx,ty)){b.x=tx*TS-b.w;hit=1;break}}
  else if(b.vx<0){const tx=Math.floor(b.x/TS);for(let ty=y0;ty<=y1;ty++)if(isSolid(tx,ty)){b.x=(tx+1)*TS;hit=-1;break}}
  const prevB=b.y+b.h;b.y+=b.vy;b.onGround=false;b.gt='.';
  const x0=Math.floor(b.x/TS),x1=Math.floor((b.x+b.w-.01)/TS);
  if(b.vy>0){const ty=Math.floor((b.y+b.h-.01)/TS);
    for(let tx=x0;tx<=x1;tx++){const t=tileAt(tx,ty);if(SOLID[t]||(oneway&&t==='='&&prevB<=ty*TS+.5)){b.y=ty*TS-b.h;b.vy=0;b.onGround=true;b.gt=t;break}}}
  else if(b.vy<0){const ty=Math.floor(b.y/TS);for(let tx=x0;tx<=x1;tx++)if(isSolid(tx,ty)){b.y=(ty+1)*TS;b.vy=0;break}}
  return hit;
}
const over=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

/* ---------------------------------------------------------------- level setup */
function setupLevel(i,cp){
  const src=LEVELS[i];
  S.lvl=i;S.th=THEMES[src.theme];S.tiles=tileSet(S.th);
  S.lv={name:src.name,theme:src.theme,w:src.w,g:src.g.map(r=>r.slice()),signs:src.signs};
  S.ents=[];S.items=[];S.plats=[];S.parts=[];S.pops=[];S.cps=[];S.exit=null;S.bossDead=true;
  const bot=r=>(r+1)*TS;
  for(const e of src.ents){
    const px=e.x*TS;
    switch(e.t){
      case 'o':S.items.push({t:'food',k:(e.x*7+e.y)%2,x:px+4,y:bot(e.y)-12,w:8,h:8,vy:0,phys:false});break;
      case 'H':S.items.push({t:'heart',x:px+4,y:bot(e.y)-12,w:8,h:8,vy:0,phys:false});break;
      case 'C':S.cps.push({x:px,y:bot(e.y)-24,w:12,h:24,lit:false});break;
      case 'E':S.exit={x:px,y:bot(e.y)-32,w:32,h:32};break;
      case 'M':case 'V':S.plats.push({x:px,y:e.y*TS,w:48,h:6,x0:px,y0:e.y*TS,r:e.r*TS,ax:e.t==='M',ph:0,dx:0,dy:0,dir:1});break;
      case 'd':S.ents.push(mkEnemy('dino',px,bot(e.y),16,14,.5));break;
      case 's':S.ents.push(mkEnemy('spiky',px,bot(e.y),14,10,.35));break;
      case 'f':S.ents.push(mkEnemy('frog',px,bot(e.y),12,10,0));break;
      case 'b':{const en=mkEnemy('bird',px,e.y*TS+TS/2,16,8,0);en.x0=px;en.y0=e.y*TS+4;en.ph=e.x;S.ents.push(en);break}
      case 'F':{const en=mkEnemy('fire',px+4,bot(e.y),8,8,0);en.y0=en.y;en.wait=(e.x*13)%60;en.hide=true;S.ents.push(en);break}
      case 'K':{const en=mkEnemy('boss',px,bot(e.y),44,34,.6);en.hp=8;en.minX=(e.minX||0)*TS;en.st='walk';en.tm=0;S.ents.push(en);S.bossDead=false;break}
    }
  }
  S.cps.sort((a,b)=>a.x-b.x);
  S.cp=Math.max(-1,Math.min(cp,S.cps.length-1));
  for(let k=0;k<=S.cp;k++)S.cps[k].lit=true;
  const sx=S.cp>=0?S.cps[S.cp].x+16:src.start*TS+3;
  S.p={x:sx,y:10*TS-20,w:10,h:20,vx:0,vy:0,face:1,onGround:false,coy:0,buf:0,atk:0,cool:0,inv:0,jumping:false,stand:null,anim:0,hits:new Set()};
  S.hp=3;S.cam=clampCam(S.p.x-VW/2);S.t=0;S.shake=0;
  $('lvlname').textContent=(i+1)+' · '+src.name;
  hud();
}
function mkEnemy(type,x,bottom,w,h,spd){return {type,x,y:bottom-h,w,h,vx:0,vy:0,dir:-1,spd,alive:true,tm:0,onGround:false,hp:1,inv:0}}
const clampCam=x=>Math.max(0,Math.min(S.lv.w*TS-VW,x));

function saveCur(){SAVE.cur={lvl:S.lvl,cp:S.cp,score:S.cpScore,lives:S.lives};writeSave()}

/* ---------------------------------------------------------------- game flow */
function startLevel(i,keep){
  if(!keep){S.score=0;S.lives=3;S.nextLife=5000}
  S.cpScore=S.score;
  setupLevel(i,-1);
  saveCur();
  play();
}
function resume(cur){
  S.score=cur.score;S.cpScore=cur.score;S.lives=cur.lives;S.nextLife=(Math.floor(cur.score/5000)+1)*5000;
  setupLevel(cur.lvl,cur.cp);play();
}
function play(){S.mode='play';closeOv();resetKeys()}
function resetKeys(){KEY.left=KEY.right=KEY.jump=KEY.atk=false;jumpHit=atkHit=false;document.querySelectorAll('.pad button.on').forEach(b=>b.classList.remove('on'))}

function addScore(n,x,y){
  S.score=Math.min(9999999,S.score+n);
  if(x!==undefined)S.pops.push({x,y,txt:'+'+n,t:50});
  while(S.score>=S.nextLife){S.nextLife+=5000;if(S.lives<9){S.lives++;SFX.life();S.pops.push({x:S.p.x,y:S.p.y-10,txt:'+1 ÉLET',t:80})}}
  hud();
}
function hurt(from){
  const p=S.p;if(p.inv>0||S.mode!=='play')return;
  S.hp--;p.inv=90;SFX.hurt();S.shake=shk(8);
  p.vx=(from!==undefined?(p.x+p.w/2<from?-1:1):-p.face)*2.4;p.vy=-3.6;p.jumping=false;
  hud();
  if(S.hp<=0)die();
}
function die(){
  if(S.mode!=='play')return;
  S.mode='dying';S.dieT=80;S.hp=0;SFX.die();S.p.vy=-5;S.p.vx=0;hud();
}
function afterDeath(){
  S.lives--;
  if(S.lives<=0){
    SAVE.cur=null;writeSave();S.mode='over';
    showOv(`<h2>VÉGE</h2><p>Elfogyott az életed.</p><p class="big">🍖 ${S.score}</p>
      <div class="btns"><button class="btn hot" id="ovNew">Új játék</button><button class="btn" id="ovMenu">Pályák</button></div>`);
    $('ovNew').onclick=()=>{audio();startLevel(S.lvl,false)};
    $('ovMenu').onclick=title;
    return;
  }
  S.score=S.cpScore;
  setupLevel(S.lvl,S.cp);saveCur();S.mode='play';S.p.inv=60;
}
function levelClear(){
  if(S.mode!=='play')return;
  S.mode='clear';SFX.win();
  const bonus=S.hp*200;addScore(bonus);
  const i=S.lvl;
  SAVE.best[i]=Math.max(SAVE.best[i],S.score);
  const last=i===NLV-1;
  SAVE.unlocked=Math.max(SAVE.unlocked,Math.min(NLV,i+2));
  SAVE.cur=last?null:{lvl:i+1,cp:-1,score:S.score,lives:S.lives};
  writeSave();
  if(last){
    showOv(`<h1>GYŐZELEM!</h1><p>A Nagy Mamut elfutott. A törzs újra eszik!</p><p class="big">🍖 ${S.score}</p>
      <p class="small">Szív bónusz: +${bonus}</p><div class="btns"><button class="btn hot" id="ovNew">Új játék</button><button class="btn" id="ovMenu">Pályák</button></div>`);
    $('ovNew').onclick=()=>{audio();startLevel(0,false)};
  }else{
    showOv(`<h2>PÁLYA ${i+1} · KÉSZ</h2><p>${LEVELS[i].name}</p><p class="big">🍖 ${S.score}</p>
      <p class="small">Szív bónusz: +${bonus} · Rekord: ${SAVE.best[i]}</p>
      <div class="btns"><button class="btn hot" id="ovNext">Tovább</button><button class="btn" id="ovMenu">Pályák</button></div>`);
    $('ovNext').onclick=()=>{audio();startLevel(i+1,true)};
  }
  $('ovMenu').onclick=title;
}
function pause(){
  if(S.mode!=='play')return;
  S.mode='pause';
  showOv(`<h2>SZÜNET</h2><div class="btns"><button class="btn hot" id="ovRes">Folytatás</button><button class="btn" id="ovRe">Pálya újra</button><button class="btn" id="ovMenu">Pályák</button></div>`);
  $('ovRes').onclick=()=>{audio();play()};
  $('ovRe').onclick=()=>{audio();S.score=S.cpScore;startLevel(S.lvl,true)};
  $('ovMenu').onclick=title;
}
function title(){
  S.mode='title';
  if(!S.lv)setupLevel(0,-1);
  const c=SAVE.cur;
  let lv='';
  for(let i=0;i<NLV;i++)lv+=`<button data-l="${i}" ${i<SAVE.unlocked?'':'disabled'} class="${SAVE.best[i]>0?'done':''}" aria-label="${i+1}. pálya">${i+1}</button>`;
  showOv(`<h1>KŐKORI KALAND</h1>
    <p>A Nagy Mamut elvitte a törzs ételét. Szedd vissza!</p>
    <div class="btns">${c?`<button class="btn hot" id="ovCont">Folytatás · ${c.lvl+1}. pálya</button><button class="btn" id="ovNew">Új játék</button>`:`<button class="btn hot" id="ovNew">Indul</button>`}</div>
    <p class="small">Pályák</p><div class="lv">${lv}</div>
    <p class="keys">Gépen: ← → mozgás · Space vagy ↑ ugrás · J vagy X ütés · P szünet</p>`);
  if(c)$('ovCont').onclick=()=>{audio();resume(c)};
  $('ovNew').onclick=()=>{audio();startLevel(0,false)};
  document.querySelectorAll('.lv button[data-l]').forEach(b=>b.onclick=()=>{audio();startLevel(+b.dataset.l,false)});
}
function showOv(html){$('ovc').innerHTML=html;$('ov').hidden=false;const h=$('ovc').querySelector('.btn.hot');if(h)try{h.focus({preventScroll:true})}catch(e){}}
function closeOv(){$('ov').hidden=true}
function hud(){
  $('hearts').textContent='♥'.repeat(Math.max(0,S.hp))+'♡'.repeat(Math.max(0,3-S.hp));
  $('lives').textContent=S.lives;$('score').textContent=S.score;
}

/* ---------------------------------------------------------------- update */
function step(){
  S.t++;
  for(const pl of S.plats){
    pl.ph+=.012;const off=(1-Math.cos(pl.ph))/2*pl.r;
    const nx=pl.ax?pl.x0+off:pl.x0, ny=pl.ax?pl.y0:pl.y0-off;
    pl.dx=nx-pl.x;pl.dy=ny-pl.y;pl.x=nx;pl.y=ny;
  }
  if(S.mode==='dying'){
    const p=S.p;p.vy=Math.min(p.vy+.25,6);p.y+=p.vy;S.dieT--;
    stepFx();if(S.dieT<=0)afterDeath();return;
  }
  if(S.mode!=='play')return;
  stepPlayer();
  stepEnemies();
  stepItems();
  stepFx();
  const p=S.p;
  /* checkpoints */
  S.cps.forEach((c,k)=>{if(!c.lit&&p.x+p.w>c.x&&p.x<c.x+c.w+8){c.lit=true;if(k>S.cp){S.cp=k;S.cpScore=S.score;saveCur();SFX.cp();S.pops.push({x:c.x,y:c.y-8,txt:'MENTVE',t:70})}}});
  /* exit */
  if(S.exit&&S.bossDead&&p.x+p.w>S.exit.x+10&&p.x<S.exit.x+22&&p.y+p.h>S.exit.y+8)levelClear();
  /* camera */
  const target=clampCam(p.x+p.w/2-VW/2+p.face*24);
  S.cam+=(target-S.cam)*.12;S.cam=clampCam(S.cam);
  /* sign tip */
  let tip=null;for(const s of S.lv.signs){const sx=s.x*TS;if(p.x>sx-40&&p.x<sx+120){tip=s.txt;break}}
  if(tip!==curTip){curTip=tip;if(tip){$('tipTxt').textContent=tip;$('tip').classList.remove('dim')}else $('tip').classList.add('dim')}
}
let curTip=undefined;

function stepPlayer(){
  const p=S.p;
  /* ride a platform */
  if(p.stand){p.x+=p.stand.dx;p.y=p.stand.y-p.h;if(isSolid(Math.floor(p.x/TS),Math.floor((p.y+p.h-1)/TS))||isSolid(Math.floor((p.x+p.w-1)/TS),Math.floor((p.y+p.h-1)/TS)))p.x-=p.stand.dx}
  const ice=p.onGround&&p.gt==='I';
  const acc=p.onGround?(ice?.07:.32):.22, fr=p.onGround?(ice?.025:.35):.05, mx=1.9;
  const L=KEY.left&&!KEY.right,R=KEY.right&&!KEY.left;
  if(p.inv>60){/* knocked back: no control for a moment */}
  else if(L){p.vx=Math.max(p.vx-acc,-mx);p.face=-1}
  else if(R){p.vx=Math.min(p.vx+acc,mx);p.face=1}
  else{if(p.vx>0)p.vx=Math.max(0,p.vx-fr);else if(p.vx<0)p.vx=Math.min(0,p.vx+fr)}
  const grounded=p.onGround||!!p.stand;
  p.coy=grounded?6:p.coy-1;
  p.buf=jumpHit?7:p.buf-1;jumpHit=false;
  if(p.buf>0&&p.coy>0){p.vy=-5.9;p.coy=0;p.buf=0;p.jumping=true;p.jt=0;p.stand=null;SFX.jump()}
  /* a short tap still clears one block; holding jumps higher */
  if(p.jumping){p.jt=(p.jt||0)+1;if(!KEY.jump&&p.jt>7&&p.vy<-2.2)p.vy=-2.2}
  if(p.vy>=0)p.jumping=false;
  p.vy=Math.min(p.vy+.32,6.5);
  /* attack */
  if(atkHit&&p.atk<=0&&p.cool<=0){p.atk=16;p.cool=22;p.hits.clear();SFX.swing()}
  atkHit=false;
  if(p.atk>0)p.atk--;if(p.cool>0)p.cool--;if(p.inv>0)p.inv--;
  const prevB=p.y+p.h;
  moveBody(p,true);
  /* platforms */
  p.stand=null;
  if(p.vy>=0)for(const pl of S.plats){
    if(p.x+p.w>pl.x+1&&p.x<pl.x+pl.w-1&&prevB<=pl.y+3&&p.y+p.h>=pl.y){p.y=pl.y-p.h;p.vy=0;p.onGround=true;p.gt='=';p.stand=pl;break}
  }
  p.anim+=Math.abs(p.vx)*.08;
  /* hazards */
  const cx0=Math.floor((p.x+2)/TS),cx1=Math.floor((p.x+p.w-2)/TS);
  for(let tx=cx0;tx<=cx1;tx++){
    const tb=Math.floor((p.y+p.h-1)/TS),tm=Math.floor((p.y+p.h-7)/TS);
    if(tileAt(tx,tb)==='~'||tileAt(tx,tm)==='~'){die();return}
    if(tileAt(tx,tb)==='^'&&(p.y+p.h)>tb*TS+8){if(p.inv<=0){hurt();p.vy=-4.6}}
  }
  if(p.y>VH+20){die();return}
  /* club: breaks rocks, bonks enemies */
  if(p.atk>=4&&p.atk<=12){
    const hb=clubBox();
    const tx0=Math.floor(hb.x/TS),tx1=Math.floor((hb.x+hb.w-1)/TS),ty0=Math.floor(hb.y/TS),ty1=Math.floor((hb.y+hb.h-1)/TS);
    for(let tx=tx0;tx<=tx1;tx++)for(let ty=ty0;ty<=ty1;ty++)if(tileAt(tx,ty)==='B')breakRock(tx,ty);
    for(const e of S.ents){if(!e.alive||e.type==='fire'||p.hits.has(e))continue;if(over(hb,e)){p.hits.add(e);hitEnemy(e,'club')}}
  }
}
function clubBox(){const p=S.p;return {x:p.face>0?p.x+p.w-2:p.x-16,y:p.y+1,w:18,h:19}}
function breakRock(tx,ty){
  /* the rock and everything stacked on it crumbles */
  let y=ty;while(y>0&&tileAt(tx,y-1)==='B')y--;
  for(let k=y;k<ROWS&&tileAt(tx,k)==='B';k++){S.lv.g[k][tx]='.';burst(tx*TS+8,k*TS+8,S.th.rock,8)}
  SFX.rock();S.shake=shk(4);
}
function hitEnemy(e,how){
  if(e.type==='boss'){
    if(e.inv>0)return;
    e.hp--;e.inv=45;SFX.boss();S.shake=shk(10);burst(e.x+e.w/2,e.y+10,'#fff',10);
    e.vx=(S.p.x<e.x?1:-1)*2.5;e.st='stun';e.tm=40;
    if(e.hp<=0)killEnemy(e);
    return;
  }
  killEnemy(e,how);
}
function killEnemy(e){
  e.alive=false;SFX.bonk();
  burst(e.x+e.w/2,e.y+e.h/2,'#ffffff',12);
  const pts=e.type==='boss'?2000:100;
  addScore(pts,e.x,e.y-6);
  if(e.type==='boss'){S.bossDead=true;S.shake=shk(20);for(let i=0;i<6;i++)S.items.push({t:'food',k:i%3,x:e.x+e.w/2-4,y:e.y,w:8,h:8,vx:(i-2.5)*.8,vy:-3-Math.random()*2,phys:true});
    S.pops.push({x:e.x,y:e.y-20,txt:'A KIJÁRAT NYITVA!',t:120});return}
  /* a bonked animal drops a big drumstick, like in the old caveman games */
  S.items.push({t:'food',k:2,x:e.x+e.w/2-4,y:e.y,w:8,h:8,vx:(Math.random()-.5)*1.5,vy:-3.2,phys:true});
}
function stepEnemies(){
  const p=S.p;
  for(const e of S.ents){
    if(!e.alive)continue;
    if(e.x<S.cam-200||e.x>S.cam+VW+200){if(e.type!=='boss')continue}
    e.tm++;if(e.inv>0)e.inv--;
    switch(e.type){
      case 'dino':case 'spiky':{
        e.vx=e.dir*e.spd;e.vy=Math.min(e.vy+.3,6);
        const hit=moveBody(e,true);
        if(hit)e.dir*=-1;
        else if(e.onGround){const fx=e.dir>0?e.x+e.w+1:e.x-1;const ty=Math.floor((e.y+e.h+2)/TS),tx=Math.floor(fx/TS);const t=tileAt(tx,ty);if(!SOLID[t]&&t!=='=')e.dir*=-1}
        if(e.y>VH+40)e.alive=false;
        break}
      case 'frog':{
        e.vy=Math.min(e.vy+.3,6);
        if(e.onGround){e.vx=0;if(e.tm>70&&Math.abs(p.x-e.x)<160){e.tm=0;e.dir=p.x<e.x?-1:1;e.vy=-4.4;e.vx=e.dir*1.3}}
        const hit=moveBody(e,true);if(hit)e.vx=-e.vx;
        if(e.onGround)e.vx=0;
        if(e.y>VH+40)e.alive=false;
        break}
      case 'bird':{
        const nx=e.x0+Math.sin((e.tm+e.ph*20)*.018)*44;e.dir=nx<e.x?-1:1;e.x=nx;e.y=e.y0+Math.sin(e.tm*.06)*6;break}
      case 'fire':{
        if(e.hide){e.wait--;if(e.wait<=0){e.hide=false;e.y=e.y0;e.vy=-6.4}}
        else{e.vy+=.2;e.y+=e.vy;if(e.y>=e.y0&&e.vy>0){e.hide=true;e.wait=50}}
        break}
      case 'boss':stepBoss(e);break;
    }
    if(e.type==='fire'&&e.hide)continue;
    /* touching the caveman */
    if(over(p,e)&&S.mode==='play'){
      const stompable=e.type!=='spiky'&&e.type!=='fire';
      if(stompable&&p.vy>0&&p.y+p.h-p.vy<=e.y+6){
        hitEnemy(e,'stomp');p.vy=KEY.jump?-6:-4.4;p.jumping=KEY.jump;
      }else hurt(e.x+e.w/2);
    }
  }
}
function stepBoss(e){
  const p=S.p;e.vy=Math.min(e.vy+.3,6);
  const toward=p.x+p.w/2<e.x+e.w/2?-1:1;
  if(e.st==='walk'){e.dir=toward;e.vx=e.dir*(e.hp<=4?.9:.6);if(e.tm>150){e.st='wind';e.tm=0}}
  else if(e.st==='wind'){e.vx=0;if(e.tm===1)SFX.boss();if(e.tm>34){e.st='charge';e.tm=0;e.dir=toward}}
  else if(e.st==='charge'){e.vx=e.dir*(e.hp<=4?3.2:2.6);if(e.hp<=4&&e.tm===30&&e.onGround)e.vy=-4.5}
  else if(e.st==='stun'){e.vx*=.9;if(e.tm>40){e.st='walk';e.tm=0}}
  const hit=moveBody(e,false);
  if(e.x<e.minX){e.x=e.minX;if(e.st==='charge'){e.st='stun';e.tm=0;S.shake=shk(10);SFX.rock()}}
  if(hit&&e.st==='charge'){e.st='stun';e.tm=0;S.shake=shk(10);SFX.rock();e.vx=-e.dir*1.5}
}
function stepItems(){
  const p=S.p;
  for(const it of S.items){
    if(it.gone)continue;
    if(it.phys){it.vx=(it.vx||0)*.98;it.vy=Math.min(it.vy+.25,5);moveBody(it,true);if(it.onGround)it.vx*=.8;if(it.y>VH+20)it.gone=true}
    if(over(p,it)&&(!it.phys||it.vy>-1.5)){
      it.gone=true;
      if(it.t==='heart'){if(S.hp<3){S.hp++;hud()}else addScore(500,it.x,it.y-4);SFX.heart();burst(it.x+4,it.y+4,'#ff4d5a',8)}
      else{addScore(FOODPTS[it.k],it.x,it.y-4);SFX.food();burst(it.x+4,it.y+4,'#ffd23f',6)}
    }
  }
  S.items=S.items.filter(i=>!i.gone);
}
/* Csökkentett mozgás: nincs képernyőrázás, kevesebb részecske. */
function calm(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}}
function shk(n){return calm()?0:n}
function burst(x,y,col,n){if(calm())n=Math.ceil(n/3);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=.6+Math.random()*1.8;S.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.6,t:22+Math.random()*14,col})}}
function stepFx(){
  for(const q of S.parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.08;q.t--}
  S.parts=S.parts.filter(q=>q.t>0);
  for(const q of S.pops){q.y-=.4;q.t--}
  S.pops=S.pops.filter(q=>q.t>0);
  if(S.shake>0)S.shake--;
}

/* ---------------------------------------------------------------- draw */
function draw(){
  const th=S.th;if(!th)return;
  const top=DH-VH;
  if(top>0){
    ctx.fillStyle=th.sky[0];ctx.fillRect(0,0,VW,top+1);
    if(S.lv.theme==='forest'||S.lv.theme==='swamp'){ctx.fillStyle='rgba(255,255,255,.6)';for(let i=0;i<4;i++){const x=((i*131-S.cam*.08)%(VW+80)+VW+80)%(VW+80)-40;const y=6+(i*23)%Math.max(8,top-10);ctx.fillRect(x,y,36,6);ctx.fillRect(x+8,y-4,18,4)}}
    else{ctx.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<24;i++)ctx.fillRect((i*53+Math.floor(S.cam*.05))%VW,(i*29)%top,1,1)}
  }
  ctx.save();ctx.translate(0,top);drawLevel(th);ctx.restore();
}
function drawLevel(th){
  const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  const sh=S.shake>0?(Math.random()-.5)*S.shake*.5:0;
  const cam=Math.round(S.cam+sh);
  /* parallax hills */
  hills(cam*.25,th.far,120,22,.021,0);
  hills(cam*.5,th.near,150,16,.034,3);
  if(S.lv.theme==='forest'||S.lv.theme==='swamp'){ctx.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<5;i++){const x=((i*97-cam*.12)%(VW+80)+VW+80)%(VW+80)-40;ctx.fillRect(x,18+i*9%30,30,6);ctx.fillRect(x+6,14+i*9%30,16,4)}}
  ctx.save();ctx.translate(-cam,0);
  /* tiles */
  const T=S.tiles,G=S.lv.g;
  const tx0=Math.max(0,Math.floor(cam/TS)),tx1=Math.min(S.lv.w-1,tx0+Math.ceil(VW/TS)+1);
  for(let y=0;y<ROWS;y++)for(let x=tx0;x<=tx1;x++){
    const t=G[y][x],px=x*TS,py=y*TS;
    if(t==='#')ctx.drawImage(y>0&&G[y-1][x]!=='#'&&G[y-1][x]!=='I'?T.top:T.fill,px,py);
    else if(t==='B')ctx.drawImage(T.rock,px,py);
    else if(t==='I')ctx.drawImage(T.ice,px,py);
    else if(t==='=')ctx.drawImage(T.plank,px,py);
    else if(t==='^')ctx.drawImage(T.spike,px,py);
    else if(t==='~'){ctx.fillStyle=th.liq;ctx.fillRect(px,py,TS,TS);if(y===0||G[y-1][x]!=='~'){ctx.fillStyle=th.liq2;const o=Math.floor((S.t/8+x*3))%4;for(let i=0;i<TS;i+=4)ctx.fillRect(px+i,py+((i/4+o)%2),3,2)}}
  }
  /* signs, checkpoints, exit */
  for(const s of S.lv.signs){const x=s.x*TS+2;if(x<cam-20||x>cam+VW)continue;ctx.fillStyle='#6a4520';ctx.fillRect(x+5,148,2,12);ctx.fillStyle='#a8743a';ctx.fillRect(x,140,12,9);ctx.fillStyle='#4a2e12';ctx.fillRect(x+2,143,8,1);ctx.fillRect(x+2,145,6,1)}
  for(const c of S.cps)drawTorch(c);
  if(S.exit)drawExit(S.exit);
  for(const pl of S.plats)drawPlat(pl);
  for(const it of S.items){const bob=it.phys?0:Math.round(Math.sin((S.t+it.x)*.08)*1.5);ctx.drawImage(it.t==='heart'?HEART:FOOD[it.k],Math.round(it.x),Math.round(it.y)+bob)}
  for(const e of S.ents)if(e.alive)drawEnemy(e);
  drawPlayer();
  for(const q of S.parts){ctx.fillStyle=q.col;ctx.globalAlpha=Math.min(1,q.t/12);ctx.fillRect(Math.round(q.x),Math.round(q.y),2,2)}ctx.globalAlpha=1;
  ctx.font='bold 8px "Chakra Petch",monospace';ctx.textAlign='center';
  for(const q of S.pops){ctx.fillStyle='#000';ctx.fillText(q.txt,Math.round(q.x)+9,Math.round(q.y)+1);ctx.fillStyle='#ffe66d';ctx.fillText(q.txt,Math.round(q.x)+8,Math.round(q.y))}
  ctx.restore();
  /* boss bar */
  const boss=S.ents.find(e=>e.type==='boss'&&e.alive);
  if(boss&&boss.x-S.cam<VW+40){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(VW/2-52,6,104,10);ctx.fillStyle='#ff5a4a';ctx.fillRect(VW/2-50,8,100*boss.hp/8,6);ctx.fillStyle='#fff';ctx.font='bold 8px "Chakra Petch",monospace';ctx.textAlign='center';ctx.fillText('NAGY MAMUT',VW/2,26)}
}
function hills(off,col,base,amp,freq,seed){
  ctx.fillStyle=col;
  for(let x=0;x<VW;x+=4){const wx=x+off;const h=base-amp*(Math.sin(wx*freq+seed)*.6+Math.sin(wx*freq*2.3+seed*2)*.4);ctx.fillRect(x,Math.round(h),4,VH-h)}
}
function drawTorch(c){
  ctx.fillStyle='#6a4520';ctx.fillRect(c.x+5,c.y+6,3,18);ctx.fillStyle='#3a2410';ctx.fillRect(c.x+3,c.y+4,7,3);
  if(c.lit){const f=Math.floor(S.t/6)%2;ctx.fillStyle='#ff7a1a';ctx.fillRect(c.x+3,c.y-3+f,7,7);ctx.fillStyle='#ffd23f';ctx.fillRect(c.x+5,c.y-1+f,3,4)}
  else{ctx.fillStyle='#555';ctx.fillRect(c.x+4,c.y+1,5,3)}
}
function drawExit(e){
  ctx.fillStyle='#5a4f48';ctx.fillRect(e.x-2,e.y-2,36,34);ctx.fillStyle='#776b62';ctx.fillRect(e.x,e.y,32,4);ctx.fillRect(e.x,e.y,4,32);ctx.fillRect(e.x+28,e.y,4,32);
  ctx.fillStyle='#0b0806';ctx.fillRect(e.x+5,e.y+6,22,26);ctx.fillRect(e.x+8,e.y+3,16,4);
  if(!S.bossDead){ctx.fillStyle='#8f8a84';ctx.fillRect(e.x+3,e.y+4,26,28);ctx.fillStyle='#5f5a54';ctx.fillRect(e.x+8,e.y+14,6,1);ctx.fillRect(e.x+16,e.y+22,8,1)}
  else{const a=(Math.sin(S.t*.1)+1)/2;ctx.fillStyle=`rgba(255,210,63,${.25+a*.35})`;ctx.fillRect(e.x+12,e.y-14,8,8);ctx.fillRect(e.x+14,e.y-6,4,4)}
}
function drawPlat(pl){
  const x=Math.round(pl.x),y=Math.round(pl.y);
  ctx.fillStyle=S.lv.theme==='volcano'?'#6a5850':'#8b5a2b';ctx.fillRect(x,y,pl.w,pl.h+2);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x,y,pl.w,1);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(x,y+pl.h+1,pl.w,1);
  ctx.fillRect(x+2,y+3,pl.w-4,1);ctx.fillStyle=S.lv.theme==='volcano'?'#4e403a':'#6a4520';ctx.fillRect(x,y,3,pl.h+2);ctx.fillRect(x+pl.w-3,y,3,pl.h+2);
}
function drawEnemy(e){
  if(e.type==='fire'){if(e.hide)return;const f=Math.floor(S.t/4)%2;ctx.fillStyle='#ff5a1a';ctx.fillRect(Math.round(e.x),Math.round(e.y),8,8);ctx.fillStyle='#ffd23f';ctx.fillRect(Math.round(e.x)+2,Math.round(e.y)+2+f,4,4);
    ctx.fillStyle='rgba(255,140,40,.6)';ctx.fillRect(Math.round(e.x)+2,Math.round(e.y)+8,4,e.vy<0?6:2);return}
  if(e.type==='boss')return drawBoss(e);
  const set=e.type==='dino'?DINO:e.type==='spiky'?SPIKY:e.type==='bird'?BIRD:FROG;
  const fr=e.type==='frog'?(e.onGround?0:1):Math.floor(S.t/(e.type==='bird'?10:14))%2;
  const img=set[fr][e.dir>0?0:1];
  const ox=Math.round(e.x+e.w/2-img.width/2),oy=Math.round(e.y+e.h-img.height);
  ctx.drawImage(img,ox,oy);
}
function drawBoss(e){
  if(e.inv>0&&Math.floor(e.inv/3)%2)return;
  const x=Math.round(e.x),y=Math.round(e.y),d=e.dir,W=e.w;
  ctx.save();ctx.translate(x+(d<0?W:0),y);ctx.scale(d<0?-1:1,1);
  const shake=e.st==='wind'?(S.t%4<2?1:-1):0;ctx.translate(shake,0);
  ctx.fillStyle='#4a321e';ctx.fillRect(4,8,30,22);ctx.fillRect(2,12,34,16);
  ctx.fillStyle='#6d4c2f';ctx.fillRect(6,6,26,20);ctx.fillRect(4,10,30,14);
  for(let i=0;i<7;i++){ctx.fillStyle='#4a321e';ctx.fillRect(7+i*4,7+(i%2),1,5)}
  const leg=Math.floor(S.t/(e.st==='charge'?5:10))%2;
  ctx.fillStyle='#4a321e';ctx.fillRect(6,26,6,8-leg*2);ctx.fillRect(14,26,6,8-(1-leg)*2);ctx.fillRect(24,26,6,8-leg*2);
  ctx.fillStyle='#6d4c2f';ctx.fillRect(30,6,12,14);ctx.fillRect(32,4,8,4);
  ctx.fillStyle='#4a321e';ctx.fillRect(38,18,5,10);ctx.fillRect(40,26,4,4);
  ctx.fillStyle='#fff8e1';ctx.fillRect(34,20,3,4);ctx.fillRect(36,23,6,2);ctx.fillRect(41,21,2,3);
  ctx.fillStyle='#fff';ctx.fillRect(36,9,3,3);ctx.fillStyle='#111';ctx.fillRect(37+(e.st==='wind'?1:0),10,2,2);
  if(e.st==='wind'||e.st==='charge'){ctx.fillStyle='#111';ctx.fillRect(34,7,6,1)}
  if(e.st==='stun'){ctx.fillStyle='#ffd23f';ctx.fillRect(18+Math.round(Math.sin(S.t*.3)*6),0,3,3);ctx.fillRect(26+Math.round(Math.cos(S.t*.3)*6),-2,3,3)}
  ctx.restore();
}
function drawPlayer(){
  const p=S.p;
  if(S.mode!=='dying'&&p.inv>0&&Math.floor(p.inv/4)%2)return;
  let k='idle';
  if(S.mode==='dying'||!(p.onGround||p.stand))k='jump';
  else if(Math.abs(p.vx)>.2)k=Math.floor(p.anim)%2?'w1':'w2';
  const img=MAN[k][p.face>0?0:1];
  const x=Math.round(p.x-1),y=Math.round(p.y);
  if(S.mode==='dying'){ctx.save();ctx.translate(x+6,y+10);ctx.rotate((80-S.dieT)*.15);ctx.drawImage(img,-6,-10);ctx.restore();return}
  ctx.drawImage(img,x,y);
  /* club */
  let ang;
  if(p.atk>0){const t=1-p.atk/16;ang=-1.9+t*3.2}else ang=-.6;
  ctx.save();
  const hx=p.face>0?x+10:x+2,hy=y+12;
  ctx.translate(hx,hy);ctx.scale(p.face,1);ctx.rotate(ang);
  ctx.fillStyle='#7a4a1e';ctx.fillRect(-1,-12,3,13);
  ctx.fillStyle='#a8682c';ctx.fillRect(-3,-17,7,7);ctx.fillStyle='#7a4a1e';ctx.fillRect(-3,-11,7,1);ctx.fillRect(2,-16,2,2);
  ctx.restore();
  if(p.atk>=5&&p.atk<=11){ctx.fillStyle='rgba(255,255,255,.5)';const bx=p.face>0?x+12:x-8;ctx.fillRect(bx,y+2,8,1);ctx.fillRect(bx+(p.face>0?3:-1),y+6,6,1)}
}

/* ---------------------------------------------------------------- input */
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyK:'jump',KeyJ:'atk',KeyX:'atk',KeyZ:'jump',ControlLeft:'atk'};
addEventListener('keydown',e=>{
  if(e.code==='KeyP'||e.code==='Escape'){if(S.mode==='play')pause();else if(S.mode==='pause')play();e.preventDefault();return}
  const k=KEYMAP[e.code];if(!k)return;
  if(!$('ov').hidden)return;
  e.preventDefault();audio();
  if(!e.repeat){if(k==='jump')jumpHit=true;if(k==='atk')atkHit=true}
  KEY[k]=true;
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)KEY[k]=false});
addEventListener('blur',()=>{resetKeys();pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){resetKeys();pause()}});
document.querySelectorAll('.pad button').forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{e.preventDefault();audio();if(!KEY[k]){if(k==='jump')jumpHit=true;if(k==='atk')atkHit=true}KEY[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const up=e=>{e.preventDefault();KEY[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
/* a tap on the picture itself jumps (handy when the thumb slips off the pad) */
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();if(S.mode==='play')jumpHit=true});
$('pauseBtn').addEventListener('click',()=>{audio();if(S.mode==='play')pause();else if(S.mode==='pause')play()});

/* ---------------------------------------------------------------- size and loop */
function fit(){
  const st=$('stage'),w=st.clientWidth,h=st.clientHeight;
  if(!w||!h)return;
  const nw=Math.round(Math.max(176,Math.min(320,VH*w/h)));
  const nh=Math.round(Math.max(VH,Math.min(VH*1.6,nw*h/w)));
  if(nw!==VW||nh!==DH){VW=nw;DH=nh;cv.width=VW;cv.height=DH;ctx.imageSmoothingEnabled=false;if(S.lv)S.cam=clampCam(S.cam)}
  const s=Math.max(.5,Math.min(w/VW,h/DH));
  cv.style.width=Math.floor(VW*s)+'px';cv.style.height=Math.floor(DH*s)+'px';
}
addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe($('stage'));
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  let n=0;while(acc>=1000/60&&n<5){step();acc-=1000/60;n++}
  if(n===5)acc=0;
  draw();
  requestAnimationFrame(frame);
}
fit();title();requestAnimationFrame(frame);
/* exposed for the automatic tests only */

<script>
/* Teljes képernyő gomb: csak ott látszik, ahol a böngésző támogatja (iPhone-on nem). */
(function(){
  var d=document, el=d.documentElement, b=d.querySelector('.fs-btn');
  if(!b) return;
  var can=d.fullscreenEnabled||d.webkitFullscreenEnabled;
  if(!can||!(el.requestFullscreen||el.webkitRequestFullscreen)){ b.remove(); return; }
  function on(){ return !!(d.fullscreenElement||d.webkitFullscreenElement); }
  function label(){ b.textContent=b.dataset.compact?'⛶':(on()?'⛶ Kilépés':'⛶ Teljes képernyő'); b.setAttribute('aria-label', on()?'Kilépés a teljes képernyőből':'Teljes képernyő'); }
  b.addEventListener('click', function(){
    try{
      if(on()){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
      else{ var p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el); if(p&&p.catch) p.catch(function(){}); }
    }catch(e){}
    b.blur();
  });
  d.addEventListener('fullscreenchange', label);
  d.addEventListener('webkitfullscreenchange', label);
  label();
})();
</script>
<script>
/* @shared fekvo-jelzes */
/* Fekvő telefonon „Fordítsd el a telefont” jelzés. A játék álló képernyőre készült, ezért amíg a telefon
   fekszik, a jelzés eltakarja, és a játék a saját szünet-logikájával megáll (ugyanaz fut le, mint amikor
   a lap háttérbe kerül). Gépen, széles ablakban nem jelenik meg (csak érintőképernyőn, alacsony ablakban). */
(function(){
  var mq;
  try{ mq=matchMedia('(orientation: landscape) and (max-height: 500px) and (pointer: coarse)'); }catch(e){ return; }
  var st=document.createElement('style');
  st.textContent='.rotate-hint{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;padding:16px;'+
    'background:rgba(5,8,14,.95);color:#fff;font:700 20px/1.3 system-ui,sans-serif;text-align:center}'+
    '.rotate-hint[hidden]{display:none!important}.rotate-hint p{margin:8px 0}'+
    '.rotate-hint .sub{font-weight:400;font-size:16px;opacity:.85}.rotate-hint svg{width:56px;height:56px}';
  var el=document.createElement('div');
  el.className='rotate-hint';el.setAttribute('role','alert');el.hidden=true;
  el.innerHTML='<div><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2" '+
    'fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18.5" r="1" fill="currentColor"/></svg>'+
    '<p>Fordítsd el a telefont!</p><p class="sub">Ez a játék álló képernyőre készült. Addig szünetel.</p></div>';
  function pauseGame(){
    try{
      Object.defineProperty(document,'hidden',{configurable:true,get:function(){return true;}});
      document.dispatchEvent(new Event('visibilitychange'));
    }catch(e){}
    try{ delete document.hidden; }catch(e){}
  }
  function update(e){
    if(mq.matches){ if(el.hidden){ el.hidden=false; if(e) pauseGame(); } }
    else el.hidden=true;
  }
  document.head.appendChild(st);
  document.body.appendChild(el);
  if(mq.addEventListener) mq.addEventListener('change',update); else if(mq.addListener) mq.addListener(update);
  update();
})();
/* @end fekvo-jelzes */
</script>
