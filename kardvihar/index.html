<style>
/* Elrendezés: egyképernyős álló arcade — vissza sáv, pontsor, aréna, harci gombok, ablakok */
:root{
  --bg:#0f1210; --panel:#1a2019; --line:#344232; --fg:#f1f5ec; --muted:#a3b19c;
  --accent:#ffcf4a; --danger:#ff5d73; --mana:#7cc8ff;
  --display:"Bungee","Arial Black",system-ui,sans-serif;
  --ui:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto}
.hud{display:flex;align-items:center;gap:12px}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
#score{font-family:var(--display);color:var(--accent);font-size:21px}
.sp{flex:1}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;padding:0;flex:none}
.icon svg{width:20px;height:20px;fill:currentColor}
.icon:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;touch-action:none}
#cv{position:absolute;left:0;top:0;display:block;touch-action:none;border-radius:12px;box-shadow:0 0 0 2px var(--line)}
.pad{display:none;align-items:center;gap:8px;flex:none}
.pad .tip{flex:1;font-size:13px;color:var(--muted);line-height:1.3}
.pad button{height:60px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;touch-action:none;padding:0 6px;font:700 13px/1.1 var(--ui);flex:none}
.pad button.on{background:var(--line)}
.pad .dash{width:64px}
.pad .spin{width:64px;color:var(--mana)}
.pad .spin:disabled{opacity:.4}
.pad .atk{width:84px;height:68px;background:#4a3a10;border-color:#8a6a1a;color:var(--accent);font-size:15px}
.pad .atk.on{background:#8a6a1a}
.hint{margin:0;text-align:center;font-size:13px;color:var(--muted);flex:none}
@media (pointer:coarse),(hover:none){.pad{display:flex}.hint.desk{display:none}}
#ov{position:fixed;left:0;top:0;right:0;bottom:0;display:grid;place-items:center;background:rgba(6,8,6,.82);z-index:5;padding-inline:16px}
.card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 20px;background:var(--panel);border:1px solid var(--line);border-radius:16px;text-align:center;width:min(370px,100%);max-height:calc(100% - 32px);overflow:auto}
.card h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--accent);line-height:1.1}
.card h2.bad{color:var(--danger)}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.card b{color:var(--fg)}
.big{font-family:var(--display);font-size:48px;line-height:1;color:var(--fg)}
.rec{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--accent);color:#2a1d00;font-weight:700;font-size:14px}
.btns{display:flex;flex-direction:column;gap:8px;width:100%}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;text-align:left;font-size:14px;color:var(--muted);width:100%}
.legend i{font-style:normal;width:16px;height:16px;border-radius:50%;display:inline-block}
button.b{font-family:var(--ui);font-weight:700;font-size:16px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;min-height:44px}
button.b.hot{background:var(--accent);border-color:var(--accent);color:#2a1d00}
button.perk{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}
button.perk span{font-weight:400;font-size:14px;color:var(--muted)}
button.perk.hot span{color:#4a3400}
button:not(:disabled):active{translate:0 1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <div class="top-bar" style="position:relative;z-index:1000;display:flex;flex-wrap:wrap;align-self:flex-start;align-items:center;gap:8px;margin:0"><a class="home-link" href="../index.html" style="display:inline-flex;align-self:flex-start;width:fit-content;align-items:center;gap:6px;margin:0;min-height:44px;min-width:44px;box-sizing:border-box;justify-content:center;padding:6px 14px;border-radius:999px;border:1px solid currentColor;color:inherit;opacity:.75;text-decoration:none;font:600 14px/1.2 system-ui,sans-serif">← Összes játék</a><button type="button" class="fs-btn" aria-label="Teljes képernyő" style="all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;justify-content:center;padding:6px 14px;border-radius:999px;border:1px solid currentColor;color:inherit;opacity:.75;cursor:pointer;font:600 14px/1.2 system-ui,sans-serif">⛶ Teljes képernyő</button><button type="button" class="hap-btn" aria-pressed="true" aria-label="Rezgés: be" style="all:unset;box-sizing:border-box;display:none;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:6px 10px;border-radius:999px;border:1px solid currentColor;color:inherit;opacity:.75;cursor:pointer;font:600 18px/1.2 system-ui,sans-serif">📳</button></div>
  <div class="hud">
    <div class="stat"><span class="lbl">Pont</span><span class="val" id="score">0</span></div>

  <div id="stage"><canvas id="cv" aria-label="Kardvihar aréna"></canvas></div>
  <div class="pad" aria-label="Harci gombok">
    <span class="tip">Húzd az ujjad a pályán a mozgáshoz</span>
    <button type="button" class="dash" data-k="dash" aria-label="Gurulás">Gurul</button>
    <button type="button" class="spin" data-k="spin" aria-label="Forgó csapás">Forgó</button>
    <button type="button" class="atk" data-k="atk" aria-label="Kardcsapás">KARD</button>
  </div>
  <p class="hint desk">Nyilak/WASD mozgás · szóköz/J: kard · K: gurulás · L: forgó csapás · Esc: szünet</p>
</div>
<div id="ov" hidden><div class="card" id="card"></div></div>

<script>
/* @shared kepesseg */
/* Modern böngészőképességek egy helyen. Mind opcionális: ha a böngésző nem tudja, vagy hibát ad, csendben nem
   történik semmi, a játék ugyanúgy játszható. Hálózatot nem használ, és a játék soha nem vár rá.
   A játék fő szkriptje ELŐTT kell betölteni, mert a játék a window.Kepesseg függvényeit hívja.
     Kepesseg.haptic(minta)   rövid rezgés telefonon (navigator.vibrate) és kontrolleren (vibrationActuator).
                              minta: 'tap' | 'hit' | 'hurt' | 'boom' | 'reward' | 'over', vagy ms, vagy ms-tömb.
                              Csak koppintás/gombnyomás után rezeg, van rá időkorlát, és ki lehet kapcsolni.
     Kepesseg.hapticsOn() / Kepesseg.setHaptics(be)   a közös rezgés-beállítás (localStorage: kepesseg:rezges).
       Ha az oldalon van .hap-btn gomb, az kapcsolja; csak ott látszik, ahol van mit rezegtetni.
     Kepesseg.wakeLock(be)    true: amíg tart a játék, a kijelző ne aludjon el; false: elengedi. Háttérbe tett
                              lap után magától újrakéri; 2 perc tétlenség után elengedi, a következő érintésre újra.
     Kepesseg.transition(fn)  fn a képernyőváltás DOM-módosítása; View Transitionnel fut, ha lehet, és nincs
                              csökkentett mozgás. Különben (vagy hibánál) azonnal fut. Az átmenet alatt (0,15 mp)
                              a böngésző nem ad át érintést, ezért csak ablak MEGJELENÉSÉRE használd; a játékba
                              visszavezető bezárás legyen azonnali, és hívja a Kepesseg.endTransition()-t.
     Kepesseg.quality(most)   képkockánként hívva a díszítő grafika szintje: 2 teljes, 1 kevesebb, 0 legkevesebb.
                              Csak látványra használd (részecske, háttér), játéklogikára soha.
     Tájolás: ha a <head>-ben <meta name="games:orientation" content="portrait"> (vagy landscape) áll, teljes
       képernyőn a böngésző abba a tájolásba zárol, kilépéskor felold. */
(function(){
  if(window.Kepesseg)return;
  var d=document,nav=navigator,noop=function(){};
  function now(){return (window.performance&&performance.now)?performance.now():Date.now()}
  function mq(q){try{return matchMedia(q).matches}catch(e){return false}}
  function calm(){return mq('(prefers-reduced-motion: reduce)')}
  function quiet(p){try{if(p&&typeof p.then==='function')p.then(noop,noop)}catch(e){}return p}

  /* ---------- rezgés ---------- */
  var KEY='kepesseg:rezges',PAT={tap:[10],hit:[20],hurt:[45],boom:[70],reward:[25,50,25],over:[40,60,40]};
  var POW={tap:.25,hit:.45,hurt:.8,boom:1,reward:.5,over:.7},RANK={tap:0,hit:1,reward:2,hurt:3,boom:3,over:4};
  var on=true,last=-1e9,busy=0,busyRank=-1;
  try{on=localStorage.getItem(KEY)!=='0'}catch(e){}
  function pattern(m){
    var p=typeof m==='string'?PAT[m]:typeof m==='number'?[m]:Array.isArray(m)?m:null,out=[],sum=0;
    if(!p)return null;
    for(var i=0;i<p.length&&i<7;i++){var v=+p[i];if(!(v>=0))return null;v=Math.min(200,Math.round(v));
      if(i%2===0){if(sum+v>400)v=400-sum;sum+=v}out.push(v)}
    return sum>0?out:null;
  }
  function pads(){
    var r=[];try{var g=nav.getGamepads?nav.getGamepads():[];for(var i=0;i<g.length;i++)
      if(g[i]&&g[i].connected!==false&&(g[i].vibrationActuator||(g[i].hapticActuators&&g[i].hapticActuators[0])))r.push(g[i])}catch(e){}
    return r;
  }
  function phone(){return typeof nav.vibrate==='function'&&mq('(pointer: coarse)')}
  function rumble(gp,ms,pow){
    try{
      var a=gp.vibrationActuator;
      if(a&&typeof a.playEffect==='function'){
        var t=(a.effects&&a.effects.indexOf&&a.effects.indexOf('dual-rumble')<0&&a.effects.indexOf('trigger-rumble')<0)?a.effects[0]:'dual-rumble';
        quiet(a.playEffect(t||'dual-rumble',{startDelay:0,duration:ms,strongMagnitude:pow,weakMagnitude:Math.min(1,pow+.2)}));
      }else if(gp.hapticActuators&&gp.hapticActuators[0]&&gp.hapticActuators[0].pulse){
        quiet(gp.hapticActuators[0].pulse(pow,ms));
      }
    }catch(e){}
  }
  function haptic(m){
    if(!on)return false;
    try{var ua=nav.userActivation;if(ua&&!ua.hasBeenActive)return false}catch(e){}
    var p=pattern(m);if(!p)return false;
    var t=now(),rk=typeof m==='string'?RANK[m]:1,total=0;
    if(t-last<70)return false;                       /* sűrű eseményeknél nem rezeg minden alkalommal */
    if(t<busy&&rk<=busyRank)return false;            /* gyengébb jelzés nem szakítja meg az erősebbet */
    for(var i=0;i<p.length;i++)total+=p[i];
    last=t;busy=t+total;busyRank=rk;
    var did=false,gs=pads(),pow=typeof m==='string'?POW[m]:.5;
    if(gs.length){
      var off=0;did=true;
      for(var j=0;j<p.length;j+=2){(function(ms,at){
        if(at===0)gs.forEach(function(g){rumble(g,ms,pow)});
        else setTimeout(function(){if(on)pads().forEach(function(g){rumble(g,ms,pow)})},at);
      })(p[j],off);off+=p[j]+(p[j+1]||0)}
    }
    if(phone()){try{did=nav.vibrate(p.length===1?p[0]:p)!==false||did}catch(e){}}
    return did;
  }
  function stop(){busy=0;try{if(typeof nav.vibrate==='function')nav.vibrate(0)}catch(e){}
    pads().forEach(function(g){try{var a=g.vibrationActuator;if(a&&a.reset)quiet(a.reset())}catch(e){}})}
  function setHaptics(v){on=!!v;try{localStorage.setItem(KEY,on?'1':'0')}catch(e){}if(!on)stop();label()}
  var btn=null;
  function label(){
    if(!btn)return;
    btn.textContent=on?'📳':'📴';btn.setAttribute('aria-pressed',on?'true':'false');
    btn.setAttribute('aria-label',on?'Rezgés: be':'Rezgés: ki');btn.title=on?'Rezgés: be':'Rezgés: ki';
    btn.style.opacity=on?'.75':'.45';
  }
  function showBtn(){
    if(!btn)return;
    btn.style.display=(phone()||pads().length)?'inline-flex':'none';
    /* ha nem fér ki egy sorba, a teljes képernyő gomb csak ikont mutat (ugyanaz a data-compact jelzés, amit a gomb szkriptje is ismer) */
    var fs=d.querySelector('.fs-btn'),first=btn.parentNode&&btn.parentNode.firstElementChild;
    if(fs&&first&&btn.style.display!=='none'&&btn.offsetTop>first.offsetTop+4){fs.dataset.compact='1';fs.textContent='⛶'}
  }
  function initBtn(){
    btn=d.querySelector('.hap-btn');if(!btn)return;
    btn.addEventListener('click',function(){setHaptics(!on);if(on)haptic('hit');btn.blur()});
    label();showBtn();
  }
  addEventListener('gamepadconnected',showBtn);addEventListener('gamepaddisconnected',showBtn);

  /* ---------- ébren tartás (Screen Wake Lock) ---------- */
  var IDLE=120000,want=false,lock=null,pending=false,lastUse=0,timer=0;
  function wlRequest(){
    if(!want||lock||pending||d.visibilityState!=='visible')return;
    var w=nav.wakeLock;if(!w||typeof w.request!=='function')return;
    pending=true;
    try{
      w.request('screen').then(function(s){
        pending=false;
        if(!want||!s){try{s&&quiet(s.release())}catch(e){}return}
        lock=s;try{s.addEventListener('release',function(){if(lock===s)lock=null})}catch(e){}
      },function(){pending=false});
    }catch(e){pending=false}
  }
  function wlRelease(){var s=lock;lock=null;if(s)try{quiet(s.release())}catch(e){}}
  function used(){lastUse=now();if(want&&!lock)wlRequest()}
  function tick(){if(lock&&now()-lastUse>IDLE)wlRelease()}
  function wakeLock(v){
    want=!!v;lastUse=now();
    if(want){wlRequest();if(!timer)timer=setInterval(tick,15000)}
    else{wlRelease();if(timer){clearInterval(timer);timer=0}}
  }
  d.addEventListener('visibilitychange',function(){if(d.visibilityState==='visible'){lastUse=now();wlRequest()}});
  ['pointerdown','keydown','touchstart'].forEach(function(ev){addEventListener(ev,used,{capture:true,passive:true})});
  addEventListener('pagehide',function(){wlRelease();oriUnlock()});

  /* ---------- képernyőváltás (View Transitions) ---------- */
  var vt=null,vtCss=false;
  function transition(fn){
    var done=false,run=function(){if(done)return;done=true;
      try{fn()}catch(e){setTimeout(function(){throw e},0)}};   /* a játék hibája ne vesszen el */
    /* betöltés közben (első képernyő) nincs mit átúsztatni */
    if(typeof d.startViewTransition!=='function'||calm()||d.visibilityState!=='visible'||d.readyState!=='complete'){run();return}
    if(!vtCss){vtCss=true;try{var st=d.createElement('style');
      st.textContent='::view-transition-old(root),::view-transition-new(root){animation-duration:.15s}';d.head.appendChild(st)}catch(e){}}
    try{
      var t=d.startViewTransition(run);vt=t;
      var clear=function(){if(vt===t)vt=null};
      quiet(t.ready);quiet(t.updateCallbackDone);
      if(t.finished&&t.finished.then)t.finished.then(clear,clear);
    }catch(e){run()}
    if(!done)setTimeout(run,250);                     /* ha a böngésző nem futtatná le, akkor is megtörténik */
  }
  /* a futó átmenet azonnali vége: bezáráskor és bármilyen érintésre, gombnyomásra, hogy a játék ne várjon rá */
  function endTransition(){var t=vt;vt=null;if(t)try{t.skipTransition()}catch(e){}}
  ['pointerdown','keydown'].forEach(function(ev){addEventListener(ev,function(){if(vt)endTransition()},{capture:true,passive:true})});

  /* ---------- tájolás (Screen Orientation) ---------- */
  var ori=null,oriLocked=false;
  function oriPref(){var m=d.querySelector('meta[name="games:orientation"]'),v=m&&m.getAttribute('content');
    return v==='portrait'||v==='landscape'?v:null}
  function oriLock(){
    var o=window.screen&&screen.orientation,p=ori||(ori=oriPref());
    if(!p||!o||typeof o.lock!=='function')return;
    try{var r=o.lock(p);oriLocked=true;if(r&&r.then)r.then(noop,function(){oriLocked=false})}catch(e){oriLocked=false}
  }
  function oriUnlock(){
    if(!oriLocked)return;oriLocked=false;
    try{var o=window.screen&&screen.orientation;if(o&&typeof o.unlock==='function')o.unlock()}catch(e){}
  }
  function fsChange(){if(d.fullscreenElement||d.webkitFullscreenElement)oriLock();else oriUnlock()}
  d.addEventListener('fullscreenchange',fsChange);d.addEventListener('webkitfullscreenchange',fsChange);

  /* ---------- adaptív grafikai minőség ---------- */
  var Q={lvl:2,t:0,acc:0,n:0,bad:0,good:0,changed:-1e9,ups:0,hot:false,watch:false,forced:null};
  function watchPressure(){
    Q.watch=true;
    try{if(typeof window.PressureObserver==='function'){
      var po=new window.PressureObserver(function(rs){var s=rs&&rs.length&&rs[rs.length-1].state;Q.hot=s==='serious'||s==='critical'});
      quiet(po.observe('cpu'));
    }}catch(e){}
  }
  function level(){var l=Q.forced!=null?Q.forced:Q.lvl;return calm()?Math.min(l,1):l}
  function quality(t){
    if(typeof t!=='number'||!isFinite(t))return level();
    if(!Q.watch)watchPressure();
    var dt=t-Q.t;Q.t=t;
    if(!(dt>0)||dt>250)return level();               /* szünet, háttér: nem mérjük */
    Q.acc+=dt;Q.n++;
    if(Q.acc>=1000){
      var avg=Q.acc/Q.n;Q.acc=0;Q.n=0;
      Q.bad=(avg>24||Q.hot)?Q.bad+1:0;Q.good=(avg<18&&!Q.hot)?Q.good+1:0;
      if(t-Q.changed>4000){
        if(Q.bad>=2&&Q.lvl>0){Q.lvl--;Q.changed=t;Q.bad=Q.good=0}
        else if(Q.good>=15&&Q.lvl<2&&Q.ups<2){Q.lvl++;Q.ups++;Q.changed=t;Q.good=0}   /* ritkán, és csak kétszer lép vissza */
      }
    }
    return level();
  }
  function setQuality(l){Q.forced=(l===0||l===1||l===2)?l:null}

  window.Kepesseg={haptic:haptic,hapticsOn:function(){return on},setHaptics:setHaptics,wakeLock:wakeLock,
    wakeLockHeld:function(){return !!lock},transition:transition,endTransition:endTransition,quality:quality,setQuality:setQuality};
  if(d.readyState==='loading')d.addEventListener('DOMContentLoaded',initBtn);else initBtn();
})();
/* @end kepesseg */
</script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const W=360;                                  // az aréna szélessége játékegységben; a magasság a képernyőhöz igazodik
const PR=13;                                  // a lovag sugara
// Szörnyek: hp, sebesség, pont, xp, sugár, szín, sebzés
const KINDS={
  slime:{name:'Nyálka',hp:2,sp:40,pts:10,xp:1,r:14,col:'#6ee06e',dmg:1},
  bat:{name:'Denevér',hp:1,sp:92,pts:15,xp:1,r:11,col:'#b48cff',dmg:1},
  boar:{name:'Tüskés',hp:4,sp:42,pts:25,xp:2,r:16,col:'#e0884a',dmg:2},
  shroom:{name:'Gombász',hp:3,sp:38,pts:30,xp:2,r:14,col:'#ff6fa8',dmg:1},
  golem:{name:'Kőgólem',hp:36,sp:30,pts:400,xp:12,r:34,col:'#9aa4b4',dmg:2},
};
// Képességek szintlépéskor: kulcs, név, leírás, legfeljebb hányszor vehető fel
const PERKS=[
  ['dmg','Erősebb kard','+35% sebzés',5],
  ['range','Hosszabb penge','+15% vágási táv',4],
  ['arc','Széles vágás','szélesebb ív',3],
  ['speed','Fürge láb','+12% futás',4],
  ['dash','Gyors gurulás','hamarabb gurulhatsz újra',3],
  ['vamp','Életlopó kard','minden pár legyőzött szörny 1 szívet ad',3],
  ['hp','Erős szív','+1 szív, és gyógyul is 1',6],
  ['charge','Viharszív','gyorsabban töltődik a forgó csapás',3],
];
let H=560,sc=1,dpr=1,cw=0,ch=0,deco=[];
let G=null,last=0,actx=null,hudKey='';
const keys={up:false,down:false,left:false,right:false};
let joy=null;                                 // érintős botkormány: {id,x0,y0,x,y}

// ---------- rekord, mentés (csak localStorage) ----------
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
let sound=lsGet('kardvihar-sound')!=='0';
const okInt=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;
function loadBest(){
  try{const d=JSON.parse(lsGet('kardvihar-best'));
    if(d&&typeof d==='object'&&!Array.isArray(d)&&okInt(d.score,0,99999999)&&okInt(d.wave,0,9999))return {score:d.score,wave:d.wave}}catch(e){}
  return {score:0,wave:0};
}
let best=loadBest();
function noPerks(){const o={};for(const p of PERKS)o[p[0]]=0;return o}
function save(){
  if(!G||G.phase==='over')return;
  lsSet('kardvihar-save',JSON.stringify({v:1,wave:G.wave,score:G.score,hp:G.hp,maxhp:G.maxhp,lvl:G.lvl,xp:G.xp,P:G.P}));
}
function loadSave(){
  try{
    const d=JSON.parse(lsGet('kardvihar-save'));
    if(!d||typeof d!=='object'||Array.isArray(d)||d.v!==1)return null;
    if(!okInt(d.wave,1,9999)||!okInt(d.score,0,99999999)||!okInt(d.maxhp,5,12)||!okInt(d.hp,1,d.maxhp)||!okInt(d.lvl,1,999)||!okInt(d.xp,0,99999))return null;
    if(!d.P||typeof d.P!=='object'||Array.isArray(d.P))return null;
    const P=noPerks();
    for(const [k,,,max] of PERKS){const v=d.P[k];if(v===undefined)continue;if(!okInt(v,0,max))return null;P[k]=v}
    return {wave:d.wave,score:d.score,hp:d.hp,maxhp:d.maxhp,lvl:d.lvl,xp:d.xp,P};
  }catch(e){return null}
}

// ---------- hang (Web Audio) ----------
function beep(f,d=0.06,type='square',v=0.04,at=0,f2=0){
  if(!sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+at;
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+0.02);
  }catch(e){}
}

    :'<path d="M3 9v6h4l5 5V4L7 9H3zm18.4 6L20 16.4l-2.6-2.6-2.6 2.6L13.4 15l2.6-2.6-2.6-2.6 1.4-1.4 2.6 2.6 2.6-2.6 1.4 1.4-2.6 2.6z"/>';
  $('snd').setAttribute('aria-pressed',sound?'true':'false');
}
$('snd').addEventListener('click',()=>{sound=!sound;lsSet('kardvihar-sound',sound?'1':'0');sndIcon();beep(660)});
sndIcon();

// ---------- számítás ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const angDiff=(a,b)=>{let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return Math.abs(d)};
function stats(){
  const P=G.P;
  return {dmg:1+.35*P.dmg,range:46*(1+.15*P.range),arc:1.9+.4*P.arc,speed:125*(1+.12*P.speed),
          dashCd:1.1*Math.pow(.75,P.dash),vampN:P.vamp?Math.max(5,16-4*P.vamp):0,charge:.055*(1+.35*P.charge)};
}
const xpNeed=l=>8+l*5;

// ---------- játék ----------
function newGame(from){
  Kepesseg.wakeLock(true);   // amíg tart a játék, a kijelző ne aludjon el
  G={phase:'play',wave:1,score:0,hp:5,maxhp:5,lvl:1,xp:0,P:noPerks(),
     pl:{x:W/2,y:H/2,face:-Math.PI/2,inv:1,dash:0,dashCd:0,dx:0,dy:0,atkT:0,combo:-1,comboT:0,spin:0,charge:0,kx:0,ky:0},
     en:[],shots:[],parts:[],drops:[],slashes:[],rings:[],toSpawn:[],spawnT:0,waveT:0,banner:null,kills:0,vampK:0,shake:0,rec:false,perkQ:0};
  if(from){Object.assign(G,{wave:from.wave,score:from.score,hp:from.hp,maxhp:from.maxhp,lvl:from.lvl,xp:from.xp,P:from.P})}
  startWave(G.wave);hideOv();hud();
}
function startWave(n){
  G.wave=n;G.en=[];G.shots=[];G.rings=[];G.drops=[];
  const list=[],cnt=5+n*2,boss=n%5===0;
  for(let i=0;i<cnt;i++){
    const r=Math.random();let k='slime';
    if(n>=4&&r<.18)k='shroom';else if(n>=3&&r<.38)k='boar';else if(n>=2&&r<.62)k='bat';
    list.push(k);
  }
  if(boss){list.length=Math.min(list.length,4+n);list.splice(2,0,'golem')}
  G.toSpawn=list;G.spawnT=.8;
  G.banner={text:boss?n+'. hullám · Kőgólem!':n+'. hullám',t:1.8};
  save();hud();
}
function spawn(k){
  const K=KINDS[k],side=Math.random()*4|0,m=K.r+4;
  let x,y;
  if(side===0){x=rnd(m,W-m);y=m}else if(side===1){x=W-m;y=rnd(m,H-m)}else if(side===2){x=rnd(m,W-m);y=H-m}else{x=m;y=rnd(m,H-m)}
  const scale=1+(G.wave-1)*.12;
  const hp=k==='golem'?Math.round(K.hp+G.wave*4):Math.max(1,Math.round(K.hp*scale));
  G.en.push({k,x,y,vx:0,vy:0,hp,max:hp,r:K.r,t:rnd(0,6),flash:0,stun:0,st:'go',stT:0,shot:rnd(1.2,2.4),cx:0,cy:0,slam:3,call:6,born:.35});
  addParts(x,y,10,'#e8e2d0',60);
}
function addParts(x,y,n,col,sp=120,life=.6){
  for(let i=0;i<n;i++){const a=rnd(0,7),v=rnd(sp*.3,sp);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:rnd(life*.5,life),col,s:rnd(2,4)})}
}
function nearest(maxD){
  let best=null,bd=maxD;
  for(const e of G.en){const d=Math.hypot(e.x-G.pl.x,e.y-G.pl.y);if(d<bd){bd=d;best=e}}
  return best;
}
function moveVec(){
  let x=(keys.right?1:0)-(keys.left?1:0),y=(keys.down?1:0)-(keys.up?1:0);
  if(joy){const dx=joy.x-joy.x0,dy=joy.y-joy.y0,l=Math.hypot(dx,dy);if(l>6){const m=Math.min(1,l/40);x=dx/l*m;y=dy/l*m}}
  const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}
  return [x,y];
}
function attack(){
  if(!G||G.phase!=='play')return;
  const p=G.pl;if(p.atkT>0||p.spin>0)return;
  p.combo=p.comboT>0?(p.combo+1)%3:0;
  const [mx,my]=moveVec();
  if(Math.hypot(mx,my)<.2){const e=nearest(150);if(e)p.face=Math.atan2(e.y-p.y,e.x-p.x)}   // állva a legközelebbi szörny felé vág
  const S=stats(),big=p.combo===2,range=S.range*(big?1.2:1),arc=S.arc*(big?1.15:1);
  G.slashes.push({x:p.x,y:p.y,a:p.face,arc,r:range,t:.16,big,dir:p.combo===1?-1:1});
  p.atkT=big?.36:.2;p.comboT=.55;
  p.kx+=Math.cos(p.face)*(big?90:50);p.ky+=Math.sin(p.face)*(big?90:50);
  let hit=false;
  for(const e of G.en){
    if(e.born>0)continue;
    const d=Math.hypot(e.x-p.x,e.y-p.y);
    if(d<range+e.r&&(d<e.r+PR||angDiff(Math.atan2(e.y-p.y,e.x-p.x),p.face)<arc/2)){hurtEnemy(e,S.dmg*(big?2:1),big?260:160);hit=true}
  }
  beep(big?300:420,.08,'sawtooth',.03,0,big?120:200);
  if(hit)beep(160,.06,'square',.04);
}
function spinAttack(){
  if(!G||G.phase!=='play')return;
  const p=G.pl;if(p.charge<1||p.spin>0)return;
  p.charge=0;p.spin=.5;p.inv=Math.max(p.inv,.55);
  const S=stats(),R=S.range*1.7;
  G.rings.push({x:p.x,y:p.y,r:10,max:R,t:.35,col:'124,200,255',hurts:false});
  for(const e of G.en)if(e.born<=0&&Math.hypot(e.x-p.x,e.y-p.y)<R+e.r)hurtEnemy(e,S.dmg*3,300);
  G.shake=.25;beep(200,.4,'sawtooth',.05,0,900);Kepesseg.haptic('hit');
}
function dash(){
  if(!G||G.phase!=='play')return;
  const p=G.pl;if(p.dashCd>0||p.dash>0)return;
  let [mx,my]=moveVec();if(Math.hypot(mx,my)<.2){mx=Math.cos(p.face);my=Math.sin(p.face)}
  const l=Math.hypot(mx,my);p.dx=mx/l;p.dy=my/l;p.dash=.2;p.inv=Math.max(p.inv,.3);p.dashCd=stats().dashCd;
  beep(700,.12,'triangle',.03,0,300);
}
function hurtEnemy(e,d,kb){
  e.hp-=d;e.flash=.12;e.stun=e.k==='golem'?.05:.18;
  const a=Math.atan2(e.y-G.pl.y,e.x-G.pl.x),m=e.k==='golem'?.15:1;
  e.vx=Math.cos(a)*kb*m;e.vy=Math.sin(a)*kb*m;
  if(e.st==='charge'){e.st='rest';e.stT=.6}
  G.pl.charge=Math.min(1,G.pl.charge+stats().charge*(e.k==='golem'?1.5:1));
  addParts(e.x,e.y,4,'#fff',140,.25);
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  const K=KINDS[e.k];
  e.dead=true;G.score+=K.pts;G.kills++;
  addParts(e.x,e.y,e.k==='golem'?40:14,'#d9d4c4',e.k==='golem'?180:100,.8);
  addParts(e.x,e.y,6,K.col,90,.5);
  Kepesseg.haptic(e.k==='golem'?'boom':'hit');
  beep(e.k==='golem'?90:240,e.k==='golem'?.6:.12,'square',.04,0,e.k==='golem'?40:80);
  if(e.k==='golem'){G.shake=.4;for(let i=0;i<3;i++)G.drops.push({x:e.x+rnd(-20,20),y:e.y+rnd(-20,20),t:12})}
  else if(Math.random()<(G.hp<=2?.12:.05))G.drops.push({x:e.x,y:e.y,t:9});
  const S=stats();
  if(S.vampN&&++G.vampK>=S.vampN){G.vampK=0;if(G.hp<G.maxhp){G.hp++;G.banner={text:'+1 szív',t:.8}}}
  G.xp+=K.xp;
  while(G.xp>=xpNeed(G.lvl)){G.xp-=xpNeed(G.lvl);G.lvl++;G.perkQ++;Kepesseg.haptic('reward')}
}
function hurtPlayer(d,fx,fy){
  const p=G.pl;if(p.inv>0||p.dash>0||p.spin>0)return;
  G.hp-=d;p.inv=1;G.shake=.2;
  const a=Math.atan2(p.y-fy,p.x-fx);p.kx+=Math.cos(a)*220;p.ky+=Math.sin(a)*220;
  addParts(p.x,p.y,10,'#ffcf4a',120,.4);beep(140,.25,'sawtooth',.05,0,60);Kepesseg.haptic('hurt');
  if(G.hp<=0){G.hp=0;over()}
}
function update(dt){
  if(G.banner&&(G.banner.t-=dt)<=0)G.banner=null;
  if(G.shake>0)G.shake-=dt;
  const p=G.pl,S=stats();
  // lovag
  if(p.atkT>0)p.atkT-=dt;if(p.comboT>0)p.comboT-=dt;if(p.inv>0)p.inv-=dt;if(p.dashCd>0)p.dashCd-=dt;if(p.spin>0)p.spin-=dt;
  const [mx,my]=moveVec();
  let vx,vy;
  if(p.dash>0){p.dash-=dt;vx=p.dx*S.speed*3.4;vy=p.dy*S.speed*3.4;if(Math.random()<.7)G.parts.push({x:p.x,y:p.y,vx:0,vy:0,t:.25,col:'#c9d6ff',s:3})}
  else{
    const slow=p.atkT>0?.45:1;vx=mx*S.speed*slow;vy=my*S.speed*slow;
    if(Math.hypot(mx,my)>.2&&p.atkT<=0)p.face=Math.atan2(my,mx);
  }
  p.x+=(vx+p.kx)*dt;p.y+=(vy+p.ky)*dt;const kd=Math.exp(-10*dt);p.kx*=kd;p.ky*=kd;
  p.x=clamp(p.x,PR,W-PR);p.y=clamp(p.y,PR,H-PR);
  // érkezés
  if(G.toSpawn.length&&G.en.length<6+G.wave){
    if((G.spawnT-=dt)<=0){G.spawnT=Math.max(.35,1.1-G.wave*.05);spawn(G.toSpawn.shift())}
  }
  // szörnyek
  for(const e of G.en){
    const K=KINDS[e.k];e.t+=dt;if(e.flash>0)e.flash-=dt;
    if(e.born>0){e.born-=dt;continue}
    const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
    let tx=0,ty=0,sp=K.sp*(1+Math.min(.5,(G.wave-1)*.03));
    if(e.stun>0)e.stun-=dt;
    else if(e.k==='slime'){const hop=Math.max(0,Math.sin(e.t*5));tx=ux*sp*(.4+hop*1.3);ty=uy*sp*(.4+hop*1.3)}
    else if(e.k==='bat'){const w=Math.sin(e.t*6)*.9;tx=(ux-uy*w)*sp;ty=(uy+ux*w)*sp}
    else if(e.k==='boar'){
      if(e.st==='go'){tx=ux*sp;ty=uy*sp;if(d<160){e.st='wind';e.stT=.65;e.cx=ux;e.cy=uy}}
      else if(e.st==='wind'){if((e.stT-=dt)<=0){e.st='charge';e.stT=.6}}
      else if(e.st==='charge'){tx=e.cx*250;ty=e.cy*250;if((e.stT-=dt)<=0||e.x<e.r||e.x>W-e.r||e.y<e.r||e.y>H-e.r){e.st='rest';e.stT=.8}}
      else if((e.stT-=dt)<=0)e.st='go';
    }
    else if(e.k==='shroom'){
      const want=d>170?1:d<120?-1:0;tx=ux*sp*want+(-uy)*sp*.4;ty=uy*sp*want+ux*sp*.4;
      if((e.shot-=dt)<=0){e.shot=Math.max(1.4,2.6-G.wave*.06);const a=Math.atan2(dy,dx);
        G.shots.push({x:e.x,y:e.y,vx:Math.cos(a)*115,vy:Math.sin(a)*115,t:4});beep(520,.08,'triangle',.03,0,260)}
    }
    else if(e.k==='golem'){
      if(e.st==='go'){tx=ux*sp;ty=uy*sp;
        if((e.slam-=dt)<=0){e.st='wind';e.stT=.8}
        if((e.call-=dt)<=0){e.call=7;G.toSpawn.unshift('slime','slime')}}
      else if(e.st==='wind'){if((e.stT-=dt)<=0){e.st='go';e.slam=3.4;G.rings.push({x:e.x,y:e.y,r:e.r,max:125,t:.6,col:'255,140,90',hurts:true});G.shake=.3;beep(70,.4,'sawtooth',.06,0,35)}}
    }
    e.x+=(tx+e.vx)*dt;e.y+=(ty+e.vy)*dt;const f=Math.exp(-8*dt);e.vx*=f;e.vy*=f;
    e.x=clamp(e.x,e.r,W-e.r);e.y=clamp(e.y,e.r,H-e.r);
    if(Math.hypot(p.x-e.x,p.y-e.y)<e.r+PR-2&&!(e.k==='boar'&&e.st==='rest'&&e.stT>.5))hurtPlayer(K.dmg,e.x,e.y);
  }
  // szörnyek ne álljanak egymáson
  for(let i=0;i<G.en.length;i++)for(let j=i+1;j<G.en.length;j++){
    const a=G.en[i],b=G.en[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r-4;
    if(d>0&&d<m){const push=(m-d)/2,ux=dx/d,uy=dy/d,wa=a.k==='golem'?.1:1,wb=b.k==='golem'?.1:1;a.x-=ux*push*wa;a.y-=uy*push*wa;b.x+=ux*push*wb;b.y+=uy*push*wb}
  }
  G.en=G.en.filter(e=>!e.dead);
  for(const s of G.shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.t-=dt;
    if(Math.hypot(s.x-p.x,s.y-p.y)<PR+4){s.t=0;hurtPlayer(1,s.x,s.y)}
    for(const sl of G.slashes)if(Math.hypot(s.x-sl.x,s.y-sl.y)<sl.r+4&&angDiff(Math.atan2(s.y-sl.y,s.x-sl.x),sl.a)<sl.arc/2){s.t=0;addParts(s.x,s.y,5,'#ff6fa8',80,.3)}
    if(s.x<0||s.y<0||s.x>W||s.y>H)s.t=0}
  G.shots=G.shots.filter(s=>s.t>0);
  for(const r of G.rings){
    const prev=r.r;r.r+=(r.max-10)/(.6)*dt;r.t-=dt;
    if(r.hurts){const d=Math.hypot(p.x-r.x,p.y-r.y);if(d>prev-PR&&d<r.r+PR)hurtPlayer(1,r.x,r.y)}
  }
  G.rings=G.rings.filter(r=>r.t>0&&r.r<r.max+5);
  for(const s of G.slashes){s.t-=dt;s.x=p.x;s.y=p.y}
  G.slashes=G.slashes.filter(s=>s.t>0);
  for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt;q.vx*=.93;q.vy*=.93}
  G.parts=G.parts.filter(q=>q.t>0);
  for(const h of G.drops){h.t-=dt;if(Math.hypot(h.x-p.x,h.y-p.y)<PR+10){h.t=0;if(G.hp<G.maxhp)G.hp++;else G.score+=50;beep(880,.08,'triangle',.04);beep(1175,.1,'triangle',.04,.07)}}
  G.drops=G.drops.filter(h=>h.t>0);
  if(G.phase!=='play')return;
  // szintlépés
  if(G.perkQ>0){G.perkQ--;showPerks();return}
  // hullám vége
  if(!G.toSpawn.length&&!G.en.length){
    if(!G.waveT){G.waveT=1.6;if(G.hp<G.maxhp)G.hp++;G.banner={text:'Tiszta! +1 szív',t:1.4};beep(660,.1,'triangle',.04);beep(880,.15,'triangle',.04,.1)}
    else if((G.waveT-=dt)<=0){G.waveT=0;startWave(G.wave+1)}
  }
  hud();
}
function over(){
  Kepesseg.wakeLock(false);
  G.phase='over';lsDel('kardvihar-save');Kepesseg.haptic('over');
  G.rec=G.score>best.score;
  if(G.rec||G.wave>best.wave){best={score:Math.max(best.score,G.score),wave:Math.max(best.wave,G.wave)};lsSet('kardvihar-best',JSON.stringify(best))}
  keys.up=keys.down=keys.left=keys.right=false;joy=null;
  hud();
  setTimeout(()=>{if(G&&G.phase==='over')showOver()},700);
}

function fit(){

  sc=cw/W;H=Math.max(380,ch/sc);dpr=window.devicePixelRatio||1;
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.style.left=Math.floor((r.width-cw)/2)+'px';
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  deco=[];for(let i=0;i<46;i++)deco.push([rnd(0,W),rnd(0,H),Math.random()<.75?'g':'s',rnd(.7,1.3)]);
  if(G){const p=G.pl;p.y=clamp(p.y,PR,H-PR);for(const e of G.en)e.y=clamp(e.y,e.r,H-e.r)}

new ResizeObserver(fit).observe($('stage'));

    ctx.fillStyle=col;ctx.beginPath();ctx.arc(ex+Math.cos(ang)*r*.08,ey+Math.sin(ang)*r*.08,r*.12,0,7);ctx.fill()}
}
function drawEnemy(e){
  const K=KINDS[e.k],a=Math.atan2(G.pl.y-e.y,G.pl.x-e.x);

    const sq=1+Math.sin(e.t*10)*.12;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(e.x,e.y+e.r*.15,e.r*sq,e.r/sq*.85,0,0,7);ctx.fill();

  }else if(e.k==='boar'){
    const shake=e.st==='wind'&&!reduced.matches?Math.sin(e.t*60)*2:0,x=e.x+shake;

    ctx.fillStyle=e.st==='wind'?'#ff6b3d':col;ctx.beginPath();ctx.arc(x,e.y,e.r,0,7);ctx.fill();
    ctx.fillStyle='#b8603a';ctx.beginPath();ctx.ellipse(x+Math.cos(a)*e.r*.7,e.y+Math.sin(a)*e.r*.7,e.r*.38,e.r*.3,a,0,7);ctx.fill();
    eyes(x,e.y,e.r,a,'#2a1405');
  }else if(e.k==='shroom'){
    ctx.fillStyle=e.flash>0?'#fff':'#f3e6c8';ctx.fillRect(e.x-e.r*.45,e.y-e.r*.1,e.r*.9,e.r*.95);

    ctx.fillStyle='#fff';for(const [px,py,pr] of [[-.5,-.55,.18],[.35,-.7,.15],[.1,-.35,.12]]){ctx.beginPath();ctx.arc(e.x+px*e.r,e.y+py*e.r,pr*e.r,0,7);ctx.fill()}

    ctx.fillStyle=wind?'#ff8a5a':'#7cf2ff';for(const s of [-1,1]){ctx.beginPath();ctx.arc(e.x+s*e.r*.3,e.y-e.r*.15,e.r*.12,0,7);ctx.fill()}

function drawKnight(p){

  const sw=p.atkT>0?(G.slashes.length?(G.slashes[G.slashes.length-1].dir*(p.atkT>.1?-1:1)*.9):0):.6;
  const sa=a+sw;

  ctx.beginPath();ctx.moveTo(p.x+Math.cos(sa)*8,p.y+Math.sin(sa)*8);ctx.lineTo(p.x+Math.cos(sa)*30,p.y+Math.sin(sa)*30);ctx.stroke();
  ctx.strokeStyle='#c9922a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x+Math.cos(sa)*8+Math.cos(sa+1.57)*5,p.y+Math.sin(sa)*8+Math.sin(sa+1.57)*5);ctx.lineTo(p.x+Math.cos(sa)*8-Math.cos(sa+1.57)*5,p.y+Math.sin(sa)*8-Math.sin(sa+1.57)*5);ctx.stroke();

  ctx.fillStyle='#cfd6e4';ctx.beginPath();ctx.arc(p.x,p.y-2,PR*.78,0,7);ctx.fill();
  ctx.fillStyle='#2a3140';ctx.fillRect(p.x+Math.cos(a)*3-4,p.y+Math.sin(a)*3-3.5,8,3);

function heart(x,y,s,full){
  ctx.fillStyle=full?'#ff4d6d':'rgba(255,255,255,.18)';ctx.beginPath();
  ctx.moveTo(x,y+s*.35);ctx.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.35);ctx.bezierCurveTo(x-s*.5,y+s*.65,x,y+s*.8,x,y+s);

function draw(){
  if(!cw)return;
  let sx=0,sy=0;if(G&&G.shake>0&&!reduced.matches){sx=rnd(-3,3);sy=rnd(-3,3)}

  ctx.fillStyle='#2d4a2a';ctx.fillRect(-5,-5,W+10,H+10);
  for(const d of deco){if(d[2]==='g'){ctx.strokeStyle='#3e6339';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(d[0]-3,d[1]);ctx.lineTo(d[0]-1,d[1]-5*d[3]);ctx.moveTo(d[0]+1,d[1]);ctx.lineTo(d[0]+3,d[1]-6*d[3]);ctx.stroke()}

  ctx.fillStyle='#e8f4ff';ctx.font='700 10px system-ui,sans-serif';ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText(p.charge>=1?'FORGÓ KÉSZ!':'forgó',W-10,21);

    {slime:'ugrál feléd',bat:'cikázva repül',boar:'megremeg, aztán nekiront: gurulj el!',shroom:'varázsgolyót lő, a kard szétvágja',golem:'minden 5. hullámban, földrengést üt'}[k]}</span>`).join('')}</div>`;

card.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;const a=b.dataset.act;

const MOVE={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
addEventListener('keydown',e=>{

  }

  else if(e.key==='k'||e.key==='K'||e.key==='Shift'){e.preventDefault();dash()}
  else if(e.key==='l'||e.key==='L'){e.preventDefault();spinAttack()}
});
addEventListener('keyup',e=>{const m=MOVE[e.key];if(m)keys[m]=false});
addEventListener('blur',()=>{keys.up=keys.down=keys.left=keys.right=false;joy=null});
document.querySelectorAll('.pad button[data-k]').forEach(b=>{

<script>
/* @shared fekvo-jelzes */
/* Fekvő telefonon „Fordítsd el a telefont” jelzés. A játék álló képernyőre készült, ezért amíg a telefon
   fekszik, a jelzés eltakarja, és a játék a saját szünet-logikájával megáll (ugyanaz fut le, mint amikor
   a lap háttérbe kerül). Gépen, széles ablakban nem jelenik meg (csak érintőképernyőn, alacsony ablakban). */
(function(){
  var mq;
  try{ mq=matchMedia('(orientation: landscape) and (max-height: 500px) and (pointer: coarse)'); }catch(e){ return; }
  var st=document.createElement('style');
  st.textContent='.rotate-hint{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;padding:16px;'+
    'background:rgba(5,8,14,.95);color:#fff;font:700 20px/1.3 system-ui,sans-serif;text-align:center}'+
    '.rotate-hint[hidden]{display:none!important}.rotate-hint p{margin:8px 0}'+
    '.rotate-hint .sub{font-weight:400;font-size:16px;opacity:.85}.rotate-hint svg{width:56px;height:56px}';
  var el=document.createElement('div');
  el.className='rotate-hint';el.setAttribute('role','alert');el.hidden=true;
  el.innerHTML='<div><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2" '+
    'fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18.5" r="1" fill="currentColor"/></svg>'+
    '<p>Fordítsd el a telefont!</p><p class="sub">Ez a játék álló képernyőre készült. Addig szünetel.</p></div>';
  function pauseGame(){
    try{
      Object.defineProperty(document,'hidden',{configurable:true,get:function(){return true;}});
      document.dispatchEvent(new Event('visibilitychange'));
    }catch(e){}
    try{ delete document.hidden; }catch(e){}
  }
  function update(e){
    if(mq.matches){ if(el.hidden){ el.hidden=false; if(e) pauseGame(); } }
    else el.hidden=true;
  }
  document.head.appendChild(st);
  document.body.appendChild(el);
  if(mq.addEventListener) mq.addEventListener('change',update); else if(mq.addListener) mq.addListener(update);
  update();
})();
/* @end fekvo-jelzes */
</script>
<script>
/* @shared gamepad */
/* Kontroller (gamepad) a böngésző Gamepad API-jával. A játék kódjához nem nyúl: a kontrollert billentyűkké
   fordítja, amelyeket a játék már ismer. Ha egy ablak (menü, szünet, vége) látszik, a kar a gombok között lép,
   az A gomb megnyomja a kijelöltet. Kiosztás (szabványos kontroller):
     bal kar / d-pad → nyilak, A → szóköz, X → J, Y → K, B → L, RB → L, Start → Escape (szünet), Select → Enter.
   iPhone-on a böngésző nem támogatja, ott ez a rész nem csinál semmit. */
(function(){
  if(!navigator.getGamepads)return;
  var DIRS=[['ArrowUp',12],['ArrowDown',13],['ArrowLeft',14],['ArrowRight',15]];
  var BTN=[[0,' ','Space'],[2,'j','KeyJ'],[3,'k','KeyK'],[1,'l','KeyL'],[5,'l','KeyL'],[9,'Escape','Escape'],[8,'Enter','Enter']];
  var held={},raf=0,shown=false,lastNav=0;
  function key(type,k,code){
    var e=new KeyboardEvent(type,{key:k,code:code,bubbles:true,cancelable:true});
    (document.activeElement&&document.activeElement!==document.body?document.activeElement:document).dispatchEvent(e);
  }
  function set(name,on,k,code){if(!!held[name]===on)return;held[name]=on;key(on?'keydown':'keyup',k,code||k)}
  function visible(el){if(!el||el.hidden)return false;var r=el.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(el).visibility!=='hidden'}
  function dialog(){
    var c=document.querySelectorAll('#ov,#over,#pick,#overlay,.modal,dialog[open],.rotate-hint');
    for(var i=0;i<c.length;i++)if(visible(c[i])&&!c[i].classList.contains('rotate-hint'))return c[i];
    return null;
  }
  function buttons(d){return Array.prototype.filter.call(d.querySelectorAll('button:not(:disabled),a[href]'),visible)}
  function nav(d,dir){
    var b=buttons(d);if(!b.length)return;
    var i=b.indexOf(document.activeElement);
    if(i<0){var hot=d.querySelector('.hot:not(:disabled)');(hot&&visible(hot)?hot:b[0]).focus();return}
    var cur=b[i].getBoundingClientRect(),best=null,bd=1e9;
    b.forEach(function(x){if(x===b[i])return;var r=x.getBoundingClientRect(),dx=r.left+r.width/2-(cur.left+cur.width/2),dy=r.top+r.height/2-(cur.top+cur.height/2);
      var ok=dir==='ArrowUp'?dy<-4:dir==='ArrowDown'?dy>4:dir==='ArrowLeft'?dx<-4:dx>4;if(!ok)return;
      var dist=Math.abs(dx)+Math.abs(dy)*(dir==='ArrowLeft'||dir==='ArrowRight'?3:1)+Math.abs(dx)*(dir==='ArrowUp'||dir==='ArrowDown'?2:0);if(dist<bd){bd=dist;best=x}});
    (best||b[(i+(dir==='ArrowUp'||dir==='ArrowLeft'?b.length-1:1))%b.length]).focus();
  }
  function note(){
    if(shown)return;shown=true;
    var t=document.createElement('div');t.setAttribute('role','status');
    t.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:3500;background:#0b0c10;color:#fff;border:1px solid #444;border-radius:10px;padding:10px 16px;font:700 15px system-ui,sans-serif;pointer-events:none';
    t.textContent='Kontroller csatlakoztatva';document.body.appendChild(t);setTimeout(function(){t.remove()},2500);
  }
  function poll(){
    raf=setTimeout(poll,16); /* időzítő, nem képkocka: álló képnél is figyeli a kontrollert */
    var pads=navigator.getGamepads?navigator.getGamepads():[],gp=null;
    for(var i=0;i<pads.length;i++)if(pads[i]&&pads[i].connected){gp=pads[i];break}
    if(!gp){for(var n in held)if(held[n])held[n]=false;return}
    note();
    var pr=function(i){var b=gp.buttons[i];return !!b&&(b.pressed||b.value>.5)};
    var ax=gp.axes[0]||0,ay=gp.axes[1]||0,dz=.25;
    var dirOn={ArrowUp:ay<-dz,ArrowDown:ay>dz,ArrowLeft:ax<-dz,ArrowRight:ax>dz};
    DIRS.forEach(function(d){if(pr(d[1]))dirOn[d[0]]=true});
    var d=dialog();
    if(d){
      DIRS.forEach(function(x){if(held[x[0]])set(x[0],false,x[0])});
      BTN.forEach(function(b){if(held['b'+b[0]])set('b'+b[0],false,b[1],b[2])});
      var now=performance.now(),any=null;DIRS.forEach(function(x){if(dirOn[x[0]])any=x[0]});
      if(any&&now-lastNav>220){lastNav=now;nav(d,any)}else if(!any)lastNav=0;
      var a=pr(0);if(a&&!held.navA){var f=document.activeElement;if(f&&d.contains(f)&&f.click)f.click();else{var b=buttons(d),hot=d.querySelector('.hot:not(:disabled)');(hot&&visible(hot)?hot:b[0])&&(hot&&visible(hot)?hot:b[0]).click()}}
      held.navA=a;
      if(pr(9)&&!held.Escape)set('Escape',true,'Escape');else if(!pr(9))set('Escape',false,'Escape');
      return;
    }
    held.navA=pr(0);
    DIRS.forEach(function(x){set(x[0],dirOn[x[0]],x[0])});
    BTN.forEach(function(b){set('b'+b[0],pr(b[0]),b[1],b[2])});
  }
  addEventListener('gamepadconnected',function(){if(!raf)poll()});
  addEventListener('gamepaddisconnected',function(){var p=navigator.getGamepads(),any=false;for(var i=0;i<p.length;i++)if(p[i])any=true;if(!any){clearTimeout(raf);raf=0;for(var n in held)if(held[n]&&n.indexOf('Arrow')===0)set(n,false,n)}});
  try{var p0=navigator.getGamepads();for(var i=0;i<p0.length;i++)if(p0[i]){poll();break}}catch(e){}
})();
/* @end gamepad */
</script>
</body>
</html>
