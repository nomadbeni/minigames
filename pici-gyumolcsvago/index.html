<title>Pici gyümölcsvágó</title>
<meta name="description" content="Gyümölcsvágós játék a legkisebbeknek: mosolygós gyümölcsök repülnek fel, egy koppintás vagy egy húzás kettévágja őket, csillogással és vidám hanggal. Nincs veszítés, nincs időre menés, minden tizedik gyümölcs után ünneplés. A menü csak nyomva tartásra nyílik (véletlen kilépés ellen), három sebesség.">

<style>
/* Elrendezés: teljes képernyős vászon; a menü (#ov) a szülőé, játék közben csak a lakat gomb látszik */
:root{
  --bg:#bfe8ff; --panel:#ffffff; --line:#d7e6f2; --fg:#1f2a44; --muted:#5b6b86;
  --accent:#7c3aed; --accent2:#f472b6; --gold:#f59e0b;
  --display:"Bungee","Arial Black",system-ui,sans-serif;
  --ui:"Nunito Sans","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#app{height:100%;display:flex;flex-direction:column;gap:6px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
body.playing #app{padding:0}
body.playing .top-bar{display:none!important}
#stage{flex:1;min-height:0;position:relative;touch-action:none}
canvas#cv{display:block;position:absolute;left:0;top:0;touch-action:none}
#lock{position:fixed;z-index:4;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:52px;height:52px;border-radius:50%;border:0;padding:4px;cursor:pointer;touch-action:none;
  background:conic-gradient(var(--accent) calc(var(--p,0) * 360deg),rgba(255,255,255,.45) 0)}
#lock span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.75);font-size:20px;line-height:1}
#lock:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#ov{position:fixed;left:0;top:calc(60px + env(safe-area-inset-top,0px));right:0;bottom:0;display:grid;place-items:center;background:rgba(191,232,255,.55);z-index:5;padding:16px}
body.playing #ov{top:0;background:rgba(31,42,68,.45)}
.card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 18px 16px;background:var(--panel);border-radius:22px;text-align:center;width:min(380px,100%);max-height:calc(100% - 16px);overflow:auto;box-shadow:0 10px 40px rgba(31,42,68,.18)}
.card h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;color:var(--accent);line-height:1.1}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.card b{color:var(--fg)}
#mini{width:240px;height:84px;display:block}
.tot{font-size:16px!important}
.btns{display:flex;flex-direction:column;gap:8px;width:100%}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.olbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
button.b{font-family:var(--ui);font-weight:800;font-size:16px;color:var(--fg);background:#f4f7fb;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;min-height:48px}
button.b.hot{background:var(--accent);border-color:var(--accent);color:#fff;font-size:20px;min-height:58px}
button.b.sm{font-size:14px;padding:10px 6px}
button.b[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:#f3edff}
button.b.warn{border-color:#fca5a5;color:#b91c1c}
.small{font-size:13px!important;line-height:1.4!important}
button:not(:disabled):active{transform:translateY(1px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app">
  <div class="top-bar" style="position:relative;z-index:1000;display:flex;flex-wrap:wrap;align-self:flex-start;align-items:center;gap:8px;margin:0"><a class="home-link" href="../index.html" style="display:inline-flex;align-self:flex-start;width:fit-content;align-items:center;gap:6px;margin:0;min-height:44px;min-width:44px;box-sizing:border-box;justify-content:center;padding:6px 14px;border-radius:999px;border:1px solid currentColor;color:inherit;opacity:.75;text-decoration:none;font:600 14px/1.2 system-ui,sans-serif">← Összes játék</a><button type="button" class="fs-btn" aria-label="Teljes képernyő" style="all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;justify-content:center;padding:6px 14px;border-radius:999px;border:1px solid currentColor;color:inherit;opacity:.75;cursor:pointer;font:600 14px/1.2 system-ui,sans-serif">⛶ Teljes képernyő</button></div>
  <div id="stage"><canvas id="cv" aria-label="Játéktér: koppints vagy húzd az ujjad a gyümölcsökön"></canvas></div>
</div>
<button type="button" id="lock" hidden aria-label="Menü: tartsd nyomva másfél másodpercig" title="Menü: tartsd nyomva" tabindex="-1"><span aria-hidden="true">🔒</span></button>
<div id="ov"><div class="card" id="card"></div></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),ov=$('ov'),card=$('card'),lock=$('lock');
const KEY='pici-gyumolcsvago-save';
const HOLD=1500;                               // ennyi ms-ig kell nyomva tartani a lakatot
// sebesség: g = gravitáció (px/s², 760 px magas képhez), every = indítási időköz (s), max = egyszerre a levegőben
const SPEEDS={lassu:{g:300,every:1.7,max:3,name:'Lassú'},kozepes:{g:440,every:1.15,max:4,name:'Közepes'},gyors:{g:600,every:.8,max:5,name:'Gyors'}};
const RM=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
const FR=[
  {n:'alma',shape:'apple',skin:'#ef4444',light:'#fca5a5',dark:'#b91c1c',flesh:'#fef3c7',seed:'#6b3f1d',juice:'#fecaca',stem:true,leaf:true},
  {n:'narancs',shape:'circle',skin:'#fb923c',light:'#fed7aa',dark:'#ea580c',flesh:'#fdba74',seed:'#fff7ed',juice:'#fed7aa',leaf:true,cut:'citrus'},
  {n:'görögdinnye',shape:'circle',size:1.15,skin:'#22c55e',light:'#86efac',dark:'#15803d',flesh:'#fb7185',rind:'#dcfce7',seed:'#1f2937',juice:'#fecdd3',stripes:'#166534',cut:'melon'},
  {n:'citrom',shape:'oval',skin:'#facc15',light:'#fef08a',dark:'#ca8a04',flesh:'#fef9c3',seed:'#fde68a',juice:'#fef08a',leaf:true,cut:'citrus'},
  {n:'szilva',shape:'circle',size:.9,skin:'#8b5cf6',light:'#c4b5fd',dark:'#5b21b6',flesh:'#fde68a',seed:'#a16207',juice:'#ddd6fe',stem:true,cut:'pit'},
  {n:'kivi',shape:'oval',skin:'#a16207',light:'#d6a35c',dark:'#713f12',flesh:'#84cc16',seed:'#1c1917',juice:'#d9f99d',core:'#fefce8',cut:'kiwi'},
  {n:'eper',shape:'berry',skin:'#f43f5e',light:'#fda4af',dark:'#be123c',flesh:'#fecdd3',seed:'#fde047',juice:'#fecdd3',crown:true,cut:'berry'},
  {n:'körte',shape:'pear',skin:'#a3e635',light:'#d9f99d',dark:'#65a30d',flesh:'#fefce8',seed:'#6b3f1d',juice:'#ecfccb',stem:true,leaf:true}
];
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51];
const CONF=['#f472b6','#a78bfa','#60a5fa','#34d399','#fbbf24','#fb923c'];

// ---------- beállítás és számláló (csak localStorage) ----------
const S={speed:'lassu',sound:true,total:0};
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY));
    if(d&&typeof d==='object'&&!Array.isArray(d)){
      if(typeof d.speed==='string'&&Object.prototype.hasOwnProperty.call(SPEEDS,d.speed))S.speed=d.speed;
      if(typeof d.sound==='boolean')S.sound=d.sound;
      if(Number.isInteger(d.total)&&d.total>=0&&d.total<1e9)S.total=d.total;
    }
  }catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({v:1,speed:S.speed,sound:S.sound,total:S.total}))}catch(e){}}
load();

// ---------- hang (Web Audio) ----------
let AC=null,master=null,noiseBuf=null;
function unlockAudio(){
  if(!S.sound)return;
  try{
    if(!AC){
      const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
      AC=new A();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
      noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*.25),AC.sampleRate);
      const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
    }
    if(AC.state==='suspended')AC.resume();
  }catch(e){}
}
const canPlay=()=>S.sound&&AC&&master;
function tone(f,t0,dur,type,vol,to){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.03);
}
function swish(t0){
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type='bandpass';f.Q.value=1.2;
  f.frequency.setValueAtTime(2600,t0);f.frequency.exponentialRampToValueAtTime(700,t0+.16);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.25,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.18);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+.2);
}
function sndSlice(combo){
  if(!canPlay())return;
  try{const t=AC.currentTime,f=PENTA[Math.min(combo,PENTA.length-1)];swish(t);tone(f,t+.02,.38,'triangle',.32);tone(f*2,t+.02,.2,'sine',.08)}catch(e){}
}
function sndBubble(){if(!canPlay())return;try{tone(330+Math.random()*80,AC.currentTime,.15,'sine',.18,700)}catch(e){}}
function sndParty(){
  if(!canPlay())return;
  try{const t=AC.currentTime;[0,2,4,5,7].forEach((k,i)=>tone(PENTA[k],t+i*.1,.3,'triangle',.28));tone(PENTA[7],t+.5,.6,'sine',.2)}catch(e){}
}

// ---------- állapot ----------
let W=1,H=1,dpr=1,R=50,raf=0,last=0,lastKey=0,lastFruit=-1;
const G={fruits:[],halves:[],parts:[],segs:[],clouds:[],t:0,spawnT:0,combo:0,comboT:0,party:0,playing:false,started:false};
function initClouds(){G.clouds=[0,1,2].map(i=>({x:Math.random()*W,y:H*(.08+i*.13),s:.7+Math.random()*.6,v:6+Math.random()*10}))}

function resize(){
  const r=stage.getBoundingClientRect();
  W=Math.max(1,Math.round(r.width));H=Math.max(1,Math.round(r.height));
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';
  R=Math.max(36,Math.min(72,Math.min(W,H)*.12));
  if(!G.clouds.length)initClouds();
  if(!G.playing)draw();
}

// ---------- játéklogika ----------
const sp=()=>SPEEDS[S.speed];
function spawn(){
  let k=Math.floor(Math.random()*FR.length);if(k===lastFruit)k=(k+1)%FR.length;lastFruit=k;
  const f=FR[k],r=R*(f.size||1),g=sp().g*Math.max(.7,H/760);
  const x0=r+8+Math.random()*Math.max(1,W-2*r-16),y0=H+r;
  const apex=H*(.16+Math.random()*.22);
  const vy=-Math.sqrt(2*g*Math.max(50,y0-apex)),tA=-vy/g;
  const xa=W*.25+Math.random()*W*.5;
  G.fruits.push({f,r,g,x:x0,y:y0,vx:(xa-x0)/tA*.7,vy,rot:0,ph:Math.random()*6,age:0});
}
function burst(x,y,col,n,spd){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=spd*(.4+Math.random()*.8);
    G.parts.push({k:'drop',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,r:3+Math.random()*5,c:col,life:.7+Math.random()*.4,max:1.1})}
}
function stars(x,y,n,cols){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=60+Math.random()*140;
    G.parts.push({k:'star',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:5+Math.random()*6,c:cols[i%cols.length],rot:Math.random()*3,life:.55+Math.random()*.3,max:.85})}
}
function slice(i,ang){
  const o=G.fruits[i];if(!o)return;
  G.fruits.splice(i,1);
  if(ang==null)ang=(Math.random()-.5)*1.2;
  const nx=-Math.sin(ang),ny=Math.cos(ang),v=70+o.r;
  for(const s of [1,-1])G.halves.push({f:o.f,r:o.r,g:o.g*1.15,x:o.x,y:o.y,vx:o.vx*.3+nx*v*s,vy:Math.min(o.vy,0)*.25+ny*v*s-110,a:ang,side:s,spin:0,vs:s*(1.2+Math.random()*1.8),life:2.6});
  const few=RM.matches;
  burst(o.x,o.y,o.f.juice,few?6:16,260);
  stars(o.x,o.y,few?2:5,['#fff','#fde047']);
  G.parts.push({k:'ring',x:o.x,y:o.y,r:o.r*.6,c:'#ffffff',life:.4,max:.4});
  S.total++;save();
  G.combo=G.comboT>0?G.combo+1:0;G.comboT=1.3;
  sndSlice(G.combo);
  if(S.total%10===0)celebrate();   // a mentett összesből számol, így újratöltés után is folytatódik
}
function celebrate(){
  G.party=2.2;sndParty();
  const n=RM.matches?16:60;
  for(let i=0;i<n;i++)G.parts.push({k:'conf',x:Math.random()*W,y:-10-Math.random()*H*.3,vx:(Math.random()-.5)*60,vy:60+Math.random()*90,r:5+Math.random()*4,c:CONF[i%CONF.length],rot:Math.random()*6,vr:(Math.random()-.5)*8,life:3,max:3});
}
function tapFx(x,y){
  G.parts.push({k:'ring',x,y,r:8,c:CONF[Math.floor(Math.random()*CONF.length)],life:.45,max:.45});
  stars(x,y,RM.matches?2:6,CONF);
  sndBubble();
}
function nearest(x,y,rad){
  let bi=-1,bd=1e9;
  G.fruits.forEach((o,i)=>{const d=Math.hypot(o.x-x,o.y-y);if(d<o.r*rad&&d<bd){bd=d;bi=i}});
  return bi;
}
function segDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function update(dt){
  G.t+=dt;
  const s=sp();
  G.spawnT-=dt;
  if(G.spawnT<=0&&G.fruits.length<s.max){spawn();G.spawnT=s.every*(.8+Math.random()*.4)}
  if(!G.fruits.length&&G.spawnT>.4&&G.spawnT<50)G.spawnT=.4;
  for(let i=G.fruits.length-1;i>=0;i--){
    const o=G.fruits[i];o.age+=dt;o.vy+=o.g*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;
    if(o.x<o.r){o.x=o.r;o.vx=Math.abs(o.vx)}else if(o.x>W-o.r){o.x=W-o.r;o.vx=-Math.abs(o.vx)}
    o.rot=Math.sin(o.age*2.2+o.ph)*.18;
    if(o.vy>0&&o.y>H+o.r*1.5)G.fruits.splice(i,1);
  }
  for(let i=G.halves.length-1;i>=0;i--){
    const h=G.halves[i];h.vy+=h.g*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.spin+=h.vs*dt;h.life-=dt;
    if(h.life<=0||h.y>H+h.r*2)G.halves.splice(i,1);
  }
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i];p.life-=dt;
    if(p.life<=0){G.parts.splice(i,1);continue}
    if(p.k==='drop'){p.vy+=520*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
    else if(p.k==='star'){p.vx*=.96;p.vy*=.96;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*4}
    else if(p.k==='ring'){p.r+=dt*160}
    else if(p.k==='conf'){p.x+=p.vx*dt+Math.sin(G.t*3+p.rot)*.6;p.y+=p.vy*dt;p.rot+=p.vr*dt}
  }
  for(let i=G.segs.length-1;i>=0;i--){G.segs[i].life-=dt;if(G.segs[i].life<=0)G.segs.splice(i,1)}
  G.comboT-=dt;if(G.comboT<=0)G.combo=0;
  if(G.party>0)G.party-=dt;
  for(const c of G.clouds){c.x+=c.v*dt;if(c.x>W+120*c.s)c.x=-120*c.s}
}

// ---------- rajzolás ----------
function shapePath(c,f,r){
  c.beginPath();
  switch(f.shape){
    case 'oval':c.ellipse(0,0,r*1.12,r*.86,0,0,Math.PI*2);break;
    case 'apple':
      c.moveTo(0,-r*.72);
      c.bezierCurveTo(r*.55,-r*1.08,r*1.12,-r*.62,r,r*.05);
      c.bezierCurveTo(r*.92,r*.72,r*.45,r*1.02,0,r*.9);
      c.bezierCurveTo(-r*.45,r*1.02,-r*.92,r*.72,-r,r*.05);
      c.bezierCurveTo(-r*1.12,-r*.62,-r*.55,-r*1.08,0,-r*.72);break;
    case 'berry':
      c.moveTo(0,r*1.05);
      c.bezierCurveTo(-r*.55,r*.75,-r*1.05,r*.05,-r*.95,-r*.45);
      c.bezierCurveTo(-r*.85,-r*.98,r*.85,-r*.98,r*.95,-r*.45);
      c.bezierCurveTo(r*1.05,r*.05,r*.55,r*.75,0,r*1.05);break;
    case 'pear':
      c.moveTo(0,-r);
      c.bezierCurveTo(r*.4,-r,r*.45,-r*.45,r*.6,-r*.15);
      c.bezierCurveTo(r*1.05,r*.3,r*.95,r,0,r);
      c.bezierCurveTo(-r*.95,r,-r*1.05,r*.3,-r*.6,-r*.15);
      c.bezierCurveTo(-r*.45,-r*.45,-r*.4,-r,0,-r);break;
    default:c.arc(0,0,r,0,Math.PI*2);
  }
  c.closePath();
}
function topY(f,r){return f.shape==='pear'?-r:f.shape==='oval'?-r*.86:f.shape==='apple'?-r*.72:f.shape==='berry'?-r*.8:-r}
function drawFruit(c,f,r,face){
  const ty=topY(f,r);
  if(f.stem){c.strokeStyle='#7c4a1e';c.lineWidth=Math.max(2,r*.09);c.lineCap='round';c.beginPath();c.moveTo(0,ty+r*.08);c.quadraticCurveTo(r*.02,ty-r*.2,r*.14,ty-r*.32);c.stroke()}
  if(f.leaf){c.save();c.translate(r*.16,ty-r*.12);c.rotate(-.5);c.fillStyle='#22c55e';c.beginPath();c.ellipse(r*.2,0,r*.24,r*.11,0,0,Math.PI*2);c.fill();c.restore()}
  const gr=c.createRadialGradient(-r*.35,-r*.4,r*.08,0,0,r*1.15);
  gr.addColorStop(0,f.light);gr.addColorStop(.55,f.skin);gr.addColorStop(1,f.dark);
  shapePath(c,f,r);c.fillStyle=gr;c.fill();
  if(f.stripes){

<script>
