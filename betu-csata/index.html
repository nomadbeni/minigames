<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Arena</title>
<meta name="description" content="Felülnézetes arénacsata robotok ellen, szűkülő viharral. Lootolj ládákat: pajzs, rakéta, gyógyital, de csak ha a felvillanó szóhoz időre a jó ikont választod. Rövid, pörgős menetek, ranglista.">
<meta name="games:category" content="jatek">
<meta name="games:title-en" content="Arena">
<meta name="games:description-en" content="Top-down arena battle against robots inside a shrinking storm. Loot chests for shields, rockets and potions, but only if you match the flashing word to the right icon in time. Short, fast rounds. Hungarian.">

<style>
/* Layout: one-screen arena — back link, HUD, canvas fills the rest, loot prompt and menus as overlays */
:root{
  --bg:#08090f; --panel:#12141f; --panel2:#1b1e2e; --line:#2a2f47; --fg:#eef0ff; --muted:#9aa0c2;
  --accent:#a66bff; --ok:#3ddc84; --bad:#ff4d6a; --p0:#ffd166; --p1:#7fdcff; --hp:#3ddc84; --sh:#4aa3ff;
  --font:"Lexend","Verdana",system-ui,sans-serif; --disp:"Chakra Petch","Lexend",system-ui,sans-serif; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:8px;max-width:900px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums;font-size:16px}
.bars{display:flex;flex-direction:column;gap:3px;min-width:80px;flex:1;max-width:200px}
.bars div{height:9px;border-radius:5px;background:var(--panel);overflow:hidden;border:1px solid var(--line)}
.bars i{display:block;height:100%}
.sp{flex:1}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:19px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;touch-action:none}
canvas{display:block;width:100%;height:100%;border-radius:12px;touch-action:none}
#bombBtn{position:absolute;right:14px;bottom:14px;width:70px;height:70px;border-radius:50%;border:2px solid var(--line);background:rgba(24,30,51,.85);color:#fff;font-size:30px;cursor:pointer}
#bombBtn small{position:absolute;right:6px;bottom:4px;font-size:14px;font-weight:800}
#bombBtn:disabled{opacity:.35}
#ov{position:fixed;inset:0;background:rgba(5,6,14,.82);display:grid;place-items:center;padding:calc(64px + env(safe-area-inset-top,0px)) 16px 16px;z-index:9}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 20px;width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.card h1,.card h2{margin:0;color:var(--accent);line-height:1.15}
.card h1{font-size:32px}.card h2{font-size:26px}
.card p{margin:0;line-height:1.45}
.how{display:grid;grid-template-columns:36px 1fr;gap:8px 10px;align-items:center;font-size:17px}
.how span:nth-child(odd){font-size:24px;text-align:center}
.btn{font:700 18px/1.2 var(--font);padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#16002b}
.btn small{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.toggle .btn[aria-pressed="true"]{background:var(--accent);color:#16002b}
.loot-word{font-size:44px;font-weight:800;text-align:center;line-height:1.2}
.icons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.icons button{font-size:46px;padding:14px 0;border-radius:16px;border:2px solid var(--line);background:var(--panel2);cursor:pointer}
.icons button.yes{border-color:var(--ok);background:#1f4a33}
.icons button.no{border-color:var(--bad);opacity:.5}
.timer{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);transition:width .1s linear}

.card h1,.card h2,.step h2,.panel h2,h1,h2{font-family:var(--disp);letter-spacing:.02em}
/* Reading kit: readable type, split-word colouring, speaker button */
.w{white-space:nowrap;font-weight:600;letter-spacing:.03em}
.w .p0{color:var(--p0,#ffb347)}
.w .p1{color:var(--p1,#5ad1ff)}
.w .dot{opacity:.55;margin:0 .1em;font-style:normal}
.say{display:inline-grid;place-items:center;width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line,#345);background:var(--panel,#1a2633);color:var(--fg,#fff);font-size:20px;cursor:pointer;padding:0;vertical-align:middle}
.say:disabled{opacity:.35;cursor:not-allowed}
.say.talking{outline:2px solid var(--p1,#5ad1ff)}

.px{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle;flex:none}
.rankchip{display:inline-flex;flex-direction:column;gap:3px;padding:4px 10px;border-radius:8px;border:1px solid var(--rc);background:rgba(0,0,0,.35);min-width:84px;white-space:nowrap}
.rankchip b{font:700 13px/1 var(--disp,system-ui);letter-spacing:.06em;color:var(--rc);text-transform:uppercase}
.rankchip i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.rankchip u{display:block;height:100%;background:var(--rc)}
#ktoast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);transition:transform .25s ease;background:#0b0c10;border:1px solid #333;color:#fff;padding:10px 18px;border-radius:10px;font:600 16px/1.3 var(--font,system-ui);z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#ktoast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#ktoast{transition:none}}
.hud,.bar{flex-wrap:nowrap!important;min-width:0}
.hud .ib,.bar .ib{flex:none}
@media (max-width:430px){.hud .chip,.bar .chip{padding:4px 7px!important;font-size:14px!important;gap:3px!important}.rankchip{min-width:0;padding:4px 6px}.rankchip i{display:none}.rankchip b{font-size:12px}}
/* gomb lenyomva 1 px-t mozdul (a translate nem ütközik a meglévő transform-okkal) */
button:not(:disabled):active{translate:0 1px}
</style>
</head>
<body>
<div id="app">
  <div class="top-bar" style="position:relative;z-index:1000;display:flex;flex-wrap:wrap;align-self:flex-start;align-items:center;gap:8px;margin:0"><a class="home-link" href="../index.html" style="display:inline-flex;align-self:flex-start;width:fit-content;align-items:center;gap:6px;margin:0;min-height:44px;min-width:44px;box-sizing:border-box;justify-content:center;padding:6px 14px;border-radius:999px;border:1px solid currentColor;color:inherit;opacity:.75;text-decoration:none;font:600 14px/1.2 system-ui,sans-serif">← Összes játék</a><button type="button" class="fs-btn" aria-label="Teljes képernyő" style="all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;justify-content:center;padding:6px 14px;border-radius:999px;border:1px solid currentColor;color:inherit;opacity:.75;cursor:pointer;font:600 14px/1.2 system-ui,sans-serif">⛶ Teljes képernyő</button></div>
  <div class="hud">
    <div class="bars" aria-label="Élet és pajzs"><div><i id="hpb" style="background:var(--hp);width:100%"></i></div><div><i id="shb" style="background:var(--sh);width:0"></i></div></div>
    <span class="chip">🤖 <span id="left">0</span></span>
    <span class="chip">🌀 <span id="storm">0</span></span>
    <span class="chip" id="buffs" hidden></span>
    <span class="sp"></span><span data-rank></span>
    <button class="ib" id="pauseBtn" aria-label="Szünet">⏸</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas><button id="bombBtn" aria-label="Bomba">💣<small id="bombs">0</small></button></div>
</div>
<div id="ov" hidden><div class="card" id="ovc"></div></div>
<script>
/* Reading kit (same in every reading game): storage, speech, split words, word mastery, sounds */
/* @shared olvaso-kit */
const K=(()=>{
  /* storage: a saved value must have the same shape as the default, or the default is used.
     For objects, each default key with a wrong type is put back to its default. */
  const kind=v=>Array.isArray(v)?'array':v===null?'null':typeof v==='number'?(Number.isFinite(v)?'number':'bad'):typeof v;
  const store={
    get(k,d){
      let v;try{const raw=localStorage.getItem(k);if(raw==null)return d;v=JSON.parse(raw)}catch(e){return d}
      if(d===undefined||d===null)return v;
      if(kind(v)!==kind(d))return d;
      if(kind(d)==='object'){for(const key of Object.keys(d))if(key in v?kind(v[key])!==kind(d[key])&&d[key]!==null:true)v[key]=d[key]}
      return v;
    },
    set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  };
  const clampInt=(v,lo,hi)=>Number.isFinite(v)?Math.max(lo,Math.min(hi,Math.floor(v))):lo;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const plain=w=>String(w).replace(/\|/g,'');
  /* speech */
  let voice=null;
  const hasTTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
  function pick(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^hu/i.test(v.lang))||null}catch(e){}}
  if(hasTTS){pick();try{speechSynthesis.addEventListener('voiceschanged',pick)}catch(e){}}
  function say(t){
    if(!hasTTS)return false;
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain(t));u.lang='hu-HU';if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u);return true}catch(e){return false}
  }
  /* mastery: how many times a word was read right, shared by all reading games */
  const MK='olvaso:mastery';
  /* only word -> non-negative count pairs survive; nothing can reach the object prototype */
  const mastery=Object.create(null);
  {const raw=store.get(MK,{});for(const k of Object.keys(raw).slice(0,5000))if(k.length<=60&&Number.isFinite(raw[k])&&raw[k]>0)mastery[k]=clampInt(raw[k],0,1e6)}
  const settings=store.get('olvaso:settings',{split:'auto'});
  if(settings.split!=='auto'&&settings.split!=='mindig')settings.split='auto';
  function seen(w){const k=plain(w).toLowerCase();mastery[k]=Math.min(1e6,(mastery[k]||0)+1);store.set(MK,mastery);if(api.addXP)api.addXP(2)}
  function level(w){
    if(settings.split==='mindig')return 2;
    const n=mastery[plain(w).toLowerCase()]||0;
    return n<4?2:n<8?1:0;
  }
  /* word: "fék|betét" -> coloured parts; level 2 also shows a dot between parts */
  function word(w,lv){
    const toks=String(w).split(/(\|| )/);
    if(lv==null)lv=level(w);
    if(toks.length<2||lv===0)return `<span class="w">${esc(plain(w))}</span>`;
    let i=0,h='';
    for(const t of toks){if(t==='|')h+=lv===2?'<i class="dot">·</i>':'';else if(t===' ')h+=' ';else h+=`<span class="p${(i++)%2}">${esc(t)}</span>`}
    return `<span class="w">${h}</span>`;
  }
  function sentence(s,lv){return String(s).split(' ').map(t=>t.includes('|')?word(t,lv):esc(t)).join(' ')}
  function setSplit(v){settings.split=v==='mindig'?'mindig':'auto';store.set('olvaso:settings',settings)}
  /* speaker buttons: <button class="say" data-say="text">; a game may set K.onSay(text) -> false to refuse */
  const api={store,esc,plain,say,hasTTS,word,sentence,seen,level,settings,setSplit,onSay:null,
    sayBtn:(t,label)=>hasTTS?`<button type="button" class="say" data-say="${esc(t)}" aria-label="${esc(label||'Felolvasás')}">🔊</button>`:''};
  document.addEventListener('click',e=>{
    const b=e.target.closest&&e.target.closest('[data-say]');if(!b||b.disabled)return;
    e.stopPropagation();
    const t=b.dataset.say;
    if(api.onSay&&api.onSay(t,b)===false)return;
    if(say(t)){b.classList.add('talking');setTimeout(()=>b.classList.remove('talking'),1200)}
  },true);
  /* sounds */
  let ac=null;api.sound=store.get('olvaso:sound',true)!==false;
  api.toggleSound=()=>{api.sound=!api.sound;store.set('olvaso:sound',api.sound);return api.sound};
  api.beep=(f=440,d=.08,type='square',vol=.06,slide=0)=>{
    if(!api.sound)return;
    try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
      o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
      g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
  };
  api.good=()=>{api.beep(660,.08,'square');setTimeout(()=>api.beep(990,.12,'square'),80)};
  api.bad=()=>api.beep(160,.18,'sawtooth',.05,-60);
  api.coin=()=>{api.beep(1200,.05,'square',.04);setTimeout(()=>api.beep(1600,.08,'square',.04),50)};

  /* pixel sprites: {r:[rows], p:{char:color}}; '.' is transparent */
  const sprCache=new Map();
  api.spr=def=>{
    const key=JSON.stringify(def);let c=sprCache.get(key);if(c)return c;
    const w=Math.max(...def.r.map(r=>r.length)),h=def.r.length;
    c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    def.r.forEach((row,y)=>{for(let i=0;i<row.length;i++){const col=def.p[row[i]];if(col){x.fillStyle=col;x.fillRect(i,y,1,1)}}});
    c._url=null;sprCache.set(key,c);return c;
  };
  api.img=(def,size,alt)=>{const c=api.spr(def);if(!c._url)c._url=c.toDataURL();return `<img class="px" src="${c._url}" alt="${esc(alt||'')}" style="width:${size}px;height:${Math.round(size*c.height/c.width)}px">`};
  api.draw=(ctx,def,cx,cy,w)=>{const c=api.spr(def),h=w*c.height/c.width;ctx.imageSmoothingEnabled=false;ctx.drawImage(c,Math.round(cx-w/2),Math.round(cy-h/2),Math.round(w),Math.round(h))};
  /* a small pixel person, used for riders, customers and villagers */
  api.human=(o={})=>{
    const r=["...hhhh...","..hhhhhh..","..hssssh..","..sesses..","..ssssss..",o.beard?"..sbbbbs..":"...smms...","..tttttt..",".tttttttt.",".sttttttss",".s.tttt.s.","...pppp...","...p..p...","...p..p...","..kk..kk.."];
    if(o.hat){r[0]="..HHHHHH..";r[1]=".HHHHHHHH."}
    if(o.cap){r[0]="..HHHHHH..";r[1]="..HHHHHHHH"}
    if(o.apron){r[7]=".twwwwwwt.";r[8]=".swwwwwwss";r[9]=".s.wwww.s."}
    return {r,p:{h:o.hair||'#3a2a1a',s:o.skin||'#e8b48a',e:'#141414',m:o.mouth||'#b0705a',b:o.hair||'#3a2a1a',t:o.shirt||'#3a6ee8',p:o.pants||'#2a3550',k:'#1f1a16',H:o.hatC||'#555',w:'#f2f2f2'}};
  };
  const HAIR=['#2a1d14','#4a3020','#8a5a2a','#d9b25a','#1a1a1a','#a83a2a'],SKIN=['#f0c7a0','#e0a878','#c98a5a','#8a5a3a'],SHIRT=['#e8494a','#ff7a1a','#2fa86a','#3a6ee8','#8a4ae8','#222831','#f2f2f2','#e8c13a'];
  api.randomHuman=()=>api.human({hair:api.pick(HAIR),skin:api.pick(SKIN),shirt:api.pick(SHIRT),pants:api.pick(['#2a3550','#1f1f24','#4a4a52','#3a5a2a']),cap:Math.random()<.35,hatC:api.pick(SHIRT),beard:Math.random()<.2});
  /* shared XP and rank across all the reading games */
  const RANKS=[[0,'Bronz','#c98a5a'],[120,'Ezüst','#c9d1dc'],[350,'Arany','#ffd166'],[800,'Platina','#6fe3d4'],[1600,'Gyémánt','#7fb6ff'],[3000,'Mester','#c38bff'],[5000,'Legenda','#ff5e6c']];
  api.xp=clampInt(store.get('olvaso:xp',0),0,1e7);
  const rankOf=x=>{let i=0;while(i+1<RANKS.length&&x>=RANKS[i+1][0])i++;return i};
  api.rank=()=>{const i=rankOf(api.xp),cur=RANKS[i],nx=RANKS[i+1];return {i,name:cur[1],color:cur[2],pct:nx?(api.xp-cur[0])/(nx[0]-cur[0]):1,next:nx?nx[1]:null}};
  api.rankChip=()=>{const r=api.rank();return `<span class="rankchip" style="--rc:${r.color}" title="Rang: ${r.name}, ${api.xp} XP"><b>◆ ${r.name}</b><i><u style="width:${Math.round(r.pct*100)}%"></u></i></span>`};
  const paint=()=>document.querySelectorAll('[data-rank]').forEach(el=>el.innerHTML=api.rankChip());
  api.addXP=n=>{const before=rankOf(api.xp);api.xp=clampInt(api.xp+Math.max(0,Math.round(Number(n)||0)),0,1e7);store.set('olvaso:xp',api.xp);paint();
    const after=rankOf(api.xp);if(after>before)api.toast(`Új rang: <b style="color:${RANKS[after][2]}">◆ ${RANKS[after][1]}</b>`)};
  api.clampInt=clampInt;
  api.toast=h=>{let t=document.getElementById('ktoast');if(!t){t=document.createElement('div');t.id='ktoast';document.body.appendChild(t)}
    t.innerHTML=h;t.className='show';clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2200)};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',paint);else setTimeout(paint);
  api.shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
  api.pick=a=>a[Math.random()*a.length|0];
  /* pickWord: a list item chosen by how well its word is known. A word never read right is ~9 times as
     likely as one read right 8 times; the word picked last time does not come again right away. */
  api.count=w=>mastery[plain(String(w)).toLowerCase()]||0;
  let lastWord='';
  api.pickWord=(list,get=x=>x)=>{
    if(!list||!list.length)return undefined;
    let pool=list.filter(x=>plain(String(get(x))).toLowerCase()!==lastWord);if(!pool.length)pool=list;
    const wt=pool.map(x=>Math.max(.11,1-api.count(get(x))/9));
    let r=Math.random()*wt.reduce((a,b)=>a+b,0),i=0;while(i<pool.length-1&&(r-=wt[i])>=0)i++;
    lastWord=plain(String(get(pool[i]))).toLowerCase();return pool[i];
  };
  return api;
})();
/* @end olvaso-kit */
</script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const LOOT=[
  {w:'pajzs',s:{r:[".bbbbbbbb.","bBBBbbbbbb","bBBBbYYbbb","bBBBbYYbbb","bbbbbbbbbb","bbbYYYYbbb",".bbbYYbbb.","..bbbbbb..","...bbbb...","....bb...."],p:{b:'#2f6bff',B:'#8ab4ff',Y:'#ffd166'}}},
  {w:'gyógy|ital',s:{r:["....kk....","....ww....","...wrrw...","..wrrrrw..",".wrrRrrrw.",".wrrrrrrw.",".wrRrrrrw.","..wrrrrw..","...wwww..."],p:{k:'#8a5a2a',w:'#cfe8ff',r:'#ff3a6a',R:'#ff9ab0'}}},
  {w:'bomba',s:{r:["......ys..",".....y....","....kk....","..kkkkkk..",".kkwkkkkk.",".kwkkkkkk.",".kkkkkkkk.",".kkkkkkkk.","..kkkkkk..","...kkkk..."],p:{k:'#2a2a35',w:'#8a8aa0',y:'#c9a36a',s:'#ff7a1a'}}},
  {w:'csizma',s:{r:["..bbbb....","..bBbb....","..bbbb....","..bBbb....","..bbbb....","..bbbbbb..","..bbbbbbbb",".kkkkkkkkk"],p:{b:'#8a5a2a',B:'#b07a40',k:'#2a1a10'}}},

/* Teljes képernyő gomb: csak ott látszik, ahol a böngésző támogatja (iPhone-on nem). */
(function(){
  var d=document, el=d.documentElement, b=d.querySelector('.fs-btn');
  if(!b) return;
  var can=d.fullscreenEnabled||d.webkitFullscreenEnabled;
  if(!can||!(el.requestFullscreen||el.webkitRequestFullscreen)){ b.remove(); return; }
  function on(){ return !!(d.fullscreenElement||d.webkitFullscreenElement); }
  function label(){ b.textContent=b.dataset.compact?'⛶':(on()?'⛶ Kilépés':'⛶ Teljes képernyő'); b.setAttribute('aria-label', on()?'Kilépés a teljes képernyőből':'Teljes képernyő'); }
  b.addEventListener('click', function(){
    try{
      if(on()){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
      else{ var p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el); if(p&&p.catch) p.catch(function(){}); }
    }catch(e){}
    b.blur();
  });
  d.addEventListener('fullscreenchange', label);
  d.addEventListener('webkitfullscreenchange', label);
  label();
})();

<script>
/* @shared fekvo-jelzes */
/* Fekvő telefonon „Fordítsd el a telefont” jelzés. A játék álló képernyőre készült, ezért amíg a telefon
   fekszik, a jelzés eltakarja, és a játék a saját szünet-logikájával megáll (ugyanaz fut le, mint amikor
   a lap háttérbe kerül). Gépen, széles ablakban nem jelenik meg (csak érintőképernyőn, alacsony ablakban). */
(function(){
  var mq;
  try{ mq=matchMedia('(orientation: landscape) and (max-height: 500px) and (pointer: coarse)'); }catch(e){ return; }
  var st=document.createElement('style');
  st.textContent='.rotate-hint{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;padding:16px;'+
    'background:rgba(5,8,14,.95);color:#fff;font:700 20px/1.3 system-ui,sans-serif;text-align:center}'+
    '.rotate-hint[hidden]{display:none!important}.rotate-hint p{margin:8px 0}'+
    '.rotate-hint .sub{font-weight:400;font-size:16px;opacity:.85}.rotate-hint svg{width:56px;height:56px}';
  var el=document.createElement('div');
  el.className='rotate-hint';el.setAttribute('role','alert');el.hidden=true;
  el.innerHTML='<div><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2" '+
    'fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18.5" r="1" fill="currentColor"/></svg>'+
    '<p>Fordítsd el a telefont!</p><p class="sub">Ez a játék álló képernyőre készült. Addig szünetel.</p></div>';
  function pauseGame(){
    try{
      Object.defineProperty(document,'hidden',{configurable:true,get:function(){return true;}});
      document.dispatchEvent(new Event('visibilitychange'));
    }catch(e){}
    try{ delete document.hidden; }catch(e){}
  }
  function update(e){
    if(mq.matches){ if(el.hidden){ el.hidden=false; if(e) pauseGame(); } }
    else el.hidden=true;
  }
  document.head.appendChild(st);
  document.body.appendChild(el);
  if(mq.addEventListener) mq.addEventListener('change',update); else if(mq.addListener) mq.addListener(update);
  update();
})();
/* @end fekvo-jelzes */
</script>

    if(last<t.length)f.appendChild(document.createTextNode(t.slice(last)));
    p.replaceChild(f,node);
  }
  function walk(root){
    if(root.nodeType===3){fix(root);return}
    if(root.nodeType!==1||SKIP[root.nodeName])return;
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),list=[],n;
    while((n=w.nextNode()))if(RE.test(n.nodeValue))list.push(n);
    list.forEach(fix);
  }
  var st=document.createElement('style');
  st.textContent='img.pxi{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;image-rendering:pixelated;image-rendering:crisp-edges}';
  document.head.appendChild(st);
  walk(document.body);
  try{new MutationObserver(function(ms){ms.forEach(function(m){
    if(m.type==='characterData')fix(m.target);else m.addedNodes.forEach(walk);
  })}).observe(document.body,{childList:true,subtree:true,characterData:true})}catch(e){}
})();
/* @end pixel-ikon */
</script>
<script>
/* @shared gamepad */
/* Kontroller (gamepad) a böngésző Gamepad API-jával. A játék kódjához nem nyúl: a kontrollert billentyűkké
   fordítja, amelyeket a játék már ismer. Ha egy ablak (menü, szünet, vége) látszik, a kar a gombok között lép,
   az A gomb megnyomja a kijelöltet. Kiosztás (szabványos kontroller):
     bal kar / d-pad → nyilak, A → szóköz, X → J, Y → K, B → L, RB → L, Start → Escape (szünet), Select → Enter.
   iPhone-on a böngésző nem támogatja, ott ez a rész nem csinál semmit. */
(function(){
  if(!navigator.getGamepads)return;
  var DIRS=[['ArrowUp',12],['ArrowDown',13],['ArrowLeft',14],['ArrowRight',15]];
  var BTN=[[0,' ','Space'],[2,'j','KeyJ'],[3,'k','KeyK'],[1,'l','KeyL'],[5,'l','KeyL'],[9,'Escape','Escape'],[8,'Enter','Enter']];
  var held={},raf=0,shown=false,lastNav=0;
  function key(type,k,code){
    var e=new KeyboardEvent(type,{key:k,code:code,bubbles:true,cancelable:true});
    (document.activeElement&&document.activeElement!==document.body?document.activeElement:document).dispatchEvent(e);
  }
  function set(name,on,k,code){if(!!held[name]===on)return;held[name]=on;key(on?'keydown':'keyup',k,code||k)}
  function visible(el){if(!el||el.hidden)return false;var r=el.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(el).visibility!=='hidden'}
  function dialog(){
    var c=document.querySelectorAll('#ov,#over,#pick,#overlay,.modal,dialog[open],.rotate-hint');
    for(var i=0;i<c.length;i++)if(visible(c[i])&&!c[i].classList.contains('rotate-hint'))return c[i];
    return null;
  }
  function buttons(d){return Array.prototype.filter.call(d.querySelectorAll('button:not(:disabled),a[href]'),visible)}
  function nav(d,dir){
    var b=buttons(d);if(!b.length)return;
    var i=b.indexOf(document.activeElement);
    if(i<0){var hot=d.querySelector('.hot:not(:disabled)');(hot&&visible(hot)?hot:b[0]).focus();return}
    var cur=b[i].getBoundingClientRect(),best=null,bd=1e9;
    b.forEach(function(x){if(x===b[i])return;var r=x.getBoundingClientRect(),dx=r.left+r.width/2-(cur.left+cur.width/2),dy=r.top+r.height/2-(cur.top+cur.height/2);
      var ok=dir==='ArrowUp'?dy<-4:dir==='ArrowDown'?dy>4:dir==='ArrowLeft'?dx<-4:dx>4;if(!ok)return;
      var dist=Math.abs(dx)+Math.abs(dy)*(dir==='ArrowLeft'||dir==='ArrowRight'?3:1)+Math.abs(dx)*(dir==='ArrowUp'||dir==='ArrowDown'?2:0);if(dist<bd){bd=dist;best=x}});
    (best||b[(i+(dir==='ArrowUp'||dir==='ArrowLeft'?b.length-1:1))%b.length]).focus();
  }
  function note(){
    if(shown)return;shown=true;
    var t=document.createElement('div');t.setAttribute('role','status');
    t.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:3500;background:#0b0c10;color:#fff;border:1px solid #444;border-radius:10px;padding:10px 16px;font:700 15px system-ui,sans-serif;pointer-events:none';
    t.textContent='Kontroller csatlakoztatva';document.body.appendChild(t);setTimeout(function(){t.remove()},2500);
  }
  function poll(){
    raf=setTimeout(poll,16); /* időzítő, nem képkocka: álló képnél is figyeli a kontrollert */
    var pads=navigator.getGamepads?navigator.getGamepads():[],gp=null;
    for(var i=0;i<pads.length;i++)if(pads[i]&&pads[i].connected){gp=pads[i];break}
    if(!gp){for(var n in held)if(held[n])held[n]=false;return}
    note();
    var pr=function(i){var b=gp.buttons[i];return !!b&&(b.pressed||b.value>.5)};
    var ax=gp.axes[0]||0,ay=gp.axes[1]||0,dz=.25;
    var dirOn={ArrowUp:ay<-dz,ArrowDown:ay>dz,ArrowLeft:ax<-dz,ArrowRight:ax>dz};
    DIRS.forEach(function(d){if(pr(d[1]))dirOn[d[0]]=true});
    var d=dialog();
    if(d){
      DIRS.forEach(function(x){if(held[x[0]])set(x[0],false,x[0])});
      BTN.forEach(function(b){if(held['b'+b[0]])set('b'+b[0],false,b[1],b[2])});
      var now=performance.now(),any=null;DIRS.forEach(function(x){if(dirOn[x[0]])any=x[0]});
      if(any&&now-lastNav>220){lastNav=now;nav(d,any)}else if(!any)lastNav=0;
      var a=pr(0);if(a&&!held.navA){var f=document.activeElement;if(f&&d.contains(f)&&f.click)f.click();else{var b=buttons(d),hot=d.querySelector('.hot:not(:disabled)');(hot&&visible(hot)?hot:b[0])&&(hot&&visible(hot)?hot:b[0]).click()}}
      held.navA=a;
      if(pr(9)&&!held.Escape)set('Escape',true,'Escape');else if(!pr(9))set('Escape',false,'Escape');
      return;
    }
    held.navA=pr(0);
    DIRS.forEach(function(x){set(x[0],dirOn[x[0]],x[0])});
    BTN.forEach(function(b){set('b'+b[0],pr(b[0]),b[1],b[2])});
  }
  addEventListener('gamepadconnected',function(){if(!raf)poll()});
  addEventListener('gamepaddisconnected',function(){var p=navigator.getGamepads(),any=false;for(var i=0;i<p.length;i++)if(p[i])any=true;if(!any){clearTimeout(raf);raf=0;for(var n in held)if(held[n]&&n.indexOf('Arrow')===0)set(n,false,n)}});
  try{var p0=navigator.getGamepads();for(var i=0;i<p0.length;i++)if(p0[i]){poll();break}}catch(e){}
})();
/* @end gamepad */
</script>
