<head>

<title>Betűbánya</title>
<meta name="description" content="Blokkos, pixeles olvasás- és matekgyakorló kaland 30 napra: napi rövid szövegek és számolós feladatok, szótagszínezés, olvasóvonalzó, felolvasás, okos ismétlés és PIN-kóddal védett tanári nézet.">
<meta name="games:category" content="jatek">
<meta name="games:title-en" content="Letter Mine">

<style>
html{color-scheme:dark}
[hidden]{display:none!important}
:root{
  --grass:#5fa531;--grass-d:#3f7a1f;--grass-l:#8fd35a;
  --dirt:#8a5a34;--dirt-d:#6e4527;
  --stone:#7b7b7b;--stone-d:#4d4d4d;--stone-l:#a9a9a9;
  --paper:#f7f0de;--ink:#1f1b16;--gold:#f2c230;
  --fs:21px;--lh:1.9;--ls:.05em;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:Lexend,Verdana,Arial,sans-serif;color:var(--ink);
  background:#333 repeating-conic-gradient(#3b3b3b 0 25%,#323232 0 50%) 0 0/24px 24px;
  min-height:100vh;
}
#app{max-width:480px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
button:focus-visible{outline:4px solid var(--gold);outline-offset:2px}

.top{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:0 -16px 10px;padding:14px 16px 22px;
  background:
    linear-gradient(var(--grass) 0 60%,#4c8a27 60% 68%,transparent 68%),
    repeating-conic-gradient(#8a5a34 0 25%,#7a4e2d 0 50%) 0 0/12px 12px;
  border-bottom:4px solid #000;
}
.logo{font-family:'Press Start 2P',monospace;font-size:15px;color:#fff;text-shadow:3px 3px 0 #000;letter-spacing:1px}
.ibtn{
  min-width:48px;min-height:48px;font-size:22px;line-height:1;
  background:var(--gold);border:3px solid #000;box-shadow:inset -3px -3px 0 #b8901a,inset 3px 3px 0 #ffe37a;
  display:inline-flex;align-items:center;justify-content:center;flex:none;
}
.ibtn.dark{background:var(--stone);box-shadow:inset -3px -3px 0 var(--stone-d),inset 3px 3px 0 var(--stone-l);color:#fff}

.btn{
  display:block;width:100%;min-height:58px;margin:10px 0;padding:12px 16px;
  font-weight:700;font-size:19px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.6);
  background:var(--stone);border:3px solid #000;
  box-shadow:inset -4px -4px 0 var(--stone-d),inset 4px 4px 0 var(--stone-l);
}
.btn.green{background:var(--grass);box-shadow:inset -4px -4px 0 var(--grass-d),inset 4px 4px 0 var(--grass-l)}
.btn.red{background:#b0413e;box-shadow:inset -4px -4px 0 #7a2725,inset 4px 4px 0 #d96a66}
.btn.big{min-height:68px;font-size:21px}
.btn.sm{min-height:50px;font-size:17px;margin:12px 0 0}
.btn:active,.opt:active,.dt:active,.mb:active,.ibtn:active{transform:translateY(2px)}

.panel{background:var(--paper);border:4px solid #000;box-shadow:inset -4px -4px 0 #ddd0b0;padding:16px;margin:12px 0}
.h{color:#fff;text-shadow:2px 2px 0 #000;font-size:20px;margin:20px 0 6px}
.hello{color:#fff;text-shadow:2px 2px 0 #000;font-size:24px;font-weight:700;margin:16px 0 4px}
.lbl{color:#fff;text-shadow:2px 2px 0 #000;font-weight:700;font-size:17px;margin:14px 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:19px}
.small{font-size:15px;color:#5a5040;margin-top:6px;line-height:1.4}
.xpbar{height:22px;border:3px solid #000;background:#3a3a3a;margin-top:10px}
.xpbar>div{height:100%;background:linear-gradient(#b6f05a,#5fa531);transition:width .5s}

.today .dname{font-size:22px;font-weight:700;margin-bottom:12px}
.mission{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mb{
  min-height:110px;padding:10px;color:#fff;font-weight:700;font-size:18px;text-shadow:2px 2px 0 #000;
  background:var(--stone);border:3px solid #000;box-shadow:inset -5px -5px 0 var(--stone-d),inset 5px 5px 0 var(--stone-l);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
}
.mb .ico{font-size:34px;text-shadow:none}
.mb.done{background:var(--grass);box-shadow:inset -5px -5px 0 var(--grass-d),inset 5px 5px 0 var(--grass-l)}
.stars{color:var(--gold);font-size:18px;letter-spacing:2px}
.mb.done .stars{color:#fff36b}

.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dt{
  aspect-ratio:1;max-width:100%;padding:0;color:#fff;font-weight:700;font-size:19px;text-shadow:2px 2px 0 #000;
  background:var(--stone);border:3px solid #000;box-shadow:inset -4px -4px 0 var(--stone-d),inset 4px 4px 0 var(--stone-l);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-variant-numeric:tabular-nums;
}
.dt small{font-size:12px}
.dt.done{background:var(--grass);box-shadow:inset -4px -4px 0 var(--grass-d),inset 4px 4px 0 var(--grass-l)}
.dt.half{background:#b8901a;box-shadow:inset -4px -4px 0 #7d6110,inset 4px 4px 0 #e0c050}
.dt.locked{filter:grayscale(1) brightness(.55)}
.dt.cur{outline:4px solid var(--gold);outline-offset:-1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:#fff;font-size:14px;margin-top:10px;text-shadow:1px 1px 0 #000}
.legend i{display:inline-block;width:14px;height:14px;border:2px solid #000;vertical-align:-2px;margin-right:4px}

.pbar{display:flex;gap:5px;flex:1}
.pb{flex:1;height:22px;background:#3a3a3a;border:3px solid #000}
.pb.done{background:var(--grass)}
.pb.cur{background:var(--gold)}

.instr{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;font-weight:700;font-size:20px;line-height:1.4;text-shadow:2px 2px 0 #000;margin:12px 0 4px}
.text{font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);word-spacing:.15em}
.sent{border-radius:4px;padding:3px 2px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sent.hl{background:#ffe680;box-shadow:0 0 0 3px #ffe680}
.s1{color:#17398f}.s2{color:#1f1b16}
.gap{display:inline-block;line-height:1.3;min-width:4.2em;border-bottom:4px solid #000;text-align:center;background:#fff7c2}
.gap.filled{background:#c8f0c8;font-weight:700}
.calcbig{font-size:calc(var(--fs) * 1.9);font-weight:700;text-align:center;letter-spacing:.06em;padding:6px 0;font-variant-numeric:tabular-nums}
.calcbig.hl{background:#ffe680}

.q{background:#fff;border:4px solid #000;padding:12px 14px;margin:12px 0;font-size:var(--fs);line-height:1.6;letter-spacing:var(--ls);display:flex;gap:10px;align-items:center;justify-content:space-between}
.q b{display:block;font-size:15px;color:#6a5a40;letter-spacing:0}
.opts{display:grid;gap:12px;margin-top:12px}
.opt,.cardt,.slot,.mw,.mp{
  width:100%;min-height:62px;padding:12px 14px;text-align:left;
  background:#fff;border:4px solid #000;box-shadow:inset -4px -4px 0 #ddd;
  font-size:var(--fs);font-weight:600;line-height:1.5;letter-spacing:var(--ls);
}
.opt.num{text-align:center;font-size:calc(var(--fs) * 1.25);font-weight:700;font-variant-numeric:tabular-nums}
.opt.ok,.mw.ok,.mp.ok,.slot.ok{background:#c8f0c8;border-color:#1f7a2e;box-shadow:inset -4px -4px 0 #9fd49f}
.opt.no{background:#f3d4d4;border-color:#a33;opacity:.75}
.mw.no,.mp.no,.slot.no{background:#f3d4d4;border-color:#a33;animation:shake .35s}
.sel{background:#fff6cc!important;outline:4px solid var(--gold);outline-offset:-8px}

.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.col{display:grid;gap:12px;align-content:start;min-width:0}
.mw,.mp{min-height:72px;text-align:center}
.mp{font-size:40px;line-height:1}

.slot{display:block;margin-bottom:10px;border-style:solid;font-weight:600}
.slot.empty{background:rgba(255,255,255,.35);border-style:dashed;color:#eee;text-shadow:1px 1px 0 #000;font-weight:700}
.card{display:flex;gap:8px;margin-bottom:10px;align-items:stretch}
.cardt{flex:1;min-width:0}

.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;max-width:448px;margin:0 auto;background:#fff3c4;border:4px solid #000;padding:12px 14px;font-size:17px;font-weight:600;line-height:1.4;box-shadow:4px 4px 0 #000}
.rwrap{position:relative;overflow:hidden}
.ruler{position:absolute;left:-6px;right:-6px;top:0;pointer-events:none;background:rgba(255,226,110,.28);border-top:3px solid var(--gold);border-bottom:3px solid var(--gold);box-shadow:0 0 0 2000px rgba(247,240,222,.8);transition:top .15s}
.tools{display:flex;gap:8px;margin-top:12px;align-items:stretch}
.tools .btn.sm{margin:0;flex:1;min-width:0}
.ibtn.on{background:var(--grass);box-shadow:inset -3px -3px 0 var(--grass-d),inset 3px 3px 0 var(--grass-l)}
.chip{display:inline-block;background:var(--gold);border:3px solid #000;padding:4px 10px;font-weight:700;font-size:16px;margin-top:12px}
.hint{background:#fff3c4;border:3px dashed var(--dirt);padding:12px;margin:12px 0;font-size:18px;line-height:1.5}
.fb{padding:16px;border:4px solid #000;margin:14px 0 0;font-size:21px;font-weight:700;text-align:center;line-height:1.5;animation:pop .35s}
.fb.good{background:#c8f0c8}.fb.okish{background:#fff3c4}.fb.soft{background:#dfe9ff}
.expl{margin-top:10px;font-size:19px;font-weight:600;background:#fff;border:2px solid #000;padding:8px;font-variant-numeric:tabular-nums}
.lvup{margin-top:8px;font-family:'Press Start 2P',monospace;font-size:13px;color:#7a5a00}

.big-ico{font-size:72px;text-align:center;margin:10px 0}
.center{text-align:center}
.stars-big{color:var(--gold);font-size:44px;text-align:center;text-shadow:3px 3px 0 #000;letter-spacing:6px}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px dashed #cdbf9e;font-size:18px;font-weight:600;flex-wrap:wrap}
.setrow:last-child{border-bottom:none}
.seg{display:flex;gap:6px}
.seg button{min-width:52px;min-height:48px;border:3px solid #000;background:#fff;font-weight:700;padding:0 8px}
.seg button.on{background:var(--grass);color:#fff;text-shadow:1px 1px 0 #000}

.dots{display:flex;justify-content:center;gap:14px;margin:18px 0}
.dot{width:26px;height:26px;border:3px solid #000;background:#fff}
.dot.on{background:var(--grass)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{min-height:66px;font-size:26px;font-weight:700;background:#fff;border:3px solid #000;box-shadow:inset -4px -4px 0 #ddd}
.msg{text-align:center;font-weight:700;min-height:26px;font-size:17px}

.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:#fff;border:3px solid #000;padding:10px;text-align:center;font-size:14px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.ptitle{font-weight:700;margin-bottom:6px;font-size:17px}
.trow{margin:10px 0;font-size:15px}
.trow .row{font-size:15px;font-weight:600}
.bar{height:16px;border:2px solid #000;background:#e6e0d0;margin-top:4px}
.bar>div{height:100%;background:var(--grass)}
.bar.weak>div{background:#d98a2b}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;border-bottom:1px solid #cdbf9e;text-align:left;vertical-align:top}
th{font-size:13px;color:#5a5040}
td.st{color:#b8901a;letter-spacing:1px}

@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* gomb lenyomva 1 px-t mozdul (a translate nem ütközik a meglévő transform-okkal) */
button:not(:disabled):active{translate:0 1px}
</style>
</head>
<body>
  <div class="top-bar" style="max-width:480px;margin:0 auto!important;padding:8px max(16px,env(safe-area-inset-left,0px)) 0;color:#fff;position:relative;z-index:1000;display:flex;flex-wrap:wrap;align-self:flex-start;align-items:center;gap:8px;margin:0"><a class="home-link" href="../index.html" style="display:inline-flex;align-self:flex-start;width:fit-content;align-items:center;gap:6px;margin:0;min-height:44px;min-width:44px;box-sizing:border-box;justify-content:center;padding:6px 14px;border-radius:999px;border:1px solid currentColor;color:inherit;opacity:.75;text-decoration:none;font:600 14px/1.2 system-ui,sans-serif">← Összes játék</a><button type="button" class="fs-btn" aria-label="Teljes képernyő" style="all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;justify-content:center;padding:6px 14px;border-radius:999px;border:1px solid currentColor;color:inherit;opacity:.75;cursor:pointer;font:600 14px/1.2 system-ui,sans-serif">⛶ Teljes képernyő</button></div>
<div id="app"></div>
<script>
/* ===================== OLVASÁS: 1–4. NAP (eredeti 20 feladat) ===================== */
const TASKS = [
  {id:'mc1',type:'mc',text:'Bálint egy kis házat épített a domb tetejére. A falakat fából, a tetőt kőből rakta. Este fáklyákat tett az ajtó mellé, hogy lássa az utat.',q:'Miből készült a ház teteje?',opts:['Fából','Kőből','Üvegből'],a:1},
  {id:'mc2',type:'mc',text:'A bányában sötét volt és hideg. Réka vitt magával egy csákányt és tíz fáklyát. Mélyen lent egy csillogó kék követ talált.',q:'Mit talált Réka a bánya mélyén?',opts:['Egy csillogó kék követ','Egy régi csákányt','Tíz fáklyát'],a:0},
  {id:'mc3',type:'mc',text:'A farkas eleinte félt Danitól. Dani minden nap adott neki egy csontot. Egy hét múlva a farkas már mindenhová követte őt.',q:'Miért kezdte követni a farkas Danit?',opts:['Mert eltévedt az erdőben','Mert Dani minden nap etette','Mert félt a sötétben'],a:1},
  {id:'mc4',type:'mc',text:'Eleredt az eső, és a folyó vize gyorsan emelkedett. Zoli homokzsákokkal védte meg a kertjét. Reggelre a víz visszahúzódott, és a répák épek maradtak.',q:'Mivel védte meg Zoli a kertjét?',opts:['Kövekkel','Homokzsákokkal','Deszkákkal'],a:1},
  {id:'tf1',type:'tf',text:'Zsófi búzát vetett a ház mögé. Minden reggel megöntözte. Három hét múlva learatta, és kenyeret sütött belőle.',q:'Zsófi a ház előtt vetett búzát.',a:false},
  {id:'tf2',type:'tf',text:'A barlang bejáratánál két nagy pók őrködött. Gergő inkább megvárta a reggelt. Napfényben a pókok elbújtak, így biztonságosan bemehetett.',q:'Gergő megvárta a reggelt, mielőtt bement a barlangba.',a:true},
  {id:'tf3',type:'tf',text:'A falu kovácsa vasból kardot és patkót készít. Cserébe almát és szenet kér. A falusiak szeretik, mert mindig segít.',q:'A kovács aranyat kér a munkájáért.',a:false},
  {id:'tf4',type:'tf',text:'Lili hajóval átkelt a tavon. A túlsó parton egy elhagyott tornyot talált. A torony tetejéről az egész völgyet látta.',q:'A torony tetejéről látni lehetett a völgyet.',a:true},
  {id:'or1',type:'or',s:['Ádám kivágott három fát.','A fából deszkákat készített.','A deszkákból egy asztalt épített.']},
  {id:'or2',type:'or',s:['Besötétedett, ezért Nóra hazasietett.','Bezárta maga mögött az ajtót.','Lefeküdt aludni, és reggelig pihent.']},
  {id:'or3',type:'or',s:['Kata talált egy tojást a fűben.','Hazavitte, és egy meleg helyre tette.','Pár nap múlva kikelt belőle egy kiscsibe.']},
  {id:'or4',type:'or',s:['Péter lement a bányába.','Talált egy darab vasércet.','A kemencében kiolvasztotta, és vasrúd lett belőle.']},
  {id:'gap1',type:'gap',text:'Sötét volt, ezért Ábel meggyújtott egy ___. Így már jól látta a lépcsőt.',opts:['fáklyát','kardot','almát'],a:0},
  {id:'gap2',type:'gap',text:'Az éhes birka a zöld ___ legelte a mezőn. A pásztor közben a fa alatt pihent.',opts:['füvet','követ','homokot'],a:0},
  {id:'gap3',type:'gap',text:'A ládát kulccsal kellett ___. Benne három aranyrúd volt.',opts:['kinyitni','megenni','elültetni'],a:0},
  {id:'gap4',type:'gap',text:'Hideg tél jött, ezért Ákos ___ rakott a kandallóba. A házban hamar meleg lett.',opts:['fát','havat','vizet'],a:0},
  {id:'ma1',type:'ma',text:'A kertben alma, répa és tök nőtt. Viki mindhármat leszedte, és vitt belőlük a nagymamájának.',pairs:[['alma','🍎'],['répa','🥕'],['tök','🎃']]},
  {id:'ma2',type:'ma',text:'Az erdőben Tomi látott egy farkast, egy rókát és egy medvét. Gyorsan és csendben hazament.',pairs:[['farkas','🐺'],['róka','🦊'],['medve','🐻']]},
  {id:'ma3',type:'ma',text:'A régi ládában volt egy kard, egy íj és egy kulcs. Márk a kulcsot tette el először.',pairs:[['kard','🗡️'],['íj','🏹'],['kulcs','🔑']]},
  {id:'ma4',type:'ma',text:'A tóparton Emma hallott egy békát. Aztán látott egy halat és egy kacsát is.',pairs:[['béka','🐸'],['hal','🐟'],['kacsa','🦆']]},
];
const DAYS = [
  {name:'Az erdő széle',ico:'🌲',ids:['mc1','tf1','gap1','or1','ma1']},
  {name:'A bánya mélye',ico:'⛏️',ids:['tf2','gap2','mc2','ma2','or2']},
  {name:'A falu',ico:'🏘️',ids:['gap3','mc3','or3','tf3','ma3']},
  {name:'A völgy',ico:'⛰️',ids:['ma4','tf4','gap4','mc4','or4']},
];

/* ===================== OLVASÁS: 5–30. NAP ===================== */
/* R(név, ikon, [szöveg, kérdés, opciók, jó index], [szöveg, állítás, igaz?], [szöveg ___-val, opciók (az első a jó)], [mondatok sorrendben], [szöveg, [szó, kép]...]) */
const ORDERS=[['mc','tf','gap','or','ma'],['tf','gap','mc','ma','or'],['gap','mc','or','tf','ma'],['ma','tf','gap','mc','or'],['mc','or','tf','ma','gap']];
function R(name,ico,mc,tf,gap,or,ma){
  const day=DAYS.length+1, p='d'+day+'_';
  const t={
    mc:{type:'mc',text:mc[0],q:mc[1],opts:mc[2],a:mc[3]},
    tf:{type:'tf',text:tf[0],q:tf[1],a:tf[2]},
    gap:{type:'gap',text:gap[0],opts:gap[1],a:0},
    or:{type:'or',s:or},
    ma:{type:'ma',text:ma[0],pairs:ma[1]},
  };
  for(const k in t){ t[k].id=p+k; TASKS.push(t[k]); }
  DAYS.push({name,ico,ids:ORDERS[day%5].map(k=>p+k)});

function mopts(ans,wrong){
  const out=[ans];
  const w=shuffle((wrong||[]).filter(x=>x>0&&Number.isInteger(x)&&x!==ans));
  if(w.length) out.push(w[0]);
  for(const x of shuffle([1,2,3,5,10,-1,-2,-3,-5,-10])){ if(out.length>=3) break; const v=ans+x; if(v>0&&!out.includes(v)) out.push(v); }
  return shuffle(out).map(v=>({t:String(v),ok:v===ans}));
}

const VOW = 'aáeéiíoóöőuúüűAÁEÉIÍOÓÖŐUÚÜŰ';
const DIG = ['dzs','cs','dz','gy','ly','ny','sz','ty','zs'];
function units(w){ const u=[]; let i=0; while(i<w.length){ let m=null; for(const d of DIG){ if(w.substr(i,d.length).toLowerCase()===d){ m=w.substr(i,d.length); break; } } if(m){u.push(m);i+=m.length;} else {u.push(w[i]);i++;} } return u; }
function syl(w){
  const u=units(w), vi=[]; u.forEach((x,i)=>{ if(VOW.includes(x[0])) vi.push(i); });
  if(vi.length<2) return [w];
  const cuts=[]; for(let k=0;k<vi.length-1;k++){ const a=vi[k], b=vi[k+1]; cuts.push(b-a-1===0 ? b : b-1); }
  const out=[]; let s=0; for(const c of cuts){ out.push(u.slice(s,c).join('')); s=c; } out.push(u.slice(s).join('')); return out;
}
function fmt(s){
  if(!S.settings.syl) return s;
  return s.replace(/[A-Za-zÀ-ž]+/g, w => syl(w).map((p,i)=>`<span class="s${i%2+1}">${p}</span>`).join(''));
}
const splitS = t => (t.match(/[^.!?]+[.!?]*/g) || [t]).map(s=>s.trim()).filter(Boolean);

/* ===================== HANG ===================== */
const TTS = (()=>{ try{ return 'speechSynthesis' in window && !!window.speechSynthesis && typeof SpeechSynthesisUtterance!=='undefined'; }catch(e){ return false; } })();
const SHOWTTS = true;
function toast(msg){ let t=document.getElementById('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); } t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>{ t.hidden=true; },5000); }
let huVoice=null, ttsTok=0;
function loadV(){ try{ const v=speechSynthesis.getVoices(); huVoice = v.find(x=>/^hu/i.test(x.lang)) || null; }catch(e){} }
try{ if(TTS){ loadV(); speechSynthesis.onvoiceschanged = loadV; } }catch(e){}
function clearHL(){ document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl')); }
function speakRaw(t,onEnd){
  if(!TTS){ clearHL(); toast('A felolvasás itt nem érhető el. Nyisd meg a játékot Chrome böngészőben, ott működik.'); return; }
  try{ if(!huVoice && !speakRaw.warned && speechSynthesis.getVoices().length){ speakRaw.warned=true; toast('Nem találtam magyar felolvasó hangot. A telefon beállításaiban (Szövegfelolvasás) töltsd le a magyar nyelvet.'); } }catch(e){}
  try{
    const u = new SpeechSynthesisUtterance(t);
    u.lang='hu-HU'; if(huVoice) u.voice=huVoice; u.rate=S.settings.rate;
    u.onend = ()=>onEnd && onEnd(); u.onerror = ()=>onEnd && onEnd();
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopTTS(){ ttsTok++; try{ if(TTS) speechSynthesis.cancel(); }catch(e){} clearHL(); }
function speak(t){ stopTTS(); const tok=ttsTok; speakRaw(t,()=>{ if(tok===ttsTok) clearHL(); }); }
function speakSeq(arr,els){
  stopTTS(); const tok=ttsTok;
  (function step(i){
    if(tok!==ttsTok) return; clearHL();
    if(i>=arr.length) return;
    if(els[i]){ els[i].classList.add('hl'); rulerToEl(els[i]); }
    speakRaw(arr[i],()=>step(i+1));
  })(0);
}
function spoken(s){ return s.replace(/___/g, P && P.filled ? P.filled : 'üres hely'); }

let AC;
function beep(good,small){
  if(!S.settings.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), n=AC.currentTime;
    o.type='square';
    if(good){ o.frequency.setValueAtTime(660,n); o.frequency.setValueAtTime(880,n+.08); if(!small) o.frequency.setValueAtTime(1175,n+.16); }
    else { o.frequency.setValueAtTime(240,n); o.frequency.setValueAtTime(190,n+.1); }
    g.gain.setValueAtTime(.05,n); g.gain.exponentialRampToValueAtTime(.001,n+(small?.14:.32));
    o.connect(g).connect(AC.destination); o.start(n); o.stop(n+.35);
  }catch(e){}
}

    ${sess?`<div class="tw"><table><tr><th>Mikor</th><th>Küldetés</th><th>XP</th><th>Idő</th></tr>${sess}</table></div>`:'<div class="small">Még nem volt befejezett kör.</div>'}</div>
  <div class="panel">
    <div class="setrow"><span>Minden nap nyitva</span><div class="seg">
      <button class="${S.unlockAll?'on':''}" data-a="unlock" data-v="1">Be</button><button class="${!S.unlockAll?'on':''}" data-a="unlock" data-v="0">Ki</button></div></div>
    <div class="small">Kikapcsolva naponta egy új nap nyílik meg.</div>
  </div>
  <button class="btn" data-a="export">📋 Adatok másolása (JSON)</button>
  <textarea id="exp" hidden readonly style="width:100%;height:160px;font-size:12px"></textarea>
  <button class="btn" data-a="newpin">🔑 PIN módosítása</button>
  <button class="btn red" data-a="reset">🗑 Haladás törlése</button>`;
}

function rulerMetrics(){ const txt=document.getElementById('txt'); if(!txt) return null; const lh=parseFloat(getComputedStyle(txt).lineHeight)||30; return {txt,lh,n:Math.max(1,Math.round(txt.scrollHeight/lh))}; }
function placeRuler(){ const r=document.getElementById('ruler'), m=rulerMetrics(); if(!r||!m||!P) return; P.line=Math.max(0,Math.min(m.n-1,P.line||0)); r.style.top=(P.line*m.lh)+'px'; r.style.height=m.lh+'px'; }
function rulerToY(y){ if(!S.settings.ruler||!P) return; const m=rulerMetrics(); if(!m) return; P.line=Math.floor((y-m.txt.getBoundingClientRect().top)/m.lh); placeRuler(); }
function rulerToEl(el){ if(!S.settings.ruler||!el||!el.getClientRects) return; const rc=el.getClientRects()[0]; if(rc) rulerToY((rc.top+rc.bottom)/2); }
function render(){
  applySettings();
  app.innerHTML = view==='play'?playHTML():view==='sum'?sumHTML():view==='day'?dayHTML():view==='settings'?settingsHTML():view==='pin'?pinHTML():view==='teacher'?teacherHTML():homeHTML();
  if(view==='play') placeRuler();
}

/* ===================== JÁTÉKMENET ===================== */
function startMission(v){
  const mode=v[0], d=+v.slice(1);
  const list = mode==='r' ? DAYS[d-1].ids.map(id=>TASK[id]) : mathKinds(d).map(k=>mathTask(k,mathLevel(d)));
  const rev = dueReviews(mode, list.map(t=>t.id), 2);
  rev.forEach(id=>list.push(Object.assign({}, mode==='m'?mathTask(id.slice(2),mathLevel(d)):TASK[id], {review:true})));
  P = {mode, day:d, list, idx:0, score:0, max:list.length*10, t0r:Date.now()};
  lockedMsg='';
  loadTask();
}
function loadTask(){
  stopTTS();
  const t = P.list[P.idx];
  Object.assign(P,{task:t, mist:0, done:false, state:{}, hint:'', filled:null, line:0, t0:Date.now(), fbMsg:'', fbType:''});
  if(t.type==='mc'||t.type==='gap') P.opts = shuffle(t.opts.map((x,i)=>({t:x, ok:i===t.a})));
  if(t.type==='tf') P.opts = [{t:'Igaz',ok:t.a===true},{t:'Hamis',ok:t.a===false}];
  if(t.type==='mt') P.opts = mopts(t.ans, t.wrong);
  if(t.type==='or'){
    const idx=t.s.map((_,i)=>i); let o; do{ o=shuffle(idx); }while(o.every((v,i)=>v===i));
    P.order=o; P.picked=Array(t.s.length).fill(null); P.mark={};
  }
  if(t.type==='ma'){ const idx=t.pairs.map((_,i)=>i); P.words=shuffle(idx); P.pics=shuffle(idx); P.matched=[]; P.sel=null; P.flash=null; }
  view='play'; render(); window.scrollTo(0,0);
}
function finish(pts){
  const before=level(S.xp);
  S.xp+=pts; P.score+=pts; P.done=true;
  const dur=Math.round((Date.now()-P.t0)/1000); S.time+=dur;
  const r=S.tasks[P.task.id]||{n:0,first:0,mist:0,time:0};
  r.n++; if(P.mist===0) r.first++; r.mist+=P.mist; r.time+=dur; S.tasks[P.task.id]=r;
  updateReview(P.task.id, P.mist===0, !!P.task.review);
  const d=dstr(new Date()); if(!S.days.includes(d)) S.days.push(d);
  save();
  const up = level(S.xp)>before, t=P.task;
  P.fbType = pts>=10?'good':pts>0?'okish':'soft';
  P.fbMsg = (pts>=10?rand(PRAISE):pts>0?'Ügyes, sikerült! 👍':'Semmi baj, most már tudod! 💪')
          + (pts?`<br>+${pts} XP`:'')
          + (t.type==='mt'?`<div class="expl">${t.expl}${t.unit&&!t.calc?' '+t.unit:''}</div>`:'')
          + (up?`<div class="lvup">⬆ SZINTLÉPÉS! ${level(S.xp)}. SZINT</div>`:'');
  beep(pts>0);
  render();
  requestAnimationFrame(()=>{ const f=document.getElementById('fb'); if(f) f.scrollIntoView({behavior:'smooth',block:'center'}); });
}
function finishRound(){
  stopTTS();
  const key=P.mode+P.day, pct=P.score/P.max, stars=pct>=.9?3:pct>=.6?2:1, prev=S.rounds[key];
  S.rounds[key]={done:true, stars:Math.max(stars, prev?prev.stars:0)};
  S.sessions.unshift({d:new Date().toISOString(), day:P.day, mode:P.mode, score:P.score, max:P.max, dur:Math.round((Date.now()-P.t0r)/1000)});
  S.sessions=S.sessions.slice(0,100);
  save(); view='sum'; render(); window.scrollTo(0,0);
}

function pick(i){
  if(P.done) return;
  const o=P.opts[i], ty=P.task.type;
  if(o.ok){ P.state[i]='ok'; if(ty==='gap') P.filled=o.t; finish(P.mist===0?10:5); return; }
  P.state[i]='no'; P.mist++; beep(false);
  if(P.mist>=2 || ty==='tf'){
    P.opts.forEach((x,j)=>{ if(x.ok){ P.state[j]='ok'; if(ty==='gap') P.filled=x.t; } });
    finish(0);
  } else {
    P.hint = ty==='mt' ? 'Majdnem! Olvasd el újra lassan, és számold ki még egyszer.' : 'Majdnem! Olvasd el újra a szöveget, és próbáld még egyszer. Ha koppintasz egy mondatra, felolvasom.';
    render();
  }
}
function put(k){ const i=P.picked.indexOf(null); if(i<0) return; P.picked[i]=k; delete P.mark[i]; P.hint=''; render(); }
function unpick(i){ if(P.done) return; P.picked[i]=null; delete P.mark[i]; render(); }
function check(){
  const t=P.task; let ok=true; P.mark={};
  P.picked.forEach((k,i)=>{ if(k===i) P.mark[i]='ok'; else { P.mark[i]='no'; ok=false; } });
  if(ok){ finish(P.mist===0?10:5); return; }
  P.mist++; beep(false);
  if(P.mist>=2){ P.picked=t.s.map((_,i)=>i); P.mark={}; t.s.forEach((_,i)=>P.mark[i]='ok'); finish(0); return; }
  P.hint='Majdnem! A zöld mondatok jó helyen vannak. A pirosakat visszaraktam, próbáld újra!';
  render();
  setTimeout(()=>{ if(P.done) return; P.picked=P.picked.map((k,i)=>P.mark[i]==='no'?null:k); Object.keys(P.mark).forEach(i=>{ if(P.mark[i]==='no') delete P.mark[i]; }); render(); }, 900);
}
function mword(i){ if(P.done) return; P.sel=i; P.hint=''; render(); }
function mpic(i){
  if(P.done || P.matched.includes(i)) return;
  if(P.sel===null){ P.hint='Előbb koppints egy szóra a bal oldalon!'; render(); return; }
  if(P.sel===i){
    P.matched.push(i); P.sel=null; P.hint='';
    if(P.matched.length===P.task.pairs.length) finish(P.mist===0?10:P.mist<=2?5:2);
    else { beep(true,true); render(); }
  } else {
    P.mist++; P.flash={w:P.sel,p:i}; beep(false); render();
    setTimeout(()=>{ P.flash=null; P.sel=null; render(); },700);
  }
}

/* ===================== PIN ===================== */
function pinKey(k){
  if(k==='del') pinBuf=pinBuf.slice(0,-1); else if(pinBuf.length<4) pinBuf+=k;
  render();
  if(pinBuf.length===4) setTimeout(pinDone,180);
}
function pinDone(){
  if(!S.pin){
    if(!pinFirst){ pinFirst=pinBuf; pinBuf=''; pinMsg='Írd be még egyszer!'; }
    else if(pinFirst===pinBuf){ S.pin=hash(pinBuf); save(); pinFirst=''; pinBuf=''; pinMsg=''; view='teacher'; }
    else { pinFirst=''; pinBuf=''; pinMsg='Nem egyezett. Kezdd újra!'; }
  } else {
    if(hash(pinBuf)===S.pin){ pinBuf=''; pinMsg=''; view='teacher'; }
    else { pinBuf=''; pinMsg='Hibás PIN kód. Próbáld újra!'; }
  }
  render(); window.scrollTo(0,0);
}

/* ===================== ESEMÉNYEK ===================== */
const ACT = {
  go:v=>{ stopTTS(); view=v; pinBuf=''; pinMsg=''; pinFirst=''; render(); window.scrollTo(0,0); },
  home:()=>{ stopTTS(); lockedMsg=''; view='home'; render(); window.scrollTo(0,0); },
  day:v=>{ selDay=+v; lockedMsg=''; view='day'; render(); window.scrollTo(0,0); },
  start:v=>startMission(v),
  locked:v=>{ lockedMsg=`🔒 A ${v}. nap később nyílik meg. Naponta egy új nap jön.`; render(); },
  sayinstr:()=>{ const t=P.task; speak(t.type==='mt'?(t.calc?INSTR.calc:INSTR.mt):INSTR[t.type]); },
  sayq:()=>speak((P.task.type==='tf'?'Állítás: ':'')+P.task.q),
  saysent:v=>speak(P.task.s[+v]),
  readall:()=>{
    const t=P.task;
    if(t.type==='mt'&&t.calc){ stopTTS(); const el=document.getElementById('calc'); if(el) el.classList.add('hl'); const tok=ttsTok; speakRaw(sayMath(t.calc)+', egyenlő?',()=>{ if(tok===ttsTok) clearHL(); }); return; }
    const arr=splitS(textOf(t)).map(spoken), els=[...document.querySelectorAll('#txt .sent')];
    if(t.type==='mt'&&t.q) arr.push(t.q);
    speakSeq(arr, els);
  },
  sent:(v,el,e)=>{ stopTTS(); if(e) rulerToY(e.clientY); el.classList.add('hl'); const tok=ttsTok; speakRaw(spoken(splitS(textOf(P.task))[+v]),()=>{ if(tok===ttsTok) clearHL(); }); },
  ruler:()=>{ S.settings.ruler=!S.settings.ruler; save(); render(); },
  rline:v=>{ P.line=(P.line||0)+(+v); placeRuler(); },
  pick:v=>pick(+v), put:v=>put(+v), unpick:v=>unpick(+v), check,
  mword:v=>mword(+v), mpic:v=>mpic(+v),
  next:()=>{ P.idx++; if(P.idx>=P.list.length) finishRound(); else loadTask(); },
  set:v=>{ const [k,val]=v.split(':'); S.settings[k] = val==='true'?true:val==='false'?false:+val; save(); render(); },
  teacher:()=>{ pinBuf=''; pinFirst=''; pinMsg=''; view='pin'; render(); },
  pin:v=>pinKey(v),
  unlock:v=>{ S.unlockAll=v==='1'; save(); render(); },
  newpin:()=>{ S.pin=null; save(); pinBuf=''; pinFirst=''; pinMsg='Új PIN: írj be 4 számjegyet'; view='pin'; render(); },
  export:(v,el)=>{
    const data=Object.assign({}, S); delete data.pin;
    const txt=JSON.stringify(data,null,2);
    const ok=()=>{ el.textContent='✔ Kimásolva a vágólapra'; };
    const fail=()=>{ const ta=document.getElementById('exp'); ta.hidden=false; ta.value=txt; ta.select(); el.textContent='Jelöld ki és másold ki a lenti szöveget'; };
    try{ navigator.clipboard.writeText(txt).then(ok,fail); }catch(e){ fail(); }
  },
  reset:(v,el)=>{
    if(!el.dataset.sure){ el.dataset.sure='1'; el.textContent='⚠ Biztos? Koppints újra a törléshez'; return; }
    const keep={settings:S.settings, pin:S.pin}; S=Object.assign(DEF(), keep, {start:dstr(new Date())}); save(); render();
  },
};
app.addEventListener('click', e=>{
  const b=e.target.closest('[data-a]'); if(!b || b.disabled) return;
  const f=ACT[b.dataset.a]; if(f) f(b.dataset.v, b, e);
});
app.addEventListener('change', e=>{
  if(e.target && e.target.id==='nick'){ S.settings.name=String(e.target.value||'').trim().slice(0,16); save(); }
});
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) stopTTS(); else if(view==='home') render(); });

render();
</script>

(function(){

  if(!b) return;
  var can=d.fullscreenEnabled||d.webkitFullscreenEnabled;
  if(!can||!(el.requestFullscreen||el.webkitRequestFullscreen)){ b.remove(); return; }
  function on(){ return !!(d.fullscreenElement||d.webkitFullscreenElement); }
  function label(){ b.textContent=b.dataset.compact?'⛶':(on()?'⛶ Kilépés':'⛶ Teljes képernyő'); b.setAttribute('aria-label', on()?'Kilépés a teljes képernyőből':'Teljes képernyő'); }
  b.addEventListener('click', function(){
    try{
      if(on()){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
      else{ var p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el); if(p&&p.catch) p.catch(function(){}); }
    }catch(e){}
    b.blur();
  });
  d.addEventListener('fullscreenchange', label);
  d.addEventListener('webkitfullscreenchange', label);
  label();
})();
</script>
