<style>

<script>
/* @shared kepesseg */
/* Modern böngészőképességek egy helyen. Mind opcionális: ha a böngésző nem tudja, vagy hibát ad, csendben nem
   történik semmi, a játék ugyanúgy játszható. Hálózatot nem használ, és a játék soha nem vár rá.
   A játék fő szkriptje ELŐTT kell betölteni, mert a játék a window.Kepesseg függvényeit hívja.
     Kepesseg.haptic(minta)   rövid rezgés telefonon (navigator.vibrate) és kontrolleren (vibrationActuator).
                              minta: 'tap' | 'hit' | 'hurt' | 'boom' | 'reward' | 'over', vagy ms, vagy ms-tömb.
                              Csak koppintás/gombnyomás után rezeg, van rá időkorlát, és ki lehet kapcsolni.
     Kepesseg.hapticsOn() / Kepesseg.setHaptics(be)   a közös rezgés-beállítás (localStorage: kepesseg:rezges).
       Ha az oldalon van .hap-btn gomb, az kapcsolja; csak ott látszik, ahol van mit rezegtetni.
     Kepesseg.wakeLock(be)    true: amíg tart a játék, a kijelző ne aludjon el; false: elengedi. Háttérbe tett
                              lap után magától újrakéri; 2 perc tétlenség után elengedi, a következő érintésre újra.
     Kepesseg.transition(fn)  fn a képernyőváltás DOM-módosítása; View Transitionnel fut, ha lehet, és nincs
                              csökkentett mozgás. Különben (vagy hibánál) azonnal fut.
     Kepesseg.quality(most)   képkockánként hívva a díszítő grafika szintje: 2 teljes, 1 kevesebb, 0 legkevesebb.
                              Csak látványra használd (részecske, háttér), játéklogikára soha.
     Tájolás: ha a <head>-ben <meta name="games:orientation" content="portrait"> (vagy landscape) áll, teljes
       képernyőn a böngésző abba a tájolásba zárol, kilépéskor felold. */
(function(){
  if(window.Kepesseg)return;
  var d=document,nav=navigator,noop=function(){};
  function now(){return (window.performance&&performance.now)?performance.now():Date.now()}
  function mq(q){try{return matchMedia(q).matches}catch(e){return false}}
  function calm(){return mq('(prefers-reduced-motion: reduce)')}
  function quiet(p){try{if(p&&typeof p.then==='function')p.then(noop,noop)}catch(e){}return p}

  /* ---------- rezgés ---------- */
  var KEY='kepesseg:rezges',PAT={tap:[10],hit:[20],hurt:[45],boom:[70],reward:[25,50,25],over:[40,60,40]};
  var POW={tap:.25,hit:.45,hurt:.8,boom:1,reward:.5,over:.7},RANK={tap:0,hit:1,reward:2,hurt:3,boom:3,over:4};
  var on=true,last=-1e9,busy=0,busyRank=-1;
  try{on=localStorage.getItem(KEY)!=='0'}catch(e){}
  function pattern(m){
    var p=typeof m==='string'?PAT[m]:typeof m==='number'?[m]:Array.isArray(m)?m:null,out=[],sum=0;
    if(!p)return null;
    for(var i=0;i<p.length&&i<7;i++){var v=+p[i];if(!(v>=0))return null;v=Math.min(200,Math.round(v));
      if(i%2===0){if(sum+v>400)v=400-sum;sum+=v}out.push(v)}
    return sum>0?out:null;
  }
  function pads(){
    var r=[];try{var g=nav.getGamepads?nav.getGamepads():[];for(var i=0;i<g.length;i++)
      if(g[i]&&g[i].connected!==false&&(g[i].vibrationActuator||(g[i].hapticActuators&&g[i].hapticActuators[0])))r.push(g[i])}catch(e){}
    return r;
  }
  function phone(){return typeof nav.vibrate==='function'&&mq('(pointer: coarse)')}
  function rumble(gp,ms,pow){
    try{
      var a=gp.vibrationActuator;
      if(a&&typeof a.playEffect==='function'){
        var t=(a.effects&&a.effects.indexOf&&a.effects.indexOf('dual-rumble')<0&&a.effects.indexOf('trigger-rumble')<0)?a.effects[0]:'dual-rumble';
        quiet(a.playEffect(t||'dual-rumble',{startDelay:0,duration:ms,strongMagnitude:pow,weakMagnitude:Math.min(1,pow+.2)}));
      }else if(gp.hapticActuators&&gp.hapticActuators[0]&&gp.hapticActuators[0].pulse){
        quiet(gp.hapticActuators[0].pulse(pow,ms));
      }
    }catch(e){}
  }
  function haptic(m){
    if(!on)return false;
    try{var ua=nav.userActivation;if(ua&&!ua.hasBeenActive)return false}catch(e){}
    var p=pattern(m);if(!p)return false;
    var t=now(),rk=typeof m==='string'?RANK[m]:1,total=0;
    if(t-last<70)return false;                       /* sűrű eseményeknél nem rezeg minden alkalommal */
    if(t<busy&&rk<=busyRank)return false;            /* gyengébb jelzés nem szakítja meg az erősebbet */
    for(var i=0;i<p.length;i++)total+=p[i];
    last=t;busy=t+total;busyRank=rk;
    var did=false,gs=pads(),pow=typeof m==='string'?POW[m]:.5;
    if(gs.length){
      var off=0;did=true;
      for(var j=0;j<p.length;j+=2){(function(ms,at){
        if(at===0)gs.forEach(function(g){rumble(g,ms,pow)});
        else setTimeout(function(){if(on)pads().forEach(function(g){rumble(g,ms,pow)})},at);
      })(p[j],off);off+=p[j]+(p[j+1]||0)}
    }
    if(phone()){try{did=nav.vibrate(p.length===1?p[0]:p)!==false||did}catch(e){}}
    return did;
  }
  function stop(){busy=0;try{if(typeof nav.vibrate==='function')nav.vibrate(0)}catch(e){}
    pads().forEach(function(g){try{var a=g.vibrationActuator;if(a&&a.reset)quiet(a.reset())}catch(e){}})}
  function setHaptics(v){on=!!v;try{localStorage.setItem(KEY,on?'1':'0')}catch(e){}if(!on)stop();label()}
  var btn=null;
  function label(){
    if(!btn)return;
    btn.textContent=on?'📳':'📴';btn.setAttribute('aria-pressed',on?'true':'false');
    btn.setAttribute('aria-label',on?'Rezgés: be':'Rezgés: ki');btn.title=on?'Rezgés: be':'Rezgés: ki';
    btn.style.opacity=on?'.75':'.45';
  }
  function showBtn(){
    if(!btn)return;
    btn.style.display=(phone()||pads().length)?'inline-flex':'none';
    /* ha nem fér ki egy sorba, a teljes képernyő gomb csak ikont mutat (ugyanaz a data-compact jelzés, amit a gomb szkriptje is ismer) */
    var fs=d.querySelector('.fs-btn'),first=btn.parentNode&&btn.parentNode.firstElementChild;
    if(fs&&first&&btn.style.display!=='none'&&btn.offsetTop>first.offsetTop+4){fs.dataset.compact='1';fs.textContent='⛶'}
  }
  function initBtn(){
    btn=d.querySelector('.hap-btn');if(!btn)return;
    btn.addEventListener('click',function(){setHaptics(!on);if(on)haptic('hit');btn.blur()});
    label();showBtn();
  }
  addEventListener('gamepadconnected',showBtn);addEventListener('gamepaddisconnected',showBtn);

  /* ---------- ébren tartás (Screen Wake Lock) ---------- */
  var IDLE=120000,want=false,lock=null,pending=false,lastUse=0,timer=0;
  function wlRequest(){
    if(!want||lock||pending||d.visibilityState!=='visible')return;
    var w=nav.wakeLock;if(!w||typeof w.request!=='function')return;
    pending=true;
    try{
      w.request('screen').then(function(s){
        pending=false;
        if(!want||!s){try{s&&quiet(s.release())}catch(e){}return}
        lock=s;try{s.addEventListener('release',function(){if(lock===s)lock=null})}catch(e){}
      },function(){pending=false});
    }catch(e){pending=false}
  }
  function wlRelease(){var s=lock;lock=null;if(s)try{quiet(s.release())}catch(e){}}
  function used(){lastUse=now();if(want&&!lock)wlRequest()}
  function tick(){if(lock&&now()-lastUse>IDLE)wlRelease()}
  function wakeLock(v){
    want=!!v;lastUse=now();
    if(want){wlRequest();if(!timer)timer=setInterval(tick,15000)}
    else{wlRelease();if(timer){clearInterval(timer);timer=0}}
  }
  d.addEventListener('visibilitychange',function(){if(d.visibilityState==='visible'){lastUse=now();wlRequest()}});
  ['pointerdown','keydown','touchstart'].forEach(function(ev){addEventListener(ev,used,{capture:true,passive:true})});
  addEventListener('pagehide',function(){wlRelease();oriUnlock()});

  /* ---------- képernyőváltás (View Transitions) ---------- */
  var vt=null,vtCss=false;
  function transition(fn){
    var done=false,run=function(){if(done)return;done=true;
      try{fn()}catch(e){setTimeout(function(){throw e},0)}};   /* a játék hibája ne vesszen el */
    if(typeof d.startViewTransition!=='function'||calm()||d.visibilityState!=='visible'){run();return}
    if(!vtCss){vtCss=true;try{var st=d.createElement('style');
      st.textContent='::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}';d.head.appendChild(st)}catch(e){}}
    try{
      var t=d.startViewTransition(run);vt=t;
      var clear=function(){if(vt===t)vt=null};
      quiet(t.ready);quiet(t.updateCallbackDone);
      if(t.finished&&t.finished.then)t.finished.then(clear,clear);
    }catch(e){run()}
    if(!done)setTimeout(run,250);                     /* ha a böngésző nem futtatná le, akkor is megtörténik */
  }

  /* ---------- tájolás (Screen Orientation) ---------- */
  var ori=null,oriLocked=false;
  function oriPref(){var m=d.querySelector('meta[name="games:orientation"]'),v=m&&m.getAttribute('content');
    return v==='portrait'||v==='landscape'?v:null}
  function oriLock(){
    var o=window.screen&&screen.orientation,p=ori||(ori=oriPref());
    if(!p||!o||typeof o.lock!=='function')return;
    try{var r=o.lock(p);oriLocked=true;if(r&&r.then)r.then(noop,function(){oriLocked=false})}catch(e){oriLocked=false}
  }
  function oriUnlock(){
    if(!oriLocked)return;oriLocked=false;
    try{var o=window.screen&&screen.orientation;if(o&&typeof o.unlock==='function')o.unlock()}catch(e){}
  }
  function fsChange(){if(d.fullscreenElement||d.webkitFullscreenElement)oriLock();else oriUnlock()}
  d.addEventListener('fullscreenchange',fsChange);d.addEventListener('webkitfullscreenchange',fsChange);

  /* ---------- adaptív grafikai minőség ---------- */
  var Q={lvl:2,t:0,acc:0,n:0,bad:0,good:0,changed:-1e9,ups:0,hot:false,watch:false,forced:null};
  function watchPressure(){
    Q.watch=true;
    try{if(typeof window.PressureObserver==='function'){
      var po=new window.PressureObserver(function(rs){var s=rs&&rs.length&&rs[rs.length-1].state;Q.hot=s==='serious'||s==='critical'});
      quiet(po.observe('cpu'));
    }}catch(e){}
  }
  function level(){var l=Q.forced!=null?Q.forced:Q.lvl;return calm()?Math.min(l,1):l}
  function quality(t){
    if(typeof t!=='number'||!isFinite(t))return level();
    if(!Q.watch)watchPressure();
    var dt=t-Q.t;Q.t=t;
    if(!(dt>0)||dt>250)return level();               /* szünet, háttér: nem mérjük */
    Q.acc+=dt;Q.n++;
    if(Q.acc>=1000){
      var avg=Q.acc/Q.n;Q.acc=0;Q.n=0;
      Q.bad=(avg>24||Q.hot)?Q.bad+1:0;Q.good=(avg<18&&!Q.hot)?Q.good+1:0;
      if(t-Q.changed>4000){
        if(Q.bad>=2&&Q.lvl>0){Q.lvl--;Q.changed=t;Q.bad=Q.good=0}
        else if(Q.good>=15&&Q.lvl<2&&Q.ups<2){Q.lvl++;Q.ups++;Q.changed=t;Q.good=0}   /* ritkán, és csak kétszer lép vissza */
      }
    }
    return level();
  }
  function setQuality(l){Q.forced=(l===0||l===1||l===2)?l:null}

  window.Kepesseg={haptic:haptic,hapticsOn:function(){return on},setHaptics:setHaptics,wakeLock:wakeLock,
    wakeLockHeld:function(){return !!lock},transition:transition,quality:quality,setQuality:setQuality};
  if(d.readyState==='loading')d.addEventListener('DOMContentLoaded',initBtn);else initBtn();
})();
/* @end kepesseg */
</script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const W=13,H=15;                     // a pálya W×H mező, kerettel
const EMPTY=0,WALL=1,SOFT=2;
const LEVEL_TIME=200;                // másodperc pályánként
const FUSE=2.4,FLAME_T=0.55,BURN_T=0.5;
const MAX={bombs:8,fire:8,speed:3};
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const ET={                           // szörnyfajták: sebesség (mező/mp), pont, ládán átmegy-e, mennyire üldöz

// ---------- hang (Web Audio) ----------
function ac(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();return actx}catch(e){return null}}
function beep(f,d=0.06,type='square',v=0.05,at=0,f2=0){
  if(!sound)return;const a=ac();if(!a)return;
  try{
    const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+at;
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+0.02);
  }catch(e){}
}
let noiseBuf=null;
function boom(v=0.25){
  if(!sound)return;const a=ac();if(!a)return;
  try{
    if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*0.6,a.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length)}
    const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;
    s.buffer=noiseBuf;f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(120,t+0.5);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
    s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+0.6);
  }catch(e){}
}

// ---------- pályagenerátor ----------
function rng(seed){let a=seed>>>0||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const idx=(x,y)=>y*W+x;
const SAFE=[[1,1],[2,1],[3,1],[1,2],[1,3]];   // a kezdőhely: innen mindig el lehet bújni a saját bomba elől
function enemyTypes(lv,R){
  const fixed=[['potty','potty','potty'],['potty','potty','potty','tuske'],['potty','potty','tuske','tuske'],
    ['potty','potty','tuske','tuske','kod'],['potty','tuske','tuske','kod','kod']];
  if(lv<=fixed.length)return fixed[lv-1].slice();
  const n=Math.min(4+Math.floor(lv/2),10),w=[['potty',Math.max(.4,2-lv/8)],['tuske',2],['kod',1+lv/10],['vadasz',(lv-4)/4]];
  const tot=w.reduce((s,x)=>s+x[1],0),out=[];
  for(let i=0;i<n;i++){let r=R()*tot;for(const [t,v] of w){r-=v;if(r<=0){out.push(t);break}}if(out.length<=i)out.push('tuske')}
  return out;
}
// Ellenőrzi a kész pályát: null, ha jó, különben a hiba oka.
function checkLevel(L){
  if(!L||L.map.length!==W*H)return 'rossz méret';
  for(let x=0;x<W;x++)for(let y=0;y<H;y++){
    const edge=x===0||y===0||x===W-1||y===H-1,pil=x%2===0&&y%2===0;
    if((edge||pil)!==(L.map[idx(x,y)]===WALL))return 'rossz fal: '+x+','+y;
  }
  for(const [x,y] of SAFE)if(L.map[idx(x,y)]!==EMPTY)return 'foglalt kezdőhely';
  if(L.map[L.exit]!==SOFT)return 'a kijárat nincs láda alatt';
  for(const [k] of L.items){if(L.map[k]!==SOFT)return 'a bónusz nincs láda alatt';if(k===L.exit)return 'bónusz a kijáraton'}
  // minden nem-fal mező összefügg (a ládák szétrobbanthatók)
  const seen=new Set([idx(1,1)]),st=[[1,1]];
  while(st.length){const [x,y]=st.pop();for(const [dx,dy] of DIRS){const k=idx(x+dx,y+dy);if(L.map[k]!==WALL&&!seen.has(k)){seen.add(k);st.push([x+dx,y+dy])}}}
  let open=0;for(let k=0;k<W*H;k++)if(L.map[k]!==WALL)open++;
  if(seen.size!==open)return 'nem összefüggő';
  if(!L.enemies.length)return 'nincs szörny';
  const used=new Set();
  for(const e of L.enemies){const k=idx(e.x,e.y);if(L.map[k]!==EMPTY||used.has(k))return 'rossz szörnyhely';used.add(k);if(e.x+e.y<8)return 'szörny túl közel'}
  return null;
}
function genLevel(lv,seed){
  const t0=Date.now();
  for(let tries=0;tries<60&&Date.now()-t0<200;tries++){
    const R=rng((seed*31+lv*7919+tries*104729)%2147483647);
    const map=new Uint8Array(W*H);
    for(let x=0;x<W;x++)for(let y=0;y<H;y++)if(x===0||y===0||x===W-1||y===H-1||(x%2===0&&y%2===0))map[idx(x,y)]=WALL;
    const safe=new Set(SAFE.map(([x,y])=>idx(x,y)));
    const dens=Math.min(.32+lv*.012,.5)-tries*.004;
    for(let x=1;x<W-1;x++)for(let y=1;y<H-1;y++){const k=idx(x,y);if(map[k]===EMPTY&&!safe.has(k)&&R()<dens)map[k]=SOFT}
    const softs=[],free=[];
    for(let x=1;x<W-1;x++)for(let y=1;y<H-1;y++){const k=idx(x,y);if(map[k]===SOFT)softs.push([x,y]);else if(map[k]===EMPTY&&x+y>=8)free.push([x,y])}
    const types=enemyTypes(lv,R);
    if(free.length<types.length+2)continue;
    const far=softs.filter(([x,y])=>x+y>=8);if(!far.length)continue;
    const [ex,ey]=far[Math.floor(R()*far.length)];const exit=idx(ex,ey);
    const items=new Map(),want=[ITEMS[(lv-1)%ITEMS.length]];if(lv%3===0)want.push(ITEMS[(lv+4)%ITEMS.length]);
    const pool=softs.filter(([x,y])=>idx(x,y)!==exit);
    for(const it of want){if(!pool.length)break;const j=Math.floor(R()*pool.length),[x,y]=pool.splice(j,1)[0];items.set(idx(x,y),it)}
    const enemies=[];
    for(const t of types){const j=Math.floor(R()*free.length),[x,y]=free.splice(j,1)[0];enemies.push({t,x,y})}
    const L={map,exit,items,enemies};
    if(!checkLevel(L))return L;
  }
  return null;
}

// ---------- játék ----------
function newGame(){
  G={lv:1,lives:3,score:0,lvScore:0,seed:1+Math.floor(Math.random()*2147483000),pw:{bombs:1,fire:1,speed:0,remote:false},phase:'menu'};
  startLevel();hideOv();
}
function resumeSave(d){G={...d,lvScore:d.score,phase:'menu'};startLevel();hideOv()}
function startLevel(){
  let L=genLevel(G.lv,G.seed);
  for(let i=0;!L&&i<5;i++){G.seed=(G.seed+1)%2147483646||1;L=genLevel(G.lv,G.seed)}   // tartalék: másik mag
  G.map=L.map;G.exit=L.exit;G.items=new Map();for(const [k,t] of L.items)G.items.set(k,{t,shown:false});
  G.exitShown=false;G.bombs=[];G.flames=new Map();G.burning=new Map();G.parts=[];G.floats=[];G.shake=0;
  G.enemies=L.enemies.map(e=>({t:e.t,x:e.x,y:e.y,fx:e.x,fy:e.y,tx:e.x,ty:e.y,dx:0,dy:0,dying:0,ph:Math.random()*6}));
  G.p={x:1,y:1,tx:1,ty:1,face:[0,1],walk:0,dying:0};stepQ.length=0;
  G.time=LEVEL_TIME;G.phase='intro';G.phaseT=1.6;G.lvScore=G.score;
  held.length=0;touchDir=null;
  save();hud();
}
function world(){return WORLDS[Math.floor((G?G.lv-1:0)/4)%WORLDS.length]}
function bombAt(x,y){return G.bombs.find(b=>b.x===x&&b.y===y)}
function solidFor(x,y){if(x<0||y<0||x>=W||y>=H)return true;const m=G.map[idx(x,y)];return m!==EMPTY||G.burning.has(idx(x,y))}
function playerPass(x,y){if(solidFor(x,y))return false;const b=bombAt(x,y);return !b||b.pass}
function enemyPass(e,x,y){
  if(x<1||y<1||x>=W-1||y>=H-1)return false;const k=idx(x,y),m=G.map[k];
  if(m===WALL)return false;if((m===SOFT||G.burning.has(k))&&!ET[e.t].ghost)return false;
  return !bombAt(x,y);
}
function speedP(){return 3.1+G.pw.speed*0.55}
// mezőről mezőre lépés: egy nyomás pontosan egy mezőt lép, nyomva tartva mezőnként továbbmegy
function stepPlayer(dt){
  const p=G.p;let dist=Math.min(.45,speedP()*dt);
  for(let guard=0;guard<3;guard++){
    const dx=p.tx-p.x,dy=p.ty-p.y,l=Math.abs(dx)+Math.abs(dy);
    if(l>1e-6){
      const m=Math.min(dist,l);p.x+=Math.sign(dx)*m;p.y+=Math.sign(dy)*m;dist-=m;p.walk+=m*6;
      if(Math.abs(p.tx-p.x)+Math.abs(p.ty-p.y)>1e-6)return;
      p.x=p.tx;p.y=p.ty;
    }
    // mezőn áll: jön a következő lépés (előbb a lenyomott, utána a nyomva tartott irány)
    const d=stepQ.length?stepQ.shift():curDir();
    if(!d)return;
    p.face=d;
    if(!playerPass(p.x+d[0],p.y+d[1]))return;
    p.tx=p.x+d[0];p.ty=p.y+d[1];
    if(dist<=0)return;
  }
}
function placeBomb(){
  if(!G||G.phase!=='play')return false;
  const x=Math.round(G.p.x),y=Math.round(G.p.y);
  if(bombAt(x,y)||G.bombs.length>=G.pw.bombs||G.map[idx(x,y)]!==EMPTY)return false;
  G.bombs.push({x,y,t:G.pw.remote?Infinity:FUSE,age:0,range:G.pw.fire,pass:true});
  beep(220,0.07,'square',0.05);return true;
}
function detonate(){
  if(!G||G.phase!=='play'||!G.pw.remote)return;
  const b=G.bombs.find(b=>b.t===Infinity);if(b)explode(b);
}
function addFlame(x,y,mask){const k=idx(x,y),f=G.flames.get(k);if(f){f.mask|=mask;f.t=FLAME_T}else G.flames.set(k,{x,y,mask,t:FLAME_T})}
// maszk: 1 jobbra, 2 balra, 4 le, 8 fel
const BIT=[1,2,4,8],BACK=[2,1,8,4];
function explode(first){
  const q=[first];let n=0;
  while(q.length){
    const b=q.shift();const bi=G.bombs.indexOf(b);if(bi<0)continue;G.bombs.splice(bi,1);n++;
    let cm=0;
    DIRS.forEach(([dx,dy],di)=>{
      for(let i=1;i<=b.range;i++){
        const x=b.x+dx*i,y=b.y+dy*i,k=idx(x,y);
        if(G.map[k]===WALL||G.burning.has(k))break;
        if(G.map[k]===SOFT){G.map[k]=EMPTY;G.burning.set(k,BURN_T);debris(x,y);break}
        if(i===1)cm|=BIT[di];
        addFlame(x,y,BACK[di]|(i<b.range?BIT[di]:0));
        const ob=bombAt(x,y);if(ob){q.push(ob);break}
      }
    });
    addFlame(b.x,b.y,cm|16);
  }
  boom(Math.min(.35,.2+n*.05));Kepesseg.haptic('boom');
  if(!reduced())G.shake=Math.max(G.shake,0.18);
}
function reduced(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}}
function debris(x,y){
  const th=world(),n=reduced()?2:6;
  for(let i=0;i<n;i++)G.parts.push({x:x+.5,y:y+.5,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4-1,t:0.6,life:0.6,c:i%2?th.soft:th.softD,s:.14});
}
function puff(x,y){
  const n=reduced()?3:8;
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2;G.parts.push({x:x+.5,y:y+.5,vx:Math.cos(a)*1.6,vy:Math.sin(a)*1.6,t:0.7,life:0.7,c:'#d9dde3',s:.2,smoke:true})}
}
function pickup(k){
  const it=G.items.get(k);if(!it||!it.shown)return;
  G.items.delete(k);const pw=G.pw;
  if(it.t==='fire')pw.fire=Math.min(MAX.fire,pw.fire+1);
  else if(it.t==='bomb')pw.bombs=Math.min(MAX.bombs,pw.bombs+1);
  else if(it.t==='speed')pw.speed=Math.min(MAX.speed,pw.speed+1);
  else if(it.t==='remote')pw.remote=true;
  else if(it.t==='life')G.lives=Math.min(9,G.lives+1);
  G.score+=50;G.floats.push({x:k%W+.5,y:Math.floor(k/W),t:1.2,txt:IT_NAME[it.t]});
  beep(660,0.07,'square',0.05);beep(990,0.1,'square',0.05,0.07);Kepesseg.haptic('reward');hud();
}
function die(){
  if(G.phase!=='play')return;
  G.phase='dying';G.phaseT=1.5;G.p.dying=1.5;G.pw.remote=false;
  beep(440,0.5,'sawtooth',0.06,0,110);Kepesseg.haptic('hurt');hud();
}
function afterDeath(){
  G.lives--;G.score=G.lvScore;           // a pálya újraindul, az ott szerzett pont elvész
  if(G.lives<=0)return over();
  startLevel();
}
function clearLevel(){
  G.phase='clear';G.phaseT=2.2;G.bonus=Math.ceil(G.time)*10;G.score+=G.bonus;
  [523,659,784,1047].forEach((f,i)=>beep(f,0.12,'square',0.05,i*0.1));Kepesseg.haptic('reward');hud();
}
function over(){
  G.phase='over';lsDel('bombasz-save');Kepesseg.haptic('over');
  G.rec=G.score>best.score;
  if(G.rec){best={score:G.score,lv:G.lv};lsSet('bombasz-best',JSON.stringify(best))}
  hud();showOver();
}
function curDir(){
  if(touchDir)return touchDir;
  return held.length?held[held.length-1]:null;
}
function update(dt){
  if(!G)return;
  const ph=G.phase;
  if(ph==='menu'||ph==='pause'||ph==='over')return;
  G.shake=Math.max(0,G.shake-dt);
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.smoke)p.vy+=6*dt;p.t-=dt}
  G.parts=G.parts.filter(p=>p.t>0);
  for(const f of G.floats)f.t-=dt;G.floats=G.floats.filter(f=>f.t>0);
  if(ph==='intro'){if((G.phaseT-=dt)<=0)G.phase='play';return}
  if(ph==='clear'){if((G.phaseT-=dt)<=0){G.lv++;G.lvScore=G.score;startLevel()}return}
  if(ph==='dying'){G.p.dying-=dt;stepWorld(dt,false);if((G.phaseT-=dt)<=0)afterDeath();return}
  // play
  G.time-=dt;if(G.time<=0){G.time=0;die();return}
  const p=G.p;
  stepPlayer(dt);
  for(const b of G.bombs)if(b.pass&&(Math.abs(p.x-b.x)>=0.99||Math.abs(p.y-b.y)>=0.99))b.pass=false;
  const pk=idx(Math.round(p.x),Math.round(p.y));
  pickup(pk);
  stepWorld(dt,true);
  if(G.phase!=='play')return;
  if(G.flames.has(pk))return die();
  for(const e of G.enemies)if(!e.dying&&Math.abs(e.x-p.x)<0.68&&Math.abs(e.y-p.y)<0.68)return die();
  if(G.exitShown&&pk===G.exit&&!G.enemies.length&&Math.abs(p.x-Math.round(p.x))<0.3&&Math.abs(p.y-Math.round(p.y))<0.3)clearLevel();
  hudTime();
}
function stepWorld(dt,live){
  // bombák
  for(const b of G.bombs.slice()){b.age+=dt;if(b.t!==Infinity&&(b.t-=dt)<=0&&G.bombs.includes(b))explode(b)}
  // lángok és égő ládák
  for(const [k,f] of G.flames){if((f.t-=dt)<=0)G.flames.delete(k)}
  for(const [k,t] of G.burning){
    const nt=t-dt;if(nt>0){G.burning.set(k,nt);continue}
    G.burning.delete(k);
    const it=G.items.get(k);if(it)it.shown=true;
    if(k===G.exit)G.exitShown=true;
  }
  // szörnyek
  for(const e of G.enemies){
    e.ph+=dt*6;
    if(e.dying){e.dying-=dt;continue}
    if(G.flames.has(idx(Math.round(e.x),Math.round(e.y)))){
      e.dying=0.8;const pts=ET[e.t].pts;G.score+=pts;G.floats.push({x:e.x+.5,y:e.y,t:1,txt:'+'+pts});puff(e.x,e.y);
      beep(880,0.15,'triangle',0.06,0,220);hud();continue;
    }
    moveEnemy(e,dt);
  }
  const before=G.enemies.length;
  G.enemies=G.enemies.filter(e=>!e.dying||e.dying>0);
  if(live&&before&&!G.enemies.length&&G.exitShown){beep(784,0.1,'square',0.05);beep(1175,0.15,'square',0.05,0.1)}
}
function moveEnemy(e,dt){
  if(bombAt(e.tx,e.ty)&&Math.abs(e.tx-e.x)+Math.abs(e.ty-e.y)>0.5){const ox=e.tx,oy=e.ty;e.tx=e.fx;e.ty=e.fy;e.fx=ox;e.fy=oy}
  let dist=ET[e.t].speed*dt;
  while(dist>0){
    const ddx=e.tx-e.x,ddy=e.ty-e.y,l=Math.abs(ddx)+Math.abs(ddy);
    if(l<1e-6){e.x=e.tx;e.y=e.ty;if(!chooseDir(e))return;continue}
    const m=Math.min(dist,l);e.x+=Math.sign(ddx)*Math.min(m,Math.abs(ddx));e.y+=Math.sign(ddy)*Math.min(m,Math.abs(ddy));dist-=m;
  }
}
function chooseDir(e){
  const x=e.tx,y=e.ty,opts=DIRS.filter(([dx,dy])=>enemyPass(e,x+dx,y+dy));
  if(!opts.length){e.dx=e.dy=0;return false}
  let pick=null;const p=G.p;
  if(Math.random()<ET[e.t].smart&&Math.abs(p.x-x)+Math.abs(p.y-y)<8){
    let bd=1e9;for(const o of opts){const dd=Math.abs(p.x-(x+o[0]))+Math.abs(p.y-(y+o[1]));if(dd<bd){bd=dd;pick=o}}
  }
  if(!pick){
    const same=opts.find(o=>o[0]===e.dx&&o[1]===e.dy);
    if(same&&Math.random()<0.8)pick=same;
    else{const nb=opts.filter(o=>!(o[0]===-e.dx&&o[1]===-e.dy));const from=nb.length?nb:opts;pick=from[Math.floor(Math.random()*from.length)]}
  }
  e.dx=pick[0];e.dy=pick[1];e.fx=x;e.fy=y;e.tx=x+pick[0];e.ty=y+pick[1];return true;
}
function pause(){if(!G||(G.phase!=='play'&&G.phase!=='intro'))return;G.prev=G.phase;G.phase='pause';held.length=0;stepQ.length=0;touchDir=null;showPause()}
function resume(){if(!G||G.phase!=='pause')return;hideOv();G.phase=G.prev||'play';last=0}

  T=Math.max(8,Math.floor(Math.min(r.width/W,r.height/H,40)));dpr=window.devicePixelRatio||1;
  const w=T*W,h=T*H;
  cv.style.width=w+'px';cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);

}
new ResizeObserver(fit).observe($('stage'));

function rr(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill()}

  ctx.fillStyle=th.wallD;ctx.globalAlpha=.35;ctx.fillRect(px+T*.3,py+T*.3,T*.4,T*.4);ctx.globalAlpha=1;

function drawSoft(x,y,th){

  ctx.fillStyle='#8a7550';ctx.fillRect(cx+T*.14,cy-T*.42,T*.1,T*.16);

function drawExit(){

function drawEnemy(e){
  const cx=(e.x+.5)*T,cy=(e.y+.5)*T,bob=Math.sin(e.ph)*T*.04;
  ctx.save();ctx.translate(cx,cy+bob);
  if(e.dying){const k=Math.max(0,e.dying/0.8);ctx.globalAlpha=k;ctx.scale(0.4+0.6*k,0.4+0.6*k)}

  if(e.t==='potty'){circ(0,0,T*.36,'#ff7eb6');circ(-T*.12,-T*.14,T*.08,'#ffc2dd');eyes('#5a1036')}

    ctx.strokeStyle='#250a5a';ctx.lineWidth=Math.max(1,T*.04);ctx.beginPath();ctx.moveTo(-T*.2,-T*.17);ctx.lineTo(-T*.05,-T*.11);ctx.moveTo(T*.2,-T*.17);ctx.lineTo(T*.05,-T*.11);ctx.stroke()}

    for(let i=0;i<=4;i++){const xx=T*.32-i*T*.16;ctx.lineTo(xx,T*.3+(i%2?-T*.07:0)+Math.sin(e.ph+i)*T*.02)}ctx.closePath();ctx.fill();eyes('#2b3a8a',T*.07,T*.045)}

let cssCache={};
function css(n){return cssCache[n]||(cssCache[n]=getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'system-ui')}
function draw(){
  if(!size)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const th=world();
  if(G&&G.shake>0&&!reduced()){const a=Math.max(1,T*.08);ctx.translate((Math.random()-.5)*2*a,(Math.random()-.5)*2*a)}
  for(let x=0;x<W;x++)for(let y=0;y<H;y++){
    const m=G&&G.map?G.map[idx(x,y)]:((x===0||y===0||x===W-1||y===H-1||(x%2===0&&y%2===0))?WALL:EMPTY);
    if(m===WALL){drawWall(x,y,th);continue}
    ctx.fillStyle=(x+y)%2?th.f2:th.f1;ctx.fillRect(x*T,y*T,T,T);
    if(m===EMPTY&&G&&G.map&&G.map[idx(x,y-1)]!==EMPTY){ctx.fillStyle='rgba(0,0,0,.14)';ctx.fillRect(x*T,y*T,T,T*.16)}
    if(m===SOFT)drawSoft(x,y,th);
  }

  if(G.exitShown)drawExit();
  for(const [k,it] of G.items)if(it.shown)drawItem(k,it);
  for(const [k,t] of G.burning)drawBurn(k%W,Math.floor(k/W),t/BURN_T);
  for(const b of G.bombs)drawBomb(b);
  for(const e of G.enemies)drawEnemy(e);

  for(const f of G.flames.values())drawFlame(f);
  for(const p of G.parts){ctx.globalAlpha=Math.max(0,p.t/p.life);const s=p.s*T*(p.smoke?1+(1-p.t/p.life):1);
    if(p.smoke)circ(p.x*T,p.y*T,s,p.c);else{ctx.fillStyle=p.c;ctx.fillRect(p.x*T-s/2,p.y*T-s/2,s,s)}}
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`700 ${Math.max(11,T*.5)}px ${css('--ui')}`;
  for(const f of G.floats){ctx.globalAlpha=Math.min(1,f.t*2);const yy=(f.y+.3-(1.2-f.t)*0.9)*T;ctx.fillStyle='#000';ctx.fillText(f.txt,f.x*T+1,yy+1);ctx.fillStyle='#fff';ctx.fillText(f.txt,f.x*T,yy)}

}
function loop(t){

const held=[],stepQ=[];let touchDir=null;

const KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
addEventListener('keydown',e=>{
  if(!ov.hidden){
    if((e.key==='Escape'||e.key==='p'||e.key==='P')&&G&&G.phase==='pause'){e.preventDefault();resume()}
    return;
  }
  const m=KEYS[e.key];
  if(m){e.preventDefault();const i=held.findIndex(h=>h[0]===m[0]&&h[1]===m[1]);if(i>=0)held.splice(i,1);held.push(m);if(!e.repeat)press(m);return}
  if(e.repeat)return;
  if(e.key===' '||e.code==='Space'||e.key==='j'||e.key==='J'||e.key==='Enter'){e.preventDefault();placeBomb();return}
  if(e.key==='k'||e.key==='K'||e.key==='l'||e.key==='L'){e.preventDefault();detonate();return}
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){e.preventDefault();pause()}
});
addEventListener('keyup',e=>{const m=KEYS[e.key];if(!m)return;const i=held.findIndex(h=>h[0]===m[0]&&h[1]===m[1]);if(i>=0)held.splice(i,1)});
addEventListener('blur',()=>{held.length=0;stepQ.length=0;touchDir=null;showDpad()});
const dpad=$('dpad');let dpadId=null;
function dpadDir(e){
  const r=dpad.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);

}
function showDpad(){const d=touchDir;dpad.querySelectorAll('span').forEach(s=>{const c=s.className.replace(' on','');
  const on=d&&((c==='u'&&d[1]<0)||(c==='d'&&d[1]>0)||(c==='l'&&d[0]<0)||(c==='r'&&d[0]>0));s.className=c+(on?' on':'')})}

dpad.addEventListener('pointerup',dpadEnd);dpad.addEventListener('pointercancel',dpadEnd);

<script>
/* Teljes képernyő gomb: csak ott látszik, ahol a böngésző támogatja (iPhone-on nem). */
(function(){
  var d=document, el=d.documentElement, b=d.querySelector('.fs-btn');
  if(!b) return;
  var can=d.fullscreenEnabled||d.webkitFullscreenEnabled;
  if(!can||!(el.requestFullscreen||el.webkitRequestFullscreen)){ b.remove(); return; }
  function on(){ return !!(d.fullscreenElement||d.webkitFullscreenElement); }
  function label(){ b.textContent=b.dataset.compact?'⛶':(on()?'⛶ Kilépés':'⛶ Teljes képernyő'); b.setAttribute('aria-label', on()?'Kilépés a teljes képernyőből':'Teljes képernyő'); }
  b.addEventListener('click', function(){
    try{
      if(on()){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
      else{ var p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el); if(p&&p.catch) p.catch(function(){}); }
    }catch(e){}
    b.blur();
  });
  d.addEventListener('fullscreenchange', label);
  d.addEventListener('webkitfullscreenchange', label);
  label();
})();
</script>
<script>
/* @shared fekvo-jelzes */
/* Fekvő telefonon „Fordítsd el a telefont” jelzés. A játék álló képernyőre készült, ezért amíg a telefon
   fekszik, a jelzés eltakarja, és a játék a saját szünet-logikájával megáll (ugyanaz fut le, mint amikor
   a lap háttérbe kerül). Gépen, széles ablakban nem jelenik meg (csak érintőképernyőn, alacsony ablakban). */
(function(){
  var mq;
  try{ mq=matchMedia('(orientation: landscape) and (max-height: 500px) and (pointer: coarse)'); }catch(e){ return; }
  var st=document.createElement('style');
  st.textContent='.rotate-hint{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;padding:16px;'+
    'background:rgba(5,8,14,.95);color:#fff;font:700 20px/1.3 system-ui,sans-serif;text-align:center}'+
    '.rotate-hint[hidden]{display:none!important}.rotate-hint p{margin:8px 0}'+
    '.rotate-hint .sub{font-weight:400;font-size:16px;opacity:.85}.rotate-hint svg{width:56px;height:56px}';
  var el=document.createElement('div');
  el.className='rotate-hint';el.setAttribute('role','alert');el.hidden=true;
  el.innerHTML='<div><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2" '+
    'fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18.5" r="1" fill="currentColor"/></svg>'+
    '<p>Fordítsd el a telefont!</p><p class="sub">Ez a játék álló képernyőre készült. Addig szünetel.</p></div>';
  function pauseGame(){
    try{
      Object.defineProperty(document,'hidden',{configurable:true,get:function(){return true;}});
      document.dispatchEvent(new Event('visibilitychange'));
    }catch(e){}
    try{ delete document.hidden; }catch(e){}
  }
  function update(e){
    if(mq.matches){ if(el.hidden){ el.hidden=false; if(e) pauseGame(); } }
    else el.hidden=true;
  }
  document.head.appendChild(st);
  document.body.appendChild(el);
  if(mq.addEventListener) mq.addEventListener('change',update); else if(mq.addListener) mq.addListener(update);
  update();
})();
/* @end fekvo-jelzes */
</script>
<script>
/* @shared gamepad */
/* Kontroller (gamepad) a böngésző Gamepad API-jával. A játék kódjához nem nyúl: a kontrollert billentyűkké
   fordítja, amelyeket a játék már ismer. Ha egy ablak (menü, szünet, vége) látszik, a kar a gombok között lép,
   az A gomb megnyomja a kijelöltet. Kiosztás (szabványos kontroller):
     bal kar / d-pad → nyilak, A → szóköz, X → J, Y → K, B → L, RB → L, Start → Escape (szünet), Select → Enter.
   iPhone-on a böngésző nem támogatja, ott ez a rész nem csinál semmit. */
(function(){
  if(!navigator.getGamepads)return;
  var DIRS=[['ArrowUp',12],['ArrowDown',13],['ArrowLeft',14],['ArrowRight',15]];
  var BTN=[[0,' ','Space'],[2,'j','KeyJ'],[3,'k','KeyK'],[1,'l','KeyL'],[5,'l','KeyL'],[9,'Escape','Escape'],[8,'Enter','Enter']];
  var held={},raf=0,shown=false,lastNav=0;
  function key(type,k,code){
    var e=new KeyboardEvent(type,{key:k,code:code,bubbles:true,cancelable:true});
    (document.activeElement&&document.activeElement!==document.body?document.activeElement:document).dispatchEvent(e);
  }
  function set(name,on,k,code){if(!!held[name]===on)return;held[name]=on;key(on?'keydown':'keyup',k,code||k)}
  function visible(el){if(!el||el.hidden)return false;var r=el.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(el).visibility!=='hidden'}
  function dialog(){
    var c=document.querySelectorAll('#ov,#over,#pick,#overlay,.modal,dialog[open],.rotate-hint');
    for(var i=0;i<c.length;i++)if(visible(c[i])&&!c[i].classList.contains('rotate-hint'))return c[i];
    return null;
  }
  function buttons(d){return Array.prototype.filter.call(d.querySelectorAll('button:not(:disabled),a[href]'),visible)}
  function nav(d,dir){
    var b=buttons(d);if(!b.length)return;
    var i=b.indexOf(document.activeElement);
    if(i<0){var hot=d.querySelector('.hot:not(:disabled)');(hot&&visible(hot)?hot:b[0]).focus();return}
    var cur=b[i].getBoundingClientRect(),best=null,bd=1e9;
    b.forEach(function(x){if(x===b[i])return;var r=x.getBoundingClientRect(),dx=r.left+r.width/2-(cur.left+cur.width/2),dy=r.top+r.height/2-(cur.top+cur.height/2);
      var ok=dir==='ArrowUp'?dy<-4:dir==='ArrowDown'?dy>4:dir==='ArrowLeft'?dx<-4:dx>4;if(!ok)return;
      var dist=Math.abs(dx)+Math.abs(dy)*(dir==='ArrowLeft'||dir==='ArrowRight'?3:1)+Math.abs(dx)*(dir==='ArrowUp'||dir==='ArrowDown'?2:0);if(dist<bd){bd=dist;best=x}});
    (best||b[(i+(dir==='ArrowUp'||dir==='ArrowLeft'?b.length-1:1))%b.length]).focus();
  }
  function note(){
    if(shown)return;shown=true;
    var t=document.createElement('div');t.setAttribute('role','status');
    t.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:3500;background:#0b0c10;color:#fff;border:1px solid #444;border-radius:10px;padding:10px 16px;font:700 15px system-ui,sans-serif;pointer-events:none';
    t.textContent='Kontroller csatlakoztatva';document.body.appendChild(t);setTimeout(function(){t.remove()},2500);
  }
  function poll(){
    raf=setTimeout(poll,16); /* időzítő, nem képkocka: álló képnél is figyeli a kontrollert */
    var pads=navigator.getGamepads?navigator.getGamepads():[],gp=null;
    for(var i=0;i<pads.length;i++)if(pads[i]&&pads[i].connected){gp=pads[i];break}
    if(!gp){for(var n in held)if(held[n])held[n]=false;return}
    note();
    var pr=function(i){var b=gp.buttons[i];return !!b&&(b.pressed||b.value>.5)};
    var ax=gp.axes[0]||0,ay=gp.axes[1]||0,dz=.25;
    var dirOn={ArrowUp:ay<-dz,ArrowDown:ay>dz,ArrowLeft:ax<-dz,ArrowRight:ax>dz};
    DIRS.forEach(function(d){if(pr(d[1]))dirOn[d[0]]=true});
    var d=dialog();
    if(d){
      DIRS.forEach(function(x){if(held[x[0]])set(x[0],false,x[0])});
      BTN.forEach(function(b){if(held['b'+b[0]])set('b'+b[0],false,b[1],b[2])});
      var now=performance.now(),any=null;DIRS.forEach(function(x){if(dirOn[x[0]])any=x[0]});
      if(any&&now-lastNav>220){lastNav=now;nav(d,any)}else if(!any)lastNav=0;
      var a=pr(0);if(a&&!held.navA){var f=document.activeElement;if(f&&d.contains(f)&&f.click)f.click();else{var b=buttons(d),hot=d.querySelector('.hot:not(:disabled)');(hot&&visible(hot)?hot:b[0])&&(hot&&visible(hot)?hot:b[0]).click()}}
      held.navA=a;
      if(pr(9)&&!held.Escape)set('Escape',true,'Escape');else if(!pr(9))set('Escape',false,'Escape');
      return;
    }
    held.navA=pr(0);
    DIRS.forEach(function(x){set(x[0],dirOn[x[0]],x[0])});
    BTN.forEach(function(b){set('b'+b[0],pr(b[0]),b[1],b[2])});
  }
  addEventListener('gamepadconnected',function(){if(!raf)poll()});
  addEventListener('gamepaddisconnected',function(){var p=navigator.getGamepads(),any=false;for(var i=0;i<p.length;i++)if(p[i])any=true;if(!any){clearTimeout(raf);raf=0;for(var n in held)if(held[n]&&n.indexOf('Arrow')===0)set(n,false,n)}});
  try{var p0=navigator.getGamepads();for(var i=0;i<p0.length;i++)if(p0[i]){poll();break}}catch(e){}
})();
/* @end gamepad */
</script>
