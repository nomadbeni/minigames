<style>
/* Elrendezés: egyképernyős álló arcade — vissza sáv, pontsor, játéktér, érintős gombok, ablakok */
:root{
  --bg:#05070f; --panel:#0e1424; --line:#24304d; --fg:#eaf0ff; --muted:#93a0bf;
  --accent:#ffb347; --cyan:#5ee6ff; --danger:#ff5d73;
  --display:"Bungee","Arial Black",system-ui,sans-serif;
  --ui:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto}
.hud{display:flex;align-items:center;gap:12px}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
#score{font-family:var(--display);color:var(--accent);font-size:21px}
#lives{color:var(--danger);letter-spacing:1px}
.sp{flex:1}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;padding:0;flex:none}
.icon svg{width:20px;height:20px;fill:currentColor}
.icon:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;touch-action:none}
canvas{position:absolute;left:0;top:0;display:block;touch-action:none;border-radius:12px;box-shadow:0 0 0 2px var(--line)}
.pad{display:none;justify-content:space-between;gap:8px;flex:none}
.pad .grp{display:flex;gap:8px}
.pad button{width:72px;height:60px;font-size:24px;font-weight:700;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;touch-action:none;padding:0;font-family:var(--ui)}
.pad button.on{background:var(--line)}
.pad button.fire{background:#3a1f10;border-color:#7a4220;color:var(--accent)}
.pad button.fire.on{background:#7a4220}
.hint{margin:0;text-align:center;font-size:13px;color:var(--muted);flex:none}
@media (pointer:coarse),(hover:none){.pad{display:flex}.hint.desk{display:none}}
#ov{position:fixed;left:0;top:0;right:0;bottom:0;display:grid;place-items:center;background:rgba(3,5,12,.82);z-index:5;padding-inline:16px}
.card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 22px;background:var(--panel);border:1px solid var(--line);border-radius:16px;text-align:center;width:min(360px,100%);max-height:calc(100% - 32px);overflow:auto}
.card h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0;color:var(--accent);line-height:1.1}
.card h2.bad{color:var(--danger)}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.card b{color:var(--fg)}
.big{font-family:var(--display);font-size:48px;line-height:1;color:var(--fg)}
.rec{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--accent);color:#2a1500;font-weight:700;font-size:14px}
.btns{display:flex;flex-direction:column;gap:8px;width:100%}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;text-align:left;font-size:14px;color:var(--muted);width:100%}
.legend i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:700;font-size:13px;color:#06101c}
button.b{font-family:var(--ui);font-weight:700;font-size:16px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;min-height:44px}

<script>
/* @shared kepesseg */
/* Modern böngészőképességek egy helyen. Mind opcionális: ha a böngésző nem tudja, vagy hibát ad, csendben nem
   történik semmi, a játék ugyanúgy játszható. Hálózatot nem használ, és a játék soha nem vár rá.
   A játék fő szkriptje ELŐTT kell betölteni, mert a játék a window.Kepesseg függvényeit hívja.
     Kepesseg.haptic(minta)   rövid rezgés telefonon (navigator.vibrate) és kontrolleren (vibrationActuator).
                              minta: 'tap' | 'hit' | 'hurt' | 'boom' | 'reward' | 'over', vagy ms, vagy ms-tömb.
                              Csak koppintás/gombnyomás után rezeg, van rá időkorlát, és ki lehet kapcsolni.
     Kepesseg.hapticsOn() / Kepesseg.setHaptics(be)   a közös rezgés-beállítás (localStorage: kepesseg:rezges).
       Ha az oldalon van .hap-btn gomb, az kapcsolja; csak ott látszik, ahol van mit rezegtetni.
     Kepesseg.wakeLock(be)    true: amíg tart a játék, a kijelző ne aludjon el; false: elengedi. Háttérbe tett
                              lap után magától újrakéri; 2 perc tétlenség után elengedi, a következő érintésre újra.
     Kepesseg.transition(fn)  fn a képernyőváltás DOM-módosítása; View Transitionnel fut, ha lehet, és nincs
                              csökkentett mozgás. Különben (vagy hibánál) azonnal fut. Az átmenet alatt (0,15 mp)
                              a böngésző nem ad át érintést, ezért csak ablak MEGJELENÉSÉRE használd; a játékba
                              visszavezető bezárás legyen azonnali, és hívja a Kepesseg.endTransition()-t.
     Kepesseg.quality(most)   képkockánként hívva a díszítő grafika szintje: 2 teljes, 1 kevesebb, 0 legkevesebb.
                              Csak látványra használd (részecske, háttér), játéklogikára soha.
     Tájolás: ha a <head>-ben <meta name="games:orientation" content="portrait"> (vagy landscape) áll, teljes
       képernyőn a böngésző abba a tájolásba zárol, kilépéskor felold. */
(function(){
  if(window.Kepesseg)return;
  var d=document,nav=navigator,noop=function(){};
  function now(){return (window.performance&&performance.now)?performance.now():Date.now()}
  function mq(q){try{return matchMedia(q).matches}catch(e){return false}}
  function calm(){return mq('(prefers-reduced-motion: reduce)')}
  function quiet(p){try{if(p&&typeof p.then==='function')p.then(noop,noop)}catch(e){}return p}

  /* ---------- rezgés ---------- */
  var KEY='kepesseg:rezges',PAT={tap:[10],hit:[20],hurt:[45],boom:[70],reward:[25,50,25],over:[40,60,40]};
  var POW={tap:.25,hit:.45,hurt:.8,boom:1,reward:.5,over:.7},RANK={tap:0,hit:1,reward:2,hurt:3,boom:3,over:4};
  var on=true,last=-1e9,busy=0,busyRank=-1;
  try{on=localStorage.getItem(KEY)!=='0'}catch(e){}
  function pattern(m){
    var p=typeof m==='string'?PAT[m]:typeof m==='number'?[m]:Array.isArray(m)?m:null,out=[],sum=0;
    if(!p)return null;
    for(var i=0;i<p.length&&i<7;i++){var v=+p[i];if(!(v>=0))return null;v=Math.min(200,Math.round(v));
      if(i%2===0){if(sum+v>400)v=400-sum;sum+=v}out.push(v)}
    return sum>0?out:null;
  }
  function pads(){
    var r=[];try{var g=nav.getGamepads?nav.getGamepads():[];for(var i=0;i<g.length;i++)
      if(g[i]&&g[i].connected!==false&&(g[i].vibrationActuator||(g[i].hapticActuators&&g[i].hapticActuators[0])))r.push(g[i])}catch(e){}
    return r;
  }
  function phone(){return typeof nav.vibrate==='function'&&mq('(pointer: coarse)')}
  function rumble(gp,ms,pow){
    try{
      var a=gp.vibrationActuator;
      if(a&&typeof a.playEffect==='function'){
        var t=(a.effects&&a.effects.indexOf&&a.effects.indexOf('dual-rumble')<0&&a.effects.indexOf('trigger-rumble')<0)?a.effects[0]:'dual-rumble';
        quiet(a.playEffect(t||'dual-rumble',{startDelay:0,duration:ms,strongMagnitude:pow,weakMagnitude:Math.min(1,pow+.2)}));
      }else if(gp.hapticActuators&&gp.hapticActuators[0]&&gp.hapticActuators[0].pulse){
        quiet(gp.hapticActuators[0].pulse(pow,ms));
      }
    }catch(e){}
  }
  function haptic(m){
    if(!on)return false;
    try{var ua=nav.userActivation;if(ua&&!ua.hasBeenActive)return false}catch(e){}
    var p=pattern(m);if(!p)return false;
    var t=now(),rk=typeof m==='string'?RANK[m]:1,total=0;
    if(t-last<70)return false;                       /* sűrű eseményeknél nem rezeg minden alkalommal */
    if(t<busy&&rk<=busyRank)return false;            /* gyengébb jelzés nem szakítja meg az erősebbet */
    for(var i=0;i<p.length;i++)total+=p[i];
    last=t;busy=t+total;busyRank=rk;
    var did=false,gs=pads(),pow=typeof m==='string'?POW[m]:.5;
    if(gs.length){
      var off=0;did=true;
      for(var j=0;j<p.length;j+=2){(function(ms,at){
        if(at===0)gs.forEach(function(g){rumble(g,ms,pow)});
        else setTimeout(function(){if(on)pads().forEach(function(g){rumble(g,ms,pow)})},at);
      })(p[j],off);off+=p[j]+(p[j+1]||0)}
    }
    if(phone()){try{did=nav.vibrate(p.length===1?p[0]:p)!==false||did}catch(e){}}
    return did;
  }
  function stop(){busy=0;try{if(typeof nav.vibrate==='function')nav.vibrate(0)}catch(e){}
    pads().forEach(function(g){try{var a=g.vibrationActuator;if(a&&a.reset)quiet(a.reset())}catch(e){}})}
  function setHaptics(v){on=!!v;try{localStorage.setItem(KEY,on?'1':'0')}catch(e){}if(!on)stop();label()}
  var btn=null;
  function label(){
    if(!btn)return;
    btn.textContent=on?'📳':'📴';btn.setAttribute('aria-pressed',on?'true':'false');
    btn.setAttribute('aria-label',on?'Rezgés: be':'Rezgés: ki');btn.title=on?'Rezgés: be':'Rezgés: ki';
    btn.style.opacity=on?'.75':'.45';
  }
  function showBtn(){
    if(!btn)return;
    btn.style.display=(phone()||pads().length)?'inline-flex':'none';
    /* ha nem fér ki egy sorba, a teljes képernyő gomb csak ikont mutat (ugyanaz a data-compact jelzés, amit a gomb szkriptje is ismer) */
    var fs=d.querySelector('.fs-btn'),first=btn.parentNode&&btn.parentNode.firstElementChild;
    if(fs&&first&&btn.style.display!=='none'&&btn.offsetTop>first.offsetTop+4){fs.dataset.compact='1';fs.textContent='⛶'}
  }
  function initBtn(){
    btn=d.querySelector('.hap-btn');if(!btn)return;
    btn.addEventListener('click',function(){setHaptics(!on);if(on)haptic('hit');btn.blur()});
    label();showBtn();
  }
  addEventListener('gamepadconnected',showBtn);addEventListener('gamepaddisconnected',showBtn);

  /* ---------- ébren tartás (Screen Wake Lock) ---------- */
  var IDLE=120000,want=false,lock=null,pending=false,lastUse=0,timer=0;
  function wlRequest(){
    if(!want||lock||pending||d.visibilityState!=='visible')return;
    var w=nav.wakeLock;if(!w||typeof w.request!=='function')return;
    pending=true;
    try{
      w.request('screen').then(function(s){
        pending=false;
        if(!want||!s){try{s&&quiet(s.release())}catch(e){}return}
        lock=s;try{s.addEventListener('release',function(){if(lock===s)lock=null})}catch(e){}
      },function(){pending=false});
    }catch(e){pending=false}
  }
  function wlRelease(){var s=lock;lock=null;if(s)try{quiet(s.release())}catch(e){}}
  function used(){lastUse=now();if(want&&!lock)wlRequest()}
  function tick(){if(lock&&now()-lastUse>IDLE)wlRelease()}
  function wakeLock(v){
    want=!!v;lastUse=now();
    if(want){wlRequest();if(!timer)timer=setInterval(tick,15000)}
    else{wlRelease();if(timer){clearInterval(timer);timer=0}}
  }
  d.addEventListener('visibilitychange',function(){if(d.visibilityState==='visible'){lastUse=now();wlRequest()}});
  ['pointerdown','keydown','touchstart'].forEach(function(ev){addEventListener(ev,used,{capture:true,passive:true})});
  addEventListener('pagehide',function(){wlRelease();oriUnlock()});

  /* ---------- képernyőváltás (View Transitions) ---------- */
  var vt=null,vtCss=false;
  function transition(fn){
    var done=false,run=function(){if(done)return;done=true;
      try{fn()}catch(e){setTimeout(function(){throw e},0)}};   /* a játék hibája ne vesszen el */
    /* betöltés közben (első képernyő) nincs mit átúsztatni */
    if(typeof d.startViewTransition!=='function'||calm()||d.visibilityState!=='visible'||d.readyState!=='complete'){run();return}
    if(!vtCss){vtCss=true;try{var st=d.createElement('style');
      st.textContent='::view-transition-old(root),::view-transition-new(root){animation-duration:.15s}';d.head.appendChild(st)}catch(e){}}
    try{
      var t=d.startViewTransition(run);vt=t;
      var clear=function(){if(vt===t)vt=null};
      quiet(t.ready);quiet(t.updateCallbackDone);
      if(t.finished&&t.finished.then)t.finished.then(clear,clear);
    }catch(e){run()}
    if(!done)setTimeout(run,250);                     /* ha a böngésző nem futtatná le, akkor is megtörténik */
  }
  /* a futó átmenet azonnali vége: bezáráskor és bármilyen érintésre, gombnyomásra, hogy a játék ne várjon rá */
  function endTransition(){var t=vt;vt=null;if(t)try{t.skipTransition()}catch(e){}}
  ['pointerdown','keydown'].forEach(function(ev){addEventListener(ev,function(){if(vt)endTransition()},{capture:true,passive:true})});

  /* ---------- tájolás (Screen Orientation) ---------- */
  var ori=null,oriLocked=false;
  function oriPref(){var m=d.querySelector('meta[name="games:orientation"]'),v=m&&m.getAttribute('content');
    return v==='portrait'||v==='landscape'?v:null}
  function oriLock(){
    var o=window.screen&&screen.orientation,p=ori||(ori=oriPref());
    if(!p||!o||typeof o.lock!=='function')return;
    try{var r=o.lock(p);oriLocked=true;if(r&&r.then)r.then(noop,function(){oriLocked=false})}catch(e){oriLocked=false}
  }
  function oriUnlock(){
    if(!oriLocked)return;oriLocked=false;
    try{var o=window.screen&&screen.orientation;if(o&&typeof o.unlock==='function')o.unlock()}catch(e){}
  }
  function fsChange(){if(d.fullscreenElement||d.webkitFullscreenElement)oriLock();else oriUnlock()}
  d.addEventListener('fullscreenchange',fsChange);d.addEventListener('webkitfullscreenchange',fsChange);

  /* ---------- adaptív grafikai minőség ---------- */
  var Q={lvl:2,t:0,acc:0,n:0,bad:0,good:0,changed:-1e9,ups:0,hot:false,watch:false,forced:null};
  function watchPressure(){
    Q.watch=true;
    try{if(typeof window.PressureObserver==='function'){
      var po=new window.PressureObserver(function(rs){var s=rs&&rs.length&&rs[rs.length-1].state;Q.hot=s==='serious'||s==='critical'});
      quiet(po.observe('cpu'));
    }}catch(e){}
  }
  function level(){var l=Q.forced!=null?Q.forced:Q.lvl;return calm()?Math.min(l,1):l}
  function quality(t){
    if(typeof t!=='number'||!isFinite(t))return level();
    if(!Q.watch)watchPressure();
    var dt=t-Q.t;Q.t=t;
    if(!(dt>0)||dt>250)return level();               /* szünet, háttér: nem mérjük */
    Q.acc+=dt;Q.n++;
    if(Q.acc>=1000){
      var avg=Q.acc/Q.n;Q.acc=0;Q.n=0;
      Q.bad=(avg>24||Q.hot)?Q.bad+1:0;Q.good=(avg<18&&!Q.hot)?Q.good+1:0;
      if(t-Q.changed>4000){
        if(Q.bad>=2&&Q.lvl>0){Q.lvl--;Q.changed=t;Q.bad=Q.good=0}
        else if(Q.good>=15&&Q.lvl<2&&Q.ups<2){Q.lvl++;Q.ups++;Q.changed=t;Q.good=0}   /* ritkán, és csak kétszer lép vissza */
      }
    }
    return level();
  }
  function setQuality(l){Q.forced=(l===0||l===1||l===2)?l:null}

  window.Kepesseg={haptic:haptic,hapticsOn:function(){return on},setHaptics:setHaptics,wakeLock:wakeLock,
    wakeLockHeld:function(){return !!lock},transition:transition,endTransition:endTransition,quality:quality,setQuality:setQuality};
  if(d.readyState==='loading')d.addEventListener('DOMContentLoaded',initBtn);else initBtn();
})();
/* @end kepesseg */
</script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const W=360;                                   // a játéktér szélessége játékegységben; a magasság a képernyőhöz igazodik
const ROT=4.4,THRUST=250,MAXV=290,BUL_V=430,BUL_LIFE=.85;
const SIZES=[null,{r:12,pts:100},{r:22,pts:50},{r:38,pts:20}];   // 3 = nagy kő, 2 = közepes, 1 = kicsi
const BONUS=10000;                             // ennyi pontonként jár egy új élet
let H=560,sc=1,dpr=1,cw=0,ch=0,stars=[];
let G=null,last=0,actx=null,hudKey='';
const keys={left:false,right:false,thrust:false,fire:false};

// ---------- rekord, mentés (csak localStorage) ----------
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
let sound=lsGet('kozapor-sound')!=='0';
function loadBest(){const s=lsGet('kozapor-best');if(!s||!/^\d{1,8}$/.test(s))return 0;return +s}
let best=loadBest();
const okInt=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;
function save(){
  if(!G||G.phase==='over')return;
  lsSet('kozapor-save',JSON.stringify({v:1,score:G.score,lives:G.lives,wave:G.wave,bonus:G.bonus}));
}
function loadSave(){
  try{
    const d=JSON.parse(lsGet('kozapor-save'));
    if(!d||typeof d!=='object'||Array.isArray(d)||d.v!==1)return null;
    if(!okInt(d.score,0,99999999)||!okInt(d.lives,1,9)||!okInt(d.wave,1,999)||!okInt(d.bonus,BONUS,99999999+BONUS))return null;
    return {score:d.score,lives:d.lives,wave:d.wave,bonus:d.bonus};
  }catch(e){return null}
}

// ---------- hang (Web Audio) ----------
function beep(f,d=0.06,type='square',v=0.04,at=0,f2=0){
  if(!sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+at;
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+0.02);
  }catch(e){}
}
function boom(big){beep(big?140:220,big?.35:.18,'sawtooth',.05,0,big?40:70)}
function sndIcon(){
  $('sndIcon').innerHTML=sound
    ?'<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z"/>'
    :'<path d="M3 9v6h4l5 5V4L7 9H3zm18.4 6L20 16.4l-2.6-2.6-2.6 2.6L13.4 15l2.6-2.6-2.6-2.6 1.4-1.4 2.6 2.6 2.6-2.6 1.4 1.4-2.6 2.6z"/>';
  $('snd').setAttribute('aria-pressed',sound?'true':'false');
}
$('snd').addEventListener('click',()=>{sound=!sound;lsSet('kozapor-sound',sound?'1':'0');sndIcon();beep(660)});
sndIcon();

// ---------- játék ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
function wrap(o){if(o.x<0)o.x+=W;else if(o.x>=W)o.x-=W;if(o.y<0)o.y+=H;else if(o.y>=H)o.y-=H}
// legrövidebb távolság a körbeérő pályán
function dist(a,b){let dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);dx=Math.min(dx,W-dx);dy=Math.min(dy,H-dy);return Math.hypot(dx,dy)}
function rock(size,x,y,speed){
  const an=rnd(0,Math.PI*2),n=11,shape=[];
  for(let i=0;i<n;i++)shape.push(rnd(.72,1.06));
  const craters=[];for(let i=0;i<(size===3?3:size===2?2:1);i++)craters.push([rnd(-.4,.4),rnd(-.4,.4),rnd(.12,.22)]);
  return {size,r:SIZES[size].r,x,y,vx:Math.cos(an)*speed,vy:Math.sin(an)*speed,a:rnd(0,7),va:rnd(-1.2,1.2),shape,craters};
}
function newShip(){return {x:W/2,y:H/2,vx:0,vy:0,a:-Math.PI/2,alive:true,inv:2.5}}
function newGame(from){
  Kepesseg.wakeLock(true);   // amíg tart a játék, a kijelző ne aludjon el
  G={phase:'play',score:0,lives:3,wave:1,bonus:BONUS,ship:newShip(),rocks:[],bullets:[],eb:[],parts:[],pickups:[],
     saucer:null,saucerT:rnd(14,20),banner:null,cool:0,shield:0,triple:0,respawn:0,waveT:0,rec:false};
  if(from){G.score=from.score;G.lives=from.lives;G.wave=from.wave;G.bonus=from.bonus}
  startWave(G.wave);hideOv();hud();
}
function startWave(n){
  G.wave=n;G.rocks=[];G.eb=[];G.saucer=null;G.saucerT=rnd(10,18);
  const cnt=Math.min(3+n,11),sp=Math.min(28+n*5,90);
  for(let i=0;i<cnt;i++){
    let x,y,k=0;
    do{x=rnd(0,W);y=rnd(0,H);k++}while(k<50&&Math.hypot(x-G.ship.x,y-G.ship.y)<150);
    G.rocks.push(rock(3,x,y,rnd(sp*.7,sp)));
  }
  G.banner={text:n+'. hullám',t:1.6};
  save();hud();
}
function addParts(x,y,n,col,sp=120){
  for(let i=0;i<n;i++){const a=rnd(0,7),v=rnd(sp*.3,sp);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:rnd(.35,.8),col})}
}
function addScore(p){
  G.score+=p;
  if(G.score>=G.bonus){G.lives=Math.min(9,G.lives+1);G.bonus+=BONUS;beep(784,.08,'square',.04);beep(1047,.12,'square',.04,.08);G.banner={text:'+1 élet',t:1.1}}
}
function splitRock(i,byShip){
  const r=G.rocks[i];G.rocks.splice(i,1);
  addScore(SIZES[r.size].pts);
  addParts(r.x,r.y,r.size*6,'#c9b79c',90+r.size*20);
  boom(r.size===3);Kepesseg.haptic(r.size===3?'hit':'tap');
  if(r.size>1){
    const sp=Math.hypot(r.vx,r.vy)*1.35+15;
    for(let k=0;k<2;k++)G.rocks.push(rock(r.size-1,r.x+rnd(-5,5),r.y+rnd(-5,5),sp));
  }
  if(r.size>=2&&!byShip&&Math.random()<.08)G.pickups.push({x:r.x,y:r.y,vx:rnd(-20,20),vy:rnd(-20,20),t:9,kind:Math.random()<.5?'S':'3'});
}
function killShip(){
  const s=G.ship;if(!s.alive)return;
  s.alive=false;G.lives--;G.shield=0;G.triple=0;
  addParts(s.x,s.y,28,'#ffb347',170);addParts(s.x,s.y,14,'#5ee6ff',120);
  beep(180,.5,'sawtooth',.06,0,35);Kepesseg.haptic('hurt');
  G.respawn=1.5;hud();
  if(G.lives<=0)G.respawn=1.1;
  else save();
}
function fire(){
  const s=G.ship,cos=Math.cos(s.a),sin=Math.sin(s.a);
  const angs=G.triple>0?[-.16,0,.16]:[0];
  for(const d of angs){const a=s.a+d;G.bullets.push({x:s.x+cos*14,y:s.y+sin*14,vx:Math.cos(a)*BUL_V+s.vx*.5,vy:Math.sin(a)*BUL_V+s.vy*.5,t:BUL_LIFE})}
  G.cool=G.triple>0?.2:.18;beep(880,.05,'square',.025,0,440);
}
function update(dt){
  if(G.banner&&(G.banner.t-=dt)<=0)G.banner=null;
  const s=G.ship;
  if(s.alive){
    if(keys.left)s.a-=ROT*dt;
    if(keys.right)s.a+=ROT*dt;
    if(keys.thrust){s.vx+=Math.cos(s.a)*THRUST*dt;s.vy+=Math.sin(s.a)*THRUST*dt;if(Math.random()<.6)G.parts.push({x:s.x-Math.cos(s.a)*12,y:s.y-Math.sin(s.a)*12,vx:-Math.cos(s.a+rnd(-.4,.4))*120+s.vx,vy:-Math.sin(s.a+rnd(-.4,.4))*120+s.vy,t:rnd(.15,.3),col:'#ffcf6b'})}
    const f=Math.exp(-.55*dt);s.vx*=f;s.vy*=f;
    const v=Math.hypot(s.vx,s.vy);if(v>MAXV){s.vx*=MAXV/v;s.vy*=MAXV/v}
    s.x+=s.vx*dt;s.y+=s.vy*dt;wrap(s);
    if(s.inv>0)s.inv-=dt;
    G.cool-=dt;
    if(keys.fire&&G.cool<=0&&G.bullets.length<12)fire();
    if(G.shield>0)G.shield-=dt;
    if(G.triple>0)G.triple-=dt;
  }else if((G.respawn-=dt)<=0){
    if(G.lives<=0)return over();
    G.ship=newShip();
  }
  for(const b of G.bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;wrap(b)}
  for(const b of G.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;wrap(b)}
  for(const r of G.rocks){r.x+=r.vx*dt;r.y+=r.vy*dt;r.a+=r.va*dt;wrap(r)}
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;p.vx*=.97;p.vy*=.97}
  for(const p of G.pickups){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;wrap(p)}
  // lövedék - kő
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i];if(b.t<=0){G.bullets.splice(i,1);continue}
    for(let j=G.rocks.length-1;j>=0;j--)if(dist(b,G.rocks[j])<G.rocks[j].r){G.bullets.splice(i,1);splitRock(j,false);break}
  }
  // lövedék - csészealj
  if(G.saucer)for(let i=G.bullets.length-1;i>=0;i--){
    if(dist(G.bullets[i],G.saucer)<16){G.bullets.splice(i,1);addScore(300);addParts(G.saucer.x,G.saucer.y,24,'#7dffa0',160);boom(true);Kepesseg.haptic('boom');
      G.pickups.push({x:G.saucer.x,y:G.saucer.y,vx:0,vy:0,t:9,kind:Math.random()<.5?'S':'3'});G.saucer=null;G.saucerT=rnd(12,20);break}
  }
  G.eb=G.eb.filter(b=>b.t>0);
  G.parts=G.parts.filter(p=>p.t>0);
  G.pickups=G.pickups.filter(p=>p.t>0);
  // hajó ütközései
  if(s.alive){
    for(let j=G.rocks.length-1;j>=0;j--){
      const r=G.rocks[j];if(dist(s,r)>=r.r+9)continue;
      if(G.shield>0){splitRock(j,true);continue}
      if(s.inv<=0){killShip();break}
    }
    if(s.alive&&G.saucer&&dist(s,G.saucer)<22&&s.inv<=0&&G.shield<=0)killShip();
    for(let i=G.eb.length-1;i>=0&&s.alive;i--){
      if(dist(s,G.eb[i])<10){G.eb.splice(i,1);if(G.shield<=0&&s.inv<=0)killShip()}
    }
    for(let i=G.pickups.length-1;i>=0&&s.alive;i--){
      const p=G.pickups[i];if(dist(s,p)>=20)continue;
      G.pickups.splice(i,1);
      if(p.kind==='S'){G.shield=7;G.banner={text:'Pajzs',t:1}}else{G.triple=9;G.banner={text:'Hármas lövés',t:1}}
      beep(660,.06,'triangle',.05);beep(990,.1,'triangle',.05,.06);Kepesseg.haptic('reward');
    }
  }
  // csészealj
  if(G.wave>=2){
    if(!G.saucer&&(G.saucerT-=dt)<=0&&G.rocks.length){
      const left=Math.random()<.5;
      G.saucer={x:left?0:W-1,y:rnd(H*.15,H*.85),vx:(left?1:-1)*rnd(60,80),vy:0,t:0,shot:1.2,dir:left?1:-1,trav:0};
    }
    const u=G.saucer;
    if(u){
      u.t+=dt;u.trav+=Math.abs(u.vx)*dt;u.x+=u.vx*dt;u.y+=Math.sin(u.t*1.7)*40*dt;wrap(u);
      if((u.shot-=dt)<=0&&s.alive){
        u.shot=Math.max(.9,1.6-G.wave*.06);
        const err=Math.max(.08,.4-G.wave*.03),a=Math.atan2(s.y-u.y,s.x-u.x)+rnd(-err,err);
        G.eb.push({x:u.x,y:u.y,vx:Math.cos(a)*190,vy:Math.sin(a)*190,t:1.6});beep(330,.06,'triangle',.03);
      }
      if(u.trav>W+20){G.saucer=null;G.saucerT=rnd(12,20)}
    }
  }
  // hullám vége
  if(!G.rocks.length&&!G.saucer){
    if(!G.waveT)G.waveT=1.4;
    else if((G.waveT-=dt)<=0){G.waveT=0;startWave(G.wave+1)}
  }
  hud();
}
function over(){
  Kepesseg.wakeLock(false);
  G.phase='over';lsDel('kozapor-save');Kepesseg.haptic('over');
  G.rec=G.score>best;if(G.rec){best=G.score;lsSet('kozapor-best',String(best))}
  keys.left=keys.right=keys.thrust=keys.fire=false;
  hud();
  setTimeout(()=>{if(G&&G.phase==='over')showOver()},500);
}
function pause(){if(!G||G.phase!=='play')return;G.phase='pause';Kepesseg.wakeLock(false);save();showPause()}
function resume(){if(!G||G.phase!=='pause')return;hideOv();G.phase='play';Kepesseg.wakeLock(true);last=performance.now()}
function hud(){
  const k=G?[G.score,G.lives,G.wave].join():'';
  if(k===hudKey)return;hudKey=k;
  $('score').textContent=(G?G.score:0).toLocaleString('hu-HU');
  const l=G?Math.max(0,G.lives):3;
  $('lives').textContent=l>5?'♥×'+l:('♥'.repeat(l)||'–');$('lives').setAttribute('aria-label',l+' élet');
  $('wave').textContent=G?G.wave:1;
  $('best').textContent=Math.max(best,G&&G.phase!=='over'?G.score:0).toLocaleString('hu-HU');
}

// ---------- rajz ----------
function fit(){
  const r=$('stage').getBoundingClientRect();
  if(r.width<10||r.height<10)return;
  cw=Math.floor(Math.min(r.width,560));ch=Math.floor(r.height);
  sc=cw/W;H=Math.max(300,ch/sc);dpr=window.devicePixelRatio||1;
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.style.left=Math.floor((r.width-cw)/2)+'px';
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  stars=[];for(let i=0;i<70;i++)stars.push([Math.random()*W,Math.random()*H,Math.random()<.15?1.4:.8,Math.random()*.6+.3]);
  if(G){for(const o of [G.ship,...G.rocks,...G.pickups])if(o.y>=H)o.y=H-1}
}
new ResizeObserver(fit).observe($('stage'));
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function drawRock(r){
  ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.a);
  ctx.beginPath();
  r.shape.forEach((f,i)=>{const a=i/r.shape.length*Math.PI*2;ctx.lineTo(Math.cos(a)*r.r*f,Math.sin(a)*r.r*f)});
  ctx.closePath();
  ctx.fillStyle=r.size===3?'#4a4256':r.size===2?'#574b5e':'#665565';ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='#b8a7c9';ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,.28)';
  for(const c of r.craters){ctx.beginPath();ctx.arc(c[0]*r.r,c[1]*r.r,c[2]*r.r,0,7);ctx.fill()}
  ctx.restore();
}
function drawShip(s,alpha){
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.globalAlpha=alpha;
  if(keys.thrust&&G.phase==='play'){ctx.fillStyle='#ffcf6b';ctx.beginPath();ctx.moveTo(-9,-5);ctx.lineTo(-17-Math.random()*7,0);ctx.lineTo(-9,5);ctx.fill()}
  ctx.fillStyle='#d7e3ff';ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(-10,-10);ctx.lineTo(-6,0);ctx.lineTo(-10,10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#5ee6ff';ctx.beginPath();ctx.moveTo(-10,-10);ctx.lineTo(-4,-12);ctx.lineTo(-1,-5);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-10,10);ctx.lineTo(-4,12);ctx.lineTo(-1,5);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffb347';ctx.beginPath();ctx.ellipse(3,0,4,2.6,0,0,7);ctx.fill();
  ctx.restore();ctx.globalAlpha=1;
}
function drawSaucer(u){
  ctx.save();ctx.translate(u.x,u.y);
  ctx.fillStyle='#9dffb9';ctx.beginPath();ctx.ellipse(0,-4,7,6,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='#2fa860';ctx.beginPath();ctx.ellipse(0,0,16,5.5,0,0,7);ctx.fill();
  ctx.fillStyle='#ffe066';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(i*8,1,1.6,0,7);ctx.fill()}
  ctx.restore();
}
function draw(){
  if(!cw)return;
  ctx.setTransform(dpr*sc,0,0,dpr*sc,0,0);
  ctx.fillStyle='#05070f';ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.globalAlpha=s[3];ctx.fillStyle='#fff';ctx.fillRect(s[0],s[1],s[2],s[2])}
  ctx.globalAlpha=1;
  if(!G)return;
  for(const r of G.rocks)drawRock(r);
  for(const p of G.pickups){
    const blink=p.t<2&&(p.t*6|0)%2;if(blink)continue;
    ctx.fillStyle=p.kind==='S'?'#5ee6ff':'#ffb347';ctx.beginPath();ctx.arc(p.x,p.y,10,0,7);ctx.fill();
    ctx.fillStyle='#06101c';ctx.font='700 12px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.kind,p.x,p.y+1);
  }
  if(G.saucer)drawSaucer(G.saucer);
  ctx.fillStyle='#ffe58a';for(const b of G.bullets){ctx.fillRect(b.x-1.6,b.y-1.6,3.2,3.2)}
  ctx.fillStyle='#ff6b8a';for(const b of G.eb){ctx.beginPath();ctx.arc(b.x,b.y,2.6,0,7);ctx.fill()}
  for(const p of G.parts){ctx.globalAlpha=Math.min(1,p.t*2);ctx.fillStyle=p.col;ctx.fillRect(p.x-1.2,p.y-1.2,2.4,2.4)}
  ctx.globalAlpha=1;
  const s=G.ship;
  if(s.alive){
    const blink=s.inv>0&&((s.inv*8)|0)%2===0;
    drawShip(s,blink?.35:1);
    if(G.shield>0){ctx.strokeStyle=G.shield<1.5&&((G.shield*8)|0)%2?'rgba(94,230,255,.3)':'rgba(94,230,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y,19,0,7);ctx.stroke()}
  }
  if(G.banner){
    ctx.globalAlpha=Math.min(1,G.banner.t*2);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`400 26px ${css('--display')||'system-ui'}`;ctx.fillText(G.banner.text,W/2,H*.3);ctx.globalAlpha=1;
  }
  if(G.triple>0||G.shield>0){
    ctx.font='700 12px system-ui,sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
    let y=8;if(G.shield>0){ctx.fillStyle='#5ee6ff';ctx.fillText('Pajzs '+Math.ceil(G.shield)+' mp',8,y);y+=16}
    if(G.triple>0){ctx.fillStyle='#ffb347';ctx.fillText('Hármas lövés '+Math.ceil(G.triple)+' mp',8,y)}
  }
}
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;
  if(G&&G.phase==='play')update(dt);
  draw();
}

// ---------- ablakok ----------
const ov=$('ov'),card=$('card');
function showOv(html){card.innerHTML=html;ov.hidden=false;const h=card.querySelector('.hot');if(h)h.focus({preventScroll:true})}
function hideOv(){ov.hidden=true;if(document.activeElement&&ov.contains(document.activeElement))document.activeElement.blur()}
const LEGEND=`<div class="legend"><i style="background:#5ee6ff">S</i><span><b>Pajzs:</b> 7 mp-ig nem árt semmi</span><i style="background:#ffb347">3</i><span><b>Hármas lövés:</b> 9 mp-ig</span></div>`;
function showMenu(){
  Kepesseg.wakeLock(false);
  const s=loadSave();
  showOv(`<h2>Kőzápor</h2><p>Forgasd a hajót, gyorsíts, és lődd szét a köveket! A nagy kő kettéhasad, a kicsi elporlad. A 2. hullámtól <b>csészealj</b> is vadászik rád.</p>${LEGEND}
  <p>${matchMedia('(pointer:coarse)').matches?'Bal oldalt forgás, jobb oldalt gáz és lövés. Tartsd nyomva a lövést!':'← → forgás · ↑ gáz · szóköz: lövés'}</p>
  <div class="btns">${s?`<button class="b hot" type="button" data-act="cont">Folytatás · ${s.wave}. hullám</button>`:''}
  <button class="b ${s?'':'hot'}" type="button" data-act="new">Új játék</button></div>`);
}
function showPause(){
  showOv(`<h2>Szünet</h2><p>Pont: <b>${G.score.toLocaleString('hu-HU')}</b> · ${G.wave}. hullám</p>
  <div class="btns"><button class="b hot" type="button" data-act="resume">Folytatás</button><button class="b" type="button" data-act="menu">Főmenü</button></div>`);
}
function showOver(){
  showOv(`<h2 class="bad">Vége</h2><div class="big">${G.score.toLocaleString('hu-HU')}</div>
  <p>pont · ${G.wave}. hullám</p>${G.rec?'<span class="rec">Új rekord!</span>':`<p>Rekord: <b>${best.toLocaleString('hu-HU')}</b></p>`}
  <div class="btns"><button class="b hot" type="button" data-act="new">Új játék</button></div>`);

card.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='new'){newGame();beep(520,.05)}
  else if(a==='cont'){const s=loadSave();newGame(s||undefined)}
  else if(a==='resume')resume();
  else if(a==='menu'){G=null;hud();showMenu()}
});

// ---------- irányítás ----------
const KEYMAP={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'thrust',w:'thrust',W:'thrust',' ':'fire',j:'fire',J:'fire',k:'fire',K:'fire'};
addEventListener('keydown',e=>{
  if(!ov.hidden){
    if((e.key==='Escape'||e.key==='p'||e.key==='P')&&G&&G.phase==='pause'){e.preventDefault();resume()}
    return;
  }
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){e.preventDefault();pause();return}
  const k=KEYMAP[e.key];if(k){e.preventDefault();keys[k]=true}
});
addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k)keys[k]=false});
addEventListener('blur',()=>{keys.left=keys.right=keys.thrust=keys.fire=false});
document.querySelectorAll('.pad button[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const off=()=>{keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);
  b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
$('pauseBtn').addEventListener('click',()=>pause());
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('pagehide',save);

fit();hud();showMenu();requestAnimationFrame(t=>{last=t;frame(t)});
if(window.__GAMES_TEST__)window.__kozapor={get G(){return G},keys,newGame,startWave,killShip,splitRock,loadSave,get H(){return H},W}; // csak a játékteszt (tools/play_test.py) kapcsolja be
})();

<script>
/* Teljes képernyő gomb: csak ott látszik, ahol a böngésző támogatja (iPhone-on nem). */
(function(){
  var d=document, el=d.documentElement, b=d.querySelector('.fs-btn');
  if(!b) return;
  var can=d.fullscreenEnabled||d.webkitFullscreenEnabled;
  if(!can||!(el.requestFullscreen||el.webkitRequestFullscreen)){ b.remove(); return; }
  function on(){ return !!(d.fullscreenElement||d.webkitFullscreenElement); }
  function label(){ b.textContent=b.dataset.compact?'⛶':(on()?'⛶ Kilépés':'⛶ Teljes képernyő'); b.setAttribute('aria-label', on()?'Kilépés a teljes képernyőből':'Teljes képernyő'); }
  b.addEventListener('click', function(){
    try{
      if(on()){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
      else{ var p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el); if(p&&p.catch) p.catch(function(){}); }
    }catch(e){}
    b.blur();
  });
  d.addEventListener('fullscreenchange', label);
  d.addEventListener('webkitfullscreenchange', label);
  label();
})();
</script>
<script>
/* @shared fekvo-jelzes */
/* Fekvő telefonon „Fordítsd el a telefont” jelzés. A játék álló képernyőre készült, ezért amíg a telefon
   fekszik, a jelzés eltakarja, és a játék a saját szünet-logikájával megáll (ugyanaz fut le, mint amikor
   a lap háttérbe kerül). Gépen, széles ablakban nem jelenik meg (csak érintőképernyőn, alacsony ablakban). */
(function(){
  var mq;
  try{ mq=matchMedia('(orientation: landscape) and (max-height: 500px) and (pointer: coarse)'); }catch(e){ return; }
  var st=document.createElement('style');
  st.textContent='.rotate-hint{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;padding:16px;'+
    'background:rgba(5,8,14,.95);color:#fff;font:700 20px/1.3 system-ui,sans-serif;text-align:center}'+
    '.rotate-hint[hidden]{display:none!important}.rotate-hint p{margin:8px 0}'+
    '.rotate-hint .sub{font-weight:400;font-size:16px;opacity:.85}.rotate-hint svg{width:56px;height:56px}';
  var el=document.createElement('div');
  el.className='rotate-hint';el.setAttribute('role','alert');el.hidden=true;
  el.innerHTML='<div><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2" '+
    'fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18.5" r="1" fill="currentColor"/></svg>'+
    '<p>Fordítsd el a telefont!</p><p class="sub">Ez a játék álló képernyőre készült. Addig szünetel.</p></div>';
  function pauseGame(){
    try{
      Object.defineProperty(document,'hidden',{configurable:true,get:function(){return true;}});
      document.dispatchEvent(new Event('visibilitychange'));
    }catch(e){}
    try{ delete document.hidden; }catch(e){}
  }
  function update(e){
    if(mq.matches){ if(el.hidden){ el.hidden=false; if(e) pauseGame(); } }
    else el.hidden=true;
  }
  document.head.appendChild(st);
  document.body.appendChild(el);
  if(mq.addEventListener) mq.addEventListener('change',update); else if(mq.addListener) mq.addListener(update);
  update();
})();
/* @end fekvo-jelzes */
</script>
<script>
/* @shared gamepad */
/* Kontroller (gamepad) a böngésző Gamepad API-jával. A játék kódjához nem nyúl: a kontrollert billentyűkké
   fordítja, amelyeket a játék már ismer. Ha egy ablak (menü, szünet, vége) látszik, a kar a gombok között lép,
   az A gomb megnyomja a kijelöltet. Kiosztás (szabványos kontroller):
     bal kar / d-pad → nyilak, A → szóköz, X → J, Y → K, B → L, RB → L, Start → Escape (szünet), Select → Enter.
   iPhone-on a böngésző nem támogatja, ott ez a rész nem csinál semmit. */
(function(){
  if(!navigator.getGamepads)return;
  var DIRS=[['ArrowUp',12],['ArrowDown',13],['ArrowLeft',14],['ArrowRight',15]];
  var BTN=[[0,' ','Space'],[2,'j','KeyJ'],[3,'k','KeyK'],[1,'l','KeyL'],[5,'l','KeyL'],[9,'Escape','Escape'],[8,'Enter','Enter']];
  var held={},raf=0,shown=false,lastNav=0;
  function key(type,k,code){
    var e=new KeyboardEvent(type,{key:k,code:code,bubbles:true,cancelable:true});
    (document.activeElement&&document.activeElement!==document.body?document.activeElement:document).dispatchEvent(e);
  }
  function set(name,on,k,code){if(!!held[name]===on)return;held[name]=on;key(on?'keydown':'keyup',k,code||k)}
  function visible(el){if(!el||el.hidden)return false;var r=el.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(el).visibility!=='hidden'}
  function dialog(){
    var c=document.querySelectorAll('#ov,#over,#pick,#overlay,.modal,dialog[open],.rotate-hint');
    for(var i=0;i<c.length;i++)if(visible(c[i])&&!c[i].classList.contains('rotate-hint'))return c[i];
    return null;
  }
  function buttons(d){return Array.prototype.filter.call(d.querySelectorAll('button:not(:disabled),a[href]'),visible)}
  function nav(d,dir){
    var b=buttons(d);if(!b.length)return;
    var i=b.indexOf(document.activeElement);
    if(i<0){var hot=d.querySelector('.hot:not(:disabled)');(hot&&visible(hot)?hot:b[0]).focus();return}
    var cur=b[i].getBoundingClientRect(),best=null,bd=1e9;
    b.forEach(function(x){if(x===b[i])return;var r=x.getBoundingClientRect(),dx=r.left+r.width/2-(cur.left+cur.width/2),dy=r.top+r.height/2-(cur.top+cur.height/2);
      var ok=dir==='ArrowUp'?dy<-4:dir==='ArrowDown'?dy>4:dir==='ArrowLeft'?dx<-4:dx>4;if(!ok)return;
      var dist=Math.abs(dx)+Math.abs(dy)*(dir==='ArrowLeft'||dir==='ArrowRight'?3:1)+Math.abs(dx)*(dir==='ArrowUp'||dir==='ArrowDown'?2:0);if(dist<bd){bd=dist;best=x}});
    (best||b[(i+(dir==='ArrowUp'||dir==='ArrowLeft'?b.length-1:1))%b.length]).focus();
  }
  function note(){
    if(shown)return;shown=true;
    var t=document.createElement('div');t.setAttribute('role','status');
    t.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:3500;background:#0b0c10;color:#fff;border:1px solid #444;border-radius:10px;padding:10px 16px;font:700 15px system-ui,sans-serif;pointer-events:none';
    t.textContent='Kontroller csatlakoztatva';document.body.appendChild(t);setTimeout(function(){t.remove()},2500);
  }
  function poll(){
    raf=setTimeout(poll,16); /* időzítő, nem képkocka: álló képnél is figyeli a kontrollert */
    var pads=navigator.getGamepads?navigator.getGamepads():[],gp=null;
    for(var i=0;i<pads.length;i++)if(pads[i]&&pads[i].connected){gp=pads[i];break}
    if(!gp){for(var n in held)if(held[n])held[n]=false;return}
    note();
    var pr=function(i){var b=gp.buttons[i];return !!b&&(b.pressed||b.value>.5)};
    var ax=gp.axes[0]||0,ay=gp.axes[1]||0,dz=.25;
    var dirOn={ArrowUp:ay<-dz,ArrowDown:ay>dz,ArrowLeft:ax<-dz,ArrowRight:ax>dz};
    DIRS.forEach(function(d){if(pr(d[1]))dirOn[d[0]]=true});
    var d=dialog();
    if(d){
      DIRS.forEach(function(x){if(held[x[0]])set(x[0],false,x[0])});
      BTN.forEach(function(b){if(held['b'+b[0]])set('b'+b[0],false,b[1],b[2])});
      var now=performance.now(),any=null;DIRS.forEach(function(x){if(dirOn[x[0]])any=x[0]});
      if(any&&now-lastNav>220){lastNav=now;nav(d,any)}else if(!any)lastNav=0;
      var a=pr(0);if(a&&!held.navA){var f=document.activeElement;if(f&&d.contains(f)&&f.click)f.click();else{var b=buttons(d),hot=d.querySelector('.hot:not(:disabled)');(hot&&visible(hot)?hot:b[0])&&(hot&&visible(hot)?hot:b[0]).click()}}
      held.navA=a;
      if(pr(9)&&!held.Escape)set('Escape',true,'Escape');else if(!pr(9))set('Escape',false,'Escape');
      return;
    }
    held.navA=pr(0);
    DIRS.forEach(function(x){set(x[0],dirOn[x[0]],x[0])});
    BTN.forEach(function(b){set('b'+b[0],pr(b[0]),b[1],b[2])});
  }
  addEventListener('gamepadconnected',function(){if(!raf)poll()});
  addEventListener('gamepaddisconnected',function(){var p=navigator.getGamepads(),any=false;for(var i=0;i<p.length;i++)if(p[i])any=true;if(!any){clearTimeout(raf);raf=0;for(var n in held)if(held[n]&&n.indexOf('Arrow')===0)set(n,false,n)}});
  try{var p0=navigator.getGamepads();for(var i=0;i<p0.length;i++)if(p0[i]){poll();break}}catch(e){}
})();
/* @end gamepad */
</script>
