<style>
/* Layout: back link, HUD (stage, lives, enemies, score, pause), square canvas, touch pad (d-pad left, fire right), overlay */
:root{
  --bg:#0c0c0e; --panel:#1b1b20; --panel2:#26262e; --line:#3a3a46; --fg:#f4f2ea; --muted:#a8a69c;

}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:7px;max-width:760px;margin:0 auto;padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.hud{display:flex;align-items:center;gap:5px;min-width:0}
.chip{display:inline-flex;align-items:baseline;gap:4px;padding:6px 8px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font:700 15px/1 var(--disp);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip small{font:600 10px/1 var(--disp);color:var(--muted);letter-spacing:.05em}
.sp{flex:1;min-width:0}
.ib{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:17px;cursor:pointer;flex:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
#bgcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cv{position:relative;z-index:1;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border:3px solid #2c2c34;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.6);touch-action:none}
.pad{display:flex;justify-content:space-between;align-items:center;gap:10px;touch-action:none;padding-bottom:4px}
.dpad{--b:min(80px,20vw);position:relative;width:calc(var(--b)*2.9);height:calc(var(--b)*2.9);flex:none;touch-action:none}
.dpad button{position:absolute;width:var(--b);height:var(--b);border-radius:16px;border:2px solid var(--line);background:var(--panel);color:var(--fg);font:700 26px/1 var(--disp);touch-action:none;cursor:pointer}
.dpad .u{left:calc(var(--b)*.95);top:0}.dpad .d{left:calc(var(--b)*.95);bottom:0}.dpad .l{left:0;top:calc(var(--b)*.95)}.dpad .r{right:0;top:calc(var(--b)*.95)}
.dpad::after{content:"";position:absolute;left:calc(var(--b)*1.07);top:calc(var(--b)*1.07);width:calc(var(--b)*.76);height:calc(var(--b)*.76);border-radius:50%;background:var(--panel2)}
.dpad button.on,.fire.on{background:var(--panel2);border-color:var(--accent)}
.fire{width:min(140px,33vw);height:min(140px,33vw);border-radius:50%;border:3px solid #8a4a1c;background:radial-gradient(circle at 40% 35%,#e0752e,#9a3e12);color:#fff3e0;font:400 22px/1 var(--title);letter-spacing:.04em;text-shadow:2px 2px 0 #4a1a04;touch-action:none;cursor:pointer;flex:none}

/* ---------------------------------------------------------------- pixel art */
function canvas16(w=16,h=16){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function spr(rows,pal,w=16,h=16){const c=canvas16(w,h),x=c.getContext('2d');rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const k=r[i];if(pal[k]){x.fillStyle=pal[k];x.fillRect(i,j,1,1)}}});return c}
/* tank facing up; f = tread frame; kind changes hull and turret */
function tankSprite(pal,f,kind){
  const c=canvas16(),x=c.getContext('2d');
  const R=(col,a,b,w,h)=>{x.fillStyle=col;x.fillRect(a,b,w,h)};
  /* treads */
  for(const tx of [1,12]){R(pal.dk,tx,2,3,14);for(let y=2+f;y<16;y+=2)R(pal.md,tx,y,3,1)}
  /* hull */
  const hx=kind==='fast'?4:3,hw=kind==='fast'?8:10;
  R(pal.md,hx,4,hw,11);R(pal.lt,hx,4,hw,1);R(pal.lt,hx,4,1,11);R(pal.dk,hx,14,hw,1);
  /* turret */
  if(kind==='armor'){R(pal.dk,4,6,8,8);R(pal.lt,5,7,6,6);R(pal.md,6,8,4,4)}
  else{R(pal.dk,5,7,6,6);R(pal.lt,6,8,4,4);R(pal.hl,6,8,2,1)}
  /* barrel */
  if(kind==='power'){R(pal.dk,6,0,1,8);R(pal.dk,9,0,1,8);R(pal.lt,6,0,1,1);R(pal.lt,9,0,1,1)}
  else{R(pal.dk,7,0,2,8);R(pal.lt,7,0,1,6)}
  return c;
}

  enemy:{dk:'#202628',md:'#8c9ea2',lt:'#d8e4e6',hl:'#ffffff'},
  bonus:{dk:'#4a0a06',md:'#d03a2a',lt:'#ff8a70',hl:'#ffffff'},

  a2:{dk:'#202628',md:'#8c9ea2',lt:'#d8e4e6',hl:'#ffffff'}
};

const BRICKC=spr(["rrrrrrrm","rrrrrrrm","rrrrrrrm","mmmmmmmm","rrrmrrrr","rrrmrrrr","rrrmrrrr","mmmmmmmm"],{r:'#b5502a',m:'#5e2410'},8,8);

const STEELC=spr(["hhhhhhhd","hsssssmd","hsssssmd","hsswssmd","hsssssmd","hsssssmd","hmmmmmmd","dddddddd"],{h:'#ffffff',s:'#b8bcc4',m:'#7c808a',d:'#4a4e56',w:'#ffffff'},8,8);
const TREEC=spr(["..gGg.g.",".gGGgggG","gGgGGgGg","GggGgGGg","gGGgggGG","gGgGGgGg",".gGggGg.","..g.gg.."],{g:'#2f7a1e',G:'#5cbf38'},8,8);
const ICEC=spr(["iiiiiiii","iwiiiiii","iiwiiiii","iiiwiiii","iiiiwiii","iiiiiwii","iiiiiiwi","iiiiiiii"],{i:'#9fb8c8',w:'#e8f4fa'},8,8);
const FLAG=spr([

"....p...........","...ppp..........","..SSSSSSSSSSSS..",".SshhhhhhhhhhsS.",".SsddddddddddsS.",".SsddddddddddsS.",".SSSSSSSSSSSSSS.","................"],
{p:'#e8e8e8',R:'#e03030',w:'#ffd84a',S:'#5a5a62',s:'#8a8a94',h:'#b8b8c2',d:'#3a3a42'});
const RUBBLE=spr([

{r:'#e03030',k:'#2a2a2e',S:'#5a5a62',s:'#8a8a94',d:'#3a3a42'});

/* ---------------------------------------------------------------- save: local only, every field checked */
const isInt=(v,lo,hi)=>typeof v==='number'&&Number.isInteger(v)&&v>=lo&&v<=hi;
function loadSave(){
  const s={best:0,reached:1};let raw=null;
  try{const t=localStorage.getItem(SAVE_KEY);if(t)raw=JSON.parse(t)}catch(e){raw=null}
  if(!raw||typeof raw!=='object'||Array.isArray(raw))return s;
  if(isInt(raw.best,0,9999999))s.best=raw.best;
  if(isInt(raw.reached,1,99))s.reached=raw.reached;
  return s;
}
let SAVE=loadSave();
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE))}catch(e){}}

/* ---------------------------------------------------------------- sound (Web Audio) */
let AC=null,engine=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,d,type='square',slide=0,vol=.06,delay=0){const a=AC;if(!a)return;try{const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,vol=.12,f=800){const a=AC;if(!a)return;try{const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),flt=a.createBiquadFilter(),g=a.createGain();flt.type='lowpass';flt.frequency.value=f;s.buffer=b;g.gain.value=vol;s.connect(flt);flt.connect(g);g.connect(a.destination);s.start()}catch(e){}}
const SFX={
  shot:()=>tone(880,.06,'square',-500,.04),
  brick:()=>noise(.08,.08,1500),
  steel:()=>tone(1400,.05,'square',0,.035),
  hit:()=>tone(300,.08,'square',-150,.06),
  boom:()=>{noise(.45,.2,600);tone(90,.35,'sawtooth',-50,.08)},
  big:()=>{noise(.9,.28,400);tone(60,.7,'sawtooth',-30,.1)},
  bonus:()=>[784,988,1319].forEach((f,i)=>tone(f,.09,'square',0,.05,i*.07)),
  appear:()=>tone(520,.15,'triangle',300,.04),
  life:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.1,'square',0,.05,i*.08)),
  start:()=>[392,523,659,784,659,784].forEach((f,i)=>tone(f,.12,'square',0,.05,i*.12)),
  over:()=>[392,330,262,196].forEach((f,i)=>tone(f,.25,'square',0,.06,i*.22))
};
function engineSet(on){
  if(!AC)return;
  try{
    if(on&&!engine){const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=48;g.gain.value=.012;o.connect(g);g.connect(AC.destination);o.start();engine={o,g}}
    else if(!on&&engine){engine.o.stop();engine=null}
  }catch(e){engine=null}
}

/* ---------------------------------------------------------------- state */
const S={mode:'menu',stage:1,cells:new Uint8Array(NC*NC),score:0,lives:3,nextLife:10000,player:null,enemies:[],bullets:[],fx:[],pops:[],
  bonus:null,reserve:[],spawnT:0,spawnIx:0,freeze:0,fort:0,baseDead:false,t:0,endT:0,kills:{basic:0,fast:0,power:0,armor:0},shots:0,banner:0,curBonusIx:0};
const KEY={d:-1,stack:[],fire:false};

function buildStage(n){
  const map=MAPS[(n-1)%MAPS.length].m;S.cells.fill(0);
  for(let ty=0;ty<13;ty++)for(let tx=0;tx<13;tx++){
    const ch=map[ty][tx],v=ch==='B'?BRICK:ch==='S'?STEEL:ch==='W'?WATER:ch==='T'?TREE:ch==='I'?ICE:EMPTY;
    for(let j=0;j<2;j++)for(let i=0;i<2;i++)S.cells[(ty*2+j)*NC+tx*2+i]=v;
  }
  for(let y=24;y<26;y++)for(let x=12;x<14;x++)S.cells[y*NC+x]=EMPTY;
  ring(BRICK);
}
function ring(v){for(const [x,y] of BASE_RING)S.cells[y*NC+x]=v}
function enemyList(n){
  const loop=Math.floor((n-1)/MAPS.length);
  const armor=Math.min(7,Math.floor(n/2)+loop*2),power=Math.min(5,1+Math.floor(n/3)+loop),fast=Math.min(6,2+Math.floor(n/2));
  const list=[];for(let i=0;i<armor;i++)list.push('armor');for(let i=0;i<power;i++)list.push('power');for(let i=0;i<fast;i++)list.push('fast');
  while(list.length<14)list.push('basic');list.length=14;
  /* mix them, but keep the tougher ones a little towards the end */
  for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
  list.sort((a,b)=>(TYPES[a].hp+Math.random()*3)-(TYPES[b].hp+Math.random()*3));
  return list.map((t,i)=>({type:t,bonus:i===3||i===8||i===12}));
}
function newTank(x,y,dir,enemy,type){return {x,y,dir,enemy,type:type||'player',hp:enemy?TYPES[type].hp:1,cd:0,f:0,moving:false,slide:0,
  shield:0,spawn:enemy?56:0,think:30,lv:0,bonus:false,flash:0,shotWait:60+Math.random()*60}}
function startStage(n,fresh){
  S.stage=n;buildStage(n);
  if(fresh){S.score=0;S.lives=3;S.nextLife=10000;S.shots=0}
  const lv=S.player&&!fresh?S.player.lv:0;
  S.player=newTank(PSPAWN.x,PSPAWN.y,0,false);S.player.lv=lv;S.player.shield=180;
  S.enemies=[];S.bullets=[];S.fx=[];S.pops=[];S.bonus=null;S.reserve=enemyList(n);S.spawnT=30;S.spawnIx=0;
  S.freeze=0;S.fort=0;S.baseDead=false;S.t=0;S.endT=0;S.kills={basic:0,fast:0,power:0,armor:0};S.banner=120;
  S.mode='play';closeOv();hud();SFX.start();
}

/* ---------------------------------------------------------------- collision helpers */
const cellAt=(cx,cy)=>cx<0||cy<0||cx>=NC||cy>=NC?STEEL:S.cells[cy*NC+cx];
function boxFree(x,y,size){
  if(x<0||y<0||x+size>W||y+size>W)return false;
  for(let cy=Math.floor(y/C);cy<=Math.floor((y+size-.01)/C);cy++)for(let cx=Math.floor(x/C);cx<=Math.floor((x+size-.01)/C);cx++){
    const v=cellAt(cx,cy);if(v===BRICK||v===STEEL||v===WATER)return false}
  if(!S.baseDead&&x<BASE.x+16&&x+size>BASE.x&&y<BASE.y+16&&y+size>BASE.y)return false;
  return true;
}
const overlap=(ax,ay,as,bx,by,bs)=>ax<bx+bs&&ax+as>bx&&ay<by+bs&&ay+as>by;
function tanksAt(x,y,me){for(const t of allTanks()){if(t===me||t.dead)continue;if(t.enemy&&t.spawn>0)continue;
  if(overlap(x,y,16,t.x,t.y,16)&&!overlap(me.x,me.y,16,t.x,t.y,16))return true}return false}
function allTanks(){return S.player&&!S.player.dead?[S.player,...S.enemies]:S.enemies}
function onIce(t){return cellAt(Math.floor((t.x+8)/C),Math.floor((t.y+8)/C))===ICE}

/* turn and step a tank; returns true if it moved */
function drive(t,dir,spd){
  if(dir!==t.dir){
    const vert=dir%2===0,wasVert=t.dir%2===0;
    if(vert!==wasVert){ /* snap to the 8 px grid on the other axis so tanks fit between walls */
      if(vert){const nx=Math.round(t.x/C)*C;if(boxFree(nx,t.y,16))t.x=nx}
      else{const ny=Math.round(t.y/C)*C;if(boxFree(t.x,ny,16))t.y=ny}
    }
    t.dir=dir;
  }
  let moved=false,left=spd;
  while(left>0){const s=Math.min(1,left);left-=s;
    const nx=t.x+DX[dir]*s,ny=t.y+DY[dir]*s;
    if(boxFree(nx,ny,16)&&!tanksAt(nx,ny,t)){t.x=nx;t.y=ny;moved=true}else break}
  if(moved)t.f^=(S.t%4===0?1:0);
  return moved;
}

/* ---------------------------------------------------------------- shooting */
function fire(t){
  if(t.cd>0||t.spawn>0)return;
  const max=!t.enemy&&t.lv>=2?2:1;
  if(S.bullets.filter(b=>b.owner===t).length>=max)return;
  const spd=t.enemy?TYPES[t.type].bs:(t.lv>=1?4:2.8);
  const cx=t.x+8+DX[t.dir]*7,cy=t.y+8+DY[t.dir]*7;
  S.bullets.push({x:cx-2,y:cy-2,dir:t.dir,spd,owner:t,enemy:t.enemy,steel:!t.enemy&&t.lv>=3});
  t.cd=t.enemy?30:(t.lv>=2?8:14);
  if(!t.enemy){SFX.shot();S.shots++;$('score').dataset.shots=S.shots}
}
function stepBullets(){
  for(const b of S.bullets){
    if(b.dead)continue;
    let left=b.spd;
    while(left>0&&!b.dead){const s=Math.min(1,left);left-=s;b.x+=DX[b.dir]*s;b.y+=DY[b.dir]*s;bulletHits(b)}
  }
  /* bullets cancel each other out */
  for(let i=0;i<S.bullets.length;i++)for(let j=i+1;j<S.bullets.length;j++){const a=S.bullets[i],c=S.bullets[j];
    if(!a.dead&&!c.dead&&a.enemy!==c.enemy&&overlap(a.x,a.y,4,c.x,c.y,4)){a.dead=c.dead=true;spark(a.x+2,a.y+2)}}
  S.bullets=S.bullets.filter(b=>!b.dead);
}
function bulletHits(b){
  const cx=b.x+2,cy=b.y+2;
  if(b.x<0||b.y<0||b.x+4>W||b.y+4>W){b.dead=true;spark(Math.max(2,Math.min(W-2,cx)),Math.max(2,Math.min(W-2,cy)));if(!b.enemy)SFX.steel();return}
  /* walls: the band of cells across the shot's path */
  const vert=b.dir%2===0;
  const hitCells=[];
  if(vert){const row=Math.floor((b.dir===0?b.y:b.y+3)/C);for(const xx of [cx-6,cx-1,cx+5]){const c=Math.floor(xx/C);if(!hitCells.some(h=>h[0]===c))hitCells.push([c,row])}}
  else{const col=Math.floor((b.dir===3?b.x:b.x+3)/C);for(const yy of [cy-6,cy-1,cy+5]){const r=Math.floor(yy/C);if(!hitCells.some(h=>h[1]===r))hitCells.push([col,r])}}
  /* only cells the bullet itself touches can stop it; neighbours in the band break along with it */
  const core=hitCells.filter(([c,r])=>{const v=cellAt(c,r);return (v===BRICK||v===STEEL)&&overlap(b.x,b.y,4,c*C,r*C,C)});
  if(core.length){
    let broke=false,clank=false;
    for(const [c,r] of hitCells){if(c<0||r<0||c>=NC||r>=NC)continue;const v=S.cells[r*NC+c];
      if(v===BRICK){S.cells[r*NC+c]=EMPTY;broke=true}
      else if(v===STEEL){if(b.steel){S.cells[r*NC+c]=EMPTY;broke=true}else clank=true}}
    b.dead=true;spark(cx,cy);
    if(!b.enemy){if(broke)SFX.brick();else if(clank)SFX.steel()}
    return;
  }
  /* the bunker */
  if(!S.baseDead&&overlap(b.x,b.y,4,BASE.x,BASE.y,16)){b.dead=true;baseHit();return}
  /* tanks */
  if(b.enemy){
    const p=S.player;
    if(p&&!p.dead&&overlap(b.x,b.y,4,p.x,p.y,16)){b.dead=true;if(p.shield>0){spark(cx,cy);return}killPlayer();}
  }else{
    for(const e of S.enemies){if(e.dead||e.spawn>0)continue;
      if(overlap(b.x,b.y,4,e.x,e.y,16)){b.dead=true;hitEnemy(e);return}}
  }
}
function hitEnemy(e){
  if(e.bonus){e.bonus=false;dropBonus()}
  e.hp--;e.flash=8;
  if(e.hp>0){SFX.hit();return}
  e.dead=true;S.kills[e.type]++;
  boom(e.x+8,e.y+8,true);SFX.boom();
  addScore(TYPES[e.type].pts,e.x+8,e.y+8);
  hud();
}
function killPlayer(){
  const p=S.player;p.dead=true;boom(p.x+8,p.y+8,true);SFX.big();
  S.lives--;hud();
  if(S.lives<=0){S.endT=120;S.mode='ending'}
  else{S.respawn=70}
}
function baseHit(){
  S.baseDead=true;boom(BASE.x+8,BASE.y+8,true);boom(BASE.x+4,BASE.y+10,true);SFX.big();
  S.endT=120;S.mode='ending';
}
function addScore(n,x,y){
  S.score=Math.min(9999999,S.score+n);
  if(x!==undefined)S.pops.push({x,y,txt:String(n),t:50});
  while(S.score>=S.nextLife){S.nextLife+=10000;if(S.lives<9){S.lives++;SFX.life()}}
  hud();
}
function spark(x,y){S.fx.push({x,y,t:10,big:false})}
function boom(x,y,big){S.fx.push({x,y,t:big?28:12,big})}

/* ---------------------------------------------------------------- bonuses */
function dropBonus(){
  const kind=BONUS[S.curBonusIx%BONUS.length];S.curBonusIx+=1+Math.floor(Math.random()*3);
  /* a free spot that is not the bunker and not the player's start */
  for(let tries=0;tries<60;tries++){
    const x=(1+Math.floor(Math.random()*11))*16,y=(1+Math.floor(Math.random()*10))*16;
    if(overlap(x,y,16,BASE.x-16,BASE.y-16,48))continue;
    S.bonus={kind,x,y,t:900};SFX.appear();return;
  }
}
function takeBonus(){
  const b=S.bonus,p=S.player;S.bonus=null;SFX.bonus();addScore(500,b.x+8,b.y+8);
  switch(b.kind){
    case 'star':p.lv=Math.min(3,p.lv+1);break;
    case 'shield':p.shield=600;break;
    case 'clock':S.freeze=480;break;
    case 'bomb':for(const e of S.enemies)if(!e.dead&&e.spawn<=0){e.dead=true;S.kills[e.type]++;boom(e.x+8,e.y+8,true)}SFX.big();hud();break;
    case 'fort':S.fort=900;ring(STEEL);break;
    case 'life':if(S.lives<9)S.lives++;SFX.life();hud();break;
  }
}

/* ---------------------------------------------------------------- enemies */
function spawnEnemies(){
  if(!S.reserve.length)return;
  if(S.spawnT>0){S.spawnT--;return}
  const alive=S.enemies.filter(e=>!e.dead).length;
  if(alive>=4)return;
  for(let k=0;k<3;k++){
    const sp=ESPAWN[(S.spawnIx+k)%3];
    if(allTanks().some(t=>!t.dead&&overlap(sp.x,sp.y,16,t.x,t.y,16)))continue;
    const r=S.reserve.shift();const e=newTank(sp.x,sp.y,2,true,r.type);e.bonus=r.bonus;
    if(r.bonus&&S.bonus)S.bonus=null;
    S.enemies.push(e);S.spawnIx=(S.spawnIx+k+1)%3;
    S.spawnT=Math.max(70,150-S.stage*8);hud();return;
  }
}
function stepEnemy(e){
  if(e.spawn>0){e.spawn--;return}
  if(e.flash>0)e.flash--;
  if(e.cd>0)e.cd--;
  if(S.freeze>0)return;
  const T=TYPES[e.type];
  e.think--;
  const moved=drive(e,e.dir,T.spd);
  if(!moved||e.think<=0){
    /* new direction: mostly towards the bunker, sometimes towards the player, sometimes anywhere */
    const r=Math.random(),p=S.player;let d;
    if(r<.45){const dx=BASE.x-e.x,dy=BASE.y-e.y;d=Math.abs(dx)>Math.abs(dy)&&Math.random()<.6?(dx>0?1:3):(dy>0?2:(dx>0?1:3))}
    else if(r<.7&&p&&!p.dead){const dx=p.x-e.x,dy=p.y-e.y;d=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0)}
    else d=Math.floor(Math.random()*4);
    if(!moved&&d===e.dir)d=(d+1+Math.floor(Math.random()*3))%4;
    e.dir=d;e.think=40+Math.random()*140;
    if(!moved&&Math.random()<.5)fire(e); /* shoot the wall in its way */
  }
  /* shoot: at random, more often when the player or the bunker is straight ahead */
  e.shotWait--;
  let want=Math.random()<T.rate;
  const p=S.player;
  if(p&&!p.dead&&lined(e,p.x,p.y))want=want||Math.random()<.05;
  if(lined(e,BASE.x,BASE.y))want=want||Math.random()<.04;
  if(want&&e.shotWait<=0){fire(e);e.shotWait=20}
}
function lined(e,x,y){
  const ex=e.x+8,ey=e.y+8,tx=x+8,ty=y+8;
  if(e.dir===0)return Math.abs(ex-tx)<8&&ty<ey;
  if(e.dir===2)return Math.abs(ex-tx)<8&&ty>ey;
  if(e.dir===1)return Math.abs(ey-ty)<8&&tx>ex;
  return Math.abs(ey-ty)<8&&tx<ex;
}

/* ---------------------------------------------------------------- main step */
function step(){
  S.t++;
  if(S.banner>0)S.banner--;
  for(const f of S.fx)f.t--;S.fx=S.fx.filter(f=>f.t>0);
  for(const q of S.pops){q.t--;q.y-=.3}S.pops=S.pops.filter(q=>q.t>0);
  if(S.mode!=='play'&&S.mode!=='ending')return;
  const p=S.player;
  /* player */
  if(p&&!p.dead&&S.mode==='play'){
    if(p.cd>0)p.cd--;if(p.shield>0)p.shield--;if(p.spawn>0)p.spawn--;
    const d=KEY.d;
    if(d>=0){p.moving=drive(p,d,1);p.slide=onIce(p)?24:0}
    else if(p.slide>0){p.slide--;if(!drive(p,p.dir,1))p.slide=0;p.moving=true}
    else p.moving=false;
    if(KEY.fire)fire(p);
    if(S.bonus&&overlap(p.x,p.y,16,S.bonus.x,S.bonus.y,16))takeBonus();
  }else if(p&&p.dead&&S.mode==='play'&&S.lives>0){
    S.respawn--;if(S.respawn<=0){const lv=0;S.player=newTank(PSPAWN.x,PSPAWN.y,0,false);S.player.lv=lv;S.player.shield=180;KEY.fire=false}
  }
  engineSet(!!(p&&!p.dead&&p.moving&&S.mode==='play'));
  if(S.mode==='play')spawnEnemies();
  for(const e of S.enemies)if(!e.dead)stepEnemy(e);
  S.enemies=S.enemies.filter(e=>!e.dead);
  stepBullets();
  if(S.freeze>0)S.freeze--;
  if(S.fort>0){S.fort--;if(S.fort===0)ring(BRICK);else if(S.fort<180)ring(Math.floor(S.fort/15)%2?STEEL:BRICK)}
  if(S.bonus){S.bonus.t--;if(S.bonus.t<=0)S.bonus=null}
  /* stage end */
  if(S.mode==='play'&&!S.reserve.length&&!S.enemies.length){S.mode='ending';S.endT=110;S.won=true}
  if(S.mode==='ending'){S.endT--;if(S.endT<=0)finish()}
}
function finish(){
  engineSet(false);KEY.fire=false;
  const won=S.won&&!S.baseDead&&S.lives>0;S.won=false;
  SAVE.best=Math.max(SAVE.best,S.score);
  if(won)SAVE.reached=Math.max(SAVE.reached,Math.min(99,S.stage+1));
  writeSave();
  const rows=Object.keys(TYPES).map(k=>`<canvas data-t="${k}" width="16" height="16"></canvas><span>${TYPES[k].name} · ${S.kills[k]} db</span><b>${S.kills[k]*TYPES[k].pts}</b>`).join('');
  if(won){
    S.mode='clear';
    showOv(`<h2>PÁLYA ${S.stage} · KÉSZ</h2><div class="tally">${rows}</div><p class="stat">${S.score} pont</p><p class="small">Rekord: ${SAVE.best}</p>
      <div class="btns"><button class="btn hot" id="ovNext">Következő pálya</button><button class="btn" id="ovMenu">Menü</button></div>`);
    $('ovNext').onclick=()=>{audio();startStage(S.stage+1,false)};
  }else{
    S.mode='over';SFX.over();
    showOv(`<h2 class="bad">VÉGE</h2><p>${S.baseDead?'Eltalálták a zászlós bunkert.':'Elfogyott minden tankod.'}</p><div class="tally">${rows}</div>
      <p class="stat">${S.score} pont</p><p class="small">Pálya: ${S.stage} · Rekord: ${SAVE.best}</p>
      <div class="btns"><button class="btn hot" id="ovNew">Új játék</button><button class="btn" id="ovRetry">Újra a ${S.stage}. pályától</button><button class="btn" id="ovMenu">Menü</button></div>`);
    $('ovNew').onclick=()=>{audio();startStage(1,true)};
    $('ovRetry').onclick=()=>{audio();startStage(S.stage,true)};
  }
  $('ovMenu').onclick=menu;
  document.querySelectorAll('.tally canvas').forEach(c=>{const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(getTank(c.dataset.t==='armor'?'a4':'enemy',c.dataset.t,0),0,0)});
}

/* ---------------------------------------------------------------- draw */
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,W);
  /* ground layer */
  for(let cy=0;cy<NC;cy++)for(let cx=0;cx<NC;cx++){
    const v=S.cells[cy*NC+cx],x=cx*C,y=cy*C;
    if(v===BRICK)ctx.drawImage(cellAt(cx,cy-1)===BRICK?BRICKC:BRICKH,x,y);
    else if(v===STEEL)ctx.drawImage(STEELC,x,y);
    else if(v===ICE)ctx.drawImage(ICEC,x,y);
    else if(v===WATER){const ph=Math.floor(S.t/30)%2;ctx.fillStyle='#1c50c8';ctx.fillRect(x,y,C,C);ctx.fillStyle='#6aa2ff';
      ctx.fillRect(x+((cx+ph)%2?1:4),y+2,3,1);ctx.fillRect(x+((cx+ph)%2?4:1),y+5,3,1)}
  }
  /* bunker */
  ctx.drawImage(S.baseDead?RUBBLE:FLAG,BASE.x,BASE.y);
  /* bonus */
  if(S.bonus&&(S.bonus.t>180||Math.floor(S.t/8)%2)){const b=S.bonus;ctx.fillStyle='#000';ctx.fillRect(b.x,b.y,16,16);
    ctx.strokeStyle=Math.floor(S.t/10)%2?'#ffd84a':'#ffffff';ctx.lineWidth=1;ctx.strokeRect(b.x+.5,b.y+.5,15,15);ctx.drawImage(BONUSSPR[b.kind],b.x+2,b.y+2)}
  /* tanks */
  for(const e of S.enemies)drawTank(e);
  if(S.player&&!S.player.dead)drawTank(S.player);
  /* bullets */
  ctx.fillStyle='#f4f4f4';
  for(const b of S.bullets){ctx.fillStyle=b.enemy?'#ffd0c0':'#ffffff';ctx.fillRect(Math.round(b.x),Math.round(b.y),4,4);ctx.fillStyle='#888';ctx.fillRect(Math.round(b.x)+1,Math.round(b.y)+1,2,2)}
  /* forest on top */
  for(let cy=0;cy<NC;cy++)for(let cx=0;cx<NC;cx++)if(S.cells[cy*NC+cx]===TREE)ctx.drawImage(TREEC,cx*C,cy*C);
  /* effects */
  for(const f of S.fx){
    const k=f.big?1-f.t/28:1-f.t/12,r=f.big?3+k*11:2+k*4;
    ctx.fillStyle=f.big?(k<.5?'#ffffff':'#ffb020'):'#ffffff';ctx.fillRect(Math.round(f.x-r),Math.round(f.y-r/2),Math.round(r*2),Math.round(r));ctx.fillRect(Math.round(f.x-r/2),Math.round(f.y-r),Math.round(r),Math.round(r*2));
    if(f.big){ctx.fillStyle='#d83a1a';ctx.fillRect(Math.round(f.x-r/3),Math.round(f.y-r/3),Math.round(r*.66),Math.round(r*.66))}
  }
  ctx.font='bold 8px "Chakra Petch",monospace';ctx.textAlign='center';

function drawTank(t){
  if(t.enemy&&t.spawn>0){ /* arrival sparkle */
    const k=Math.floor(t.spawn/4)%4,r=[2,4,6,4][k];ctx.fillStyle='#ffffff';
    ctx.fillRect(t.x+8-r,t.y+7,r*2,2);ctx.fillRect(t.x+7,t.y+8-r,2,r*2);ctx.fillRect(t.x+8-r/2,t.y+8-r/2,r,r);return}
  let pal='enemy';
  if(!t.enemy)pal=t.lv>=2?'player2':'player';
  else if(t.bonus&&Math.floor(S.t/8)%2)pal='bonus';
  else if(t.type==='armor')pal=t.hp>=4?'a4':t.hp===3?'a3':'a2';
  if(t.flash>0&&t.flash%2)pal='bonus';
  const img=getTank(pal,t.enemy?t.type:(t.lv>=3?'power':t.lv>=1?'armor':'basic'),t.f);
  ctx.save();ctx.translate(Math.round(t.x)+8,Math.round(t.y)+8);ctx.rotate(t.dir*Math.PI/2);ctx.drawImage(img,-8,-8);ctx.restore();
  if(!t.enemy&&t.shield>0){ /* shield shimmer */
    const ph=Math.floor(S.t/3)%2;ctx.strokeStyle=ph?'#ffffff':'#5fa8ff';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(Math.round(t.x)+8,Math.round(t.y)+8,10+ph,0,Math.PI*2);ctx.stroke()}
}

/* ---------------------------------------------------------------- input: the newest held direction wins */
function dirDown(d){KEY.stack=KEY.stack.filter(x=>x!==d);KEY.stack.push(d);KEY.d=d}
function dirUp(d){KEY.stack=KEY.stack.filter(x=>x!==d);KEY.d=KEY.stack.length?KEY.stack[KEY.stack.length-1]:-1}
function releaseAll(){KEY.stack=[];KEY.d=-1;KEY.fire=false;document.querySelectorAll('.on').forEach(b=>b.classList.remove('on'))}
const KD={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
addEventListener('keydown',e=>{
  if(e.code==='KeyP'||e.code==='Escape'){if(S.mode==='play')pause();else if(S.mode==='pause')resume();e.preventDefault();return}
  if(!$('ov').hidden)return;
  if(e.code in KD){e.preventDefault();audio();if(!e.repeat)dirDown(KD[e.code]);return}
  if(e.code==='Space'||e.code==='KeyJ'||e.code==='KeyK'||e.code==='Enter'){e.preventDefault();audio();KEY.fire=true}
});
addEventListener('keyup',e=>{
  if(e.code in KD)dirUp(KD[e.code]);

/* d-pad: slide the thumb between arrows without lifting it */
const dp=$('dpad');let dpId=null;
function dpAt(e){const r=dp.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
  if(Math.hypot(x,y)<14)return -1;return Math.abs(x)>Math.abs(y)?(x>0?1:3):(y>0?2:0)}
function dpSet(d){KEY.stack=d>=0?[d]:[];KEY.d=d;dp.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.d===d))}
dp.addEventListener('pointerdown',e=>{e.preventDefault();audio();dpId=e.pointerId;try{dp.setPointerCapture(e.pointerId)}catch(_){}dpSet(dpAt(e))});
dp.addEventListener('pointermove',e=>{if(e.pointerId===dpId)dpSet(dpAt(e))});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>dp.addEventListener(n,e=>{if(e.pointerId===dpId){dpId=null;dpSet(-1)}}));

/* ---------------------------------------------------------------- size and loop */
function fit(){
  const st=$('stage'),w=st.clientWidth-6,h=st.clientHeight-6;if(w<=0||h<=0)return;
  const s=Math.max(1,Math.min(w,h)/W);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(W*s)+'px';
  drawCabinet(st.clientWidth,st.clientHeight,Math.floor(W*s));
}
/* Játékgép-szekrény a csatatér körül: felirat felül, hangszóró és érmebedobó alul. Csak átméretezéskor rajzolódik. */
function drawCabinet(SW,SH,side){
  const b=$('bgcv'),dpr=Math.min(2,devicePixelRatio||1);b.width=Math.round(SW*dpr);b.height=Math.round(SH*dpr);
  const g=b.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  const top=(SH-side)/2,bot=top+side,cx=SW/2;
  const body=g.createLinearGradient(0,0,SW,0);body.addColorStop(0,'#14141a');body.addColorStop(.5,'#22222b');body.addColorStop(1,'#14141a');
  g.fillStyle=body;g.beginPath();g.roundRect?g.roundRect(0,0,SW,SH,14):g.rect(0,0,SW,SH);g.fill();
  g.fillStyle='#b8322a';g.fillRect(4,0,6,SH);g.fillRect(SW-10,0,6,SH);g.fillStyle='#e0a030';g.fillRect(12,0,3,SH);g.fillRect(SW-15,0,3,SH);
  if(top>40){const mh=Math.min(70,top-14),my=(top-mh)/2;
    const mg=g.createLinearGradient(0,my,0,my+mh);mg.addColorStop(0,'#3a1010');mg.addColorStop(1,'#1c0808');g.fillStyle=mg;g.fillRect(22,my,SW-44,mh);
    g.strokeStyle='#e0a030';g.lineWidth=2;g.strokeRect(23,my+1,SW-46,mh-2);
    g.fillStyle='#ffd34d';g.textAlign='center';g.textBaseline='middle';g.font=`700 ${Math.round(Math.min(30,mh*.42))}px "Bungee","Chakra Petch",system-ui,sans-serif`;
    g.shadowColor='#ff6a00';g.shadowBlur=10;g.fillText('PÁNCÉLOS ŐRSÉG',cx,my+mh/2+1);g.shadowBlur=0;
    for(let i=0;i<6;i++){g.fillStyle=i%2?'#e0a030':'#b8322a';g.fillRect(30+i*12,my+mh-8,8,3);g.fillRect(SW-38-i*12,my+mh-8,8,3)}}
  if(SH-bot>40){const y0=bot+12,h=SH-bot-24;
    g.fillStyle='#101015';g.fillRect(22,y0,SW-44,h);
    g.fillStyle='#2c2c36';for(let y=y0+8;y<y0+h-6;y+=8)for(let x=34;x<cx-30;x+=8){g.beginPath();g.arc(x,y,2,0,7);g.fill()}
    for(let y=y0+8;y<y0+h-6;y+=8)for(let x=cx+34;x<SW-30;x+=8){g.beginPath();g.arc(x,y,2,0,7);g.fill()}
    const cw=34,ch=Math.min(46,h-16),cy=y0+(h-ch)/2;g.fillStyle='#3a3a44';g.fillRect(cx-cw/2,cy,cw,ch);
    g.fillStyle='#ff4d3a';g.fillRect(cx-3,cy+8,6,Math.max(8,ch-30));g.fillStyle='#9a9aa6';g.fillRect(cx-10,cy+ch-12,20,4)}
}

let last=performance.now(),acc=0;
function frame(now){

  while(acc>=1000/FPS&&n<5){if(S.mode==='play'||S.mode==='ending')step();else S.t++;acc-=1000/FPS;n++}
  if(n===5)acc=0;
  draw();requestAnimationFrame(frame);
}

(function(){

<script>
/* @shared fekvo-jelzes */
/* Fekvő telefonon „Fordítsd el a telefont” jelzés. A játék álló képernyőre készült, ezért amíg a telefon
   fekszik, a jelzés eltakarja, és a játék a saját szünet-logikájával megáll (ugyanaz fut le, mint amikor
   a lap háttérbe kerül). Gépen, széles ablakban nem jelenik meg (csak érintőképernyőn, alacsony ablakban). */
(function(){
  var mq;
  try{ mq=matchMedia('(orientation: landscape) and (max-height: 500px) and (pointer: coarse)'); }catch(e){ return; }
  var st=document.createElement('style');
  st.textContent='.rotate-hint{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;padding:16px;'+
    'background:rgba(5,8,14,.95);color:#fff;font:700 20px/1.3 system-ui,sans-serif;text-align:center}'+
    '.rotate-hint[hidden]{display:none!important}.rotate-hint p{margin:8px 0}'+
    '.rotate-hint .sub{font-weight:400;font-size:16px;opacity:.85}.rotate-hint svg{width:56px;height:56px}';
  var el=document.createElement('div');
  el.className='rotate-hint';el.setAttribute('role','alert');el.hidden=true;
  el.innerHTML='<div><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2" '+
    'fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18.5" r="1" fill="currentColor"/></svg>'+
    '<p>Fordítsd el a telefont!</p><p class="sub">Ez a játék álló képernyőre készült. Addig szünetel.</p></div>';
  function pauseGame(){
    try{
      Object.defineProperty(document,'hidden',{configurable:true,get:function(){return true;}});
      document.dispatchEvent(new Event('visibilitychange'));
    }catch(e){}
    try{ delete document.hidden; }catch(e){}
  }
  function update(e){
    if(mq.matches){ if(el.hidden){ el.hidden=false; if(e) pauseGame(); } }
    else el.hidden=true;
  }
  document.head.appendChild(st);
  document.body.appendChild(el);
  if(mq.addEventListener) mq.addEventListener('change',update); else if(mq.addListener) mq.addListener(update);
  update();
})();
/* @end fekvo-jelzes */
</script>
