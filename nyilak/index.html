<style>
/* Elrendezés: egyképernyős álló logikai játék — vissza sáv, pontsor, tábla, súgó sor, ablakok */
:root{
  --bg:#0d1020; --panel:#161b33; --line:#2a3360; --fg:#eef1ff; --muted:#9aa3cc;
  --accent:#7c9cff; --gold:#fbbf24; --danger:#ff5d73; --dot:#2c3463;
  --display:"Bungee","Arial Black",system-ui,sans-serif;
  --ui:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto}
.hud{display:flex;align-items:center;gap:14px}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
#lvl{font-family:var(--display);color:var(--accent);font-size:22px}
#hearts{color:var(--danger);font-size:20px;letter-spacing:2px;white-space:nowrap}
#hearts .off{color:var(--line)}
.sp{flex:1}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;padding:0}
.icon svg{width:20px;height:20px;fill:currentColor}
.icon:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;touch-action:none}
canvas{position:absolute;left:0;top:0;display:block;touch-action:none}
.bar{display:flex;gap:8px;flex:none}
.bar button{flex:1}
.hint{margin:0;text-align:center;font-size:13px;color:var(--muted);flex:none}
@media (pointer:coarse),(hover:none){.hint.desk{display:none}}
#ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,8,18,.82);z-index:5;padding-inline:16px}
.card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 22px;background:var(--panel);border:1px solid var(--line);border-radius:16px;text-align:center;width:min(360px,100%);max-height:calc(100% - 32px);overflow:auto}
.card h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0;color:var(--accent);line-height:1.1}
.card h2.bad{color:var(--danger)}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.card b{color:var(--fg)}
.stars{font-size:40px;letter-spacing:6px;color:var(--gold);line-height:1}
.stars .off{color:var(--line)}
.btns{display:flex;flex-direction:column;gap:8px;width:100%}
.pick{display:grid;grid-template-columns:52px 1fr 52px;gap:6px;width:100%;align-items:center}
.pick span{font-weight:700;font-size:16px}
button.b{font-family:var(--ui);font-weight:700;font-size:16px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;min-height:44px}
button.b.hot{background:var(--accent);border-color:var(--accent);color:#0b1030}
button.b.sm{font-size:14px;padding:10px 6px}
button.b:disabled{opacity:.4;cursor:default}
button:not(:disabled):active{translate:0 1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app">
  <div class="top-bar" style="position:relative;z-index:1000;display:flex;flex-wrap:wrap;align-self:flex-start;align-items:center;gap:8px;margin:0"><a class="home-link" href="../index.html" style="display:inline-flex;align-self:flex-start;width:fit-content;align-items:center;gap:6px;margin:0;min-height:44px;min-width:44px;box-sizing:border-box;justify-content:center;padding:6px 14px;border-radius:999px;border:1px solid currentColor;color:inherit;opacity:.75;text-decoration:none;font:600 14px/1.2 system-ui,sans-serif">← Összes játék</a><button type="button" class="fs-btn" aria-label="Teljes képernyő" style="all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;justify-content:center;padding:6px 14px;border-radius:999px;border:1px solid currentColor;color:inherit;opacity:.75;cursor:pointer;font:600 14px/1.2 system-ui,sans-serif">⛶ Teljes képernyő</button><button type="button" class="hap-btn" aria-pressed="true" aria-label="Rezgés: be" style="all:unset;box-sizing:border-box;display:none;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:6px 10px;border-radius:999px;border:1px solid currentColor;color:inherit;opacity:.75;cursor:pointer;font:600 18px/1.2 system-ui,sans-serif">📳</button></div>

<script>
/* @shared kepesseg */
/* Modern böngészőképességek egy helyen. Mind opcionális: ha a böngésző nem tudja, vagy hibát ad, csendben nem
   történik semmi, a játék ugyanúgy játszható. Hálózatot nem használ, és a játék soha nem vár rá.
   A játék fő szkriptje ELŐTT kell betölteni, mert a játék a window.Kepesseg függvényeit hívja.
     Kepesseg.haptic(minta)   rövid rezgés telefonon (navigator.vibrate) és kontrolleren (vibrationActuator).
                              minta: 'tap' | 'hit' | 'hurt' | 'boom' | 'reward' | 'over', vagy ms, vagy ms-tömb.
                              Csak koppintás/gombnyomás után rezeg, van rá időkorlát, és ki lehet kapcsolni.
     Kepesseg.hapticsOn() / Kepesseg.setHaptics(be)   a közös rezgés-beállítás (localStorage: kepesseg:rezges).
       Ha az oldalon van .hap-btn gomb, az kapcsolja; csak ott látszik, ahol van mit rezegtetni.
     Kepesseg.wakeLock(be)    true: amíg tart a játék, a kijelző ne aludjon el; false: elengedi. Háttérbe tett
                              lap után magától újrakéri; 2 perc tétlenség után elengedi, a következő érintésre újra.
     Kepesseg.transition(fn)  fn a képernyőváltás DOM-módosítása; View Transitionnel fut, ha lehet, és nincs
                              csökkentett mozgás. Különben (vagy hibánál) azonnal fut. Az átmenet alatt (0,15 mp)
                              a böngésző nem ad át érintést, ezért csak ablak MEGJELENÉSÉRE használd; a játékba
                              visszavezető bezárás legyen azonnali, és hívja a Kepesseg.endTransition()-t.
     Kepesseg.quality(most)   képkockánként hívva a díszítő grafika szintje: 2 teljes, 1 kevesebb, 0 legkevesebb.
                              Csak látványra használd (részecske, háttér), játéklogikára soha.
     Tájolás: ha a <head>-ben <meta name="games:orientation" content="portrait"> (vagy landscape) áll, és a
       készülék már így áll, teljes képernyőn ebben rögzíti (nem fordul el véletlenül), kilépéskor felold.
       Ha másképp áll, nem zárol és nem forgat; ilyenkor a CSS-es elrendezés és a fekvo-jelzes segít. */
(function(){
  if(window.Kepesseg)return;
  var d=document,nav=navigator,noop=function(){};
  function now(){return (window.performance&&performance.now)?performance.now():Date.now()}
  function mq(q){try{return matchMedia(q).matches}catch(e){return false}}
  function calm(){return mq('(prefers-reduced-motion: reduce)')}
  function quiet(p){try{if(p&&typeof p.then==='function')p.then(noop,noop)}catch(e){}return p}

  /* ---------- rezgés ---------- */
  var KEY='kepesseg:rezges',PAT={tap:[10],hit:[20],hurt:[45],boom:[70],reward:[25,50,25],over:[40,60,40]};
  var POW={tap:.25,hit:.45,hurt:.8,boom:1,reward:.5,over:.7},RANK={tap:0,hit:1,reward:2,hurt:3,boom:3,over:4};
  var on=true,last=-1e9,busy=0,busyRank=-1;
  try{on=localStorage.getItem(KEY)!=='0'}catch(e){}
  function pattern(m){
    var p=typeof m==='string'?PAT[m]:typeof m==='number'?[m]:Array.isArray(m)?m:null,out=[],sum=0;
    if(!p)return null;
    for(var i=0;i<p.length&&i<7;i++){var v=+p[i];if(!(v>=0))return null;v=Math.min(200,Math.round(v));
      if(i%2===0){if(sum+v>400)v=400-sum;sum+=v}out.push(v)}
    return sum>0?out:null;
  }
  function pads(){
    var r=[];try{var g=nav.getGamepads?nav.getGamepads():[];for(var i=0;i<g.length;i++)
      if(g[i]&&g[i].connected!==false&&(g[i].vibrationActuator||(g[i].hapticActuators&&g[i].hapticActuators[0])))r.push(g[i])}catch(e){}
    return r;
  }
  function phone(){return typeof nav.vibrate==='function'&&mq('(pointer: coarse)')}
  function rumble(gp,ms,pow){
    try{
      var a=gp.vibrationActuator;
      if(a&&typeof a.playEffect==='function'){
        var t=(a.effects&&a.effects.indexOf&&a.effects.indexOf('dual-rumble')<0&&a.effects.indexOf('trigger-rumble')<0)?a.effects[0]:'dual-rumble';
        quiet(a.playEffect(t||'dual-rumble',{startDelay:0,duration:ms,strongMagnitude:pow,weakMagnitude:Math.min(1,pow+.2)}));
      }else if(gp.hapticActuators&&gp.hapticActuators[0]&&gp.hapticActuators[0].pulse){
        quiet(gp.hapticActuators[0].pulse(pow,ms));
      }
    }catch(e){}
  }
  function haptic(m){
    if(!on)return false;
    try{var ua=nav.userActivation;if(ua&&!ua.hasBeenActive)return false}catch(e){}
    var p=pattern(m);if(!p)return false;
    var t=now(),rk=typeof m==='string'?RANK[m]:1,total=0;
    if(t-last<70)return false;                       /* sűrű eseményeknél nem rezeg minden alkalommal */
    if(t<busy&&rk<=busyRank)return false;            /* gyengébb jelzés nem szakítja meg az erősebbet */
    for(var i=0;i<p.length;i++)total+=p[i];
    last=t;busy=t+total;busyRank=rk;
    var did=false,gs=pads(),pow=typeof m==='string'?POW[m]:.5;
    if(gs.length){
      var off=0;did=true;
      for(var j=0;j<p.length;j+=2){(function(ms,at){
        if(at===0)gs.forEach(function(g){rumble(g,ms,pow)});
        else setTimeout(function(){if(on)pads().forEach(function(g){rumble(g,ms,pow)})},at);
      })(p[j],off);off+=p[j]+(p[j+1]||0)}
    }
    if(phone()){try{did=nav.vibrate(p.length===1?p[0]:p)!==false||did}catch(e){}}
    return did;
  }
  function stop(){busy=0;try{if(typeof nav.vibrate==='function')nav.vibrate(0)}catch(e){}
    pads().forEach(function(g){try{var a=g.vibrationActuator;if(a&&a.reset)quiet(a.reset())}catch(e){}})}
  function setHaptics(v){on=!!v;try{localStorage.setItem(KEY,on?'1':'0')}catch(e){}if(!on)stop();label()}
  var btn=null;
  function label(){
    if(!btn)return;
    btn.textContent=on?'📳':'📴';btn.setAttribute('aria-pressed',on?'true':'false');
    btn.setAttribute('aria-label',on?'Rezgés: be':'Rezgés: ki');btn.title=on?'Rezgés: be':'Rezgés: ki';
    btn.style.opacity=on?'.75':'.45';
  }
  function showBtn(){
    if(!btn)return;
    btn.style.display=(phone()||pads().length)?'inline-flex':'none';
    /* ha nem fér ki egy sorba, a teljes képernyő gomb csak ikont mutat (ugyanaz a data-compact jelzés, amit a gomb szkriptje is ismer) */
    var fs=d.querySelector('.fs-btn'),first=btn.parentNode&&btn.parentNode.firstElementChild;
    if(fs&&first&&btn.style.display!=='none'&&btn.offsetTop>first.offsetTop+4){fs.dataset.compact='1';fs.textContent='⛶'}
  }
  function initBtn(){
    btn=d.querySelector('.hap-btn');if(!btn)return;
    btn.addEventListener('click',function(){setHaptics(!on);if(on)haptic('hit');btn.blur()});
    label();showBtn();
  }
  addEventListener('gamepadconnected',showBtn);addEventListener('gamepaddisconnected',showBtn);

  /* ---------- ébren tartás (Screen Wake Lock) ---------- */
  var IDLE=120000,want=false,lock=null,pending=false,lastUse=0,timer=0;
  function wlRequest(){
    if(!want||lock||pending||d.visibilityState!=='visible')return;
    var w=nav.wakeLock;if(!w||typeof w.request!=='function')return;
    pending=true;
    try{
      w.request('screen').then(function(s){
        pending=false;
        if(!want||!s){try{s&&quiet(s.release())}catch(e){}return}
        lock=s;try{s.addEventListener('release',function(){if(lock===s)lock=null})}catch(e){}
      },function(){pending=false});
    }catch(e){pending=false}
  }
  function wlRelease(){var s=lock;lock=null;if(s)try{quiet(s.release())}catch(e){}}
  function used(){lastUse=now();if(want&&!lock)wlRequest()}
  function tick(){if(lock&&now()-lastUse>IDLE)wlRelease()}
  function wakeLock(v){
    want=!!v;lastUse=now();
    if(want){wlRequest();if(!timer)timer=setInterval(tick,15000)}
    else{wlRelease();if(timer){clearInterval(timer);timer=0}}
  }
  d.addEventListener('visibilitychange',function(){if(d.visibilityState==='visible'){lastUse=now();wlRequest()}});
  ['pointerdown','keydown','touchstart'].forEach(function(ev){addEventListener(ev,used,{capture:true,passive:true})});
  addEventListener('pagehide',function(){wlRelease();oriUnlock()});

  /* ---------- képernyőváltás (View Transitions) ---------- */
  var vt=null,vtCss=false;
  function transition(fn){
    var done=false,run=function(){if(done)return;done=true;
      try{fn()}catch(e){setTimeout(function(){throw e},0)}};   /* a játék hibája ne vesszen el */
    /* betöltés közben (első képernyő) nincs mit átúsztatni */
    if(typeof d.startViewTransition!=='function'||calm()||d.visibilityState!=='visible'||d.readyState!=='complete'){run();return}
    if(!vtCss){vtCss=true;try{var st=d.createElement('style');
      st.textContent='::view-transition-old(root),::view-transition-new(root){animation-duration:.15s}';d.head.appendChild(st)}catch(e){}}
    try{
      var t=d.startViewTransition(run);vt=t;
      var clear=function(){if(vt===t)vt=null};
      quiet(t.ready);quiet(t.updateCallbackDone);
      if(t.finished&&t.finished.then)t.finished.then(clear,clear);
    }catch(e){run()}
    if(!done)setTimeout(run,250);                     /* ha a böngésző nem futtatná le, akkor is megtörténik */
  }
  /* a futó átmenet azonnali vége: bezáráskor és bármilyen érintésre, gombnyomásra, hogy a játék ne várjon rá */
  function endTransition(){var t=vt;vt=null;if(t)try{t.skipTransition()}catch(e){}}
  ['pointerdown','keydown'].forEach(function(ev){addEventListener(ev,function(){if(vt)endTransition()},{capture:true,passive:true})});

  /* ---------- tájolás (Screen Orientation) ---------- */
  var ori=null,oriLocked=false;
  function oriPref(){var m=d.querySelector('meta[name="games:orientation"]'),v=m&&m.getAttribute('content');
    return v==='portrait'||v==='landscape'?v:null}
  function oriLock(){
    var o=window.screen&&screen.orientation,p=ori||(ori=oriPref());
    if(!p||!o||typeof o.lock!=='function')return;
    if(String(o.type||'').split('-')[0]!==p)return;   /* csak a már meglévő tájolást rögzíti: soha nem forgatja el a képet */
    try{var r=o.lock(p);oriLocked=true;if(r&&r.then)r.then(noop,function(){oriLocked=false})}catch(e){oriLocked=false}
  }
  function oriUnlock(){
    if(!oriLocked)return;oriLocked=false;
    try{var o=window.screen&&screen.orientation;if(o&&typeof o.unlock==='function')o.unlock()}catch(e){}
  }
  function fsChange(){if(d.fullscreenElement||d.webkitFullscreenElement)oriLock();else oriUnlock()}
  d.addEventListener('fullscreenchange',fsChange);d.addEventListener('webkitfullscreenchange',fsChange);

  /* ---------- adaptív grafikai minőség ---------- */
  var Q={lvl:2,t:0,acc:0,n:0,bad:0,good:0,changed:-1e9,ups:0,hot:false,watch:false,forced:null};
  function watchPressure(){
    Q.watch=true;
    try{if(typeof window.PressureObserver==='function'){
      var po=new window.PressureObserver(function(rs){var s=rs&&rs.length&&rs[rs.length-1].state;Q.hot=s==='serious'||s==='critical'});
      quiet(po.observe('cpu'));
    }}catch(e){}
  }
  function level(){var l=Q.forced!=null?Q.forced:Q.lvl;return calm()?Math.min(l,1):l}
  function quality(t){
    if(typeof t!=='number'||!isFinite(t))return level();
    if(!Q.watch)watchPressure();
    var dt=t-Q.t;Q.t=t;
    if(!(dt>0)||dt>250)return level();               /* szünet, háttér: nem mérjük */
    Q.acc+=dt;Q.n++;
    if(Q.acc>=1000){
      var avg=Q.acc/Q.n;Q.acc=0;Q.n=0;
      Q.bad=(avg>24||Q.hot)?Q.bad+1:0;Q.good=(avg<18&&!Q.hot)?Q.good+1:0;
      if(t-Q.changed>4000){
        if(Q.bad>=3&&Q.lvl>0){Q.lvl--;Q.changed=t;Q.bad=Q.good=0}   /* 3 lassú másodperc egymás után: egy rövid akadás nem számít */
        else if(Q.good>=15&&Q.lvl<2&&Q.ups<2){Q.lvl++;Q.ups++;Q.changed=t;Q.good=0}   /* ritkán, és csak kétszer lép vissza */
      }
    }
    return level();
  }
  function setQuality(l){Q.forced=(l===0||l===1||l===2)?l:null}

  window.Kepesseg={haptic:haptic,hapticsOn:function(){return on},setHaptics:setHaptics,wakeLock:wakeLock,
    wakeLockHeld:function(){return !!lock},transition:transition,endTransition:endTransition,quality:quality,setQuality:setQuality};
  if(d.readyState==='loading')d.addEventListener('DOMContentLoaded',initBtn);else initBtn();
})();
/* @end kepesseg */
</script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const HEARTS=3,HINTS=3,MAXLVL=9999;
const COLORS=['#7c9cff','#4ade80','#fbbf24','#f472b6','#38bdf8','#fb923c','#a78bfa','#2dd4bf','#f87171','#a3e635'];

// ---------- Pálya-generátor ----------
// A pálya véletlen kígyózó nyilakból áll (farok → fej). Egy nyíl akkor csúszik ki, ha a feje előtt a tábla
// széléig üres az út. Mivel kivétellel csak hely szabadul fel, a mohó próba (amíg van szabad nyíl, vedd ki)
// pontosan megmondja, megoldható-e a pálya. Az elakadt nyilakat a generátor megfordítja vagy elhagyja,
// így minden pálya megoldható. A pálya a szintszámból (seed) mindig ugyanúgy jön létre.
function rng(seed){return ()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function levelSpec(lvl){
  return {w:Math.min(9,4+Math.floor((lvl+1)/3)),h:Math.min(12,5+Math.floor(lvl/2)),maxLen:Math.min(8,3+Math.floor(lvl/3))};
}
function headDir(cells){const n=cells.length,a=cells[n-2],b=cells[n-1];return [b[0]-a[0],b[1]-a[1]]}
// Az első foglalt mező indexe a fej előtt (vagy -1, ha szabad az út a szélig), és hány lépés odáig.
function rayHit(cells,dir,occ,w,h){
  let [x,y]=cells[cells.length-1],k=0;
  for(;;){x+=dir[0];y+=dir[1];k++;if(x<0||y<0||x>=w||y>=h)return {id:-1,k};const o=occ[y*w+x];if(o>=0)return {id:o,k}}
}
function selfBlocked(cells,w,h){
  const own=new Array(w*h).fill(-1);cells.forEach(([x,y])=>own[y*w+x]=0);
  return rayHit(cells,headDir(cells),own,w,h).id>=0;
}
function greedy(arrows,w,h){
  const occ=new Array(w*h).fill(-1),left=new Set();
  arrows.forEach((a,i)=>{left.add(i);a.cells.forEach(([x,y])=>occ[y*w+x]=i)});
  const order=[];let moved=true;
  while(moved){moved=false;
    for(const i of [...left]){const a=arrows[i];if(rayHit(a.cells,a.dir,occ,w,h).id<0){left.delete(i);order.push(i);a.cells.forEach(([x,y])=>occ[y*w+x]=-1);moved=true}}}
  return {order,stuck:[...left]};
}
// Több (GEN_TRIES) jelöltből a legjobbat adja: minél teljesebb tábla, magasabb szinten kevesebb azonnal szabad nyíl.
const GEN_TRIES=8;
function generate(lvl){
  let best=null,bs=-1e9;
  for(let t=0;t<GEN_TRIES;t++){
    const p=build(lvl,lvl*7919+101+t*104729),n=p.arrows.length;if(!n)continue;
    const used=p.arrows.reduce((s,a)=>s+a.cells.length,0),occ=new Array(p.w*p.h).fill(-1);
    p.arrows.forEach(a=>a.cells.forEach(([x,y])=>occ[y*p.w+x]=a.id));
    const free=p.arrows.filter(a=>rayHit(a.cells,a.dir,occ,p.w,p.h).id<0).length;
    const sc=used/(p.w*p.h)-(lvl>3?.5*free/n:0);
    if(sc>bs){bs=sc;best=p}
  }
  return best;
}
function build(lvl,seed){
  const {w,h,maxLen}=levelSpec(lvl),R=rng(seed);
  const occ=new Array(w*h).fill(-1);let arrows=[];
  const cells=[...Array(w*h).keys()];
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}
  for(const start of cells){
    if(occ[start]>=0)continue;
    const id=arrows.length,target=2+Math.floor(R()*(maxLen-1));
    const path=[[start%w,Math.floor(start/w)]];occ[start]=id;
    let dir=null;
    while(path.length<target){
      const [x,y]=path[path.length-1];
      const opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>=0&&ny>=0&&nx<w&&ny<h&&occ[ny*w+nx]<0});
      if(!opts.length)break;
      let d=opts[Math.floor(R()*opts.length)];
      if(dir&&R()<.45&&opts.some(o=>o[0]===dir[0]&&o[1]===dir[1]))d=dir;   // kicsit egyenesebb nyilak
      dir=d;path.push([x+d[0],y+d[1]]);occ[(y+d[1])*w+x+d[0]]=id;
    }
    const free=()=>path.forEach(([x,y])=>occ[y*w+x]=-1);
    if(path.length<2){free();continue}
    let c=path;
    if(selfBlocked(c,w,h)){c=path.slice().reverse();if(selfBlocked(c,w,h)){free();continue}}
    arrows.push({cells:c,dir:headDir(c),flipped:false});
  }
  // javítás: amíg van elakadt nyíl, egyet megfordítunk (egyszer) vagy elhagyunk
  for(let guard=0;guard<500;guard++){
    const {stuck}=greedy(arrows,w,h);
    if(!stuck.length)break;
    const i=stuck[Math.floor(R()*stuck.length)],a=arrows[i],rev=a.cells.slice().reverse();
    if(!a.flipped&&!selfBlocked(rev,w,h)){a.cells=rev;a.dir=headDir(rev);a.flipped=true}
    else arrows.splice(i,1);
  }
  arrows=arrows.map((a,i)=>({id:i,cells:a.cells,dir:a.dir}));
  return {lvl,w,h,arrows};
}
// ---------- vége: generátor ----------

let G=null,unlocked=1,sound=true,actx=null,raf=0,cell=0,ox=0,oy=0,W=0,H=0,dpr=1,cursor=null,kbd=false;
const anims=[],flashes=[];

// ---------- mentés (csak localStorage) ----------
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
sound=lsGet('nyilak-sound')!=='0';
function loadProg(){
  try{const d=JSON.parse(lsGet('nyilak-prog'));
    if(d&&typeof d==='object'&&!Array.isArray(d)){
      const u=Number.isInteger(d.max)&&d.max>=1&&d.max<=MAXLVL?d.max:1,st={};
      if(d.stars&&typeof d.stars==='object'&&!Array.isArray(d.stars))for(const k of Object.keys(d.stars)){const n=+k,v=d.stars[k];if(Number.isInteger(n)&&n>=1&&n<=MAXLVL&&Number.isInteger(v)&&v>=1&&v<=3)st[n]=v}
      return {max:u,stars:st};
    }}catch(e){}
  return {max:1,stars:{}};
}
let prog=loadProg();unlocked=prog.max;
let pickLvl=unlocked;
function saveProg(){lsSet('nyilak-prog',JSON.stringify({max:prog.max,stars:prog.stars}))}
function save(){
  if(!G||G.phase!=='play')return;
  lsSet('nyilak-save',JSON.stringify({v:1,lvl:G.lvl,gone:G.arrows.filter(a=>a.gone).map(a=>a.id),hearts:G.hearts,hints:G.hints,miss:G.miss}));
}
function loadSave(){
  try{
    const d=JSON.parse(lsGet('nyilak-save'));
    if(!d||typeof d!=='object'||d.v!==1)return null;
    if(!Number.isInteger(d.lvl)||d.lvl<1||d.lvl>MAXLVL||d.lvl>prog.max)return null;
    if(!Number.isInteger(d.hearts)||d.hearts<1||d.hearts>HEARTS)return null;
    if(!Number.isInteger(d.hints)||d.hints<0||d.hints>HINTS)return null;
    if(typeof d.miss!=='boolean'||!Array.isArray(d.gone))return null;
    const p=generate(d.lvl),n=p.arrows.length;
    if(!d.gone.every(i=>Number.isInteger(i)&&i>=0&&i<n)||new Set(d.gone).size!==d.gone.length||d.gone.length>=n)return null;
    if(!validSet(p,new Set(d.gone)))return null;   // csak kirakható állás fogadható el
    return {p,d};
  }catch(e){return null}
}
function validSet(p,gone){
  const occ=occOf(p,new Set()),left=new Set(gone);let moved=true;
  while(moved&&left.size){moved=false;for(const i of [...left]){const a=p.arrows[i];if(rayHit(a.cells,a.dir,occ,p.w,p.h).id<0){left.delete(i);a.cells.forEach(([x,y])=>occ[y*p.w+x]=-1);moved=true}}}
  return !left.size;
}
function occOf(p,gone){const o=new Array(p.w*p.h).fill(-1);p.arrows.forEach(a=>{if(!gone.has(a.id))a.cells.forEach(([x,y])=>o[y*p.w+x]=a.id)});return o}

// ---------- hang (Web Audio) ----------
function beep(f,d=0.06,type='square',v=0.05,at=0){
  if(!sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+at;
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+0.02);
  }catch(e){}
}
function sndIcon(){
  $('sndIcon').innerHTML=sound
    ?'<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z"/>'
    :'<path d="M3 9v6h4l5 5V4L7 9H3zm18.4 6L20 16.4l-2.6-2.6-2.6 2.6L13.4 15l2.6-2.6-2.6-2.6 1.4-1.4 2.6 2.6 2.6-2.6 1.4 1.4-2.6 2.6z"/>';
  $('snd').setAttribute('aria-pressed',sound?'true':'false');
}
$('snd').addEventListener('click',()=>{sound=!sound;lsSet('nyilak-sound',sound?'1':'0');sndIcon();beep(660)});
sndIcon();

// ---------- játék ----------
function startLevel(lvl,d){
  const p=d?d.p:generate(lvl);
  G={lvl:p.lvl,w:p.w,h:p.h,arrows:p.arrows.map(a=>({...a,gone:false})),hearts:HEARTS,hints:HINTS,miss:false,phase:'play',hint:-1,occ:null};
  if(d){d.d.gone.forEach(i=>G.arrows[i].gone=true);G.hearts=d.d.hearts;G.hints=d.d.hints;G.miss=d.d.miss}
  G.occ=occOf(G,new Set(G.arrows.filter(a=>a.gone).map(a=>a.id)));
  anims.length=0;flashes.length=0;cursor=null;
  hideOv();layout();hud();save();kick();
}
function leftCount(){return G?G.arrows.filter(a=>!a.gone).length:0}
function tap(id){
  if(!G||G.phase!=='play')return;
  const a=G.arrows[id];if(!a||a.gone)return;
  const hit=rayHit(a.cells,a.dir,G.occ,G.w,G.h);
  if(G.hint===id)G.hint=-1;
  if(hit.id<0){
    a.gone=true;a.cells.forEach(([x,y])=>G.occ[y*G.w+x]=-1);
    const extra=Math.ceil(Math.max(W,H)/Math.max(cell,1))+2;
    anims.push({id,t0:performance.now(),dist:hit.k+a.cells.length+extra,bump:0});
    beep(520+Math.min(400,a.cells.length*40),0.07,'triangle',0.06);
    if(G.hint>=0&&G.arrows[G.hint].gone)G.hint=-1;
    if(!leftCount())win();else save();
  }else{
    G.hearts--;G.miss=true;
    anims.push({id,t0:performance.now(),dist:0,bump:Math.max(0.3,hit.k-1+0.3)});
    flashes.push({ids:[id,hit.id],t0:performance.now()});
    beep(180,0.15,'sawtooth',0.06);Kepesseg.haptic(60);
    if(G.hearts<=0)lose();else save();
  }
  hud();kick();
}
function win(){
  G.phase='won';lsDel('nyilak-save');
  const stars=G.miss?(G.hearts>=2?2:1):3;
  if(!prog.stars[G.lvl]||prog.stars[G.lvl]<stars)prog.stars[G.lvl]=stars;
  if(G.lvl>=prog.max&&G.lvl<MAXLVL)prog.max=G.lvl+1;
  unlocked=prog.max;pickLvl=Math.min(G.lvl+1,MAXLVL);saveProg();
  beep(660,0.08,'triangle',0.06,0.15);beep(880,0.08,'triangle',0.06,0.25);beep(1175,0.18,'triangle',0.06,0.35);
  setTimeout(()=>{if(G&&G.phase==='won')showWin(stars)},700);
}
function lose(){
  G.phase='lost';lsDel('nyilak-save');
  beep(220,0.25,'sawtooth',0.06,0.15);
  setTimeout(()=>{if(G&&G.phase==='lost')showLost()},700);
}
function hint(){
  if(!G||G.phase!=='play'||G.hints<=0)return;
  if(G.hint>=0&&!G.arrows[G.hint].gone){kick();return}   // a mostani súgás még áll
  const free=G.arrows.filter(a=>!a.gone&&rayHit(a.cells,a.dir,G.occ,G.w,G.h).id<0);
  if(!free.length)return;
  G.hint=free[0].id;G.hints--;beep(990,0.06,'sine',0.05);save();hud();kick();
}
function pause(){if(!G||G.phase!=='play')return;G.phase='pause';save();showPause()}
function resume(){if(!G||G.phase!=='pause')return;G.phase='play';hideOv();kick()}
function hud(){
  $('lvl').textContent=G?G.lvl:pickLvl;
  const h=G?G.hearts:HEARTS;
  $('hearts').innerHTML='♥'.repeat(Math.max(0,h))+'<span class="off">'+'♥'.repeat(Math.max(0,HEARTS-h))+'</span>';
  $('hearts').setAttribute('aria-label',h+' szív');
  $('left').textContent=leftCount();
  $('hintN').textContent=G?G.hints:HINTS;
  $('hintBtn').disabled=!G||G.hints<=0||G.phase!=='play';
}

// ---------- rajz ----------
function layout(){
  const r=$('stage').getBoundingClientRect();
  if(r.width<10||r.height<10)return;
  W=r.width;H=r.height;dpr=window.devicePixelRatio||1;
  cv.style.width=W+'px';cv.style.height=H+'px';cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  if(G){cell=Math.floor(Math.min((W-8)/G.w,(H-8)/G.h,64));ox=Math.round((W-cell*G.w)/2);oy=Math.round((H-cell*G.h)/2)}
  draw();
}
new ResizeObserver(layout).observe($('stage'));
function kick(){if(!raf)raf=requestAnimationFrame(loop)}
function loop(){
  raf=0;draw();
  const now=performance.now();
  for(let i=anims.length-1;i>=0;i--)if(now-anims[i].t0>animDur(anims[i]))anims.splice(i,1);
  for(let i=flashes.length-1;i>=0;i--)if(now-flashes[i].t0>500)flashes.splice(i,1);
  if(anims.length||flashes.length||(G&&G.hint>=0))kick();
}
const SPEED=26;                               // mező/másodperc kicsúszáskor
function animDur(a){return a.bump?a.bump/14*2000:a.dist/SPEED*1000}
function animPos(a,now){
  const t=(now-a.t0)/1000;
  if(a.bump){const half=a.bump/14,u=Math.min(t,2*half);return u<half?u*14:(2*half-u)*14}
  return Math.min(a.dist,t*SPEED);
}
const cx=x=>ox+(x+.5)*cell,cy=y=>oy+(y+.5)*cell;
// A nyíl pályája: saját mezői (farok → fej), aztán a fej irányában tovább. p eltolásnál a nyíl a [p, p+len-1] szakaszon áll.
function trackPt(a,s){
  const n=a.cells.length;
  if(s<=n-1){const i=Math.floor(s),f=s-i,A=a.cells[i],B=a.cells[Math.min(n-1,i+1)];return [A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f]}
  const hd=a.cells[n-1],k=s-(n-1);return [hd[0]+a.dir[0]*k,hd[1]+a.dir[1]*k];
}
function arrowPath(a,p){
  const n=a.cells.length,pts=[trackPt(a,p)];
  for(let s=Math.floor(p)+1;s<p+n-1;s++)pts.push(trackPt(a,s));
  pts.push(trackPt(a,p+n-1));return pts;
}
function drawArrow(a,p,col,glow){
  const pts=arrowPath(a,p),lw=Math.max(3,cell*.26);
  const hp=pts[pts.length-1],hx=cx(hp[0]),hy=cy(hp[1]),[dx,dy]=a.dir;
  ctx.lineCap='round';ctx.lineJoin='round';
  if(glow){ctx.strokeStyle=glow;ctx.lineWidth=lw+cell*.22;line(pts,hx-dx*cell*.2,hy-dy*cell*.2);ctx.stroke()}
  ctx.strokeStyle=col;ctx.lineWidth=lw;line(pts,hx-dx*cell*.2,hy-dy*cell*.2);ctx.stroke();
  // nyílhegy
  const s=cell*.36,bx=hx-dx*s*.55,by=hy-dy*s*.55;
  ctx.fillStyle=glow||col;
  if(glow){ctx.beginPath();tri(hx+dx*cell*.08,hy+dy*cell*.08,bx-dx*cell*.08,by-dy*cell*.08,dx,dy,s+cell*.12);ctx.fill()}
  ctx.fillStyle=col;ctx.beginPath();tri(hx,hy,bx,by,dx,dy,s);ctx.fill();
}
function line(pts,ex,ey){ctx.beginPath();pts.forEach((q,i)=>{const x=cx(q[0]),y=cy(q[1]);if(i===pts.length-1)ctx.lineTo(ex,ey);else if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)})}
function tri(hx,hy,bx,by,dx,dy,s){const px=-dy,py=dx;ctx.moveTo(hx+dx*s*.5,hy+dy*s*.5);ctx.lineTo(bx+px*s*.62,by+py*s*.62);ctx.lineTo(bx-px*s*.62,by-py*s*.62);ctx.closePath()}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function draw(){
  if(!W)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  if(!G||!cell)return;
  const now=performance.now();
  // üres mezők pöttyei
  ctx.fillStyle=css('--dot')||'#2c3463';
  for(let y=0;y<G.h;y++)for(let x=0;x<G.w;x++){ctx.beginPath();ctx.arc(cx(x),cy(y),Math.max(1.5,cell*.07),0,7);ctx.fill()}
  const red=new Set();flashes.forEach(f=>{if(Math.floor((now-f.t0)/100)%2===0)f.ids.forEach(i=>red.add(i))});
  const moving=new Map();anims.forEach(a=>moving.set(a.id,a));
  const pulse=.45+.35*Math.sin(now/180);
  for(const a of G.arrows){
    const m=moving.get(a.id);
    if(a.gone&&!m)continue;
    const p=m?animPos(m,now):0;
    const col=red.has(a.id)?(css('--danger')||'#ff5d73'):COLORS[a.id%COLORS.length];
    const glow=G.hint===a.id?`rgba(255,255,255,${pulse})`:null;
    drawArrow(a,p,col,glow);
  }
  if(kbd&&cursor&&G.phase==='play'){
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.setLineDash([5,4]);
    ctx.strokeRect(ox+cursor[0]*cell+2,oy+cursor[1]*cell+2,cell-4,cell-4);ctx.setLineDash([]);
  }
}

// ---------- ablakok ----------
const ov=$('ov'),card=$('card');
function showOv(html){card.innerHTML=html;ov.hidden=false;const h=card.querySelector('.hot');if(h)h.focus({preventScroll:true})}
function hideOv(){ov.hidden=true;if(document.activeElement&&ov.contains(document.activeElement))document.activeElement.blur()}
function starsHTML(n){return '<div class="stars" aria-label="'+n+' csillag">'+'★'.repeat(n)+'<span class="off">'+'★'.repeat(3-n)+'</span></div>'}
function showMenu(){
  const s=loadSave();
  pickLvl=Math.max(1,Math.min(pickLvl,unlocked));
  const st=prog.stars[pickLvl];
  showOv(`<h2>Nyilak</h2><p>Koppints egy nyílra: ha előtte <b>szabad az út</b>, kicsúszik. Ha valami útban van, elveszítesz egy <b>szívet</b>. Ürítsd ki a táblát!</p>
  <div class="pick"><button class="b sm" type="button" data-act="prev" aria-label="Előző pálya" ${pickLvl<=1?'disabled':''}>◀</button><span>${pickLvl}. pálya${st?' · '+'★'.repeat(st):''}</span><button class="b sm" type="button" data-act="next" aria-label="Következő pálya" ${pickLvl>=unlocked?'disabled':''}>▶</button></div>
  <div class="btns">${s?`<button class="b hot" type="button" data-act="cont">Folytatás · ${s.d.lvl}. pálya</button>`:''}
  <button class="b ${s?'':'hot'}" type="button" data-act="play">Játék · ${pickLvl}. pálya</button></div>`);
  hud();
}
function showPause(){
  showOv(`<h2>Szünet</h2><p>${G.lvl}. pálya · még <b>${leftCount()}</b> nyíl</p>
  <div class="btns"><button class="b hot" type="button" data-act="resume">Folytatás</button><button class="b" type="button" data-act="retry">Pálya újrakezdése</button><button class="b" type="button" data-act="menu">Menü</button></div>`);
}
function showWin(stars){
  showOv(`<h2>Kész!</h2>${starsHTML(stars)}<p>${G.lvl}. pálya${stars===3?' · <b>hibátlan!</b>':''}</p>
  <div class="btns"><button class="b hot" type="button" data-act="nextlvl">Következő pálya</button><button class="b" type="button" data-act="retry">Még egyszer</button><button class="b" type="button" data-act="menu">Menü</button></div>`);
}
function showLost(){
  showOv(`<h2 class="bad">Elfogyott a szív</h2><p>${G.lvl}. pálya · még <b>${leftCount()}</b> nyíl maradt. Nézd meg, mi van a nyíl <b>előtt</b>!</p>
  <div class="btns"><button class="b hot" type="button" data-act="retry">Újra</button><button class="b" type="button" data-act="menu">Menü</button></div>`);
}
card.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='play')startLevel(pickLvl);
  else if(a==='cont'){const s=loadSave();if(s)startLevel(s.d.lvl,s);else startLevel(pickLvl)}
  else if(a==='resume')resume();
  else if(a==='retry'){lsDel('nyilak-save');startLevel(G?G.lvl:pickLvl)}
  else if(a==='nextlvl')startLevel(Math.min(MAXLVL,G.lvl+1));
  else if(a==='menu'){if(G&&G.phase==='pause'){save()}G=null;draw();showMenu()}
  else if(a==='prev'){pickLvl=Math.max(1,pickLvl-1);showMenu()}
  else if(a==='next'){pickLvl=Math.min(unlocked,pickLvl+1);showMenu()}
  if(a!=='prev'&&a!=='next')beep(520,0.05);
});
$('hintBtn').addEventListener('click',hint);
$('restartBtn').addEventListener('click',()=>{if(G&&(G.phase==='play'))showOv(`<h2>Újrakezded?</h2><p>A pálya elölről indul, három szívvel.</p>
  <div class="btns"><button class="b hot" type="button" data-act="retry">Igen, újra</button><button class="b" type="button" data-act="resume2">Mégse</button></div>`)});
card.addEventListener('click',e=>{const b=e.target.closest('button[data-act="resume2"]');if(b){hideOv();kick()}});

// ---------- irányítás ----------
function cellAt(clientX,clientY){
  const r=cv.getBoundingClientRect(),x=Math.floor((clientX-r.left-ox)/cell),y=Math.floor((clientY-r.top-oy)/cell);
  return x>=0&&y>=0&&x<G.w&&y<G.h?[x,y]:null;
}
cv.addEventListener('pointerdown',e=>{
  if(!G||G.phase!=='play'||!ov.hidden)return;
  e.preventDefault();kbd=false;
  const c=cellAt(e.clientX,e.clientY);if(!c)return;
  const id=G.occ[c[1]*G.w+c[0]];if(id>=0)tap(id);
});
const KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
addEventListener('keydown',e=>{
  if(!ov.hidden){
    if((e.key==='Escape'||e.key==='p'||e.key==='P')&&G&&G.phase==='pause'){e.preventDefault();resume()}
    return;
  }
  if(!G||G.phase!=='play')return;
  const m=KEYS[e.key];
  if(m){e.preventDefault();
    if(!kbd||!cursor){kbd=true;const first=G.arrows.find(a=>!a.gone);cursor=first?first.cells[first.cells.length-1].slice():[0,0]}
    else cursor=[Math.max(0,Math.min(G.w-1,cursor[0]+m[0])),Math.max(0,Math.min(G.h-1,cursor[1]+m[1]))];
    kick();return}
  if(e.key===' '||e.key==='Enter'||e.key==='j'||e.key==='J'){e.preventDefault();
    if(!kbd||!cursor){kbd=true;const first=G.arrows.find(a=>!a.gone);cursor=first?first.cells[first.cells.length-1].slice():[0,0];kick();return}
    const id=G.occ[cursor[1]*G.w+cursor[0]];if(id>=0)tap(id);return}
  if(e.key==='h'||e.key==='H'||e.key==='k'||e.key==='K'){e.preventDefault();hint();return}
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){e.preventDefault();pause()}
});
$('pauseBtn').addEventListener('click',()=>{if(G&&G.phase==='play')pause();else if(!G)showMenu()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.phase==='play')pause()});
addEventListener('pagehide',save);

layout();hud();showMenu();
if(window.__GAMES_TEST__)window.__nyilak={get G(){return G},generate,greedy,rayHit,tap,hint,startLevel,draw}; // csak a játékteszt (tools/play_test.py) kapcsolja be
})();

<script>
/* Teljes képernyő gomb: csak ott látszik, ahol a böngésző támogatja (iPhone-on nem). */
(function(){
  var d=document, el=d.documentElement, b=d.querySelector('.fs-btn');
  if(!b) return;
  var can=d.fullscreenEnabled||d.webkitFullscreenEnabled;
  if(!can||!(el.requestFullscreen||el.webkitRequestFullscreen)){ b.remove(); return; }
  function on(){ return !!(d.fullscreenElement||d.webkitFullscreenElement); }
  function label(){ b.textContent=b.dataset.compact?'⛶':(on()?'⛶ Kilépés':'⛶ Teljes képernyő'); b.setAttribute('aria-label', on()?'Kilépés a teljes képernyőből':'Teljes képernyő'); }
  b.addEventListener('click', function(){
    try{
      if(on()){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
      else{ var p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el); if(p&&p.catch) p.catch(function(){}); }
    }catch(e){}
    b.blur();
  });
  d.addEventListener('fullscreenchange', label);
  d.addEventListener('webkitfullscreenchange', label);
  label();
})();
</script>
<script>
/* @shared fekvo-jelzes */
/* Fekvő telefonon „Fordítsd el a telefont” jelzés. A játék álló képernyőre készült, ezért amíg a telefon
   fekszik, a jelzés eltakarja, és a játék a saját szünet-logikájával megáll (ugyanaz fut le, mint amikor
   a lap háttérbe kerül). Gépen, széles ablakban nem jelenik meg (csak érintőképernyőn, alacsony ablakban). */
(function(){
  var mq;
  try{ mq=matchMedia('(orientation: landscape) and (max-height: 500px) and (pointer: coarse)'); }catch(e){ return; }
  var st=document.createElement('style');
  st.textContent='.rotate-hint{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;padding:16px;'+
    'background:rgba(5,8,14,.95);color:#fff;font:700 20px/1.3 system-ui,sans-serif;text-align:center}'+
    '.rotate-hint[hidden]{display:none!important}.rotate-hint p{margin:8px 0}'+
    '.rotate-hint .sub{font-weight:400;font-size:16px;opacity:.85}.rotate-hint svg{width:56px;height:56px}';
  var el=document.createElement('div');
  el.className='rotate-hint';el.setAttribute('role','alert');el.hidden=true;
  el.innerHTML='<div><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2" '+
    'fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18.5" r="1" fill="currentColor"/></svg>'+
    '<p>Fordítsd el a telefont!</p><p class="sub">Ez a játék álló képernyőre készült. Addig szünetel.</p></div>';
  function pauseGame(){
    try{
      Object.defineProperty(document,'hidden',{configurable:true,get:function(){return true;}});
      document.dispatchEvent(new Event('visibilitychange'));
    }catch(e){}
    try{ delete document.hidden; }catch(e){}
  }
  function update(e){
    if(mq.matches){ if(el.hidden){ el.hidden=false; if(e) pauseGame(); } }
    else el.hidden=true;
  }
  document.head.appendChild(st);
  document.body.appendChild(el);
  if(mq.addEventListener) mq.addEventListener('change',update); else if(mq.addListener) mq.addListener(update);
  update();
})();
/* @end fekvo-jelzes */
</script>
<script>
/* @shared gamepad */
/* Kontroller (gamepad) a böngésző Gamepad API-jával. A játék kódjához nem nyúl: a kontrollert billentyűkké
   fordítja, amelyeket a játék már ismer. Ha egy ablak (menü, szünet, vége) látszik, a kar a gombok között lép,
   az A gomb megnyomja a kijelöltet. Kiosztás (szabványos kontroller):
     bal kar / d-pad → nyilak, A → szóköz, X → J, Y → K, B → L, RB → L, Start → Escape (szünet), Select → Enter.
   iPhone-on a böngésző nem támogatja, ott ez a rész nem csinál semmit. */
(function(){
  if(!navigator.getGamepads)return;
  var DIRS=[['ArrowUp',12],['ArrowDown',13],['ArrowLeft',14],['ArrowRight',15]];
  var BTN=[[0,' ','Space'],[2,'j','KeyJ'],[3,'k','KeyK'],[1,'l','KeyL'],[5,'l','KeyL'],[9,'Escape','Escape'],[8,'Enter','Enter']];
  var held={},raf=0,shown=false,lastNav=0;
  function key(type,k,code){
    var e=new KeyboardEvent(type,{key:k,code:code,bubbles:true,cancelable:true});
    (document.activeElement&&document.activeElement!==document.body?document.activeElement:document).dispatchEvent(e);
  }
  function set(name,on,k,code){if(!!held[name]===on)return;held[name]=on;key(on?'keydown':'keyup',k,code||k)}
  function visible(el){if(!el||el.hidden)return false;var r=el.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(el).visibility!=='hidden'}
  function dialog(){
    var c=document.querySelectorAll('#ov,#over,#pick,#overlay,.modal,dialog[open],.rotate-hint');
    for(var i=0;i<c.length;i++)if(visible(c[i])&&!c[i].classList.contains('rotate-hint'))return c[i];
    return null;
  }
  function buttons(d){return Array.prototype.filter.call(d.querySelectorAll('button:not(:disabled),a[href]'),visible)}
  function nav(d,dir){
    var b=buttons(d);if(!b.length)return;
    var i=b.indexOf(document.activeElement);
    if(i<0){var hot=d.querySelector('.hot:not(:disabled)');(hot&&visible(hot)?hot:b[0]).focus();return}
    var cur=b[i].getBoundingClientRect(),best=null,bd=1e9;
    b.forEach(function(x){if(x===b[i])return;var r=x.getBoundingClientRect(),dx=r.left+r.width/2-(cur.left+cur.width/2),dy=r.top+r.height/2-(cur.top+cur.height/2);
      var ok=dir==='ArrowUp'?dy<-4:dir==='ArrowDown'?dy>4:dir==='ArrowLeft'?dx<-4:dx>4;if(!ok)return;
      var dist=Math.abs(dx)+Math.abs(dy)*(dir==='ArrowLeft'||dir==='ArrowRight'?3:1)+Math.abs(dx)*(dir==='ArrowUp'||dir==='ArrowDown'?2:0);if(dist<bd){bd=dist;best=x}});
    (best||b[(i+(dir==='ArrowUp'||dir==='ArrowLeft'?b.length-1:1))%b.length]).focus();
  }
  function note(){
    if(shown)return;shown=true;
    var t=document.createElement('div');t.setAttribute('role','status');
    t.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:3500;background:#0b0c10;color:#fff;border:1px solid #444;border-radius:10px;padding:10px 16px;font:700 15px system-ui,sans-serif;pointer-events:none';
    t.textContent='Kontroller csatlakoztatva';document.body.appendChild(t);setTimeout(function(){t.remove()},2500);
  }
  function poll(){
    raf=setTimeout(poll,16); /* időzítő, nem képkocka: álló képnél is figyeli a kontrollert */
    var pads=navigator.getGamepads?navigator.getGamepads():[],gp=null;
    for(var i=0;i<pads.length;i++)if(pads[i]&&pads[i].connected){gp=pads[i];break}
    if(!gp){for(var n in held)if(held[n])held[n]=false;return}
    note();
    var pr=function(i){var b=gp.buttons[i];return !!b&&(b.pressed||b.value>.5)};
    var ax=gp.axes[0]||0,ay=gp.axes[1]||0,dz=.25;
    var dirOn={ArrowUp:ay<-dz,ArrowDown:ay>dz,ArrowLeft:ax<-dz,ArrowRight:ax>dz};
    DIRS.forEach(function(d){if(pr(d[1]))dirOn[d[0]]=true});
    var d=dialog();
    if(d){
      DIRS.forEach(function(x){if(held[x[0]])set(x[0],false,x[0])});
      BTN.forEach(function(b){if(held['b'+b[0]])set('b'+b[0],false,b[1],b[2])});
      var now=performance.now(),any=null;DIRS.forEach(function(x){if(dirOn[x[0]])any=x[0]});
      if(any&&now-lastNav>220){lastNav=now;nav(d,any)}else if(!any)lastNav=0;
      var a=pr(0);if(a&&!held.navA){var f=document.activeElement;if(f&&d.contains(f)&&f.click)f.click();else{var b=buttons(d),hot=d.querySelector('.hot:not(:disabled)');(hot&&visible(hot)?hot:b[0])&&(hot&&visible(hot)?hot:b[0]).click()}}
      held.navA=a;
      if(pr(9)&&!held.Escape)set('Escape',true,'Escape');else if(!pr(9))set('Escape',false,'Escape');
      return;
    }
    held.navA=pr(0);
    DIRS.forEach(function(x){set(x[0],dirOn[x[0]],x[0])});
    BTN.forEach(function(b){set('b'+b[0],pr(b[0]),b[1],b[2])});
  }
  addEventListener('gamepadconnected',function(){if(!raf)poll()});
  addEventListener('gamepaddisconnected',function(){var p=navigator.getGamepads(),any=false;for(var i=0;i<p.length;i++)if(p[i])any=true;if(!any){clearTimeout(raf);raf=0;for(var n in held)if(held[n]&&n.indexOf('Arrow')===0)set(n,false,n)}});
  try{var p0=navigator.getGamepads();for(var i=0;i<p0.length;i++)if(p0[i]){poll();break}}catch(e){}
})();
/* @end gamepad */
</script>
