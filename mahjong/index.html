<style>
/* Felépítés: vissza gomb, kijelző (mód, idő, párok), üzenetsor, játéktér (canvas), alsó gombsor, felugró ablak */
:root{
  --bg:#0b1f24; --felt:#14594f; --felt2:#0b3a35; --panel:#10333a; --panel2:#174650; --line:#2b6670; --fg:#f1fbf9; --muted:#acd2cc;
  --accent:#ffcf4a; --ok:#62e39a; --bad:#ff8080;
  --font:"Lexend","Verdana",system-ui,sans-serif; --disp:"Chakra Petch","Lexend",system-ui,sans-serif; --title:"Bungee","Chakra Petch",system-ui,sans-serif; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);background:var(--bg)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:6px;max-width:900px;margin:0 auto;padding-block:8px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.hud{display:flex;align-items:center;gap:6px;min-width:0}
.chip{display:inline-flex;align-items:baseline;gap:5px;padding:7px 9px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font:700 15px/1 var(--disp);white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--fg)}
.chip small{font:600 11px/1 var(--disp);color:var(--muted);letter-spacing:.06em}
.chip.low b{color:var(--bad)}
button.chip{cursor:pointer;min-height:44px;align-items:center;font:700 15px/1.1 var(--font);overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp{flex:1;min-width:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{min-height:22px;text-align:center;font:600 16px/1.3 var(--font);color:var(--muted)}
#msg.warn{color:var(--bad)}
#msg.good{color:var(--ok)}
#msg.tip{color:var(--accent)}
#board{flex:1;min-height:0;position:relative;touch-action:none;border-radius:14px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 35%,var(--felt) 0%,var(--felt2) 100%);box-shadow:inset 0 0 0 2px #072a26,inset 0 6px 30px rgba(0,0,0,.35)}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:pointer}
.bar{display:flex;gap:8px}
.bar button{flex:1;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--fg);font:700 15px/1.1 var(--font);cursor:pointer;padding:4px 4px;min-width:0}
.bar button:active{background:var(--panel2);border-color:var(--accent)}
.bar button:disabled{opacity:.4;cursor:default}
.bar b{display:block;font-size:20px;line-height:1.05}
.conf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:fall linear forwards;z-index:4000}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}}
/* Felugró ablak */
#ov{position:fixed;inset:0;z-index:2000;background:rgba(2,14,14,.8);display:grid;place-items:center;padding:12px}
#ovc{width:min(440px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px 16px 14px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#ovc h2{margin:0 0 4px;font:400 26px/1.15 var(--title);color:var(--accent);text-align:center}
#ovc p{margin:6px 0;font:400 16px/1.45 var(--font);color:var(--fg)}
#ovc .sub{color:var(--muted);text-align:center}
.vars{display:grid;gap:8px;margin:10px 0}
.var{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2px 10px;text-align:left;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer;min-height:56px;font:inherit}
.var i{grid-row:1/3;font:400 26px/1 "Segoe UI Symbol","DejaVu Sans",sans-serif;font-style:normal;width:32px;text-align:center}
.var b{font:700 17px/1.2 var(--font)}
.var span{grid-column:2;font:400 14px/1.3 var(--font);color:var(--muted)}
.var em{grid-column:3;grid-row:1/3;font:700 13px/1.25 var(--disp);font-style:normal;color:var(--muted);text-align:right}
.var.hot{border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--fg);font:700 16px/1.2 var(--font);cursor:pointer;padding:6px 10px}
.btn.hot{background:var(--accent);color:#1d1600;border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0;text-align:center}
.stats div{background:var(--panel2);border-radius:10px;padding:8px 4px;font:700 20px/1.1 var(--disp)}
.stats small{display:block;font:600 12px/1.2 var(--font);color:var(--muted);margin-top:3px}
.rules{padding-left:20px;margin:6px 0}
.rules li{margin:5px 0;font:400 16px/1.45 var(--font)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font:600 16px/1.3 var(--font)}
.opt button{min-width:84px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--fg);font:700 15px/1 var(--font);cursor:pointer}
.opt button[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}
@media (max-width:430px){.hud{gap:4px}.chip{padding:6px 6px;font-size:14px;gap:3px}.chip small{font-size:9px}button.chip{font-size:14px}.bar{gap:5px}.bar button{font-size:13px}}
/* Fekvő telefon: jobb oldalt egy oszlopban a kijelző és a gombok, balra a játéktér */
@media (orientation:landscape) and (max-height:560px){
  #app{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 150px;grid-template-rows:auto auto minmax(0,1fr);gap:4px 8px;padding-block:4px}
  .top-bar{grid-column:1;grid-row:1}
  .hud{grid-column:2;grid-row:1/3;flex-direction:column;align-items:stretch;gap:4px}
  .hud .sp{display:none}
  #msg{grid-column:1;grid-row:2;min-height:18px;font-size:14px}
  #board{grid-column:1;grid-row:3}
  .bar{grid-column:2;grid-row:3;flex-direction:column;justify-content:flex-end}
  .bar button{flex:none;min-height:44px}
  .bar b{display:inline;margin-right:4px}
}
</style>
</head>
<body>
<div id="app">
  <div class="top-bar" style="position:relative;z-index:1000;display:flex;flex-wrap:wrap;align-self:flex-start;align-items:center;gap:8px;margin:0"><a class="home-link" href="../index.html" style="display:inline-flex;align-self:flex-start;width:fit-content;align-items:center;gap:6px;margin:0;min-height:44px;min-width:44px;box-sizing:border-box;justify-content:center;padding:6px 14px;border-radius:999px;border:1px solid currentColor;color:inherit;opacity:.75;text-decoration:none;font:600 14px/1.2 system-ui,sans-serif">← Összes játék</a><button type="button" class="fs-btn" aria-label="Teljes képernyő" style="all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;justify-content:center;padding:6px 14px;border-radius:999px;border:1px solid currentColor;color:inherit;opacity:.75;cursor:pointer;font:600 14px/1.2 system-ui,sans-serif">⛶ Teljes képernyő</button></div>
  <div class="hud">
    <button type="button" class="chip" id="modeBtn" aria-label="Mód és kirakás választása">Mahjong</button>
    <span class="sp"></span>
    <span class="chip" id="timeChip"><small id="timeLbl">IDŐ</small><b id="time">0:00</b></span>
    <span class="chip"><small>PÁR</small><b id="left">0</b></span>
    <span class="chip" title="Most levehető párok száma"><small>LEHET</small><b id="moves">0</b></span>
  </div>
  <div id="msg" aria-live="polite"></div>
  <div id="board"><canvas id="cv" aria-label="Mahjong játéktér. Nyilakkal lépsz, szóközzel választasz." role="img"></canvas></div>
  <div class="bar">
    <button type="button" id="undo" aria-label="Visszavonás (L)"><b>↶</b>Vissza</button>
    <button type="button" id="hint" aria-label="Tipp (J)"><b>★</b>Tipp</button>
    <button type="button" id="mix" aria-label="Keverés (K)"><b>⟳</b>Keverés</button>
    <button type="button" id="menuBtn" aria-label="Menü (Escape)"><b>☰</b>Menü</button>
  </div>
</div>
<div id="ov" hidden><div id="ovc" role="dialog" aria-modal="true" aria-labelledby="ovt"></div></div>
<script>
/* @shared kepesseg */
/* Modern böngészőképességek egy helyen. Mind opcionális: ha a böngésző nem tudja, vagy hibát ad, csendben nem
   történik semmi, a játék ugyanúgy játszható. Hálózatot nem használ, és a játék soha nem vár rá.
   A játék fő szkriptje ELŐTT kell betölteni, mert a játék a window.Kepesseg függvényeit hívja.
     Kepesseg.haptic(minta)   rövid rezgés telefonon (navigator.vibrate) és kontrolleren (vibrationActuator).
                              minta: 'tap' | 'hit' | 'hurt' | 'boom' | 'reward' | 'over', vagy ms, vagy ms-tömb.
                              Csak koppintás/gombnyomás után rezeg, van rá időkorlát, és ki lehet kapcsolni.
     Kepesseg.hapticsOn() / Kepesseg.setHaptics(be)   a közös rezgés-beállítás (localStorage: kepesseg:rezges).
       Ha az oldalon van .hap-btn gomb, az kapcsolja; csak ott látszik, ahol van mit rezegtetni.
     Kepesseg.wakeLock(be)    true: amíg tart a játék, a kijelző ne aludjon el; false: elengedi. Háttérbe tett
                              lap után magától újrakéri; 2 perc tétlenség után elengedi, a következő érintésre újra.
     Kepesseg.transition(fn)  fn a képernyőváltás DOM-módosítása; View Transitionnel fut, ha lehet, és nincs
                              csökkentett mozgás. Különben (vagy hibánál) azonnal fut. Az átmenet alatt (0,15 mp)
                              a böngésző nem ad át érintést, ezért csak ablak MEGJELENÉSÉRE használd; a játékba
                              visszavezető bezárás legyen azonnali, és hívja a Kepesseg.endTransition()-t.
     Kepesseg.quality(most)   képkockánként hívva a díszítő grafika szintje: 2 teljes, 1 kevesebb, 0 legkevesebb.
                              Csak látványra használd (részecske, háttér), játéklogikára soha.
     Tájolás: ha a <head>-ben <meta name="games:orientation" content="portrait"> (vagy landscape) áll, és a
       készülék már így áll, teljes képernyőn ebben rögzíti (nem fordul el véletlenül), kilépéskor felold.
       Ha másképp áll, nem zárol és nem forgat; ilyenkor a CSS-es elrendezés és a fekvo-jelzes segít. */
(function(){
  if(window.Kepesseg)return;
  var d=document,nav=navigator,noop=function(){};
  function now(){return (window.performance&&performance.now)?performance.now():Date.now()}
  function mq(q){try{return matchMedia(q).matches}catch(e){return false}}
  function calm(){return mq('(prefers-reduced-motion: reduce)')}
  function quiet(p){try{if(p&&typeof p.then==='function')p.then(noop,noop)}catch(e){}return p}

  /* ---------- rezgés ---------- */
  var KEY='kepesseg:rezges',PAT={tap:[10],hit:[20],hurt:[45],boom:[70],reward:[25,50,25],over:[40,60,40]};
  var POW={tap:.25,hit:.45,hurt:.8,boom:1,reward:.5,over:.7},RANK={tap:0,hit:1,reward:2,hurt:3,boom:3,over:4};
  var on=true,last=-1e9,busy=0,busyRank=-1;
  try{on=localStorage.getItem(KEY)!=='0'}catch(e){}
  function pattern(m){
    var p=typeof m==='string'?PAT[m]:typeof m==='number'?[m]:Array.isArray(m)?m:null,out=[],sum=0;
    if(!p)return null;
    for(var i=0;i<p.length&&i<7;i++){var v=+p[i];if(!(v>=0))return null;v=Math.min(200,Math.round(v));
      if(i%2===0){if(sum+v>400)v=400-sum;sum+=v}out.push(v)}
    return sum>0?out:null;
  }
  function pads(){
    var r=[];try{var g=nav.getGamepads?nav.getGamepads():[];for(var i=0;i<g.length;i++)
      if(g[i]&&g[i].connected!==false&&(g[i].vibrationActuator||(g[i].hapticActuators&&g[i].hapticActuators[0])))r.push(g[i])}catch(e){}
    return r;
  }
  function phone(){return typeof nav.vibrate==='function'&&mq('(pointer: coarse)')}
  function rumble(gp,ms,pow){
    try{
      var a=gp.vibrationActuator;
      if(a&&typeof a.playEffect==='function'){
        var t=(a.effects&&a.effects.indexOf&&a.effects.indexOf('dual-rumble')<0&&a.effects.indexOf('trigger-rumble')<0)?a.effects[0]:'dual-rumble';
        quiet(a.playEffect(t||'dual-rumble',{startDelay:0,duration:ms,strongMagnitude:pow,weakMagnitude:Math.min(1,pow+.2)}));
      }else if(gp.hapticActuators&&gp.hapticActuators[0]&&gp.hapticActuators[0].pulse){
        quiet(gp.hapticActuators[0].pulse(pow,ms));
      }
    }catch(e){}
  }
  function haptic(m){
    if(!on)return false;
    try{var ua=nav.userActivation;if(ua&&!ua.hasBeenActive)return false}catch(e){}
    var p=pattern(m);if(!p)return false;
    var t=now(),rk=typeof m==='string'?RANK[m]:1,total=0;
    if(t-last<70)return false;                       /* sűrű eseményeknél nem rezeg minden alkalommal */
    if(t<busy&&rk<=busyRank)return false;            /* gyengébb jelzés nem szakítja meg az erősebbet */
    for(var i=0;i<p.length;i++)total+=p[i];
    last=t;busy=t+total;busyRank=rk;
    var did=false,gs=pads(),pow=typeof m==='string'?POW[m]:.5;
    if(gs.length){
      var off=0;did=true;
      for(var j=0;j<p.length;j+=2){(function(ms,at){
        if(at===0)gs.forEach(function(g){rumble(g,ms,pow)});
        else setTimeout(function(){if(on)pads().forEach(function(g){rumble(g,ms,pow)})},at);
      })(p[j],off);off+=p[j]+(p[j+1]||0)}
    }
    if(phone()){try{did=nav.vibrate(p.length===1?p[0]:p)!==false||did}catch(e){}}
    return did;
  }
  function stop(){busy=0;try{if(typeof nav.vibrate==='function')nav.vibrate(0)}catch(e){}
    pads().forEach(function(g){try{var a=g.vibrationActuator;if(a&&a.reset)quiet(a.reset())}catch(e){}})}
  function setHaptics(v){on=!!v;try{localStorage.setItem(KEY,on?'1':'0')}catch(e){}if(!on)stop();label()}
  var btn=null;
  function label(){
    if(!btn)return;
    btn.textContent=on?'📳':'📴';btn.setAttribute('aria-pressed',on?'true':'false');
    btn.setAttribute('aria-label',on?'Rezgés: be':'Rezgés: ki');btn.title=on?'Rezgés: be':'Rezgés: ki';
    btn.style.opacity=on?'.75':'.45';
  }
  function showBtn(){
    if(!btn)return;
    btn.style.display=(phone()||pads().length)?'inline-flex':'none';
    /* ha nem fér ki egy sorba, a teljes képernyő gomb csak ikont mutat (ugyanaz a data-compact jelzés, amit a gomb szkriptje is ismer) */
    var fs=d.querySelector('.fs-btn'),first=btn.parentNode&&btn.parentNode.firstElementChild;
    if(fs&&first&&btn.style.display!=='none'&&btn.offsetTop>first.offsetTop+4){fs.dataset.compact='1';fs.textContent='⛶'}
  }
  function initBtn(){
    btn=d.querySelector('.hap-btn');if(!btn)return;
    btn.addEventListener('click',function(){setHaptics(!on);if(on)haptic('hit');btn.blur()});
    label();showBtn();
  }
  addEventListener('gamepadconnected',showBtn);addEventListener('gamepaddisconnected',showBtn);

  /* ---------- ébren tartás (Screen Wake Lock) ---------- */
  var IDLE=120000,want=false,lock=null,pending=false,lastUse=0,timer=0;
  function wlRequest(){
    if(!want||lock||pending||d.visibilityState!=='visible')return;
    var w=nav.wakeLock;if(!w||typeof w.request!=='function')return;
    pending=true;
    try{
      w.request('screen').then(function(s){
        pending=false;
        if(!want||!s){try{s&&quiet(s.release())}catch(e){}return}
        lock=s;try{s.addEventListener('release',function(){if(lock===s)lock=null})}catch(e){}
      },function(){pending=false});
    }catch(e){pending=false}
  }
  function wlRelease(){var s=lock;lock=null;if(s)try{quiet(s.release())}catch(e){}}
  function used(){lastUse=now();if(want&&!lock)wlRequest()}
  function tick(){if(lock&&now()-lastUse>IDLE)wlRelease()}
  function wakeLock(v){
    want=!!v;lastUse=now();
    if(want){wlRequest();if(!timer)timer=setInterval(tick,15000)}
    else{wlRelease();if(timer){clearInterval(timer);timer=0}}
  }
  d.addEventListener('visibilitychange',function(){if(d.visibilityState==='visible'){lastUse=now();wlRequest()}});
  ['pointerdown','keydown','touchstart'].forEach(function(ev){addEventListener(ev,used,{capture:true,passive:true})});
  addEventListener('pagehide',function(){wlRelease();oriUnlock()});

  /* ---------- képernyőváltás (View Transitions) ---------- */
  var vt=null,vtCss=false;
  function transition(fn){
    var done=false,run=function(){if(done)return;done=true;
      try{fn()}catch(e){setTimeout(function(){throw e},0)}};   /* a játék hibája ne vesszen el */
    /* betöltés közben (első képernyő) nincs mit átúsztatni */
    if(typeof d.startViewTransition!=='function'||calm()||d.visibilityState!=='visible'||d.readyState!=='complete'){run();return}
    if(!vtCss){vtCss=true;try{var st=d.createElement('style');
      st.textContent='::view-transition-old(root),::view-transition-new(root){animation-duration:.15s}';d.head.appendChild(st)}catch(e){}}
    try{
      var t=d.startViewTransition(run);vt=t;
      var clear=function(){if(vt===t)vt=null};
      quiet(t.ready);quiet(t.updateCallbackDone);
      if(t.finished&&t.finished.then)t.finished.then(clear,clear);
    }catch(e){run()}
    if(!done)setTimeout(run,250);                     /* ha a böngésző nem futtatná le, akkor is megtörténik */
  }
  /* a futó átmenet azonnali vége: bezáráskor és bármilyen érintésre, gombnyomásra, hogy a játék ne várjon rá */
  function endTransition(){var t=vt;vt=null;if(t)try{t.skipTransition()}catch(e){}}
  ['pointerdown','keydown'].forEach(function(ev){addEventListener(ev,function(){if(vt)endTransition()},{capture:true,passive:true})});

  /* ---------- tájolás (Screen Orientation) ---------- */
  var ori=null,oriLocked=false;
  function oriPref(){var m=d.querySelector('meta[name="games:orientation"]'),v=m&&m.getAttribute('content');
    return v==='portrait'||v==='landscape'?v:null}
  function oriLock(){
    var o=window.screen&&screen.orientation,p=ori||(ori=oriPref());
    if(!p||!o||typeof o.lock!=='function')return;
    if(String(o.type||'').split('-')[0]!==p)return;   /* csak a már meglévő tájolást rögzíti: soha nem forgatja el a képet */
    try{var r=o.lock(p);oriLocked=true;if(r&&r.then)r.then(noop,function(){oriLocked=false})}catch(e){oriLocked=false}
  }
  function oriUnlock(){
    if(!oriLocked)return;oriLocked=false;
    try{var o=window.screen&&screen.orientation;if(o&&typeof o.unlock==='function')o.unlock()}catch(e){}
  }
  function fsChange(){if(d.fullscreenElement||d.webkitFullscreenElement)oriLock();else oriUnlock()}
  d.addEventListener('fullscreenchange',fsChange);d.addEventListener('webkitfullscreenchange',fsChange);

  /* ---------- adaptív grafikai minőség ---------- */
  var Q={lvl:2,t:0,acc:0,n:0,bad:0,good:0,changed:-1e9,ups:0,hot:false,watch:false,forced:null};
  function watchPressure(){
    Q.watch=true;
    try{if(typeof window.PressureObserver==='function'){
      var po=new window.PressureObserver(function(rs){var s=rs&&rs.length&&rs[rs.length-1].state;Q.hot=s==='serious'||s==='critical'});
      quiet(po.observe('cpu'));
    }}catch(e){}
  }
  function level(){var l=Q.forced!=null?Q.forced:Q.lvl;return calm()?Math.min(l,1):l}
  function quality(t){
    if(typeof t!=='number'||!isFinite(t))return level();

    var dt=t-Q.t;Q.t=t;
    if(!(dt>0)||dt>250)return level();               /* szünet, háttér: nem mérjük */
    Q.acc+=dt;Q.n++;
    if(Q.acc>=1000){
      var avg=Q.acc/Q.n;Q.acc=0;Q.n=0;
      Q.bad=(avg>24||Q.hot)?Q.bad+1:0;Q.good=(avg<18&&!Q.hot)?Q.good+1:0;
      if(t-Q.changed>4000){
        if(Q.bad>=3&&Q.lvl>0){Q.lvl--;Q.changed=t;Q.bad=Q.good=0}   /* 3 lassú másodperc egymás után: egy rövid akadás nem számít */
        else if(Q.good>=15&&Q.lvl<2&&Q.ups<2){Q.lvl++;Q.ups++;Q.changed=t;Q.good=0}   /* ritkán, és csak kétszer lép vissza */
      }
    }

  }
  function setQuality(l){Q.forced=(l===0||l===1||l===2)?l:null}

  window.Kepesseg={haptic:haptic,hapticsOn:function(){return on},setHaptics:setHaptics,wakeLock:wakeLock,
    wakeLockHeld:function(){return !!lock},transition:transition,endTransition:endTransition,quality:quality,setQuality:setQuality};
  if(d.readyState==='loading')d.addEventListener('DOMContentLoaded',initBtn);else initBtn();
})();

<script>
// ---------- Pályagenerátor ----------
/* Szabálymotor és pályagenerátor. Nem nyúl a DOM-hoz, így a játéktesztben külön is futtatható.
   Lapok: 0-8 pötty 1-9, 9-17 bambusz 1-9, 18-26 szám 1-9, 27-30 szél (É K D NY), 31-33 drágakő,
   34-37 virág (bármelyik virág párja bármelyik virágnak), 38-41 évszak (ugyanígy).
   Pasziánsz: a helyek fél-lap egységben [x,y,z]; egy lap 2×2 egységet foglal. Egy lap szabad, ha nincs rajta
   lap, és balról vagy jobbról nincs mellette lap. A generátor visszafelé rak: mindig két olyan helyet tölt be,
   amelyek abban a pillanatban szabadok lennének, ezért a kész pálya biztosan végigjátszható.
   Összekötő: W×H rács, két egyforma lap akkor vehető le, ha legfeljebb két kanyarral, üres mezőkön (a rácson
   kívül is) összeköthető. A generátor egy véletlen játékossal végigjátssza a pályát, csak a kirakhatót adja. */
const GEN_BUDGET_MS=3000;
function mkRng(seed){let s=(seed>>>0)||1;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,r){for(let i=a.length-1;i>0;i--){const j=(r()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t}return a}
const nowMs=()=>(typeof performance!=='undefined'?performance.now():Date.now());
const FACES=42;
function grp(f){return f<34?f:f<38?34:38}
function same(a,b){return a>=0&&b>=0&&grp(a)===grp(b)}

function lay(build){const P=[];build((x,y,z)=>P.push([Math.round(x*2),Math.round(y*2),z]));return P}
function rect(a,z,x0,y0,w,h){for(let y=0;y<h;y++)for(let x=0;x<w;x++)a(x0+x,y0+y,z)}
const LAYOUTS={
  kicsi:{name:'Kis torony',info:'36 lap, gyors kör',P:lay(a=>{rect(a,0,0,0,4,6);rect(a,1,1,1,2,4);rect(a,2,1,2,2,2)})},
  piramis:{name:'Piramis',info:'82 lap, négy szint',P:lay(a=>{rect(a,0,0,0,6,8);rect(a,1,1,1,4,6);rect(a,2,2,2,2,4);rect(a,3,2.5,3,1,2)})},
  kereszt:{name:'Kereszt',info:'88 lap, széles karok',P:lay(a=>{
    for(let y=0;y<9;y++)for(let x=0;x<9;x++)if(Math.abs(x-4)<=1||Math.abs(y-4)<=1)a(x,y,0);
    for(let y=1;y<8;y++)for(let x=1;x<8;x++)if((Math.abs(x-4)<=1&&Math.abs(y-4)<=3)||(Math.abs(y-4)<=1&&Math.abs(x-4)<=3))a(x,y,1);
    rect(a,2,3,3,3,3);a(4,4,3)})},
  var:{name:'Vár',info:'96 lap, tornyokkal',P:lay(a=>{rect(a,0,0,0,8,8);
    for(let y=1;y<7;y++)for(let x=1;x<7;x++)if(x===1||x===6||y===1||y===6)a(x,y,1);
    rect(a,1,3,3,2,2);[[1,1],[6,1],[1,6],[6,6]].forEach(([x,y])=>a(x,y,2));rect(a,2,3,3,2,2)})},
  teknos:{name:'Teknős',info:'144 lap, a klasszikus',P:lay(a=>{
    [[1,12],[3,8],[2,10],[1,12],[1,12],[2,10],[3,8],[1,12]].forEach(([x0,w],y)=>rect(a,0,x0,y,w,1));
    a(0,3.5,0);a(13,3.5,0);a(14,3.5,0);rect(a,1,4,1,6,6);rect(a,2,5,2,4,4);rect(a,3,6,3,2,2);a(6.5,3.5,4)})}
};
const LAY_IDS=Object.keys(LAYOUTS);
const CONNECT={e:{name:'Könnyű',info:'6×8 lap',W:6,H:8},m:{name:'Közepes',info:'7×10 lap',W:7,H:10},h:{name:'Nehéz',info:'8×12 lap',W:8,H:12}};

/* Elforgatott kirakás (álló telefonon a széles pálya így nagyobb lapokat ad): x és y csere */
function place(id,rot){return LAYOUTS[id].P.map(p=>rot?[p[1],p[0],p[2]]:[p[0],p[1],p[2]])}
function topo(P){
  const n=P.length,L=[],R=[],A=[],B=[];
  for(let i=0;i<n;i++){L.push([]);R.push([]);A.push([]);B.push([])}
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(i===j)continue;
    const dx=P[j][0]-P[i][0],dy=P[j][1]-P[i][1],dz=P[j][2]-P[i][2];
    if(dz===0&&Math.abs(dy)<2){if(dx===-2)L[i].push(j);else if(dx===2)R[i].push(j)}
    else if(dz===1&&Math.abs(dx)<2&&Math.abs(dy)<2){A[i].push(j);B[j].push(i)}}
  return{n,L,R,A,B};
}
function isFree(T,on,i){
  for(const j of T.A[i])if(on[j])return false;
  let l=false,r=false;for(const j of T.L[i])if(on[j]){l=true;break}
  if(!l)return true;for(const j of T.R[i])if(on[j]){r=true;break}
  return !r;
}
/* Szabad, egyforma lapokból álló párok listája */
function freePairs(T,on,f){
  const by={},out=[];
  for(let i=0;i<T.n;i++)if(on[i]&&isFree(T,on,i)){const g=grp(f[i]);(by[g]=by[g]||[]).push(i)}
  for(const g in by){const a=by[g];for(let x=0;x<a.length;x++)for(let y=x+1;y<a.length;y++)out.push([a[x],a[y]])}
  return out;
}
/* Visszafelé rakás: mask = a betöltendő helyek, tokens = laptípus-párok. Siker: arcok tömbje, különben null. */
function fillFaces(T,mask,tokens,r,deadline){
  const n=T.n,has=new Uint8Array(n),order=[];let left=0;
  for(let i=0;i<n;i++)if(mask[i])left++;
  const hasAny=l=>{for(const j of l)if(has[j])return true;return false};
  const sideFree=i=>!hasAny(T.L[i])||!hasAny(T.R[i]);
  /* Egy üres hely reménytelen, ha balra és jobbra is van már (akár távolabb) betöltött lap a sorában:
     a köztük lévő utolsó hely mindkét oldalán lap lenne, sosem lehetne szabad. */
  const reach=(q,S)=>{const seen=new Set([q]),st=[q];while(st.length){const c=st.pop();
    for(const j of S[c])if(mask[j]&&!seen.has(j)){if(has[j])return true;seen.add(j);st.push(j)}}return false};
  const dead=i=>{const seen=new Set([i]),st=[i];
    while(st.length){const c=st.pop();
      if(!has[c]&&reach(c,T.L)&&reach(c,T.R))return true;
      for(const j of T.L[c].concat(T.R[c]))if(mask[j]&&!seen.has(j)){seen.add(j);st.push(j)}}
    return false};
  while(left>0){
    if(nowMs()>deadline)return null;
    const cand=[];
    for(let i=0;i<n;i++){
      if(!mask[i]||has[i]||hasAny(T.A[i])||!sideFree(i))continue;
      let ok=true;for(const j of T.B[i])if(mask[j]&&!has[j]){ok=false;break}
      if(ok)cand.push(i);
    }
    shuf(cand,r);let found=false;
    for(let a=0;a<cand.length&&!found;a++)for(let b=a+1;b<cand.length;b++){
      const i=cand[a],j=cand[b];has[i]=has[j]=1;
      if(sideFree(i)&&sideFree(j)&&!dead(i)&&!dead(j)){order.push([i,j]);left-=2;found=true;break}
      has[i]=has[j]=0;
    }
    if(!found)return null;
  }
  const f=new Array(n).fill(-1);
  order.forEach(([i,j],k)=>{const t=tokens[k];if(r()<.5){f[i]=t[0];f[j]=t[1]}else{f[i]=t[1];f[j]=t[0]}});
  return{f,order:order.reverse()};
}
/* Laptípus-párok: minden típusból két pár (négy lap), a virágok és évszakok egy-egy közös csoport */
function makeTokens(pairs,r){
  const groups=shuf([...Array(34).keys(),'F','S'],r),fl=shuf([34,35,36,37],r),se=shuf([38,39,40,41],r),out=[];
  let k=0;
  while(out.length<pairs){const g=groups[k%groups.length];k++;
    for(let c=0;c<2&&out.length<pairs;c++){
      if(g==='F'){if(fl.length<2)fl.push(...shuf([34,35,36,37],r));out.push([fl.pop(),fl.pop()])}
      else if(g==='S'){if(se.length<2)se.push(...shuf([38,39,40,41],r));out.push([se.pop(),se.pop()])}
      else out.push([g,g]);
    }}
  return shuf(out,r);
}
/* Új pasziánsz pálya. ver: ellenőrzött (végigjátszható) */
function dealSolitaire(id,rot,seed){
  const P=place(id,rot),T=topo(P),r=mkRng(seed),mask=new Uint8Array(P.length).fill(1),dl=nowMs()+GEN_BUDGET_MS;
  let tries=0;
  while(nowMs()<dl){tries++;const d=fillFaces(T,mask,makeTokens(P.length/2,r),r,dl);if(d)return{P,T,f:d.f,order:d.order,ver:true,tries}}
  const tok=makeTokens(P.length/2,r),f=[];tok.forEach(t=>f.push(t[0],t[1]));shuf(f,r);
  return{P,T,f,ver:false,tries};
}
/* Keverés: a megmaradt lapok újraosztása úgy, hogy továbbra is végigjátszható maradjon */
function reshuffle(T,on,f,seed){
  const r=mkRng(seed),by={};
  for(let i=0;i<T.n;i++)if(on[i]){const g=grp(f[i]);(by[g]=by[g]||[]).push(f[i])}
  const dl=nowMs()+GEN_BUDGET_MS/2;
  while(nowMs()<dl){
    const tok=[];for(const g in by){const a=shuf(by[g].slice(),r);for(let k=0;k+1<a.length;k+=2)tok.push([a[k],a[k+1]])}
    shuf(tok,r);
    const nf=fillFaces(T,on,tok,r,dl);
    if(nf){const out=f.slice();for(let i=0;i<T.n;i++)if(on[i])out[i]=nf.f[i];return{f:out,order:nf.order,ver:true}}
  }
  const idx=[];for(let i=0;i<T.n;i++)if(on[i])idx.push(i);
  const vals=shuf(idx.map(i=>f[i]),r),out=f.slice();idx.forEach((i,k)=>out[i]=vals[k]);
  return{f:out,ver:false};
}

/* Összekötő: útkeresés legfeljebb két kanyarral. g: W*H rács (-1 üres). Siker: a töréspontok listája
   (keretes rácsban: oszlop, sor, a rácson kívüli keret -1 és W/H), különben null. */
function connPath(g,W,H,a,b){
  if(a===b||g[a]<0||g[b]<0)return null;
  const PW=W+2,PH=H+2,pa=(((a/W)|0)+1)*PW+(a%W)+1,pb=(((b/W)|0)+1)*PW+(b%W)+1;
  const empty=p=>{const x=p%PW,y=(p/PW)|0;if(x===0||y===0||x===PW-1||y===PH-1)return true;return g[(y-1)*W+x-1]<0};
  const prev=new Int32Array(PW*PH).fill(-2);prev[pa]=-1;let fr=[pa];
  const D=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let t=0;t<3;t++){const nx=[];
    for(const p of fr)for(const [dx,dy] of D){let x=p%PW+dx,y=((p/PW)|0)+dy;
      while(x>=0&&y>=0&&x<PW&&y<PH){const q=y*PW+x;
        if(q===pb){const pts=[q];let c=p;while(c!==-1){pts.push(c);c=prev[c]}
          return pts.reverse().map(v=>[v%PW-1,((v/PW)|0)-1])}
        if(!empty(q))break;
        if(prev[q]===-2){prev[q]=p;nx.push(q)}
        x+=dx;y+=dy}}
    fr=nx}
  return null;
}
function connPairs(g,W,H,limit){
  const by={},out=[];
  g.forEach((v,i)=>{if(v>=0)(by[grp(v)]=by[grp(v)]||[]).push(i)});
  for(const k in by){const a=by[k];for(let x=0;x<a.length;x++)for(let y=x+1;y<a.length;y++)
    if(connPath(g,W,H,a[x],a[y])){out.push([a[x],a[y]]);if(limit&&out.length>=limit)return out}}
  return out;
}
/* Véletlen játékos: ha valaha kiürül a tábla, a pálya kirakható */
function connSolvable(g,W,H,r,runs){
  for(let k=0;k<runs;k++){const c=g.slice();let left=c.filter(v=>v>=0).length;
    while(left>0){const p=connPairs(c,W,H);if(!p.length)break;const [a,b]=p[(r()*p.length)|0];c[a]=c[b]=-1;left-=2}
    if(left===0)return true}
  return false;
}
function dealConnect(lv,seed){
  const {W,H}=CONNECT[lv],n=W*H,r=mkRng(seed),dl=nowMs()+GEN_BUDGET_MS;let tries=0,g=null;
  while(nowMs()<dl){tries++;
    const tok=makeTokens(n/2,r);g=[];tok.forEach(t=>g.push(t[0],t[1]));shuf(g,r);
    if(connSolvable(g,W,H,r,6))return{g,ver:true,tries}}
  return{g,ver:false,tries};
}
function connShuffle(g,W,H,seed){
  const r=mkRng(seed),idx=[];g.forEach((v,i)=>{if(v>=0)idx.push(i)});
  const dl=nowMs()+GEN_BUDGET_MS/2;let out=g;
  do{out=g.slice();const vals=shuf(idx.map(i=>g[i]),r);idx.forEach((i,k)=>out[i]=vals[k]);
    if(connSolvable(out,W,H,r,4))return{g:out,ver:true}}while(nowMs()<dl);
  return{g:out,ver:false};
}

(()=>{

const SAVE_KEY='mahjong-save';
const MODES={c:{name:'Klasszikus',short:'Klasszikus',icon:'▦'},t:{name:'Időfutam',short:'Időfutam',icon:'⏱'},d:{name:'Napi feladvány',short:'Napi',icon:'✶'},k:{name:'Összekötő',short:'Összekötő',icon:'⇄'}};
const DAILY_LAYS=['piramis','kereszt','var','teknos'];
const STAT_KEYS=[];LAY_IDS.forEach(l=>STAT_KEYS.push('c-'+l,'t-'+l));STAT_KEYS.push('d','k-e','k-m','k-h');
const SAVE={v:1,sound:true,dim:true,last:'piramis',lastLv:'m',stats:{},daily:{d:'',b:0},game:null};

function dayInfo(ds){const [y,m,d]=ds.split('-').map(Number);const n=Math.round(Date.UTC(y,m-1,d)/864e5);return{seed:(y*10000+m*100+d)*7+13,lay:DAILY_LAYS[((n%4)+4)%4]}}

function tone(f,d,type,vol,delay){const a=audio();if(!a)return;try{const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}

function cleanStats(src){const out={};if(!src||typeof src!=='object'||Array.isArray(src))return out;
  for(const k of STAT_KEYS){const s=src[k];if(s&&typeof s==='object'&&!Array.isArray(s))out[k]={w:okInt(s.w,0,1e6)?s.w:0,b:okInt(s.b,0,1e6)?s.b:0}}return out}
function countsEven(f){const c={};for(const v of f)if(v>=0){const g=grp(v);c[g]=(c[g]||0)+1}return Object.keys(c).every(k=>c[k]%2===0)}
function validGame(g){

function loadSave(){

function faceImg(f,w,h){
  const W=Math.max(8,Math.round(w*dpr)),H=Math.max(8,Math.round(h*dpr)),key=f+'|'+W+'|'+H;
  let im=faceCache.get(key);if(im)return im;
  im=document.createElement('canvas');im.width=W;im.height=H;const c=im.getContext('2d');c.scale(W/100,H/130);drawFace(c,f);
  faceCache.set(key,im);return im;

// ---------- Elrendezés a képernyőn ----------
const ASP=1.3,DZ=.26,SD=.24,CASP=1.24;
function solFit(P,bw,bh){
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9,maxz=0;
  for(const p of P){minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0]);miny=Math.min(miny,p[1]);maxy=Math.max(maxy,p[1]);maxz=Math.max(maxz,p[2])}
  const sx=maxx-minx+2,sy=maxy-miny+2,pad=8;
  const u=Math.max(3,Math.min((bw-2*pad)/(sx+maxz*DZ+SD),(bh-2*pad)/(sy*ASP+maxz*DZ+SD),40));
  const tw=(sx+maxz*DZ+SD)*u,th=(sy*ASP+maxz*DZ+SD)*u;
  return{u,minx,miny,maxz,ox:(bw-tw)/2,oy:(bh-th)/2};
}
function pickRot(id){
  const r=board.getBoundingClientRect(),w=r.width||360,h=r.height||560;
  return solFit(place(id,1),w,h).u>solFit(place(id,0),w,h).u*1.08?1:0;
}
function geo(){
  if(!G)return;faceCache.clear();
  if(G.kind==='s'){GEO=solFit(G.P,BW,BH);ORDER=G.P.map((p,i)=>i).sort((a,b)=>G.P[a][2]-G.P[b][2]||G.P[a][1]-G.P[b][1]||G.P[a][0]-G.P[b][0])}
  else{const cw=Math.max(8,Math.min(BW/(G.W+1),BH/((G.H+1)*CASP),90)),ch=cw*CASP;GEO={cw,ch,ox:(BW-G.W*cw)/2,oy:(BH-G.H*ch)/2}}
}
function tileRect(i){
  if(G.kind==='s'){const p=G.P[i],g=GEO,u=g.u,k=(g.maxz-p[2])*DZ*u;return{x:g.ox+(p[0]-g.minx)*u+k,y:g.oy+(p[1]-g.miny)*u*ASP+k,w:2*u,h:2*u*ASP,s:SD*u}}
  const g=GEO,c=i%G.W,r=(i/G.W)|0,ins=Math.max(1,g.cw*.04),s=g.cw*.09;
  return{x:g.ox+c*g.cw+ins,y:g.oy+r*g.ch+ins,w:g.cw-2*ins-s,h:g.ch-2*ins-s,s};
}
function resize(){
  const r=board.getBoundingClientRect();dpr=Math.min(3,window.devicePixelRatio||1);BW=r.width;BH=r.height;
  cv.width=Math.max(1,Math.round(BW*dpr));cv.height=Math.max(1,Math.round(BH*dpr));geo();draw();
}

// ---------- Rajzolás ----------
function req(){if(!raf)raf=requestAnimationFrame(draw)}
const reduced=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
function tileBody(R,f,round){
  const r=Math.max(2,R.w*.12);
  rr(ctx,R.x+R.s,R.y+R.s,R.w,R.h,r);ctx.fillStyle='#1c6a52';ctx.fill();
  rr(ctx,R.x+R.s*.5,R.y+R.s*.5,R.w,R.h,r);ctx.fillStyle='#d9caa6';ctx.fill();
  ctx.drawImage(faceImg(f,R.w,R.h),R.x,R.y,R.w,R.h);
}
function overlay(R,fill,stroke,lw,dash){
  const r=Math.max(2,R.w*.12);rr(ctx,R.x,R.y,R.w,R.h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.setLineDash(dash||[]);ctx.strokeStyle=stroke;ctx.lineWidth=lw||3;ctx.stroke();ctx.setLineDash([])}
}
function draw(){
  raf=0;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,BW,BH);
  if(!G||!GEO)return;
  const now=performance.now();let more=false;
  const hintOn=G.hint&&now<G.hintT,pulse=reduced()?1:.55+.45*Math.sin(now/140);
  if(hintOn)more=true;
  const mark=(i,R,blocked)=>{
    if(blocked&&SAVE.dim)overlay(R,'rgba(6,24,28,.34)');
    if(i===G.sel)overlay(R,'rgba(255,207,74,.38)','#ffcf4a',3);
    if(hintOn&&G.hint.includes(i))overlay(R,'rgba(98,227,154,'+(.2*pulse)+')','rgba(98,227,154,'+pulse+')',4);
    if(kbOn&&i===G.cur)overlay(R,null,'#6cc4ff',3,[6,4]);
  };
  if(G.kind==='s'){
    for(const i of ORDER){if(!G.on[i])continue;const R=tileRect(i);tileBody(R,G.f[i]);mark(i,R,!isFree(G.T,G.on,i))}
  }else{
    if(kbOn&&G.g[G.cur]<0){const R=tileRect(G.cur);overlay(R,'rgba(108,196,255,.12)','#6cc4ff',3,[6,4])}
    for(let i=0;i<G.g.length;i++){if(G.g[i]<0)continue;const R=tileRect(i);tileBody(R,G.g[i]);mark(i,R,false)}
  }
  for(let k=FX.length-1;k>=0;k--){const e=FX[k],t=(now-e.t0)/(e.dur||260);if(t>=1){FX.splice(k,1);continue}more=true;
    if(e.pts){ctx.globalAlpha=1-t;ctx.strokeStyle='#ffcf4a';ctx.lineWidth=Math.max(3,GEO.cw*.09);ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();
      e.pts.forEach(([c,r],j)=>{const x=GEO.ox+(c+.5)*GEO.cw,y=GEO.oy+(r+.5)*GEO.ch;j?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.globalAlpha=1;continue}
    const R=e.R,sc=1+t*.25,cx=R.x+R.w/2,cy=R.y+R.h/2;ctx.globalAlpha=1-t;
    ctx.drawImage(faceImg(e.f,R.w,R.h),cx-R.w*sc/2,cy-R.h*sc/2,R.w*sc,R.h*sc);ctx.globalAlpha=1}
  if(more)req();
}

// ---------- Játékmenet ----------
function alive(){if(G.kind==='s'){let n=0;for(let i=0;i<G.T.n;i++)n+=G.on[i];return n}return G.g.filter(v=>v>=0).length}
function pairsNow(){return G.kind==='s'?freePairs(G.T,G.on,G.f):connPairs(G.g,G.W,G.H)}
function statKey(){return G.m==='k'?'k-'+G.lv:G.m==='d'?'d':G.m+'-'+G.lay}
function modeLabel(){if(!G)return'Mahjong';const m=MODES[G.m].short;return m+' · '+(G.kind==='k'?CONNECT[G.lv].name:LAYOUTS[G.lay].name)}
function updHud(){
  if(!G)return;
  $('modeBtn').textContent=modeLabel();
  const t=G.m==='t';$('timeLbl').textContent=t?'MARAD':'IDŐ';$('time').textContent=fmt(t?G.tl:G.time);
  $('timeChip').classList.toggle('low',t&&G.tl<=15);
  $('left').textContent=String(alive()/2);$('moves').textContent=String(pairsNow().length);
  $('undo').disabled=G.over||G.h.length<=G.lk;$('hint').disabled=$('mix').disabled=!!G.over;
}
function start(g){
  G=g;G.sel=-1;G.hint=null;G.hintT=0;G.over=false;FX.length=0;
  if(G.kind==='s'){G.P=place(G.lay,G.rot);G.T=topo(G.P);G.on=new Uint8Array(G.P.length).fill(1);for(const [a,b] of G.h)G.on[a]=G.on[b]=0;
    G.cur=-1;for(let i=0;i<G.T.n;i++)if(G.on[i]&&isFree(G.T,G.on,i)){G.cur=i;break}}
  else G.cur=G.g.findIndex(v=>v>=0);
  geo();updHud();req();
}
function newGame(spec){
  hideOv();const seed=spec.seed||newSeed();
  if(spec.m==='k'){SAVE.lastLv=spec.lv;const d=dealConnect(spec.lv,seed),c=CONNECT[spec.lv];
    start({kind:'k',m:'k',lv:spec.lv,W:c.W,H:c.H,seed,g:d.g,h:[],lk:0,time:0,sh:0,hi:0,st:false})}
  else{let lay=spec.lay,day='',s=seed;
    if(spec.m==='d'){day=spec.day||today();const di=dayInfo(day);lay=di.lay;s=di.seed}else SAVE.last=lay;
    const rot=pickRot(lay),d=dealSolitaire(lay,rot,s);
    start({kind:'s',m:spec.m,lay,rot,day,seed:s,f:d.f,h:[],lk:0,time:0,tl:spec.m==='t'?30+Math.round(d.P.length/2):0,sh:0,hi:0,st:false})}
  msg(G.m==='t'?'Indul az óra az első koppintással. Minden pár +3 mp!':G.m==='k'?'Kösd össze a párokat legfeljebb két kanyarral!':'Szedd párba a szabad lapokat!','good');
  writeSave();
}
function again(){if(!G)return menu();newGame(G.m==='k'?{m:'k',lv:G.lv}:G.m==='d'?{m:'d',day:G.day}:{m:G.m,lay:G.lay})}
function firstTouch(){if(!G.st){G.st=true}}
function tap(i){
  if(!G||G.over||i<0)return;firstTouch();
  if(G.kind==='s'){
    if(!G.on[i])return;
    if(!isFree(G.T,G.on,i)){SND.bad();msg(G.T.A[i].some(j=>G.on[j])?'Ezen a lapon másik lap van.':'Ez a lap két oldalról be van zárva.','warn');G.sel=-1;req();return}
  }else if(G.g[i]<0){G.sel=-1;req();return}
  const fa=G.kind==='s'?G.f:G.g;
  if(G.sel<0||G.sel===i){G.sel=G.sel===i?-1:i;if(G.sel>=0)SND.sel();req();return}
  if(!same(fa[G.sel],fa[i])){G.sel=i;SND.sel();msg('Ez a két lap nem egyforma.','warn');req();return}
  if(G.kind==='k'){const pts=connPath(G.g,G.W,G.H,G.sel,i);
    if(!pts){SND.bad();msg('Ezeket nem lehet összekötni: legfeljebb két kanyar, üres helyeken át.','warn');G.sel=i;req();return}
    FX.push({pts,t0:performance.now(),dur:420})}
  take(G.sel,i);
}
function take(a,b){
  const now=performance.now();
  if(G.kind==='s'){FX.push({R:tileRect(a),f:G.f[a],t0:now},{R:tileRect(b),f:G.f[b],t0:now});G.on[a]=G.on[b]=0;G.h.push([a,b])}
  else{FX.push({R:tileRect(a),f:G.g[a],t0:now},{R:tileRect(b),f:G.g[b],t0:now});G.h.push([a,b,G.g[a],G.g[b]]);G.g[a]=G.g[b]=-1}
  G.sel=-1;G.hint=null;if(G.m==='t')G.tl=Math.min(999,G.tl+3);SND.match();
  fixCursor();
  if(alive()===0){updHud();req();return win()}
  if(!pairsNow().length){
    if(G.kind==='k'){mix(true)}
    else{updHud();req();writeSave();setTimeout(()=>{if(G&&!G.over&&!pairsNow().length&&ov.hidden)stuck()},350);return}
  }
  updHud();req();writeSave();
}
function undo(){

<script>
/* @shared gamepad */
/* Kontroller (gamepad) a böngésző Gamepad API-jával. A játék kódjához nem nyúl: a kontrollert billentyűkké
