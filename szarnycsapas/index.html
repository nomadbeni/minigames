<style>
/* Elrendezés: egyképernyős álló arcade — vissza sáv, pontsor, játéktér, ablakok */
:root{
  --bg:#0d2233; --panel:#123049; --line:#245170; --fg:#f1f8ff; --muted:#9dbad1;
  --accent:#ffc83d; --danger:#ff5d73;
  --display:"Bungee","Arial Black",system-ui,sans-serif;
  --ui:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;

}
[hidden]{display:none!important}
html{box-sizing:border-box;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto}
.hud{display:flex;align-items:center;gap:14px}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
#score{font-family:var(--display);color:var(--accent);font-size:22px}
.sp{flex:1}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;padding:0;flex:none}

<script>
/* @shared kepesseg */
/* Modern böngészőképességek egy helyen. Mind opcionális: ha a böngésző nem tudja, vagy hibát ad, csendben nem
   történik semmi, a játék ugyanúgy játszható. Hálózatot nem használ, és a játék soha nem vár rá.
   A játék fő szkriptje ELŐTT kell betölteni, mert a játék a window.Kepesseg függvényeit hívja.
     Kepesseg.haptic(minta)   rövid rezgés telefonon (navigator.vibrate) és kontrolleren (vibrationActuator).
                              minta: 'tap' | 'hit' | 'hurt' | 'boom' | 'reward' | 'over', vagy ms, vagy ms-tömb.
                              Csak koppintás/gombnyomás után rezeg, van rá időkorlát, és ki lehet kapcsolni.
     Kepesseg.hapticsOn() / Kepesseg.setHaptics(be)   a közös rezgés-beállítás (localStorage: kepesseg:rezges).
       Ha az oldalon van .hap-btn gomb, az kapcsolja; csak ott látszik, ahol van mit rezegtetni.
     Kepesseg.wakeLock(be)    true: amíg tart a játék, a kijelző ne aludjon el; false: elengedi. Háttérbe tett
                              lap után magától újrakéri; 2 perc tétlenség után elengedi, a következő érintésre újra.
     Kepesseg.transition(fn)  fn a képernyőváltás DOM-módosítása; View Transitionnel fut, ha lehet, és nincs
                              csökkentett mozgás. Különben (vagy hibánál) azonnal fut. Az átmenet alatt (0,15 mp)
                              a böngésző nem ad át érintést, ezért csak ablak MEGJELENÉSÉRE használd; a játékba
                              visszavezető bezárás legyen azonnali, és hívja a Kepesseg.endTransition()-t.
     Kepesseg.quality(most)   képkockánként hívva a díszítő grafika szintje: 2 teljes, 1 kevesebb, 0 legkevesebb.
                              Csak látványra használd (részecske, háttér), játéklogikára soha.
     Tájolás: ha a <head>-ben <meta name="games:orientation" content="portrait"> (vagy landscape) áll, és a
       készülék már így áll, teljes képernyőn ebben rögzíti (nem fordul el véletlenül), kilépéskor felold.
       Ha másképp áll, nem zárol és nem forgat; ilyenkor a CSS-es elrendezés és a fekvo-jelzes segít. */
(function(){
  if(window.Kepesseg)return;
  var d=document,nav=navigator,noop=function(){};
  function now(){return (window.performance&&performance.now)?performance.now():Date.now()}
  function mq(q){try{return matchMedia(q).matches}catch(e){return false}}
  function calm(){return mq('(prefers-reduced-motion: reduce)')}
  function quiet(p){try{if(p&&typeof p.then==='function')p.then(noop,noop)}catch(e){}return p}

  /* ---------- rezgés ---------- */
  var KEY='kepesseg:rezges',PAT={tap:[10],hit:[20],hurt:[45],boom:[70],reward:[25,50,25],over:[40,60,40]};
  var POW={tap:.25,hit:.45,hurt:.8,boom:1,reward:.5,over:.7},RANK={tap:0,hit:1,reward:2,hurt:3,boom:3,over:4};
  var on=true,last=-1e9,busy=0,busyRank=-1;
  try{on=localStorage.getItem(KEY)!=='0'}catch(e){}
  function pattern(m){
    var p=typeof m==='string'?PAT[m]:typeof m==='number'?[m]:Array.isArray(m)?m:null,out=[],sum=0;
    if(!p)return null;
    for(var i=0;i<p.length&&i<7;i++){var v=+p[i];if(!(v>=0))return null;v=Math.min(200,Math.round(v));
      if(i%2===0){if(sum+v>400)v=400-sum;sum+=v}out.push(v)}
    return sum>0?out:null;
  }
  function pads(){
    var r=[];try{var g=nav.getGamepads?nav.getGamepads():[];for(var i=0;i<g.length;i++)
      if(g[i]&&g[i].connected!==false&&(g[i].vibrationActuator||(g[i].hapticActuators&&g[i].hapticActuators[0])))r.push(g[i])}catch(e){}
    return r;
  }
  function phone(){return typeof nav.vibrate==='function'&&mq('(pointer: coarse)')}
  function rumble(gp,ms,pow){
    try{
      var a=gp.vibrationActuator;
      if(a&&typeof a.playEffect==='function'){
        var t=(a.effects&&a.effects.indexOf&&a.effects.indexOf('dual-rumble')<0&&a.effects.indexOf('trigger-rumble')<0)?a.effects[0]:'dual-rumble';
        quiet(a.playEffect(t||'dual-rumble',{startDelay:0,duration:ms,strongMagnitude:pow,weakMagnitude:Math.min(1,pow+.2)}));
      }else if(gp.hapticActuators&&gp.hapticActuators[0]&&gp.hapticActuators[0].pulse){
        quiet(gp.hapticActuators[0].pulse(pow,ms));
      }
    }catch(e){}
  }
  function haptic(m){
    if(!on)return false;
    try{var ua=nav.userActivation;if(ua&&!ua.hasBeenActive)return false}catch(e){}
    var p=pattern(m);if(!p)return false;
    var t=now(),rk=typeof m==='string'?RANK[m]:1,total=0;
    if(t-last<70)return false;                       /* sűrű eseményeknél nem rezeg minden alkalommal */
    if(t<busy&&rk<=busyRank)return false;            /* gyengébb jelzés nem szakítja meg az erősebbet */
    for(var i=0;i<p.length;i++)total+=p[i];
    last=t;busy=t+total;busyRank=rk;
    var did=false,gs=pads(),pow=typeof m==='string'?POW[m]:.5;
    if(gs.length){
      var off=0;did=true;
      for(var j=0;j<p.length;j+=2){(function(ms,at){
        if(at===0)gs.forEach(function(g){rumble(g,ms,pow)});
        else setTimeout(function(){if(on)pads().forEach(function(g){rumble(g,ms,pow)})},at);
      })(p[j],off);off+=p[j]+(p[j+1]||0)}
    }
    if(phone()){try{did=nav.vibrate(p.length===1?p[0]:p)!==false||did}catch(e){}}
    return did;
  }
  function stop(){busy=0;try{if(typeof nav.vibrate==='function')nav.vibrate(0)}catch(e){}
    pads().forEach(function(g){try{var a=g.vibrationActuator;if(a&&a.reset)quiet(a.reset())}catch(e){}})}
  function setHaptics(v){on=!!v;try{localStorage.setItem(KEY,on?'1':'0')}catch(e){}if(!on)stop();label()}
  var btn=null;
  function label(){
    if(!btn)return;
    btn.textContent=on?'📳':'📴';btn.setAttribute('aria-pressed',on?'true':'false');
    btn.setAttribute('aria-label',on?'Rezgés: be':'Rezgés: ki');btn.title=on?'Rezgés: be':'Rezgés: ki';
    btn.style.opacity=on?'.75':'.45';
  }
  function showBtn(){
    if(!btn)return;
    btn.style.display=(phone()||pads().length)?'inline-flex':'none';
    /* ha nem fér ki egy sorba, a teljes képernyő gomb csak ikont mutat (ugyanaz a data-compact jelzés, amit a gomb szkriptje is ismer) */
    var fs=d.querySelector('.fs-btn'),first=btn.parentNode&&btn.parentNode.firstElementChild;
    if(fs&&first&&btn.style.display!=='none'&&btn.offsetTop>first.offsetTop+4){fs.dataset.compact='1';fs.textContent='⛶'}
  }
  function initBtn(){
    btn=d.querySelector('.hap-btn');if(!btn)return;
    btn.addEventListener('click',function(){setHaptics(!on);if(on)haptic('hit');btn.blur()});
    label();showBtn();
  }
  addEventListener('gamepadconnected',showBtn);addEventListener('gamepaddisconnected',showBtn);

  /* ---------- ébren tartás (Screen Wake Lock) ---------- */
  var IDLE=120000,want=false,lock=null,pending=false,lastUse=0,timer=0;
  function wlRequest(){
    if(!want||lock||pending||d.visibilityState!=='visible')return;
    var w=nav.wakeLock;if(!w||typeof w.request!=='function')return;
    pending=true;
    try{
      w.request('screen').then(function(s){
        pending=false;
        if(!want||!s){try{s&&quiet(s.release())}catch(e){}return}
        lock=s;try{s.addEventListener('release',function(){if(lock===s)lock=null})}catch(e){}
      },function(){pending=false});
    }catch(e){pending=false}
  }
  function wlRelease(){var s=lock;lock=null;if(s)try{quiet(s.release())}catch(e){}}
  function used(){lastUse=now();if(want&&!lock)wlRequest()}
  function tick(){if(lock&&now()-lastUse>IDLE)wlRelease()}
  function wakeLock(v){
    want=!!v;lastUse=now();
    if(want){wlRequest();if(!timer)timer=setInterval(tick,15000)}
    else{wlRelease();if(timer){clearInterval(timer);timer=0}}
  }
  d.addEventListener('visibilitychange',function(){if(d.visibilityState==='visible'){lastUse=now();wlRequest()}});
  ['pointerdown','keydown','touchstart'].forEach(function(ev){addEventListener(ev,used,{capture:true,passive:true})});
  addEventListener('pagehide',function(){wlRelease();oriUnlock()});

  /* ---------- képernyőváltás (View Transitions) ---------- */
  var vt=null,vtCss=false;
  function transition(fn){
    var done=false,run=function(){if(done)return;done=true;
      try{fn()}catch(e){setTimeout(function(){throw e},0)}};   /* a játék hibája ne vesszen el */
    /* betöltés közben (első képernyő) nincs mit átúsztatni */
    if(typeof d.startViewTransition!=='function'||calm()||d.visibilityState!=='visible'||d.readyState!=='complete'){run();return}
    if(!vtCss){vtCss=true;try{var st=d.createElement('style');
      st.textContent='::view-transition-old(root),::view-transition-new(root){animation-duration:.15s}';d.head.appendChild(st)}catch(e){}}
    try{
      var t=d.startViewTransition(run);vt=t;
      var clear=function(){if(vt===t)vt=null};
      quiet(t.ready);quiet(t.updateCallbackDone);
      if(t.finished&&t.finished.then)t.finished.then(clear,clear);
    }catch(e){run()}
    if(!done)setTimeout(run,250);                     /* ha a böngésző nem futtatná le, akkor is megtörténik */
  }
  /* a futó átmenet azonnali vége: bezáráskor és bármilyen érintésre, gombnyomásra, hogy a játék ne várjon rá */
  function endTransition(){var t=vt;vt=null;if(t)try{t.skipTransition()}catch(e){}}
  ['pointerdown','keydown'].forEach(function(ev){addEventListener(ev,function(){if(vt)endTransition()},{capture:true,passive:true})});

  /* ---------- tájolás (Screen Orientation) ---------- */
  var ori=null,oriLocked=false;
  function oriPref(){var m=d.querySelector('meta[name="games:orientation"]'),v=m&&m.getAttribute('content');
    return v==='portrait'||v==='landscape'?v:null}
  function oriLock(){
    var o=window.screen&&screen.orientation,p=ori||(ori=oriPref());
    if(!p||!o||typeof o.lock!=='function')return;
    if(String(o.type||'').split('-')[0]!==p)return;   /* csak a már meglévő tájolást rögzíti: soha nem forgatja el a képet */
    try{var r=o.lock(p);oriLocked=true;if(r&&r.then)r.then(noop,function(){oriLocked=false})}catch(e){oriLocked=false}
  }
  function oriUnlock(){
    if(!oriLocked)return;oriLocked=false;
    try{var o=window.screen&&screen.orientation;if(o&&typeof o.unlock==='function')o.unlock()}catch(e){}
  }
  function fsChange(){if(d.fullscreenElement||d.webkitFullscreenElement)oriLock();else oriUnlock()}
  d.addEventListener('fullscreenchange',fsChange);d.addEventListener('webkitfullscreenchange',fsChange);

  /* ---------- adaptív grafikai minőség ---------- */
  var Q={lvl:2,t:0,acc:0,n:0,bad:0,good:0,changed:-1e9,ups:0,hot:false,watch:false,forced:null};
  function watchPressure(){
    Q.watch=true;
    try{if(typeof window.PressureObserver==='function'){
      var po=new window.PressureObserver(function(rs){var s=rs&&rs.length&&rs[rs.length-1].state;Q.hot=s==='serious'||s==='critical'});
      quiet(po.observe('cpu'));
    }}catch(e){}
  }
  function level(){var l=Q.forced!=null?Q.forced:Q.lvl;return calm()?Math.min(l,1):l}
  function quality(t){
    if(typeof t!=='number'||!isFinite(t))return level();
    if(!Q.watch)watchPressure();
    var dt=t-Q.t;Q.t=t;
    if(!(dt>0)||dt>250)return level();               /* szünet, háttér: nem mérjük */
    Q.acc+=dt;Q.n++;
    if(Q.acc>=1000){
      var avg=Q.acc/Q.n;Q.acc=0;Q.n=0;
      Q.bad=(avg>24||Q.hot)?Q.bad+1:0;Q.good=(avg<18&&!Q.hot)?Q.good+1:0;
      if(t-Q.changed>4000){
        if(Q.bad>=3&&Q.lvl>0){Q.lvl--;Q.changed=t;Q.bad=Q.good=0}   /* 3 lassú másodperc egymás után: egy rövid akadás nem számít */
        else if(Q.good>=15&&Q.lvl<2&&Q.ups<2){Q.lvl++;Q.ups++;Q.changed=t;Q.good=0}   /* ritkán, és csak kétszer lép vissza */
      }
    }
    return level();
  }
  function setQuality(l){Q.forced=(l===0||l===1||l===2)?l:null}

  window.Kepesseg={haptic:haptic,hapticsOn:function(){return on},setHaptics:setHaptics,wakeLock:wakeLock,
    wakeLockHeld:function(){return !!lock},transition:transition,endTransition:endTransition,quality:quality,setQuality:setQuality};
  if(d.readyState==='loading')d.addEventListener('DOMContentLoaded',initBtn);else initBtn();
})();
/* @end kepesseg */
</script>
<script>
(()=>{
'use strict';
/* Egy kör fél perc–pár perc, ezért félbehagyott kört nem mentünk: csak a rekord és a beállítás marad meg. */
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const W=360,GROUND=64,BX=96,BR=13;               // BX: a madár vízszintes helye, BR: ütközési sugara
const MODES={n:{name:'Normál',grav:1250,flap:-370,gap0:150,gapMin:118,sp0:140,spMax:185},
             k:{name:'Könnyű',grav:1050,flap:-340,gap0:180,gapMin:150,sp0:120,spMax:150}};
const MEDALS=[[80,'Platina','#d8f3ff'],[40,'Arany','#ffd23f'],[20,'Ezüst','#cfd6de'],[10,'Bronz','#d88a4a']];
let H=560,sc=1,dpr=1,cw=0,ch=0;
let G=null,last=0,actx=null,hudKey='',clouds=[],hills=[];

// ---------- rekord, beállítás (csak localStorage) ----------
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let sound=lsGet('szarnycsapas-sound')!=='0';
let mode=lsGet('szarnycsapas-mode')==='k'?'k':'n';
function loadBest(){
  const out={n:0,k:0};
  try{const d=JSON.parse(lsGet('szarnycsapas-best'));
    if(d&&typeof d==='object'&&!Array.isArray(d))for(const k of ['n','k'])if(Number.isInteger(d[k])&&d[k]>=0&&d[k]<1e6)out[k]=d[k]}catch(e){}
  return out;
}
let best=loadBest();

// ---------- hang (Web Audio) ----------
function beep(f,d=0.06,type='square',v=0.04,at=0,f2=0){
  if(!sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+at;
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+0.02);
  }catch(e){}
}
function sndIcon(){
  $('sndIcon').innerHTML=sound
    ?'<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z"/>'
    :'<path d="M3 9v6h4l5 5V4L7 9H3zm18.4 6L20 16.4l-2.6-2.6-2.6 2.6L13.4 15l2.6-2.6-2.6-2.6 1.4-1.4 2.6 2.6 2.6-2.6 1.4 1.4-2.6 2.6z"/>';
  $('snd').setAttribute('aria-pressed',sound?'true':'false');
}
$('snd').addEventListener('click',()=>{sound=!sound;lsSet('szarnycsapas-sound',sound?'1':'0');sndIcon();beep(660)});
sndIcon();

// ---------- játék ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
const M=()=>MODES[G?G.mode:mode];
const floorY=()=>H-GROUND;
function newGame(){
  G={mode,phase:'ready',y:floorY()*.45,vy:0,rot:0,flapT:0,score:0,pipes:[],dist:0,next:W+40,scroll:0,t:0,rec:false,flash:0};
  hideOv();hud();
}
function gapNow(){const m=M();return Math.max(m.gapMin,m.gap0-G.score*1.2)}
function speedNow(){const m=M();return Math.min(m.spMax,m.sp0+G.score*1.1)}
function addPipe(){
  const gap=gapNow(),margin=56,top=rnd(margin,floorY()-margin-gap);
  G.pipes.push({x:W+30,top,gap,w:58,passed:false});
}
function flap(){
  if(!G)return;
  if(G.phase==='ready'){G.phase='play';G.resumed=false}
  if(G.phase!=='play')return;
  G.vy=M().flap;G.flapT=.18;beep(520,.07,'triangle',.04,0,780);
}
function die(){
  if(G.phase!=='play')return;
  G.phase='dead';G.flash=performance.now();
  beep(200,.25,'sawtooth',.05,0,60);
  if(G.vy<0)G.vy=0;
}
function update(dt){
  G.t+=dt;
  if(G.phase==='ready'){if(!G.resumed){G.y=floorY()*.45+Math.sin(G.t*4)*8;G.scroll+=speedNow()*dt}return}  // szünet után a madár egy helyben vár
  const m=M();
  G.vy=Math.min(G.vy+m.grav*dt,620);G.y+=G.vy*dt;
  if(G.flapT>0)G.flapT-=dt;
  G.rot=Math.max(-.45,Math.min(1.25,G.vy/520));
  if(G.y<BR){G.y=BR;G.vy=Math.max(0,G.vy)}
  if(G.phase==='play'){
    const sp=speedNow();G.scroll+=sp*dt;
    for(const p of G.pipes)p.x-=sp*dt;
    G.pipes=G.pipes.filter(p=>p.x>-80);
    G.next-=sp*dt;if(G.next<=W){addPipe();G.next+=196}
    for(const p of G.pipes){
      if(!p.passed&&p.x+p.w<BX-BR){p.passed=true;G.score++;beep(880,.05,'square',.035);beep(1320,.08,'square',.035,.05);hud()}
      // kör - téglalap ütközés a felső és az alsó oszloppal
      const cx=Math.max(p.x,Math.min(BX,p.x+p.w));
      for(const [y1,y2] of [[-999,p.top],[p.top+p.gap,floorY()]]){
        const cy=Math.max(y1,Math.min(G.y,y2));
        if((BX-cx)**2+(G.y-cy)**2<(BR-2)**2){die();break}
      }
      if(G.phase!=='play')break;
    }
  }
  if(G.y>=floorY()-BR){
    G.y=floorY()-BR;
    if(G.phase==='play')die();
    if(G.phase==='dead')over();
  }
}
function over(){
  G.phase='over';
  G.rec=G.score>best[G.mode];if(G.rec){best[G.mode]=G.score;lsSet('szarnycsapas-best',JSON.stringify(best))}
  hud();
  setTimeout(()=>{if(G&&G.phase==='over')showOver()},450);
}
function pause(){if(!G||(G.phase!=='play'&&G.phase!=='ready'))return;G.prev=G.phase;G.phase='pause';showPause()}
function resume(){if(!G||G.phase!=='pause')return;hideOv();G.phase='ready';G.resumed=G.prev==='play';last=performance.now()}
function hud(){
  const k=G?[G.score,G.mode,G.phase==='over'].join():'-'+mode;
  if(k===hudKey)return;hudKey=k;
  $('score').textContent=G?G.score:0;
  const md=G?G.mode:mode;
  $('best').textContent=Math.max(best[md],G&&G.phase!=='over'?G.score:0);
  $('mode').textContent=MODES[md].name;
}

// ---------- rajz ----------
function fit(){
  const r=$('stage').getBoundingClientRect();
  if(r.width<10||r.height<10)return;
  cw=Math.floor(Math.min(r.width,560));ch=Math.floor(r.height);
  sc=cw/W;const oldF=floorY();H=Math.max(420,ch/sc);dpr=window.devicePixelRatio||1;
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.style.left=Math.floor((r.width-cw)/2)+'px';
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  clouds=[];for(let i=0;i<6;i++)clouds.push([Math.random()*W*1.5,rnd(30,H*.45),rnd(.6,1.2)]);
  hills=[];for(let i=0;i<8;i++)hills.push([i*80+rnd(-20,20),rnd(40,90)]);
  if(G){const d=floorY()-oldF;G.y+=d;for(const p of G.pipes)p.top=Math.min(p.top,floorY()-56-p.gap)}
}
new ResizeObserver(fit).observe($('stage'));
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function cloud(x,y,s){
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();
  ctx.arc(x,y,16*s,0,7);ctx.arc(x+18*s,y-8*s,20*s,0,7);ctx.arc(x+40*s,y,16*s,0,7);ctx.rect(x,y,40*s,14*s);ctx.fill();
}
function pillar(x,y,w,h,capTop){
  if(h<=0)return;
  const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'#7a5bd6');g.addColorStop(.45,'#a98bff');g.addColorStop(1,'#5a3fb0');
  ctx.fillStyle=g;ctx.fillRect(x+4,y,w-8,h);
  ctx.fillStyle='rgba(255,255,255,.12)';for(let yy=y+((capTop?h:0)%18);yy<y+h;yy+=18)ctx.fillRect(x+4,yy,w-8,2);
  const cy=capTop?y+h-18:y;
  ctx.fillStyle='#4a2f99';ctx.fillRect(x,cy,w,18);
  ctx.fillStyle='#c4b0ff';ctx.fillRect(x+3,cy+3,w-6,4);
}
function bird(x,y,rot,flapT){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  // test
  ctx.fillStyle='#2ec4b6';ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fill();
  ctx.fillStyle='#bff5ee';ctx.beginPath();ctx.ellipse(-2,6,9,6,0,0,7);ctx.fill();
  // szárny: csapáskor felfelé áll
  const up=flapT>0||(G&&G.phase==='ready'&&Math.sin(G.t*12)>0);
  ctx.fillStyle='#1b8f86';ctx.beginPath();ctx.ellipse(-6,up?-6:2,9,5,up?-.6:.4,0,7);ctx.fill();
  // szem és csőr
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(6,-5,5.5,0,7);ctx.fill();
  ctx.fillStyle='#14213d';ctx.beginPath();ctx.arc(7.5,-5,2.6,0,7);ctx.fill();
  ctx.fillStyle='#ff9f1c';ctx.beginPath();ctx.moveTo(12,-1);ctx.lineTo(21,2);ctx.lineTo(12,5);ctx.closePath();ctx.fill();
  // bóbita
  ctx.fillStyle='#ff6b8a';ctx.beginPath();ctx.ellipse(-3,-15,3,6,-.3,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(2,-15,3,5,.3,0,7);ctx.fill();
  ctx.restore();
}
function draw(){
  if(!cw)return;
  ctx.setTransform(dpr*sc,0,0,dpr*sc,0,0);
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#5ec8ff');sky.addColorStop(1,'#c8f0ff');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const scr=G?G.scroll:performance.now()/12;
  for(const c of clouds){const x=((c[0]-scr*.15*c[2])%(W*1.5)+W*1.5)%(W*1.5)-60;cloud(x,c[1],c[2])}
  ctx.fillStyle='#8fd694';
  for(const h of hills){const x=((h[0]-scr*.35)%640+640)%640-80;ctx.beginPath();ctx.ellipse(x,floorY(),70,h[1],0,Math.PI,0);ctx.fill()}
  if(G)for(const p of G.pipes){pillar(p.x,0,p.w,p.top,true);pillar(p.x,p.top+p.gap,p.w,floorY()-p.top-p.gap,false)}
  // föld
  ctx.fillStyle='#6b4f2a';ctx.fillRect(0,floorY(),W,GROUND);
  ctx.fillStyle='#5cbf4a';ctx.fillRect(0,floorY(),W,12);
  ctx.fillStyle='#4aa03a';const off=-(scr%24);for(let x=off;x<W;x+=24)ctx.fillRect(x,floorY()+12,12,5);
  if(!G)return;
  bird(BX,G.y,G.phase==='ready'?0:G.rot,G.flapT);
  if(G.phase==='dead'||G.phase==='over'){const a=1-(performance.now()-G.flash)/250;if(a>0){ctx.fillStyle=`rgba(255,255,255,${a*.7})`;ctx.fillRect(0,0,W,H)}}
  // nagy pontszám fent
  if(G.phase!=='ready'){
    ctx.textAlign='center';ctx.textBaseline='top';ctx.font=`400 44px ${css('--display')||'system-ui'}`;
    ctx.lineWidth=6;ctx.strokeStyle='#14213d';ctx.strokeText(G.score,W/2,24);ctx.fillStyle='#fff';ctx.fillText(G.score,W/2,24);
  }else{
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#14213d';
    ctx.font=`400 26px ${css('--display')||'system-ui'}`;ctx.fillText(G.resumed?'Folytatás':'Készen állsz?',W/2,H*.2);
    ctx.font=`700 16px ${css('--ui')||'system-ui'}`;
    ctx.fillText(matchMedia('(pointer:coarse)').matches?'Koppints a csapáshoz!':'Szóköz vagy kattintás: csapás',W/2,H*.2+34);
  }
}
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.04,Math.max(0,(t-last)/1000));last=t;
  if(G&&(G.phase==='play'||G.phase==='ready'||G.phase==='dead'))update(dt);
  draw();
}

// ---------- ablakok ----------
const ov=$('ov'),card=$('card');
function showOv(html){card.innerHTML=html;ov.hidden=false;const h=card.querySelector('.hot');if(h)h.focus({preventScroll:true})}
function hideOv(){ov.hidden=true;if(document.activeElement&&ov.contains(document.activeElement))document.activeElement.blur()}
function optsHTML(){
  return `<div class="olbl">Mód</div><div class="opts">${['k','n'].map(v=>`<button class="b sm" type="button" data-act="mode" data-v="${v}" aria-pressed="${mode===v}">${MODES[v].name}</button>`).join('')}</div>
  <p>Rekord ebben a módban: <b id="mbest">${best[mode]}</b></p>`;
}
function showMenu(){
  showOv(`<h2>Szárnycsapás</h2><p>Minden koppintásra <b>Pötyi</b> felcsap egyet. Repülj át az oszlopok közti réseken, és ne érj se hozzájuk, se a földhöz!</p>
  <p>Érmek: <b>10</b> bronz · <b>20</b> ezüst · <b>40</b> arany · <b>80</b> platina</p>

}

  const md=MEDALS.find(m=>G.score>=m[0]);

  ${md?`<div class="medal"><i style="background:${md[2]}"></i>${md[1]} érem</div>`:''}
  ${G.rec?'<span class="rec">Új rekord!</span>':`<p>Rekord: <b>${best[G.mode]}</b></p>`}
  <div class="btns"><button class="b hot" type="button" data-act="new">Új játék</button><button class="b" type="button" data-act="menu">Főmenü</button></div>`);
}
card.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='new'){newGame();beep(520,.05)}
  else if(a==='resume')resume();
  else if(a==='menu'){G=null;hud();showMenu()}
  else if(a==='mode'){mode=b.dataset.v==='k'?'k':'n';lsSet('szarnycsapas-mode',mode);
    card.querySelectorAll('[data-act="mode"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===mode)));
    const mb=$('mbest');if(mb)mb.textContent=best[mode];hud()}
});

// ---------- irányítás ----------
addEventListener('keydown',e=>{
  if(!ov.hidden){
    if((e.key==='Escape'||e.key==='p'||e.key==='P')&&G&&G.phase==='pause'){e.preventDefault();resume()}
    return;
  }
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){e.preventDefault();pause();return}
  if(e.repeat)return;
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w'||e.key==='W'||e.key==='j'||e.key==='J'||e.key==='Enter'){e.preventDefault();flap()}
});
$('stage').addEventListener('pointerdown',e=>{e.preventDefault();flap()});
$('stage').addEventListener('contextmenu',e=>e.preventDefault());
$('pauseBtn').addEventListener('click',()=>pause());
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

fit();hud();showMenu();requestAnimationFrame(t=>{last=t;frame(t)});
if(window.__GAMES_TEST__)window.__szarny={get G(){return G},newGame,flap,update,floorY,BX}; // csak a játékteszt (tools/play_test.py) kapcsolja be
})();

  function label(){ b.textContent=b.dataset.compact?'⛶':(on()?'⛶ Kilépés':'⛶ Teljes képernyő'); b.setAttribute('aria-label', on()?'Kilépés a teljes képernyőből':'Teljes képernyő'); }

<script>
/* @shared fekvo-jelzes */
/* Fekvő telefonon „Fordítsd el a telefont” jelzés. A játék álló képernyőre készült, ezért amíg a telefon
   fekszik, a jelzés eltakarja, és a játék a saját szünet-logikájával megáll (ugyanaz fut le, mint amikor
   a lap háttérbe kerül). Gépen, széles ablakban nem jelenik meg (csak érintőképernyőn, alacsony ablakban). */
(function(){
  var mq;
  try{ mq=matchMedia('(orientation: landscape) and (max-height: 500px) and (pointer: coarse)'); }catch(e){ return; }
  var st=document.createElement('style');
  st.textContent='.rotate-hint{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;padding:16px;'+
    'background:rgba(5,8,14,.95);color:#fff;font:700 20px/1.3 system-ui,sans-serif;text-align:center}'+
    '.rotate-hint[hidden]{display:none!important}.rotate-hint p{margin:8px 0}'+
    '.rotate-hint .sub{font-weight:400;font-size:16px;opacity:.85}.rotate-hint svg{width:56px;height:56px}';
  var el=document.createElement('div');
  el.className='rotate-hint';el.setAttribute('role','alert');el.hidden=true;
  el.innerHTML='<div><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2" '+
    'fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18.5" r="1" fill="currentColor"/></svg>'+
    '<p>Fordítsd el a telefont!</p><p class="sub">Ez a játék álló képernyőre készült. Addig szünetel.</p></div>';
  function pauseGame(){
    try{
      Object.defineProperty(document,'hidden',{configurable:true,get:function(){return true;}});
      document.dispatchEvent(new Event('visibilitychange'));
    }catch(e){}
    try{ delete document.hidden; }catch(e){}
  }
  function update(e){
    if(mq.matches){ if(el.hidden){ el.hidden=false; if(e) pauseGame(); } }
    else el.hidden=true;
  }
  document.head.appendChild(st);
  document.body.appendChild(el);
  if(mq.addEventListener) mq.addEventListener('change',update); else if(mq.addListener) mq.addListener(update);
  update();
})();
/* @end fekvo-jelzes */
</script>
<script>
/* @shared gamepad */
/* Kontroller (gamepad) a böngésző Gamepad API-jával. A játék kódjához nem nyúl: a kontrollert billentyűkké
   fordítja, amelyeket a játék már ismer. Ha egy ablak (menü, szünet, vége) látszik, a kar a gombok között lép,
   az A gomb megnyomja a kijelöltet. Kiosztás (szabványos kontroller):
     bal kar / d-pad → nyilak, A → szóköz, X → J, Y → K, B → L, RB → L, Start → Escape (szünet), Select → Enter.
   iPhone-on a böngésző nem támogatja, ott ez a rész nem csinál semmit. */
(function(){
  if(!navigator.getGamepads)return;
  var DIRS=[['ArrowUp',12],['ArrowDown',13],['ArrowLeft',14],['ArrowRight',15]];
  var BTN=[[0,' ','Space'],[2,'j','KeyJ'],[3,'k','KeyK'],[1,'l','KeyL'],[5,'l','KeyL'],[9,'Escape','Escape'],[8,'Enter','Enter']];
  var held={},raf=0,shown=false,lastNav=0;
  function key(type,k,code){
    var e=new KeyboardEvent(type,{key:k,code:code,bubbles:true,cancelable:true});
    (document.activeElement&&document.activeElement!==document.body?document.activeElement:document).dispatchEvent(e);
  }
  function set(name,on,k,code){if(!!held[name]===on)return;held[name]=on;key(on?'keydown':'keyup',k,code||k)}
  function visible(el){if(!el||el.hidden)return false;var r=el.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(el).visibility!=='hidden'}
  function dialog(){
    var c=document.querySelectorAll('#ov,#over,#pick,#overlay,.modal,dialog[open],.rotate-hint');
    for(var i=0;i<c.length;i++)if(visible(c[i])&&!c[i].classList.contains('rotate-hint'))return c[i];
    return null;
  }
  function buttons(d){return Array.prototype.filter.call(d.querySelectorAll('button:not(:disabled),a[href]'),visible)}
  function nav(d,dir){
    var b=buttons(d);if(!b.length)return;
    var i=b.indexOf(document.activeElement);
    if(i<0){var hot=d.querySelector('.hot:not(:disabled)');(hot&&visible(hot)?hot:b[0]).focus();return}
    var cur=b[i].getBoundingClientRect(),best=null,bd=1e9;
    b.forEach(function(x){if(x===b[i])return;var r=x.getBoundingClientRect(),dx=r.left+r.width/2-(cur.left+cur.width/2),dy=r.top+r.height/2-(cur.top+cur.height/2);
      var ok=dir==='ArrowUp'?dy<-4:dir==='ArrowDown'?dy>4:dir==='ArrowLeft'?dx<-4:dx>4;if(!ok)return;
      var dist=Math.abs(dx)+Math.abs(dy)*(dir==='ArrowLeft'||dir==='ArrowRight'?3:1)+Math.abs(dx)*(dir==='ArrowUp'||dir==='ArrowDown'?2:0);if(dist<bd){bd=dist;best=x}});
    (best||b[(i+(dir==='ArrowUp'||dir==='ArrowLeft'?b.length-1:1))%b.length]).focus();
  }
  function note(){
    if(shown)return;shown=true;
    var t=document.createElement('div');t.setAttribute('role','status');
    t.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:3500;background:#0b0c10;color:#fff;border:1px solid #444;border-radius:10px;padding:10px 16px;font:700 15px system-ui,sans-serif;pointer-events:none';
    t.textContent='Kontroller csatlakoztatva';document.body.appendChild(t);setTimeout(function(){t.remove()},2500);
  }
  function poll(){
    raf=setTimeout(poll,16); /* időzítő, nem képkocka: álló képnél is figyeli a kontrollert */
    var pads=navigator.getGamepads?navigator.getGamepads():[],gp=null;
    for(var i=0;i<pads.length;i++)if(pads[i]&&pads[i].connected){gp=pads[i];break}
    if(!gp){for(var n in held)if(held[n])held[n]=false;return}
    note();
    var pr=function(i){var b=gp.buttons[i];return !!b&&(b.pressed||b.value>.5)};
    var ax=gp.axes[0]||0,ay=gp.axes[1]||0,dz=.25;
    var dirOn={ArrowUp:ay<-dz,ArrowDown:ay>dz,ArrowLeft:ax<-dz,ArrowRight:ax>dz};
    DIRS.forEach(function(d){if(pr(d[1]))dirOn[d[0]]=true});
    var d=dialog();
    if(d){
      DIRS.forEach(function(x){if(held[x[0]])set(x[0],false,x[0])});
      BTN.forEach(function(b){if(held['b'+b[0]])set('b'+b[0],false,b[1],b[2])});
      var now=performance.now(),any=null;DIRS.forEach(function(x){if(dirOn[x[0]])any=x[0]});
      if(any&&now-lastNav>220){lastNav=now;nav(d,any)}else if(!any)lastNav=0;
      var a=pr(0);if(a&&!held.navA){var f=document.activeElement;if(f&&d.contains(f)&&f.click)f.click();else{var b=buttons(d),hot=d.querySelector('.hot:not(:disabled)');(hot&&visible(hot)?hot:b[0])&&(hot&&visible(hot)?hot:b[0]).click()}}
      held.navA=a;
      if(pr(9)&&!held.Escape)set('Escape',true,'Escape');else if(!pr(9))set('Escape',false,'Escape');
      return;
    }
    held.navA=pr(0);
    DIRS.forEach(function(x){set(x[0],dirOn[x[0]],x[0])});
    BTN.forEach(function(b){set('b'+b[0],pr(b[0]),b[1],b[2])});
  }
  addEventListener('gamepadconnected',function(){if(!raf)poll()});
  addEventListener('gamepaddisconnected',function(){var p=navigator.getGamepads(),any=false;for(var i=0;i<p.length;i++)if(p[i])any=true;if(!any){clearTimeout(raf);raf=0;for(var n in held)if(held[n]&&n.indexOf('Arrow')===0)set(n,false,n)}});
  try{var p0=navigator.getGamepads();for(var i=0;i<p0.length;i++)if(p0[i]){poll();break}}catch(e){}
})();
/* @end gamepad */
</script>
<script>
/* A „Hogyan kell?” súgó tartalma (a közös sugo blokk olvassa). */
window.SUGO={
  erinto:[["👆", "Koppints: csapás"],["⏸", "Szünet gomb: megáll"]],
  gep:[["Szóköz", "csapás (↑ is)"],["Esc", "szünet"]],
  kontroller:[["A", "csapás (kar fel is)"],["Start", "szünet"]]
};
/* @shared sugo */
/* Egységes „Hogyan kell?” súgó. A felső sávba (.top-bar) egy „?” gombot tesz; az ablakban a játék saját
   vezérlése látszik három fülön: Érintés, Billentyű, Kontroller. Az a fül nyílik meg, amivel épp játszanak.
   A játék a blokk ELŐTT megadja a tartalmat, soronként [jel, rövid szöveg]:
     window.SUGO={
       erinto:[['👆','Húzd az ujjad: mozgás']],
       gep:[['← →','mozgás'],['Szóköz','ugrás']],
       kontroller:[['Kar','mozgás'],['A','ugrás'],['Start','szünet']]
     };
   Megnyitáskor a játék a saját szünet-logikájával megáll (ugyanaz fut le, mint amikor a lap háttérbe kerül).
   Billentyűvel a ? nyitja, az Esc zárja; kontrollerrel a Start zárja. A szöveg textContent-tel kerül ki. */
(function(){
  var d=document,S=window.SUGO;
  if(!S||typeof S!=='object')return;
  var TABS=[['erinto','👆','Érintés'],['gep','⌨️','Billentyű'],['kontroller','🎮','Kontroller']];
  function rows(k){var r=S[k];return Array.isArray(r)?r.filter(function(x){return Array.isArray(x)&&x.length===2&&String(x[0])&&String(x[1])}):[]}
  var tabs=TABS.filter(function(t){return rows(t[0]).length});
  if(!tabs.length)return;
  var st=d.createElement('style');
  st.textContent='.sugo-btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;'+
    'min-height:44px;min-width:44px;padding:6px 10px;border-radius:999px;border:1px solid currentColor;color:inherit;opacity:.75;'+
    'cursor:pointer;font:800 20px/1 system-ui,sans-serif}.sugo-btn:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}'+
    'dialog.sugo{box-sizing:border-box;width:min(400px,calc(100vw - 16px));max-width:none;max-height:calc(100dvh - 16px);margin:auto;'+
    'padding:16px;border:2px solid #3b4660;border-radius:16px;background:#10141f;color:#fff;overflow:auto;'+
    'font:400 18px/1.35 Lexend,system-ui,sans-serif;z-index:4000}dialog.sugo::backdrop{background:rgba(0,0,0,.7)}'+
    'dialog.sugo h2{margin:0 0 12px;font-size:22px;font-weight:700}'+
    'dialog.sugo .sugo-tabs{display:flex;gap:6px;margin-bottom:12px}'+
    'dialog.sugo .sugo-tabs button{all:unset;box-sizing:border-box;flex:1;min-height:48px;padding:4px 6px;border-radius:10px;'+
    'border:2px solid #3b4660;text-align:center;cursor:pointer;font:600 15px/1.15 Lexend,system-ui,sans-serif;color:#cfd6e6}'+
    'dialog.sugo .sugo-tabs button span{display:block;font-size:20px}'+
    'dialog.sugo .sugo-tabs button[aria-selected="true"]{background:#2a6df4;border-color:#2a6df4;color:#fff}'+
    'dialog.sugo button:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}'+
    'dialog.sugo dl{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;margin:0 0 16px}'+
    'dialog.sugo dt{justify-self:start;min-width:44px;padding:4px 8px;border-radius:8px;background:#26304a;border:1px solid #4a5878;'+
    'text-align:center;font-weight:700;white-space:nowrap}dialog.sugo dd{margin:0}'+
    'dialog.sugo .sugo-ok{all:unset;box-sizing:border-box;display:block;width:100%;min-height:48px;padding:10px;border-radius:12px;'+
    'background:#ffd23f;color:#1a1a1a;text-align:center;cursor:pointer;font:700 18px/1.2 Lexend,system-ui,sans-serif}';
  d.head.appendChild(st);
  var dlg=d.createElement('dialog');dlg.className='sugo';dlg.setAttribute('aria-labelledby','sugo-cim');
  var h=d.createElement('h2');h.id='sugo-cim';h.textContent='❓ Hogyan kell?';dlg.appendChild(h);
  var bar=d.createElement('div');bar.className='sugo-tabs';bar.setAttribute('role','tablist');
  var list=d.createElement('dl');list.setAttribute('role','tabpanel');
  var ok=d.createElement('button');ok.type='button';ok.className='sugo-ok hot';ok.textContent='Értem';
  var cur=null,btns={};
  function show(k){
    cur=k;
    tabs.forEach(function(t){btns[t[0]].setAttribute('aria-selected',t[0]===k?'true':'false')});
    list.textContent='';
    rows(k).forEach(function(r){
      var dt=d.createElement('dt'),dd=d.createElement('dd');dt.textContent=String(r[0]);dd.textContent=String(r[1]);
      list.appendChild(dt);list.appendChild(dd);
    });
  }
  tabs.forEach(function(t){
    var b=d.createElement('button');b.type='button';b.setAttribute('role','tab');
    var i=d.createElement('span');i.setAttribute('aria-hidden','true');i.textContent=t[1];b.appendChild(i);
    b.appendChild(d.createTextNode(t[2]));
    b.addEventListener('click',function(){show(t[0])});btns[t[0]]=b;bar.appendChild(b);
  });
  if(tabs.length>1)dlg.appendChild(bar);
  dlg.appendChild(list);dlg.appendChild(ok);
  function has(k){return tabs.some(function(t){return t[0]===k})}
  function pad(){try{var p=navigator.getGamepads?navigator.getGamepads():[];for(var i=0;i<p.length;i++)if(p[i]&&p[i].connected)return true}catch(e){}return false}
  function touch(){try{return matchMedia('(pointer:coarse)').matches}catch(e){return false}}
  var lastKey=false;
  function best(){
    if(pad()&&has('kontroller'))return 'kontroller';
    if(lastKey&&has('gep'))return 'gep';
    if(touch()&&has('erinto'))return 'erinto';
    if(has('gep'))return 'gep';
    return tabs[0][0];
  }
  function pauseGame(){
    try{
      Object.defineProperty(d,'hidden',{configurable:true,get:function(){return true}});
      d.dispatchEvent(new Event('visibilitychange'));
    }catch(e){}
    try{delete d.hidden}catch(e){}
  }
  function isOpen(){return dlg.open}
  function open(){
    if(isOpen())return;
    show(best());pauseGame();
    try{dlg.showModal()}catch(e){dlg.setAttribute('open','')}
    ok.focus();
  }
  function close(){
    if(!isOpen())return;
    try{dlg.close()}catch(e){dlg.removeAttribute('open')}
    var a=d.activeElement;if(a&&a.blur)a.blur();   /* a szóköz utána ne nyissa újra a gombot */
  }
  ok.addEventListener('click',close);
  dlg.addEventListener('cancel',function(e){e.preventDefault();close()});
  dlg.addEventListener('click',function(e){if(e.target===dlg)close()});   /* a sötét háttérre koppintás is bezár */
  /* amíg nyitva van, a játék ne kapja meg az érintést és a billentyűt */
  ['pointerdown','pointerup','pointermove','touchstart','touchmove','touchend','mousedown','mouseup','click','wheel'].forEach(function(t){
    dlg.addEventListener(t,function(e){e.stopPropagation()});
  });
  addEventListener('keydown',function(e){
    if(isOpen()){
      if(e.key==='Escape'){e.preventDefault();close()}
      else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
        var a=d.activeElement;
        if(a&&a.parentNode===bar){e.preventDefault();var i=tabs.map(function(t){return btns[t[0]]}).indexOf(a),n=tabs.length;
          var b=btns[tabs[(i+(e.key==='ArrowLeft'?n-1:1))%n][0]];b.focus();b.click()}
      }
      e.stopImmediatePropagation();return;
    }
    lastKey=e.isTrusted&&e.key!=='Tab';
    if(e.key==='?'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
      var t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
      e.preventDefault();e.stopImmediatePropagation();open();
    }
  },true);
  addEventListener('keyup',function(e){if(isOpen())e.stopImmediatePropagation()},true);
  addEventListener('pointerdown',function(e){if(e.pointerType==='touch'||e.pointerType==='pen')lastKey=false},true);
  function init(){
    d.body.appendChild(dlg);
    var top=d.querySelector('.top-bar');if(!top)return;
    var b=d.createElement('button');b.type='button';b.className='sugo-btn';b.textContent='?';
    b.setAttribute('aria-label','Hogyan kell?');b.title='Hogyan kell? (?)';
    ['pointerdown','touchstart','mousedown'].forEach(function(t){b.addEventListener(t,function(e){e.stopPropagation()})});
    b.addEventListener('click',function(e){e.stopPropagation();open()});
    top.appendChild(b);
    /* ha nem fér ki egy sorba, a teljes képernyő gomb csak ikont mutat (ugyanaz a jelzés, amit a gomb szkriptje is ismer) */
    function fit(){
      var fs=d.querySelector('.fs-btn'),first=top.firstElementChild;
      if(fs&&first&&b.offsetTop>first.offsetTop+4){fs.dataset.compact='1';fs.textContent='⛶'}
    }
    fit();addEventListener('gamepadconnected',function(){setTimeout(fit,50)});
  }
  if(d.readyState==='loading')d.addEventListener('DOMContentLoaded',init);else init();
  window.Sugo={open:open,close:close};
})();
/* @end sugo */
</script>
